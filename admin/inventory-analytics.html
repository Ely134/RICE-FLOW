              </div>
              <span id="inv-history-count-badge" class="px-3 py-1 rounded-full text-xs font-extrabold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700">0 Stock Changes</span>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">

                    <th class="py-3 px-3.5">Rice Variety</th>

                    <th class="py-3 px-3.5 text-right">Logged By</th>
                  </tr>

      `;

      // Helper logic
      function parseInventoryHistoryDate(entry) {
        if (!entry) return new Date(0);
        const rawTs = entry.timestamp || entry.createdAt;
        if (rawTs && (typeof rawTs === 'number' || String(rawTs).includes('T') || String(rawTs).includes(':'))) {
          const tsDate = new Date(rawTs);
          if (!isNaN(tsDate.getTime()) && tsDate.getTime() > 0) return tsDate;
        }
        if (entry.date) {
          const parts = String(entry.date).trim().split('-');
          if (parts.length === 3) {
            const yr = parseInt(parts[0], 10);
            const mo = parseInt(parts[1], 10) - 1;
            const da = parseInt(parts[2], 10);
            let hr = 0, mi = 0;
            if (entry.time) {
              const timeParts = String(entry.time).trim().split(':');
              if (timeParts.length >= 2) {
                hr = parseInt(timeParts[0], 10) || 0;
                mi = parseInt(timeParts[1], 10) || 0;
              }
            }
            const localDate = new Date(yr, mo, da, hr, mi, 0, 0);
            if (!isNaN(localDate.getTime())) return localDate;
          }
        }
        if (entry.timestamp) {
          const d = new Date(entry.timestamp);
          if (!isNaN(d.getTime())) return d;
        }
        if (entry.createdAt) {
          const d = new Date(entry.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      function formatInventoryHistoryDateTime(entry) {
        const d = parseInventoryHistoryDate(entry);
        if (isNaN(d.getTime()) || d.getTime() === 0) {
          return `${entry.date || 'N/A'} ${entry.time || ''}`.trim() || 'N/A';
        }
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const mins = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${m} ${day}, ${year} · ${hours}:${mins} ${ampm}`;
      }

      function isEntryFromArchivedProduct(entry, productsList) {
        if (!entry) return false;
        const list = productsList || [];
        const archivedProducts = list.filter(p => Boolean(p.isArchived || p.archived));
        if (archivedProducts.length === 0) return false;
        if (entry.productId) {
          return archivedProducts.some(p => String(p.id) === String(entry.productId));
        }
        const entryName = (entry.productName || '').trim().toLowerCase();
        if (!entryName) return false;
        return archivedProducts.some(p => (p.name || '').trim().toLowerCase() === entryName);
      }

      function entryMatchesVariety(entry, prodIdFilter, productsList) {
        if (!prodIdFilter || prodIdFilter === 'all') return true;
        if (entry.productId) {
          return String(entry.productId) === String(prodIdFilter);
        }
        const targetProd = (productsList || []).find(p => String(p.id) === String(prodIdFilter));
        if (!targetProd) return false;
        const entryName = (entry.productName || '').trim().toLowerCase();
        const targetName = (targetProd.name || '').trim().toLowerCase();
        if (!entryName || !targetName) return false;
        return entryName === targetName;
      }

      function populateProductDropdown() {
        const selProd = document.getElementById('sel-inv-product');
        if (!selProd) return;
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);
        let html = '<option value="all">All Rice Varieties</option>';
        activeProducts.forEach(p => {
          html += `<option value="${p.id}">${p.name}</option>`;
        });
        selProd.innerHTML = html;
        selProd.value = invProductFilter || 'all';
      }

      function formatCompactRangeLabel(sYMD, eYMD) {
        if (!sYMD || !eYMD) return 'Custom Date Range';
        if (sYMD === eYMD) return sYMD;
        return `${sYMD} – ${eYMD}`;
      }

      function updateInvCustomRangeButtonUI() {
        const btn = document.getElementById('btn-inv-custom-range');
        const label = document.getElementById('inv-custom-range-label');
        const selRange = document.getElementById('sel-inv-range');
        if (invTimeRange === 'custom' && invCustomStart && invCustomEnd) {
          if (label) label.textContent = formatCompactRangeLabel(invCustomStart, invCustomEnd);
          if (btn) {
            btn.classList.remove('ia-date-btn-default');
            btn.classList.add('ia-date-btn-active');
          }
          if (selRange) selRange.value = 'custom';
        } else {
          if (label) label.textContent = 'Custom Date Range';
          if (btn) {
            btn.classList.remove('ia-date-btn-active');
            btn.classList.add('ia-date-btn-default');
          }
          if (selRange && selRange.value === 'custom') {
            selRange.value = invTimeRange || 'all';
          }
        }
      }

      function drawInvCalendar() {
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();
        const calMonthYear = document.getElementById('inv-cal-month-year');
        const calDaysGrid = document.getElementById('inv-cal-days-grid');
        const startSlot = document.getElementById('inv-cal-start-slot');
        const endSlot = document.getElementById('inv-cal-end-slot');
        const startDisplay = document.getElementById('inv-cal-start-display');
        const endDisplay = document.getElementById('inv-cal-end-display');
        const stepHint = document.getElementById('inv-cal-step-hint');
        if (!calMonthYear || !calDaysGrid) return;

        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        calMonthYear.textContent = `${months[month]} ${year}`;

        if (startDisplay) startDisplay.textContent = draftInvStart || 'Select date';
        if (endDisplay) endDisplay.textContent = draftInvEnd || 'Select date';

        if (stepHint) {
          stepHint.textContent = invPickingStep === 'start' ? 'Click a start date' : 'Click an end date';
        }

        calDaysGrid.innerHTML = '';
        const firstDayIndex = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
          calDaysGrid.innerHTML += `<div></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isStart = draftInvStart === dStr;
          const isEnd = draftInvEnd === dStr;
          const inRange = draftInvStart && draftInvEnd && dStr >= draftInvStart && dStr <= draftInvEnd;

          let btnClass = 'w-8 h-8 mx-auto rounded-lg flex items-center justify-center cursor-pointer transition-colors text-xs font-bold';
          if (isStart || isEnd) {
            btnClass += ' bg-[#1E6C02] text-white shadow-2xs';
          } else if (inRange) {
            btnClass += ' bg-emerald-100 dark:bg-emerald-900/60 text-[#145001] dark:text-emerald-200';
          } else {
            btnClass += ' text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-800';
          }

          calDaysGrid.innerHTML += `
            <button type="button" data-date="${dStr}" class="${btnClass}">${d}</button>
          `;
        }

        calDaysGrid.querySelectorAll('button[data-date]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const chosen = e.currentTarget.getAttribute('data-date');
            if (invPickingStep === 'start') {
              draftInvStart = chosen;
              draftInvEnd = '';
              invPickingStep = 'end';
            } else {
              if (chosen < draftInvStart) {
                draftInvEnd = draftInvStart;
                draftInvStart = chosen;
              } else {
                draftInvEnd = chosen;
              }
              invPickingStep = 'start';
            }
            drawInvCalendar();
          });
        });
      }

      function openInvRangeCalendar() {
        const pop = document.getElementById('inv-calendar-popover');
        if (!pop) return;
        draftInvStart = invCustomStart || '';
        draftInvEnd = invCustomEnd || '';
        invPickingStep = draftInvStart ? 'end' : 'start';
        currentCalDate = new Date();
        drawInvCalendar();
        pop.classList.remove('hidden');
      }

      function closeInvRangeCalendar() {
        const pop = document.getElementById('inv-calendar-popover');
        if (pop) pop.classList.add('hidden');
      }

      // Bind calendar buttons
      const btnInvRange = document.getElementById('btn-inv-custom-range');
      if (btnInvRange) btnInvRange.addEventListener('click', openInvRangeCalendar);

      const btnCloseCal = document.getElementById('btn-close-inv-cal');
      if (btnCloseCal) btnCloseCal.addEventListener('click', closeInvRangeCalendar);

      const btnCancelCustom = document.getElementById('btn-cancel-inv-custom');
      if (btnCancelCustom) btnCancelCustom.addEventListener('click', closeInvRangeCalendar);

      const btnCalPrev = document.getElementById('btn-inv-cal-prev');
      if (btnCalPrev) {
        btnCalPrev.addEventListener('click', () => {
          currentCalDate.setMonth(currentCalDate.getMonth() - 1);
          drawInvCalendar();
        });
      }

      const btnCalNext = document.getElementById('btn-inv-cal-next');
      if (btnCalNext) {
        btnCalNext.addEventListener('click', () => {
          currentCalDate.setMonth(currentCalDate.getMonth() + 1);
          drawInvCalendar();
        });
      }

      const btnApplyCustom = document.getElementById('btn-apply-inv-custom');
      if (btnApplyCustom) {
        btnApplyCustom.addEventListener('click', () => {
          if (!draftInvStart) {
            showToast('Please select a start date');
            return;
          }
          invCustomStart = draftInvStart;
          invCustomEnd = draftInvEnd || draftInvStart;
          invTimeRange = 'custom';
          updateInvCustomRangeButtonUI();
          closeInvRangeCalendar();
          renderInventoryAnalyticsPage();
          showToast(`Filtered to ${formatCompactRangeLabel(invCustomStart, invCustomEnd)}`);
        });
      }

      // Main calculation and render function
      function renderInventoryAnalyticsPage() {
        populateProductDropdown();
        const history = typeof getInventoryHistory === 'function' ? getInventoryHistory() : [];
        const productsList = typeof getProducts === 'function' ? getProducts() : [];

        const selRangeEl = document.getElementById('sel-inv-range');
        const selProdEl = document.getElementById('sel-inv-product');
        const resetBtn = document.getElementById('btn-reset-inv-filters');

        const currentRange = selRangeEl ? selRangeEl.value : (invTimeRange || 'all');
        const currentProd = selProdEl ? selProdEl.value : (invProductFilter || 'all');

        if (resetBtn) {
          if (currentRange !== 'all' || currentProd !== 'all') {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        let rangeStart = new Date(0);
        let rangeEnd = endOfToday;
        let periodLabel = 'All Time';

        if (currentRange === '1week') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
          periodLabel = '1 Week';
        } else if (currentRange === '1month') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
          periodLabel = '1 Month';
        } else if (currentRange === '3months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate(), 0, 0, 0, 0);
          periodLabel = '3 Months';
        } else if (currentRange === '6months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), 0, 0, 0, 0);
          periodLabel = '6 Months';
        } else if (currentRange === '1year') {
          rangeStart = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), 0, 0, 0, 0);
          periodLabel = '1 Year';
        } else if (currentRange === 'custom' && invCustomStart && invCustomEnd) {
          const [sY, sM, sD] = invCustomStart.split('-').map(Number);
          const [eY, eM, eD] = invCustomEnd.split('-').map(Number);
          rangeStart = new Date(sY, sM - 1, sD, 0, 0, 0, 0);
          rangeEnd = new Date(eY, eM - 1, eD, 23, 59, 59, 999);
          periodLabel = formatCompactRangeLabel(invCustomStart, invCustomEnd);
        } else {
          periodLabel = 'All Time';
        }

        const labelPeriodEl = document.getElementById('label-inv-period');
        if (labelPeriodEl) labelPeriodEl.textContent = periodLabel;

        const filteredEntries = history.filter(entry => {
          if (!entry) return false;
          if (isEntryFromArchivedProduct(entry, productsList)) return false;
          if (currentRange !== 'all') {
            const eDate = parseInventoryHistoryDate(entry);
            if (eDate < rangeStart || eDate > rangeEnd) return false;
          }
          return entryMatchesVariety(entry, currentProd, productsList);
        });

        const isRestoredOrderStock = (entry) => {
          if (!entry) return false;
          const remarks = String(entry.remarks || entry.reason || '').toLowerCase();
          const type = String(entry.type || entry.action || entry.source || '').toLowerCase();
          return (
            remarks.includes('returned/restored') ||
            remarks.includes('cancelled order') ||
            remarks.includes('restored from') ||
            remarks.includes('returned from') ||
            type === 'restoration' ||
            type === 'order_cancelled_restore' ||
            type === 'return'
          );
        };

        let totalAdded = 0;
        let totalAddedKg = 0;
        let totalDeducted = 0;
        let totalDeductedKg = 0;

        filteredEntries.forEach(entry => {
          const qty = Number(entry.quantityAdded || 0);
          const p = productsList.find(pr => String(pr.id) === String(entry.productId)) ||
                    productsList.find(pr => pr.name === entry.productName);
          const sackWeight = (typeof getProductSackWeightKg === 'function' ? getProductSackWeightKg(p) : 25);
          const kg = Math.abs(qty) * sackWeight;

          if (qty > 0) {
            if (!isRestoredOrderStock(entry)) {
              totalAdded += qty;
              totalAddedKg += kg;
            }
          } else if (qty < 0) {
            totalDeducted += Math.abs(qty);
            totalDeductedKg += kg;
          }
        });

        const activeProducts = productsList.filter(p =>
          p && p.name && !p.isArchived && !p.archived && p.status !== 'archived'
        );
        const targetProducts = (currentProd && currentProd !== 'all')
          ? activeProducts.filter(p => String(p.id) === String(currentProd) || p.name === currentProd)
          : activeProducts;

        // Use the exact same existing Available Stock calculation/source from Dashboard
        const availableStockData = typeof getDashboardAvailableStockData === 'function'
          ? getDashboardAvailableStockData({ productsList: targetProducts })
          : { totalAvailableSacks: 0, totalAvailableKg: 0 };

        const formatStockDisplay = (sacks, kg) => {
          const sFormatted = Number(sacks || 0).toLocaleString('en-US');
          const kFormatted = Number(kg || 0).toLocaleString('en-US');
          return `${sFormatted} sacks <span class="text-base sm:text-lg font-bold text-gray-400 dark:text-gray-500 mx-1.5">/</span> <span class="text-base sm:text-lg font-bold text-gray-500 dark:text-gray-400">${kFormatted} kg</span>`;
        };

        // Calculate delivered stock from completed/delivered orders
        let deliveredSacks = 0;
        let deliveredKg = 0;
        const allOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];
        allOrders.forEach(o => {
          const s = String(o.status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
          if (s === 'delivered' || s === 'completed' || s === 'fulfilled') {
            (o.items || []).forEach(it => {
              const pId = String(it.productId || it.product?.id || it.id || '');
              const pName = it.name || it.productName || '';
              if (!currentProd || currentProd === 'all' || pId === String(currentProd) || pName === currentProd) {
                const qty = Math.max(0, Number(it.quantity || o.quantity || 1));
                const p = productsList.find(pr => String(pr.id) === pId) || productsList.find(pr => pr.name === pName);
                const w = (typeof getProductSackWeightKg === 'function' ? getProductSackWeightKg(p) : 25);
                deliveredSacks += qty;
                deliveredKg += (qty * w);
              }
            });
          }
        });

        const statAddedEl = document.getElementById('inv-stat-added');
        const statDeductedEl = document.getElementById('inv-stat-deducted');
        const statDeliveredEl = document.getElementById('inv-stat-delivered');
        const statTotalEl = document.getElementById('inv-stat-total');

        if (statAddedEl) statAddedEl.innerHTML = formatStockDisplay(totalAdded, totalAddedKg);
        if (statDeductedEl) statDeductedEl.innerHTML = formatStockDisplay(totalDeducted, totalDeductedKg);
        if (statDeliveredEl) statDeliveredEl.innerHTML = formatStockDisplay(deliveredSacks, deliveredKg);
        if (statTotalEl) statTotalEl.innerHTML = formatStockDisplay(availableStockData.totalAvailableSacks, availableStockData.totalAvailableKg);

        // Chart Rendering
        const chartContainer = document.getElementById('inv-movement-chart-inner');
        if (chartContainer) {
          if (filteredEntries.length === 0) {
            chartContainer.innerHTML = `
              <div class="h-full min-h-56 flex flex-col items-center justify-center text-center p-6">
                <div class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-[#1E6C02] dark:text-emerald-400 mb-3 shadow-2xs">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <p class="ia-text-main text-sm font-bold">No stock movements recorded in this period.</p>
                <p class="ia-text-sub text-xs max-w-md mt-1 font-medium">When sacks of rice are added (restocks) or deducted (orders), movements will appear here automatically.</p>
              </div>
            `;
          } else {
            const buckets = [];
            const numMonths = currentRange === '3months' ? 3 : (currentRange === '6months' ? 6 : 6);
            for (let i = numMonths - 1; i >= 0; i--) {
              const mDate = new Date(now.getFullYear(), now.getMonth() - i, 1);
              const bStart = new Date(mDate.getFullYear(), mDate.getMonth(), 1, 0, 0, 0, 0);
              const bEnd = new Date(mDate.getFullYear(), mDate.getMonth() + 1, 0, 23, 59, 59, 999);
              const label = bStart.toLocaleDateString('en-US', { month: 'short' });
              buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
            }

            filteredEntries.forEach(entry => {
              const eDate = parseInventoryHistoryDate(entry);
              buckets.forEach(b => {
                if (eDate >= b.bStart && eDate <= b.bEnd) {
                  const qty = Number(entry.quantityAdded || 0);
                  if (qty > 0 && !isRestoredOrderStock(entry)) {
                    b.added += qty;
                  } else if (qty < 0) {
                    b.deducted += Math.abs(qty);
                  }
                }
              });
            });

            const maxBucketVal = Math.max(...buckets.map(b => Math.max(b.added, b.deducted)), 10);
            const maxTrackPx = 180;

            chartContainer.innerHTML = `
              <div class="w-full flex flex-col pt-3 pb-8 select-none">
                <div class="relative w-full h-[225px] flex items-end gap-3 sm:gap-6 pl-16 sm:pl-20 pr-3 border-b-2 ia-chart-gridline">
                  <div class="ia-chart-gridline absolute inset-x-0 bottom-[180px] border-t border-dashed flex items-center pointer-events-none">
                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${maxBucketVal} sacks</span>
                  </div>
                  <div class="ia-chart-gridline absolute inset-x-0 bottom-[90px] border-t border-dashed flex items-center pointer-events-none">
                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.floor(maxBucketVal / 2)} sacks</span>
                  </div>
                  <div class="ia-chart-gridline absolute inset-x-0 bottom-0 flex items-center pointer-events-none">
                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs translate-y-1/2">0 sacks</span>
                  </div>

                  ${buckets.map(b => {
                    const hasAdded = b.added > 0;
                    const hasDeducted = b.deducted > 0;
                    const heightAdded = hasAdded ? Math.max(Math.round((b.added / maxBucketVal) * maxTrackPx), 8) : 0;
                    const heightDeducted = hasDeducted ? Math.max(Math.round((b.deducted / maxBucketVal) * maxTrackPx), 8) : 0;

                    return `
                      <div class="flex-1 flex flex-col items-center group relative justify-end cursor-pointer z-10 h-full">
                        <div class="absolute bottom-full mb-2 bg-slate-900 dark:bg-slate-950 text-white text-xs py-2 px-3 rounded-xl opacity-0 group-hover:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl border border-slate-700">
                          <div class="font-bold border-b border-slate-700 pb-1 mb-1">${b.label}</div>
                          <div class="text-emerald-400 font-bold">Stock Added: ${b.added} sacks</div>
                          <div class="text-indigo-400 font-bold">Stock Set Aside: ${b.deducted} sacks</div>
                        </div>

                        <div class="w-full flex items-end justify-center gap-1.5 sm:gap-2.5 max-w-[64px] h-[210px]">
                          <div class="flex-1 flex flex-col items-center justify-end h-full">
                            ${hasAdded ? `<span class="text-[11px] sm:text-xs font-extrabold mb-1.5 ia-val-added tabular-nums leading-none">${b.added}</span>` : ''}
                            <div class="w-full ${hasAdded ? 'ia-bar-added' : 'bg-transparent'} rounded-t-md transition-all shadow-xs" style="height: ${heightAdded}px;"></div>
                          </div>
                          <div class="flex-1 flex flex-col items-center justify-end h-full">
                            ${hasDeducted ? `<span class="text-[11px] sm:text-xs font-extrabold mb-1.5 ia-val-deducted tabular-nums leading-none">${b.deducted}</span>` : ''}
                            <div class="w-full ${hasDeducted ? 'ia-bar-deducted' : 'bg-transparent'} rounded-t-md transition-all shadow-xs" style="height: ${heightDeducted}px;"></div>
                          </div>
                        </div>

                        <span class="ia-text-main text-xs font-bold absolute top-full mt-2.5 truncate w-full text-center" title="${b.label}">${b.label}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }
        }

        // Table Rendering
        const tbody = document.getElementById('inv-history-tbody');
        const countBadge = document.getElementById('inv-history-count-badge');
        if (countBadge) {
          countBadge.textContent = `${filteredEntries.length} Stock Change${filteredEntries.length !== 1 ? 's' : ''}`;
        }

        if (tbody) {
          if (filteredEntries.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" class="py-8 text-center text-gray-500 dark:text-gray-400 font-normal text-xs">
                  No stock movements recorded for the selected filter.
                </td>
              </tr>
            `;
          } else {
            const sortedEntries = filteredEntries.slice().sort((a, b) => {
              const tA = parseInventoryHistoryDate(a).getTime();
              const tB = parseInventoryHistoryDate(b).getTime();
              return tB - tA;
            });

            tbody.innerHTML = sortedEntries.slice(0, 30).map(entry => {
              const qty = Number(entry.quantityAdded || 0);
              const isAdded = qty >= 0;
              const formattedDate = formatInventoryHistoryDateTime(entry);
              const varietyName = entry.productName || 'Rice Variety';
              const reason = entry.remarks || (isAdded ? 'Stock added' : 'Order stock deduction');
              const loggedBy = entry.staffName || 'System / Admin';

              return `
                <tr class="hover:bg-gray-50/60 dark:hover:bg-slate-800/60 transition-colors">
                  <td class="py-3 px-3.5 text-xs text-gray-800 dark:text-gray-200 whitespace-nowrap font-medium">${formattedDate}</td>
                  <td class="py-3 px-3.5 text-xs font-semibold text-gray-900 dark:text-white">
                    <span class="px-2 py-0.5 rounded-md bg-gray-100 dark:bg-slate-800 border border-gray-200/80 dark:border-slate-700 text-gray-800 dark:text-gray-200">${varietyName}</span>
                  </td>
                  <td class="py-3 px-3.5 text-xs whitespace-nowrap">
                    ${isAdded 
                      ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-50 dark:bg-emerald-950/60 text-green-800 dark:text-emerald-300 border border-green-200 dark:border-emerald-800/80">+ Rice Added</span>`
                      : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/80">- Rice Taken Out</span>`
                    }
                  </td>
                  <td class="py-3 px-3.5 text-xs font-bold whitespace-nowrap ${isAdded ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}">
                    ${isAdded ? `+${qty} Sacks` : `-${Math.abs(qty)} Sacks`}
                  </td>
                  <td class="py-3 px-3.5 text-xs text-gray-700 dark:text-gray-300 truncate max-w-[220px]" title="${reason}">${reason}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-600 dark:text-gray-400 text-right whitespace-nowrap">${loggedBy}</td>
                </tr>
              `;
            }).join('');
          }
        }
      }

      // Event listeners for dropdown filters
      const selRange = document.getElementById('sel-inv-range');
      if (selRange) {
        selRange.addEventListener('change', () => {
          if (selRange.value === 'custom') {
            openInvRangeCalendar();
            return;
          }
          invCustomStart = '';
          invCustomEnd = '';
          invTimeRange = selRange.value;
          updateInvCustomRangeButtonUI();
          closeInvRangeCalendar();
          renderInventoryAnalyticsPage();
        });
      }

      const selProd = document.getElementById('sel-inv-product');
      if (selProd) {
        selProd.addEventListener('change', () => {
          invProductFilter = selProd.value;
          renderInventoryAnalyticsPage();
        });
      }

      const resetBtn = document.getElementById('btn-reset-inv-filters');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          invTimeRange = 'all';
          invProductFilter = 'all';
          invCustomStart = '';
          invCustomEnd = '';
          if (selRange) selRange.value = 'all';
          if (selProd) selProd.value = 'all';
          updateInvCustomRangeButtonUI();
          closeInvRangeCalendar();
          renderInventoryAnalyticsPage();
          showToast('Filters reset to All Time & All Rice Varieties');
        });
      }

      // Initial Render & dynamic sync listeners
      renderInventoryAnalyticsPage();
      window.addEventListener('aurora-sync-event', renderInventoryAnalyticsPage);
      window.addEventListener('aurora-orders-updated', renderInventoryAnalyticsPage);
      window.addEventListener('storage', renderInventoryAnalyticsPage);
    });
  </script>
</body>
</html>
