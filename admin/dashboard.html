          const formattedDate = formatActivityTimestamp(log.timestamp);

          return `
            <div class="p-3.5 rounded-xl bg-gray-50 border border-gray-200/60 hover:bg-gray-100/50 text-xs font-normal text-gray-900 space-y-1 transition-colors">
              <p class="text-sm font-normal text-gray-900">${userName} (${userRole}) ${action}</p>
              <p class="text-xs font-normal text-gray-500">${formattedDate}</p>
              <p class="text-xs font-normal text-gray-500">${category}</p>
            </div>
          `;
        }).join('');
      }

      function updateInventoryHealth() {
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived);

        const lowStockItems = activeProducts.filter(p => {
          const stock = p.availableStock !== undefined ? p.availableStock : (p.currentStock !== undefined ? p.currentStock : p.stock);
          return stock >= 1 && stock <= 20;
        });

        const outOfStockItems = activeProducts.filter(p => {
          const stock = p.availableStock !== undefined ? p.availableStock : (p.currentStock !== undefined ? p.currentStock : p.stock);
          return stock === 0;
        });

        const healthyItems = activeProducts.filter(p => {
          const stock = p.availableStock !== undefined ? p.availableStock : (p.currentStock !== undefined ? p.currentStock : p.stock);
          return stock > 20;
        });

        const lowCount = lowStockItems.length;
        const outCount = outOfStockItems.length;
        const totalActive = activeProducts.length;
        const healthPct = totalActive > 0 ? Math.round((healthyItems.length / totalActive) * 100) : 0;

        const lowEl = document.getElementById('dash-low-stock-count');
        if (lowEl) lowEl.textContent = `${lowCount} Item${lowCount !== 1 ? 's' : ''}`;

        const outEl = document.getElementById('dash-out-stock-count');
        if (outEl) outEl.textContent = `${outCount} Item(s)`;

        const pctEl = document.getElementById('dash-health-pct');
        if (pctEl) pctEl.textContent = `${healthPct}%`;
      }

      function parseInventoryHistoryDate(entry) {
        if (!entry) return new Date(0);
        if (entry.date) {
          const parts = String(entry.date).trim().split('-');
          if (parts.length === 3) {
            const yr = parseInt(parts[0], 10);
            const mo = parseInt(parts[1], 10) - 1;
            const da = parseInt(parts[2], 10);
            let hr = 0;
            let mi = 0;
            if (entry.time) {
              const timeParts = String(entry.time).trim().split(':');
              if (timeParts.length >= 2) {
                hr = parseInt(timeParts[0], 10) || 0;
                mi = parseInt(timeParts[1], 10) || 0;
              }
            }
            const localDate = new Date(yr, mo, da, hr, mi, 0, 0);
            if (!isNaN(localDate.getTime())) return localDate;
          }
        }
        if (entry.timestamp) {
          const d = new Date(entry.timestamp);
          if (!isNaN(d.getTime())) return d;
        }
        if (entry.createdAt) {
          const d = new Date(entry.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      function formatInventoryHistoryDateTime(entry) {
        const d = parseInventoryHistoryDate(entry);
        if (isNaN(d.getTime()) || d.getTime() === 0) {
          return `${entry.date || 'N/A'} ${entry.time || ''}`.trim() || 'N/A';
        }
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const mins = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${m} ${day}, ${year} · ${hours}:${mins} ${ampm}`;
      }

      function isEntryFromArchivedProduct(entry, productsList) {
        if (!entry) return false;
        const list = productsList || [];
        const archivedProducts = list.filter(p => Boolean(p.isArchived || p.archived));
        if (archivedProducts.length === 0) return false;

        // 1. If entry has productId, exact match against archived product IDs
        if (entry.productId) {
          const entryId = String(entry.productId);
          return archivedProducts.some(p => String(p.id) === entryId);
        }

        // 2. If no productId, safe exact normalized name match against archived product names
        const entryName = (entry.productName || '').trim().toLowerCase();
        if (!entryName) return false;
        return archivedProducts.some(p => (p.name || '').trim().toLowerCase() === entryName);
      }

      function entryMatchesVariety(entry, prodIdFilter, productsList) {
        if (!prodIdFilter || prodIdFilter === 'all') return true;

        // 1. Exact productId match if entry has productId
        if (entry.productId) {
          return String(entry.productId) === String(prodIdFilter);
        }

        // 2. Safe exact normalized name match against the filtered active product if no productId
        const targetProd = (productsList || []).find(p => String(p.id) === String(prodIdFilter));
        if (!targetProd) return false;

        const entryName = (entry.productName || '').trim().toLowerCase();
        const targetName = (targetProd.name || '').trim().toLowerCase();
        if (!entryName || !targetName) return false;

        // Strictly exact normalized match — NO substring matching
        return entryName === targetName;
      }

      function renderInventoryAnalytics() {
        const history = typeof getInventoryHistory === 'function' ? getInventoryHistory() : [];
        const productsList = typeof getProducts === 'function' ? getProducts() : [];

        const selRangeEl = document.getElementById('sel-inv-range');
        const selProdEl = document.getElementById('sel-inv-product');
        const resetBtn = document.getElementById('btn-reset-inv-filters');

        const currentRange = selRangeEl ? selRangeEl.value : (invTimeRange || 'all');
        const currentProd = selProdEl ? selProdEl.value : (invProductFilter || 'all');

        // Toggle reset button
        if (resetBtn) {
          if (currentRange !== 'all' || currentProd !== 'all') {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        let rangeStart = new Date(0);

        if (currentRange === '1week') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
        } else if (currentRange === '1month') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
        } else if (currentRange === '3months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate(), 0, 0, 0, 0);
        } else if (currentRange === '6months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), 0, 0, 0, 0);
        } else if (currentRange === '1year') {
          rangeStart = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), 0, 0, 0, 0);
        } else {
          // 'all': inspect history timestamps
          const activeHistory = history.filter(entry => entry && !isEntryFromArchivedProduct(entry, productsList));
          if (activeHistory.length > 0) {
            const validDates = activeHistory.map(h => parseInventoryHistoryDate(h).getTime()).filter(t => t > 0);
            if (validDates.length > 0) {
              const earliest = Math.min(...validDates);
              const eDate = new Date(earliest);
              rangeStart = new Date(eDate.getFullYear(), eDate.getMonth(), eDate.getDate(), 0, 0, 0, 0);
            } else {
              rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 5, 0, 0, 0, 0);
            }
          } else {
            rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 5, 0, 0, 0, 0);
          }
        }

        // Filter history entries strictly: exclude archived products, apply date range and variety
        const filteredEntries = history.filter(entry => {
          if (!entry) return false;
          // Rule: Exclude movements belonging to archived products
          if (isEntryFromArchivedProduct(entry, productsList)) return false;

          if (currentRange !== 'all') {
            const eDate = parseInventoryHistoryDate(entry);
            if (eDate < rangeStart || eDate > endOfToday) return false;
          }
          return entryMatchesVariety(entry, currentProd, productsList);
        });

        // Calculate totals using actual recorded data only
        let totalAdded = 0;
        let totalDeducted = 0;

        filteredEntries.forEach(entry => {
          const qty = Number(entry.quantityAdded || 0);
          if (qty > 0) {
            totalAdded += qty;
          } else if (qty < 0) {
            totalDeducted += Math.abs(qty);
          }
        });

        const netMovement = totalAdded - totalDeducted;
        const totalOps = filteredEntries.length;

        // Update Summary Cards with simple, clear quantities
        const statAddedEl = document.getElementById('inv-stat-added');
        const statDeductedEl = document.getElementById('inv-stat-deducted');
        const statNetEl = document.getElementById('inv-stat-net');
        const statCountEl = document.getElementById('inv-stat-count');

        if (statAddedEl) {
          statAddedEl.textContent = `+${totalAdded} Sack${totalAdded !== 1 ? 's' : ''}`;
        }
        if (statDeductedEl) {
          statDeductedEl.textContent = `-${totalDeducted} Sack${totalDeducted !== 1 ? 's' : ''}`;
        }
        if (statNetEl) {
          const sign = netMovement > 0 ? '+' : '';
          statNetEl.textContent = `${sign}${netMovement} Sack${netMovement !== 1 ? 's' : ''}`;
          statNetEl.className = `text-2xl font-black ${netMovement > 0 ? 'text-emerald-700 dark:text-emerald-400' : (netMovement < 0 ? 'text-amber-700 dark:text-amber-400' : 'text-slate-950 dark:text-white')}`;
        }
        if (statCountEl) {
          statCountEl.textContent = `${totalOps} Record${totalOps !== 1 ? 's' : ''}`;
        }

        // Render Simplified Trend Chart
        const chartContainer = document.getElementById('inv-movement-chart-inner');
        if (chartContainer) {
          if (filteredEntries.length === 0) {
            chartContainer.innerHTML = `
              <div class="h-48 flex flex-col items-center justify-center text-center p-4">
                <div class="w-12 h-12 rounded-full bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 flex items-center justify-center text-[#1E6C02] dark:text-emerald-400 mb-2.5">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <p class="text-sm font-bold text-gray-800 dark:text-slate-200">No rice stock changes recorded in this period</p>
                <p class="text-xs text-gray-500 dark:text-slate-400 max-w-md mt-1">Live tracking is active. When sacks of rice are added (restocks) or taken out (orders), they will show up here automatically.</p>
              </div>
            `;
          } else {
            // Build time buckets aligned to calendar dates
            const buckets = [];

            if (currentRange === '1week') {
              for (let i = 0; i < 7; i++) {
                const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                const label = bStart.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === '1month') {
              const monthStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 28, 0, 0, 0, 0);
              for (let i = 0; i < 5; i++) {
                const bStart = new Date(monthStart.getFullYear(), monthStart.getMonth(), monthStart.getDate() + i * 7, 0, 0, 0, 0);
                const bEnd = (i === 4) ? endOfToday : new Date(monthStart.getFullYear(), monthStart.getMonth(), monthStart.getDate() + (i + 1) * 7 - 1, 23, 59, 59, 999);
                const label = `Wk ${i + 1}`;
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === '3months' || currentRange === '6months' || currentRange === '1year') {
              const numMonths = currentRange === '3months' ? 3 : (currentRange === '6months' ? 6 : 12);
              for (let i = numMonths - 1; i >= 0; i--) {
                const mDate = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const bStart = new Date(mDate.getFullYear(), mDate.getMonth(), 1, 0, 0, 0, 0);
                const bEnd = new Date(mDate.getFullYear(), mDate.getMonth() + 1, 0, 23, 59, 59, 999);
                const label = bStart.toLocaleDateString('en-US', { month: 'short' });
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else {
              // 'all'
              const daysDiff = Math.max(1, Math.round((endOfToday.getTime() - rangeStart.getTime()) / 86400000));
              if (daysDiff <= 14) {
                for (let i = 0; i < daysDiff; i++) {
                  const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                  const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              } else {
                const totalDurationMs = Math.max(endOfToday.getTime() - rangeStart.getTime(), 86400000);
                const bucketMs = totalDurationMs / 6;
                for (let i = 0; i < 6; i++) {
                  const bStart = new Date(rangeStart.getTime() + i * bucketMs);
                  const bEnd = (i === 5) ? endOfToday : new Date(rangeStart.getTime() + (i + 1) * bucketMs);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              }
            }

            filteredEntries.forEach(entry => {
              const eDate = parseInventoryHistoryDate(entry);
              buckets.forEach(b => {
                if (eDate >= b.bStart && eDate <= b.bEnd) {
                  const qty = Number(entry.quantityAdded || 0);
                  if (qty > 0) b.added += qty;
                  else if (qty < 0) b.deducted += Math.abs(qty);
                }
              });
            });

            const maxBucketVal = Math.max(...buckets.map(b => Math.max(b.added, b.deducted)), 10);

            chartContainer.innerHTML = `
              <div class="h-56 flex items-end gap-3 sm:gap-5 pt-8 pb-3 border-b-2 border-gray-200 dark:border-slate-700 relative select-none">
                <!-- Simple Y-axis guidelines -->
                <div class="absolute inset-x-0 top-2 border-t border-gray-200 dark:border-slate-700/80 border-dashed text-[10px] text-gray-500 dark:text-slate-300 font-bold flex justify-between">
                  <span>${maxBucketVal} sacks</span>
                  <span class="hidden sm:inline text-gray-400 dark:text-slate-400">Scale max</span>
                </div>
                <div class="absolute inset-x-0 top-1/2 border-t border-gray-200 dark:border-slate-700/80 border-dashed text-[10px] text-gray-500 dark:text-slate-300 font-bold flex justify-between">
                  <span>${Math.floor(maxBucketVal / 2)} sacks</span>
                  <span class="hidden sm:inline text-gray-400 dark:text-slate-400">Midpoint</span>
                </div>

                <!-- Easy-to-read dual bars for each time period -->
                ${buckets.map(b => {
                  const hasAdded = b.added > 0;
                  const hasDeducted = b.deducted > 0;
                  const heightAdded = hasAdded ? Math.max((b.added / maxBucketVal) * 100, 8) : 0;
                  const heightDeducted = hasDeducted ? Math.max((b.deducted / maxBucketVal) * 100, 8) : 0;
                  const hasActivity = hasAdded || hasDeducted;

                  return `
                    <div class="flex-1 flex flex-col items-center group relative h-full justify-end" tabindex="0">
                      <!-- Tooltip with clear, simple summary -->
                      <div class="absolute bottom-full mb-2 bg-gray-900 dark:bg-slate-950 text-white text-xs py-2 px-3 rounded-xl opacity-0 group-hover:opacity-100 group-focus:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl border border-gray-700 dark:border-slate-700">
                        <div class="font-extrabold border-b border-gray-700 dark:border-slate-800 pb-1 mb-1.5 text-gray-200">${b.label}</div>
                        <div class="flex items-center gap-1.5 text-emerald-300 font-bold">
                          <span class="w-2.5 h-2.5 rounded-xs bg-[#1E6C02]"></span>
                          <span>Rice Added: +${b.added} sacks</span>
                        </div>
                        <div class="flex items-center gap-1.5 text-amber-300 font-bold mt-0.5">
                          <span class="w-2.5 h-2.5 rounded-xs bg-[#D97706]"></span>
                          <span>Rice Taken Out: -${b.deducted} sacks</span>
                        </div>
                        <div class="text-gray-300 text-[10px] border-t border-gray-800 dark:border-slate-800 pt-1 mt-1 font-semibold">
                          Overall change: ${b.added - b.deducted > 0 ? '+' : ''}${b.added - b.deducted} sacks
                        </div>
                      </div>

                      <!-- Directly visible quantity labels on top of bars -->
                      <div class="w-full flex items-end justify-center gap-1.5 h-full max-w-[56px] pb-1">
                        <!-- Added Column (Green) -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                          ${hasAdded ? `<span class="text-[10px] sm:text-xs font-black text-[#1E6C02] dark:text-emerald-400 mb-0.5 leading-none">+${b.added}</span>` : ''}
                          <div class="w-full ${hasAdded ? 'bg-[#1E6C02] hover:bg-[#145001]' : 'bg-transparent'} rounded-t-md transition-all shadow-xs" style="height: ${heightAdded}%;"></div>
                        </div>

                        <!-- Deducted Column (Orange) -->
                        <div class="flex-1 flex flex-col items-center justify-end h-full">
                          ${hasDeducted ? `<span class="text-[10px] sm:text-xs font-black text-[#D97706] dark:text-amber-400 mb-0.5 leading-none">-${b.deducted}</span>` : ''}
                          <div class="w-full ${hasDeducted ? 'bg-[#D97706] hover:bg-[#B45309]' : 'bg-transparent'} rounded-t-md transition-all shadow-xs" style="height: ${heightDeducted}%;"></div>
                        </div>
                      </div>

                      <!-- If no changes in this period, subtle zero indicator -->
                      ${!hasActivity ? `<div class="absolute bottom-6 text-[10px] font-bold text-gray-400 dark:text-slate-500 select-none">0</div>` : ''}

                      <!-- Clear, readable period label -->
                      <span class="text-[10px] sm:text-[11px] text-gray-700 dark:text-slate-200 font-bold mt-2 truncate w-full text-center" title="${b.label}">${b.label}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }
        }

        // Render History Table
        const tbody = document.getElementById('inv-history-tbody');
        const countBadge = document.getElementById('inv-history-count-badge');
        if (countBadge) {
          countBadge.textContent = `${filteredEntries.length} Recorded Event${filteredEntries.length !== 1 ? 's' : ''}`;
        }

        if (tbody) {
          if (filteredEntries.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" class="py-8 text-center text-gray-500 dark:text-gray-400 font-normal text-xs">
                  No stock movements recorded for the selected filter.
                </td>
              </tr>
            `;
          } else {
            // Sort by date descending
            const sortedEntries = filteredEntries.slice().sort((a, b) => {
              const tA = parseInventoryHistoryDate(a).getTime();
              const tB = parseInventoryHistoryDate(b).getTime();
              return tB - tA;
            });

            // Display latest 25 entries in table
            tbody.innerHTML = sortedEntries.slice(0, 25).map(entry => {
              const qty = Number(entry.quantityAdded || 0);
              const isAdded = qty >= 0;
              const formattedDate = formatInventoryHistoryDateTime(entry);
              const varietyName = entry.productName || 'Rice Variety';
              const reason = entry.remarks || (isAdded ? 'Manual stock replenishment' : 'Order stock deduction');
              const loggedBy = entry.staffName || 'System / Admin';

              return `
                <tr class="hover:bg-gray-50/60 dark:hover:bg-slate-800/60 transition-colors">
                  <td class="py-3 px-3.5 text-xs text-gray-800 dark:text-gray-200 whitespace-nowrap font-medium">${formattedDate}</td>
                  <td class="py-3 px-3.5 text-xs font-semibold text-gray-900 dark:text-white">
                    <span class="px-2 py-0.5 rounded-md bg-gray-100 dark:bg-slate-800 border border-gray-200/80 dark:border-slate-700 text-gray-800 dark:text-gray-200">${varietyName}</span>
                  </td>
                  <td class="py-3 px-3.5 text-xs whitespace-nowrap">
                    ${isAdded 
                      ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-50 dark:bg-emerald-950/60 text-green-800 dark:text-emerald-300 border border-green-200 dark:border-emerald-800/80"><span class="font-extrabold">+</span> Rice Added</span>`
                      : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/80"><span class="font-extrabold">-</span> Rice Taken Out</span>`
                    }
                  </td>
                  <td class="py-3 px-3.5 text-xs font-bold whitespace-nowrap ${isAdded ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}">
                    ${isAdded ? `+${qty} Sacks` : `-${Math.abs(qty)} Sacks`}
                  </td>
                  <td class="py-3 px-3.5 text-xs text-gray-700 dark:text-gray-300 truncate max-w-[220px]" title="${reason}">${reason}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-600 dark:text-gray-400 text-right whitespace-nowrap">${loggedBy}</td>
                </tr>
              `;
            }).join('');
          }
        }
      }

      function renderReservationAnalytics() {
        const orders = typeof getAllOrders === 'function' ? getAllOrders() : [];
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);

        const filterResRangeEl = document.getElementById('sel-res-range');
        const filterResProdEl = document.getElementById('sel-res-product');
        const currentRange = filterResRangeEl ? filterResRangeEl.value : (resTimeRange || 'all');
        const currentProd = filterResProdEl ? filterResProdEl.value : (resProductFilter || 'all');

        const resetBtn = document.getElementById('btn-reset-res-filters');
        if (resetBtn) {
          if (currentRange !== 'all' || currentProd !== 'all') {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        let rangeStart = new Date(0);

        if (currentRange === '1week') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
        } else if (currentRange === '1month') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
        } else if (currentRange === '3months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 89, 0, 0, 0, 0);
        } else if (currentRange === '6months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), 0, 0, 0, 0);
        } else if (currentRange === '1year') {
          rangeStart = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), 0, 0, 0, 0);
        }

        // All reservation orders in the system
        const allReservations = orders.filter(o => isReservationOrder(o));

        // Filter by date range and selected rice variety
        const filteredReservations = allReservations.filter(order => {
          if (currentRange !== 'all') {
            const oDate = parseOrderDate(order);
            if (oDate < rangeStart || oDate > endOfToday) return false;
          }

          if (currentProd !== 'all') {
            const hasProd = (order.items || []).some(it => {
              const pid = it.product?.id || it.productId || it.id;
              return String(pid) === String(currentProd);
            });
            if (!hasProd) return false;
          }

          return true;
        });

        // Helper to count sacks matching current variety filter
        function getOrderSacks(order) {
          let sacks = 0;
          (order.items || []).forEach(it => {
            const pid = it.product?.id || it.productId || it.id;
            if (currentProd === 'all' || String(pid) === String(currentProd)) {
              sacks += Number(it.quantity || 1);
            }
          });
          return sacks > 0 ? sacks : Number(order.quantity || 1);
        }

        // Status classification categories
        let activeCount = 0;
        let activeSacks = 0;

        let waitingCount = 0;
        let waitingSacks = 0;

        let paymentVerificationCount = 0;
        let paymentVerificationSacks = 0;

        let readyCount = 0;
        let readySacks = 0;

        let cancelledCount = 0;
        let cancelledSacks = 0;

        let completedCount = 0;
        let completedSacks = 0;

        filteredReservations.forEach(order => {
          const rawStatus = String(order.status || '').toLowerCase().trim();
          const normStatus = rawStatus.replace(/[\s_]+/g, '-');

          // Check if this reservation has already been transferred to normal Orders
          const isTransferredToOrders = [
            'processing',
            'to-ship',
            'preparing',
            'to-receive',
            'shipped',
            'in-transit',
            'out-for-delivery',
            'in-delivery',
            'dispatch',
            'delivered',
            'completed',
            'fulfilled'
          ].includes(normStatus) || order.transferredToOrders === true || (order.isPreOrder === false && !['ready-for-processing', 'ready', 'payment-verification', 'pending-verification', 'pre-order', 'waiting', 'waiting-for-stock', 'cancelled', 'rejected', 'expired'].includes(normStatus));

          const sacks = getOrderSacks(order);

          if (isTransferredToOrders) {
            // Transferred reservations belong to the normal Orders workflow, excluded from reservation status breakdown
            if (normStatus === 'completed' || normStatus === 'fulfilled') {
              completedCount++;
              completedSacks += sacks;
            }
            return;
          }

          const isCancelled = (
            normStatus === 'cancelled' ||
            normStatus === 'rejected' ||
            normStatus === 'expired' ||
            order.status === 'Cancelled' ||
            order.paymentStatus === 'rejected_expired' ||
            order.autoCancelledDueToRejectionDeadline === true
          );

          const isReuploadWaiting = !isCancelled && isReservationWaitingForReupload(order);

          const hasSubmittedProof = Boolean(
            (order.paymentProof && String(order.paymentProof).trim() !== '' && String(order.paymentProof) !== 'null') ||
            (order.paymentProofUrl && String(order.paymentProofUrl).trim() !== '') ||
            (order.paymentProofDataUrl && String(order.paymentProofDataUrl).trim() !== '') ||
            order.paymentUploadedAt ||
            order.referenceNumber
          );

          const isPaymentVerified = order.paymentVerified === true || 
                                    order.paymentStatus === 'verified' || 
                                    order.paymentStatus === 'paid' || 
                                    order.isVerifiedPayment === true || 
                                    order.paymentConfirmed === true;

          const isReady = !isCancelled && (
            normStatus === 'ready-for-processing' ||
            normStatus === 'ready' ||
            order.status === 'ready_for_processing' ||
            order.status === 'Ready for Processing' ||
            isPaymentVerified
          );

          const isPaymentVerification = !isCancelled && !isReady && (
            isReuploadWaiting ||
            normStatus === 'payment-verification' ||
            normStatus === 'pending-verification' ||
            order.status === 'payment_verification' ||
            order.status === 'Payment Verification' ||
            order.paymentStatus === 'pending_verification' ||
            order.paymentStatus === 'payment_verification' ||
            hasSubmittedProof
          );

          if (isCancelled) {
            cancelledCount++;
            cancelledSacks += sacks;
          } else if (isReady) {
            readyCount++;
            readySacks += sacks;
            activeCount++;
            activeSacks += sacks;
          } else if (isPaymentVerification) {
            paymentVerificationCount++;
            paymentVerificationSacks += sacks;
            activeCount++;
            activeSacks += sacks;
          } else {
            // Waiting for Stock
            waitingCount++;
            waitingSacks += sacks;
            activeCount++;
            activeSacks += sacks;
          }
        });

        // 1. Update the 6 Metric Cards
        const statActiveEl = document.getElementById('res-stat-active');
        const statSacksEl = document.getElementById('res-stat-sacks');
        const statWaitingEl = document.getElementById('res-stat-waiting');
        const statReadyEl = document.getElementById('res-stat-ready');
        const statCompletedEl = document.getElementById('res-stat-completed');
        const statCancelledEl = document.getElementById('res-stat-cancelled');

        if (statActiveEl) statActiveEl.textContent = `${activeCount} Order${activeCount !== 1 ? 's' : ''}`;
        if (statSacksEl) statSacksEl.textContent = `${activeSacks} Sack${activeSacks !== 1 ? 's' : ''}`;
        if (statWaitingEl) statWaitingEl.textContent = `${waitingCount} Order${waitingCount !== 1 ? 's' : ''}`;
        if (statReadyEl) statReadyEl.textContent = `${readyCount} Order${readyCount !== 1 ? 's' : ''}`;
        if (statCompletedEl) statCompletedEl.textContent = `${completedCount} Order${completedCount !== 1 ? 's' : ''}`;
        if (statCancelledEl) statCancelledEl.textContent = `${cancelledCount} Order${cancelledCount !== 1 ? 's' : ''}`;

        // Subtitles with sacks
        const subActiveEl = document.getElementById('res-sub-active');
        const subWaitingEl = document.getElementById('res-sub-waiting');
        const subReadyEl = document.getElementById('res-sub-ready');
        const subCompletedEl = document.getElementById('res-sub-completed');
        const subCancelledEl = document.getElementById('res-sub-cancelled');

        if (subActiveEl) subActiveEl.textContent = `${activeSacks} sack${activeSacks !== 1 ? 's' : ''} in pipeline`;
        if (subWaitingEl) subWaitingEl.textContent = `${waitingSacks} sack${waitingSacks !== 1 ? 's' : ''} awaiting stock`;
        if (subReadyEl) subReadyEl.textContent = `${readySacks} sack${readySacks !== 1 ? 's' : ''} stock allocated`;
        if (subCompletedEl) subCompletedEl.textContent = `${completedSacks} sack${completedSacks !== 1 ? 's' : ''} delivered`;
        if (subCancelledEl) subCancelledEl.textContent = `${cancelledSacks} sack${cancelledSacks !== 1 ? 's' : ''} released`;

        // 2. Render Status Breakdown
        const breakdownContainer = document.getElementById('res-status-breakdown-container');
        if (breakdownContainer) {
          const totalBreakdownReservations = waitingCount + paymentVerificationCount + readyCount + cancelledCount;
          const statusRows = [
            {
              label: 'Waiting for Stock',
              count: waitingCount,
              sacks: waitingSacks,
              color: '#D97706',
              bgClass: 'bg-amber-500',
              badgeClass: 'bg-amber-100 text-amber-900 border-amber-300'
            },
            {
              label: 'Payment Verification',
              count: paymentVerificationCount,
              sacks: paymentVerificationSacks,
              color: '#8B5CF6',
              bgClass: 'bg-purple-500',
              badgeClass: 'bg-purple-100 text-purple-900 border-purple-300'
            },
            {
              label: 'Ready for Processing',
              count: readyCount,
              sacks: readySacks,
              color: '#0284C7',
              bgClass: 'bg-sky-500',
              badgeClass: 'bg-sky-100 text-sky-900 border-sky-300'
            },
            {
              label: 'Cancelled',
              count: cancelledCount,
              sacks: cancelledSacks,
              color: '#64748B',
              bgClass: 'bg-slate-400',
              badgeClass: 'bg-slate-100 text-slate-700 border-slate-300'
            }
          ];

          if (totalBreakdownReservations === 0) {
            breakdownContainer.innerHTML = `
              <div class="p-8 text-center text-gray-500 dark:text-gray-400 text-xs">
                No reservations found for the selected time range or product filter.
              </div>
            `;
          } else {
            breakdownContainer.innerHTML = `
              <div class="space-y-3.5">
                ${statusRows.map(row => {
                  const pct = totalBreakdownReservations > 0 ? (row.count / totalBreakdownReservations) * 100 : 0;
                  const pctDisplay = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);
                  return `
                    <div class="space-y-1">
                      <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                          <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${row.color};"></span>
                          <span class="font-bold text-gray-900 dark:text-gray-100">${row.label}</span>
                        </div>
                        <div class="flex items-center gap-3">
                          <span class="text-xs font-extrabold text-gray-900 dark:text-white">${row.count} Orders</span>
                          <span class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">(${row.sacks} Sacks)</span>
                          <span class="text-[11px] font-bold text-gray-600 dark:text-gray-300 w-12 text-right">${pctDisplay}%</span>
                        </div>
                      </div>
                      <div class="w-full bg-gray-100 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
                        <div class="h-2 rounded-full transition-all duration-300 ${row.bgClass}" style="width: ${pct}%;"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }
        }

        // 3. Render Demand by Rice Variety
        const varietyContainer = document.getElementById('res-variety-breakdown-container');
        if (varietyContainer) {
          const varietyStats = activeProducts.map(p => {
            const pId = String(p.id);
            let pReservedSacks = 0;
            let pResCount = 0;

            allReservations.forEach(order => {
              const s = (order.status || '').toLowerCase().replace(/_/g, '-');
              const isCancelled = isCancelledOrRejectedOrder(order) || s === 'cancelled' || s === 'rejected' || s === 'expired';
              const isCompleted = s === 'completed' || s === 'fulfilled';
              if (isCancelled || isCompleted) return;

              (order.items || []).forEach(it => {
                const itemId = String(it.product?.id || it.productId || it.id);
                if (itemId === pId) {
                  pReservedSacks += Number(it.quantity || 1);
                  pResCount++;
                }
              });
            });

            const currentStock = Number(p.stock !== undefined ? p.stock : (p.currentStock || 0));
            return {
              product: p,
              reservedSacks: pReservedSacks,
              reservationCount: pResCount,
              warehouseStock: currentStock
            };
          });

          // Sort by highest reserved sacks
          varietyStats.sort((a, b) => b.reservedSacks - a.reservedSacks);

          const displayStats = (currentProd !== 'all') 
            ? varietyStats.filter(v => String(v.product.id) === String(currentProd))
            : varietyStats;

          if (displayStats.length === 0) {
            varietyContainer.innerHTML = `
              <div class="p-8 text-center text-gray-500 dark:text-gray-400 text-xs">
                No active grain varieties found.
              </div>
            `;
          } else {
            varietyContainer.innerHTML = `
              <div class="space-y-3">
                ${displayStats.map(item => {
                  const isHealthy = item.warehouseStock >= item.reservedSacks;
                  const deficit = Math.max(0, item.reservedSacks - item.warehouseStock);
                  let badge = '';
                  if (item.reservedSacks === 0) {
                    badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-gray-400 border border-gray-200 dark:border-slate-700">No Active Demand</span>`;
                  } else if (isHealthy) {
                    badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/80">✓ Stock Sufficient</span>`;
                  } else if (item.warehouseStock === 0) {
                    badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-50 dark:bg-red-950/60 text-red-800 dark:text-red-300 border border-red-200 dark:border-red-800/80">🚫 Restock Needed (${deficit} Sacks)</span>`;
                  } else {
                    badge = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/80">⚠️ Partial Deficit (${deficit} Sacks)</span>`;
                  }

                  return `
                    <div class="p-3 rounded-xl bg-gray-50/80 dark:bg-slate-800/60 border border-gray-200/80 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                          <span class="text-sm font-bold text-gray-900 dark:text-white">${item.product.name}</span>
                          ${badge}
                        </div>
                        <p class="text-xs text-gray-500 dark:text-gray-400">
                          Warehouse Stock: <span class="font-bold text-gray-800 dark:text-gray-200">${item.warehouseStock} Sacks</span>
                        </p>
                      </div>
                      <div class="text-left sm:text-right shrink-0">
                        <p class="text-sm font-black text-[#1E6C02] dark:text-emerald-400">${item.reservedSacks} Sacks</p>
                        <p class="text-[10px] font-semibold text-gray-500 dark:text-gray-400">${item.reservationCount} active customer${item.reservationCount !== 1 ? 's' : ''}</p>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }
        }

        // 4. Render Recent Reservations / Queue Preview Table
        const recentTbody = document.getElementById('res-recent-tbody');
        if (recentTbody) {
          const sorted = filteredReservations.slice().sort((a, b) => {
            const tA = parseOrderDate(a).getTime();
            const tB = parseOrderDate(b).getTime();
            return tB - tA;
          });
          const displayRows = sorted.slice(0, 5);

          if (displayRows.length === 0) {
            recentTbody.innerHTML = `
              <tr>
                <td colspan="6" class="py-8 text-center text-gray-500 dark:text-gray-400 text-xs font-medium">
                  No reservation records found for this period.
                </td>
              </tr>
            `;
          } else {
            recentTbody.innerHTML = displayRows.map(order => {
              const customerName = order.fullName || order.customerName || order.userName || 'Customer';
              const itemsText = (order.items || [])
                .map(i => `${i.product?.name || i.name || i.productName || 'Rice'} (${i.quantity || 1}s)`)
                .join(', ');
              const formattedDate = parseOrderDate(order).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

              const rawStatus = String(order.status || '').toLowerCase().trim();
              const normStatus = rawStatus.replace(/[\s_]+/g, '-');

              const isCancelled = (
                normStatus === 'cancelled' ||
                normStatus === 'rejected' ||
                normStatus === 'expired' ||
                order.status === 'Cancelled' ||
                order.paymentStatus === 'rejected_expired' ||
                order.autoCancelledDueToRejectionDeadline === true
              );

              const isReuploadWaiting = !isCancelled && isReservationWaitingForReupload(order);

              const hasSubmittedProof = Boolean(
                (order.paymentProof && String(order.paymentProof).trim() !== '' && String(order.paymentProof) !== 'null') ||
                (order.paymentProofUrl && String(order.paymentProofUrl).trim() !== '') ||
                (order.paymentProofDataUrl && String(order.paymentProofDataUrl).trim() !== '') ||
                order.paymentUploadedAt ||
                order.referenceNumber
              );

              const isPaymentVerified = order.paymentVerified === true || 
                                        order.paymentStatus === 'verified' || 
                                        order.paymentStatus === 'paid' || 
                                        order.isVerifiedPayment === true || 
                                        order.paymentConfirmed === true;

              const isReady = !isCancelled && (
                normStatus === 'ready-for-processing' ||
                normStatus === 'ready' ||
                order.status === 'ready_for_processing' ||
                order.status === 'Ready for Processing' ||
                isPaymentVerified
              );

              const isPaymentVerification = !isCancelled && !isReady && (
                isReuploadWaiting ||
                normStatus === 'payment-verification' ||
                normStatus === 'pending-verification' ||
                order.status === 'payment_verification' ||
                order.status === 'Payment Verification' ||
                order.paymentStatus === 'pending_verification' ||
                order.paymentStatus === 'payment_verification' ||
                hasSubmittedProof
              );

              // Map effective status for badge/label display matching reservation section
              let displayStatus = order.status;
              if (isCancelled) {
                displayStatus = 'cancelled';
              } else if (isReady) {
                displayStatus = 'ready-for-processing';
              } else if (isPaymentVerification) {
                displayStatus = 'payment-verification';
              } else {
                displayStatus = 'waiting';
              }

              // Retrieve actual recorded payment amount from existing payment data
              let recordedPayment = 0;
              if (order.amountPaid !== undefined && order.amountPaid !== null && !isNaN(Number(order.amountPaid)) && Number(order.amountPaid) > 0) {
                recordedPayment = Number(order.amountPaid);
              } else if (order.depositAmount !== undefined && order.depositAmount !== null && !isNaN(Number(order.depositAmount)) && Number(order.depositAmount) > 0) {
                recordedPayment = Number(order.depositAmount);
              } else if (order.downPaymentAmount !== undefined && order.downPaymentAmount !== null && !isNaN(Number(order.downPaymentAmount)) && Number(order.downPaymentAmount) > 0) {
                recordedPayment = Number(order.downPaymentAmount);
              } else if (order.paidAmount !== undefined && order.paidAmount !== null && !isNaN(Number(order.paidAmount)) && Number(order.paidAmount) > 0) {
                recordedPayment = Number(order.paidAmount);
              }

              // Determine actual amount paid:
              // - Waiting for Stock + no payment made: Display ₱0.00
              // - Payment Verification + down payment submitted: Display actual recorded down payment amount
              // - Other reservations with recorded payments: Display actual recorded amount paid
              // - Never use calculated amount due as amount paid
              let depositVal = 0;
              if (isPaymentVerification) {
                depositVal = recordedPayment;
              } else if (isPaymentVerified || isReady) {
                depositVal = recordedPayment;
              } else if (isCancelled) {
                depositVal = isPaymentVerified ? recordedPayment : 0;
              } else {
                // Waiting for Stock
                depositVal = isPaymentVerified || hasSubmittedProof ? recordedPayment : 0;
              }

              return `
                <tr class="hover:bg-gray-50/70 dark:hover:bg-slate-800/50 transition-colors">
                  <td class="py-3 px-3.5 font-bold font-mono text-gray-900 dark:text-white text-xs">#${order.id}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-900 dark:text-gray-100 font-medium">${customerName}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-800 dark:text-gray-200 truncate max-w-[180px]">${itemsText || 'N/A'}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-900 dark:text-gray-100 font-semibold">₱${depositVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-600 dark:text-gray-400">${formattedDate}</td>
                  <td class="py-3 px-3.5 text-right">
                    <span class="px-2.5 py-1 rounded-full font-semibold text-xs tracking-wide ${getStatusBadgeClass(displayStatus)}">${getStatusLabel(displayStatus)}</span>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }
      }

      // Calendar states and dynamic bindings
      let currentCalDate = new Date();
      let selectedCalDate = new Date();

      function drawDashboardCalendar() {
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();

        const calMonthYear = document.getElementById('cal-month-year');
        const calDaysGrid = document.getElementById('cal-days-grid');
        const calSelectedStatus = document.getElementById('cal-selected-status');
        if (!calMonthYear || !calDaysGrid) return;

        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        calMonthYear.textContent = `${months[month]} ${year}`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const prevTotalDays = new Date(year, month, 0).getDate();

        // Retrieve real orders data from existing RiceFlow database
        const allOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];

        let daysHtml = '';

        // Filler days
        for (let i = firstDayIndex; i > 0; i--) {
          daysHtml += `<div class="p-1.5 text-black/40 font-medium select-none text-[11px]">${prevTotalDays - i + 1}</div>`;
        }

        // Active days
        const today = new Date();
        for (let day = 1; day <= totalDays; day++) {
          const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
          const isSelected = selectedCalDate && selectedCalDate.getDate() === day && selectedCalDate.getMonth() === month && selectedCalDate.getFullYear() === year;

          // Compute real operations for each day cell
          const dayOrders = allOrders.filter(o => {
            if (o.isReplacement || isCancelledOrRejectedOrder(o) || isReservationOrder(o)) return false;
            const dateVal = o.createdAt || o.dateCreated || o.date || o.timestamp;
            if (!dateVal) return false;
            const d = new Date(dateVal);
            return !isNaN(d.getTime()) && d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
          });

          const dayReservations = allOrders.filter(o => {
            if (!isReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
            const dateVal = o.reservedDate || o.createdAt || o.dateCreated || o.date;
            if (!dateVal) return false;
            const d = new Date(dateVal);
            return !isNaN(d.getTime()) && d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
          });

          const dayDeliveries = allOrders.filter(o => {
            if (o.deliveryOption !== 'delivery' && !o.deliveredDate && !o.deliveryDate && !o.deliveryVerificationDate && !o.deliveredAt) {
              return false;
            }
            let dateVal = o.deliveredDate || o.deliveryDate || o.deliveryVerificationDate || o.deliveredAt;
            if (!dateVal && (o.status === 'delivered' || o.status === 'to-receive' || o.status === 'shipped')) {
              dateVal = o.createdAt || o.dateCreated;
            }
            if (!dateVal) return false;
            const d = new Date(dateVal);
            return !isNaN(d.getTime()) && d.getFullYear() === year && d.getMonth() === month && d.getDate() === day;
          });

          const dayCompletedSales = allOrders.filter(o => {
            if (isReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
            const s = (o.status || '').toLowerCase().replace(/_/g, '-');
            if (s !== 'completed') return false;
            const info = getVerifiedCustomerPaymentInfo(o);
            if (!info.isVerified) return false;
            const compDate = getOrderCompletionDate(o);
            return compDate && !isNaN(compDate.getTime()) && compDate.getTime() > 0 && compDate.getFullYear() === year && compDate.getMonth() === month && compDate.getDate() === day;
          });

          const hasOps = (dayOrders.length + dayReservations.length + dayDeliveries.length + dayCompletedSales.length) > 0;

          let cellClass = "p-1.5 rounded-lg cursor-pointer hover:bg-gray-150 text-black transition-colors select-none text-[11px] relative flex flex-col items-center justify-center min-h-[34px]";
          if (isToday) {
            cellClass = "p-1.5 rounded-lg cursor-pointer bg-green-50 text-[#1E6C02] font-black border border-green-200/60 hover:bg-green-100 transition-colors select-none text-[11px] relative flex flex-col items-center justify-center min-h-[34px]";
          }
          if (isSelected) {
            cellClass = "p-1.5 rounded-lg cursor-pointer bg-[#1E6C02] text-white font-black hover:bg-[#145001] transition-colors select-none text-[11px] relative flex flex-col items-center justify-center min-h-[34px] shadow-xs";
          }

          const dotHTML = hasOps ? `<span class="w-1.5 h-1.5 ${isSelected ? 'bg-white' : 'bg-[#1E6C02]'} rounded-full mt-0.5 shrink-0"></span>` : '';

          daysHtml += `<div class="${cellClass}" data-day="${day}"><span>${day}</span>${dotHTML}</div>`;
        }

        calDaysGrid.innerHTML = daysHtml;

        // Render selected date operational summary
        if (selectedCalDate) {
          const selYear = selectedCalDate.getFullYear();
          const selMonth = selectedCalDate.getMonth();
          const selDay = selectedCalDate.getDate();

          const ordersOnDate = allOrders.filter(o => {
            if (o.isReplacement || isCancelledOrRejectedOrder(o) || isReservationOrder(o)) return false;
            const dateVal = o.createdAt || o.dateCreated || o.date || o.timestamp;
            if (!dateVal) return false;
            const d = new Date(dateVal);
            return !isNaN(d.getTime()) && d.getFullYear() === selYear && d.getMonth() === selMonth && d.getDate() === selDay;
          });

          const reservationsOnDate = allOrders.filter(o => {
            if (!isReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
            const dateVal = o.reservedDate || o.createdAt || o.dateCreated || o.date;
            if (!dateVal) return false;
            const d = new Date(dateVal);
            return !isNaN(d.getTime()) && d.getFullYear() === selYear && d.getMonth() === selMonth && d.getDate() === selDay;
          });

          const deliveriesOnDate = allOrders.filter(o => {
            if (o.deliveryOption !== 'delivery' && !o.deliveredDate && !o.deliveryDate && !o.deliveryVerificationDate && !o.deliveredAt) {
              return false;
            }
            let dateVal = o.deliveredDate || o.deliveryDate || o.deliveryVerificationDate || o.deliveredAt;
            if (!dateVal && (o.status === 'delivered' || o.status === 'to-receive' || o.status === 'shipped')) {
              dateVal = o.createdAt || o.dateCreated;
            }
            if (!dateVal) return false;
            const d = new Date(dateVal);
            return !isNaN(d.getTime()) && d.getFullYear() === selYear && d.getMonth() === selMonth && d.getDate() === selDay;
          });

          const completedSalesOnDate = allOrders.filter(o => {
            if (isReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
            const s = (o.status || '').toLowerCase().replace(/_/g, '-');
            if (s !== 'completed') return false;
            const info = getVerifiedCustomerPaymentInfo(o);
            if (!info.isVerified) return false;
            const compDate = getOrderCompletionDate(o);
            return compDate && !isNaN(compDate.getTime()) && compDate.getTime() > 0 && compDate.getFullYear() === selYear && compDate.getMonth() === selMonth && compDate.getDate() === selDay;
          });

          const completedSalesAmount = completedSalesOnDate.reduce((sum, o) => {
            return sum + getVerifiedCustomerPaymentInfo(o).amount;
          }, 0);

          const totalOpsCount = ordersOnDate.length + reservationsOnDate.length + deliveriesOnDate.length + completedSalesOnDate.length;
          const formattedSelectedDateStr = `${months[selMonth]} ${selDay}, ${selYear}`;
          const formattedDateParam = `${selYear}-${String(selMonth + 1).padStart(2, '0')}-${String(selDay).padStart(2, '0')}`;

          if (totalOpsCount === 0) {
            calSelectedStatus.innerHTML = `
              <div class="space-y-1.5 text-center py-1">
                <p class="text-[10px] font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Operations Window</p>
                <p class="text-xs font-black text-gray-900 dark:text-white">${formattedSelectedDateStr}</p>
                <a href="activities.html?date=${formattedDateParam}" class="inline-flex items-center gap-1 text-[10px] font-extrabold px-2.5 py-1 bg-green-50 dark:bg-emerald-950/60 text-[#1E6C02] dark:text-emerald-300 border border-green-200 dark:border-emerald-800/80 rounded-full hover:bg-green-100 dark:hover:bg-emerald-900/80 transition-all cursor-pointer shadow-2xs">
                  0 Total Activity
                </a>
                <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mt-0.5">No scheduled operations for this date.</p>
              </div>
            `;
          } else {
            // Optional details list
            let detailsListHTML = '';
            const detailsItems = [];

            if (ordersOnDate.length > 0) {
              const ids = ordersOnDate.map(o => `#${o.id}`).slice(0, 3).join(', ');
              const moreStr = ordersOnDate.length > 3 ? ` +${ordersOnDate.length - 3} more` : '';
              detailsItems.push(`<p class="text-[11px] font-medium text-gray-700 dark:text-gray-300"><span class="font-bold text-gray-900 dark:text-white">Orders:</span> ${ids}${moreStr}</p>`);
            }
            if (reservationsOnDate.length > 0) {
              const ids = reservationsOnDate.map(o => `#${o.id}`).slice(0, 3).join(', ');
              const moreStr = reservationsOnDate.length > 3 ? ` +${reservationsOnDate.length - 3} more` : '';
              detailsItems.push(`<p class="text-[11px] font-medium text-gray-700 dark:text-gray-300"><span class="font-bold text-gray-900 dark:text-white">Reservations:</span> ${ids}${moreStr}</p>`);
            }
            if (deliveriesOnDate.length > 0) {
              const ids = deliveriesOnDate.map(o => `#${o.id}`).slice(0, 3).join(', ');
              const moreStr = deliveriesOnDate.length > 3 ? ` +${deliveriesOnDate.length - 3} more` : '';
              detailsItems.push(`<p class="text-[11px] font-medium text-gray-700 dark:text-gray-300"><span class="font-bold text-gray-900 dark:text-white">Deliveries:</span> ${ids}${moreStr}</p>`);
            }

            if (detailsItems.length > 0) {
              detailsListHTML = `
                <div class="pt-2 border-t border-gray-200/60 dark:border-slate-700 mt-2 space-y-1">
                  ${detailsItems.join('')}
                </div>
              `;
            }

            calSelectedStatus.innerHTML = `
              <div class="space-y-2.5 text-left p-0.5">
                <div class="flex items-center justify-between pb-2 border-b border-gray-200/80 dark:border-slate-700">
                  <div>
                    <span class="text-[9px] font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider block">Operations Window</span>
                    <span class="text-xs font-black text-gray-950 dark:text-white">${formattedSelectedDateStr}</span>
                  </div>
                  <a href="activities.html?date=${formattedDateParam}" class="text-[10px] font-extrabold px-2.5 py-1 bg-green-50 dark:bg-emerald-950/60 text-[#1E6C02] dark:text-emerald-300 border border-green-200 dark:border-emerald-800/80 rounded-full hover:bg-green-100 dark:hover:bg-emerald-900/80 transition-all cursor-pointer inline-flex items-center gap-1 shadow-2xs">
                    ${totalOpsCount} Total Activity
                  </a>
                </div>

                <div class="grid grid-cols-2 gap-2">
                  <div class="bg-white dark:bg-slate-800/80 p-2 rounded-xl border border-gray-200/80 dark:border-slate-700 shadow-2xs">
                    <span class="text-[9px] font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider block">Orders</span>
                    <span class="text-sm font-black text-gray-900 dark:text-white mt-0.5 block">${ordersOnDate.length}</span>
                  </div>
                  <div class="bg-white dark:bg-slate-800/80 p-2 rounded-xl border border-gray-200/80 dark:border-slate-700 shadow-2xs">
                    <span class="text-[9px] font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider block">Reservations</span>
                    <span class="text-sm font-black text-gray-900 dark:text-white mt-0.5 block">${reservationsOnDate.length}</span>
                  </div>
                  <div class="bg-white dark:bg-slate-800/80 p-2 rounded-xl border border-gray-200/80 dark:border-slate-700 shadow-2xs">
                    <span class="text-[9px] font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider block">Deliveries</span>
                    <span class="text-sm font-black text-gray-900 dark:text-white mt-0.5 block">${deliveriesOnDate.length}</span>
                  </div>
                  <div class="bg-white dark:bg-slate-800/80 p-2 rounded-xl border border-gray-200/80 dark:border-slate-700 shadow-2xs">
                    <span class="text-[9px] font-black text-gray-500 dark:text-gray-400 uppercase tracking-wider block">Completed Sales</span>
                    <span class="text-sm font-black text-[#1E6C02] dark:text-emerald-400 mt-0.5 block">₱${completedSalesAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                  </div>
                </div>

                ${detailsListHTML}
              </div>
            `;
          }
        } else {
          calSelectedStatus.textContent = 'No active date selected';
        }

        // Cell listeners
        calDaysGrid.querySelectorAll('[data-day]').forEach(cell => {
          cell.addEventListener('click', (e) => {
            const dayTarget = e.currentTarget;
            const clickedDay = parseInt(dayTarget.getAttribute('data-day'));
            selectedCalDate = new Date(year, month, clickedDay);
            drawDashboardCalendar();
            showToast(`Operations date set to ${months[month]} ${clickedDay}, ${year}!`);
          });
        });
      }

      function bindCalendarControls() {
        const prevBtn = document.getElementById('btn-cal-prev');
        const nextBtn = document.getElementById('btn-cal-next');

        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            currentCalDate.setMonth(currentCalDate.getMonth() - 1);
            drawDashboardCalendar();
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            currentCalDate.setMonth(currentCalDate.getMonth() + 1);
            drawDashboardCalendar();
          });
        }
      }

      // Render calendar immediately
      drawDashboardCalendar();
      bindCalendarControls();

      // Bind chart filters
      const filterRange = document.getElementById('sel-chart-range');
      const filterProduct = document.getElementById('sel-chart-product');
      const resetBtn = document.getElementById('btn-reset-filters');

      if (filterRange) {
        filterRange.addEventListener('change', () => {
          timeRange = filterRange.value;
          hasUserAppliedFilter = (timeRange !== 'all' || productFilter !== 'all');
          drawPerformanceCharts();
        });
      }

      if (filterProduct) {
        filterProduct.addEventListener('change', () => {
          productFilter = filterProduct.value;
          hasUserAppliedFilter = (timeRange !== 'all' || productFilter !== 'all');
          drawPerformanceCharts();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          timeRange = 'all';
          productFilter = 'all';
          hasUserAppliedFilter = false;
          if (filterRange) filterRange.value = 'all';
          if (filterProduct) filterProduct.value = 'all';
          drawPerformanceCharts();
        });
      }

      // Bind inventory analytics filters
      const filterInvRange = document.getElementById('sel-inv-range');
      const filterInvProduct = document.getElementById('sel-inv-product');
      const resetInvBtn = document.getElementById('btn-reset-inv-filters');

      if (filterInvRange) {
        filterInvRange.addEventListener('change', () => {
          invTimeRange = filterInvRange.value;
          renderInventoryAnalytics();
        });
      }

      if (filterInvProduct) {
        filterInvProduct.addEventListener('change', () => {
          invProductFilter = filterInvProduct.value;
          renderInventoryAnalytics();
        });
      }

      if (resetInvBtn) {
        resetInvBtn.addEventListener('click', () => {
          invTimeRange = 'all';
          invProductFilter = 'all';
          if (filterInvRange) filterInvRange.value = 'all';
          if (filterInvProduct) filterInvProduct.value = 'all';
          renderInventoryAnalytics();
        });
      }

      // Bind reservation analytics filters
      const filterResRange = document.getElementById('sel-res-range');
      const filterResProduct = document.getElementById('sel-res-product');
      const resetResBtn = document.getElementById('btn-reset-res-filters');

      // Bind replenishment guide filter
      const filterReplenish = document.getElementById('sel-replenish-filter');
      if (filterReplenish) {
        filterReplenish.addEventListener('change', () => {
          replenishFilter = filterReplenish.value;
          renderStockReplenishmentGuide();
        });
      }

      if (filterResRange) {
        filterResRange.addEventListener('change', () => {
          resTimeRange = filterResRange.value;
          renderReservationAnalytics();
        });
      }

      if (filterResProduct) {
        filterResProduct.addEventListener('change', () => {
          resProductFilter = filterResProduct.value;
          renderReservationAnalytics();
        });
      }

      if (resetResBtn) {
        resetResBtn.addEventListener('click', () => {
          resTimeRange = 'all';
          resProductFilter = 'all';
          if (filterResRange) filterResRange.value = 'all';
          if (filterResProduct) filterResProduct.value = 'all';
          renderReservationAnalytics();
        });
      }

      // Initial dashboard layout render and sync setup
      refreshDashboard();

      window.addEventListener('aurora-sync-event', refreshDashboard);
      window.addEventListener('aurora-orders-updated', refreshDashboard);
      window.addEventListener('storage', refreshDashboard);
    });
  </script>
</body>
</html>
