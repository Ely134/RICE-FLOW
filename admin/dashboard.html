  <script>
    (function() {
      function isResizeObserverError(msg) {
        return typeof msg === 'string' && (
          msg.indexOf('ResizeObserver loop') !== -1 ||
          msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
          msg.indexOf('ResizeObserver loop limit exceeded') !== -1
        );
      }
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || (e.error && e.error.message));
        if (isResizeObserverError(msg)) {
          e.stopImmediatePropagation();
          if (typeof e.preventDefault === 'function') e.preventDefault();
          return true;
        }
      }, true);
      var prevOnError = window.onerror;
      window.onerror = function(msg) {
        if (isResizeObserverError(msg)) return true;
        if (prevOnError) return prevOnError.apply(this, arguments);
      };
      try {
        var d = document.documentElement;
        var isDark = localStorage.getItem('aurora-dark-mode') === 'true';
        d.classList.toggle('dark', isDark);
        d.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

      // Order completion date helper - strictly for orders that reached completed status
      function getOrderCompletionDate(order) {
        if (!order) return new Date(0);
        const s = (order.status || '').toLowerCase().replace(/_/g, '-');
        if (s !== 'completed') {
          return new Date(0);
        }
        if (order.completedAt) {
          const d = new Date(order.completedAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.completionDate) {
          const d = new Date(order.completionDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.completedDate) {
          const d = new Date(order.completedDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.statusHistory && Array.isArray(order.statusHistory)) {
          const compHist = order.statusHistory.slice().reverse().find(h => {
            const hs = (h.status || '').toLowerCase().replace(/_/g, '-');
            return hs === 'completed';
          });
          if (compHist && compHist.changedAt) {
            const d = new Date(compHist.changedAt);
            if (!isNaN(d.getTime())) return d;
          }
        }
        if (order.customerConfirmationDate) {
          const d = new Date(order.customerConfirmationDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.deliveredDate) {
          const timeStr = order.deliveredTime || '00:00';
          const d = new Date(`${order.deliveredDate} ${timeStr}`);
          if (!isNaN(d.getTime())) return d;
          const d2 = new Date(order.deliveredDate);
          if (!isNaN(d2.getTime())) return d2;
        }
        if (order.deliveryVerificationDate) {
          const d = new Date(order.deliveryVerificationDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.createdAt) {
          const d = new Date(order.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.dateCreated) {
          const d = new Date(order.dateCreated);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.date) {
          const d = new Date(order.date);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      // General order date parser (createdAt, dateCreated, date, timestamp, etc.)
      function parseOrderDate(order) {
        if (!order) return new Date(0);

        function parseRawDateValue(val) {
          if (!val) return null;
          if (val instanceof Date) {
            return !isNaN(val.getTime()) ? val : null;
          }
          if (typeof val === 'object') {
            if (typeof val.toDate === 'function') {
              const d = val.toDate();
              return (d instanceof Date && !isNaN(d.getTime())) ? d : null;
            }
            if (typeof val.seconds === 'number') {
              const d = new Date(val.seconds * 1000);
              return !isNaN(d.getTime()) ? d : null;
            }
          }
          if (typeof val === 'string') {
            const trimmed = val.trim();
            const dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(trimmed);
            if (dateOnlyMatch) {
              const yr = parseInt(dateOnlyMatch[1], 10);
              const mo = parseInt(dateOnlyMatch[2], 10) - 1;
              const da = parseInt(dateOnlyMatch[3], 10);
              const localDate = new Date(yr, mo, da, 0, 0, 0, 0);
              if (!isNaN(localDate.getTime())) return localDate;
            }
          }
          const d = new Date(val);
          return !isNaN(d.getTime()) ? d : null;
        }

        const candidates = [
          order.createdAt,
          order.dateCreated,
          order.createdDate,
          order.date,
          order.timestamp,
          order.completedAt,
          order.completionDate,
          order.completedDate,
          order.deliveredAt,
          order.deliveredDate
        ];

        for (let i = 0; i < candidates.length; i++) {
          const parsed = parseRawDateValue(candidates[i]);
          if (parsed) return parsed;
        }

        if (order.statusHistory && Array.isArray(order.statusHistory) && order.statusHistory.length > 0) {
          for (let i = 0; i < order.statusHistory.length; i++) {
            const parsed = parseRawDateValue(order.statusHistory[i]?.changedAt);
            if (parsed) return parsed;
          }
        }
        return new Date(0);
      }

      // Draw performance charts & live statistics
      function drawPerformanceCharts() {
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const liveOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];

        const filterRangeEl = document.getElementById('sel-chart-range');
        const filterProdEl = document.getElementById('sel-chart-product');
        const currentRange = filterRangeEl ? filterRangeEl.value : (timeRange || '1month');
        const currentProd = filterProdEl ? filterProdEl.value : (productFilter || 'all');

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

        let rangeStart;
        let rangeEnd = endOfToday;
        let rangeLabel = 'All Time';
        let numBuckets = 6;

        if (selectedSalesDate) {
          const selY = selectedSalesDate.getFullYear();
          const selM = selectedSalesDate.getMonth();
          const selD = selectedSalesDate.getDate();
          rangeStart = new Date(selY, selM, selD, 0, 0, 0, 0);
          rangeEnd = new Date(selY, selM, selD, 23, 59, 59, 999);
          rangeLabel = selectedSalesDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          numBuckets = 4;
        } else if (currentRange === 'custom' && salesCustomStart && salesCustomEnd) {
          const [sY, sM, sD] = salesCustomStart.split('-').map(Number);
          const [eY, eM, eD] = salesCustomEnd.split('-').map(Number);
          rangeStart = new Date(sY, sM - 1, sD, 0, 0, 0, 0);
          rangeEnd = new Date(eY, eM - 1, eD, 23, 59, 59, 999);
          const sameYear = rangeStart.getFullYear() === rangeEnd.getFullYear();
          const sFormatted = rangeStart.toLocaleDateString('en-US', sameYear ? { month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric', year: 'numeric' });
          const eFormatted = rangeEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          rangeLabel = salesCustomStart === salesCustomEnd ? eFormatted : `${sFormatted} – ${eFormatted}`;
          const spanDays = Math.max(1, Math.round((rangeEnd.getTime() - rangeStart.getTime()) / (24 * 60 * 60 * 1000)));
          numBuckets = spanDays <= 7 ? spanDays : (spanDays <= 35 ? 5 : 6);
        } else if (currentRange === '1week') {
          // Last 7 days including today (00:00:00 to 23:59:59.999)
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
          rangeLabel = '1 Week';
          numBuckets = 7;
        } else if (currentRange === '1month') {
          // Last 30 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
          rangeLabel = '1 Month';
          numBuckets = 5;
        } else if (currentRange === '3months') {
          // Last 90 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 89, 0, 0, 0, 0);
          rangeLabel = '3 Months';
          numBuckets = 3;
        } else if (currentRange === '6months') {
          // Last 180 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 179, 0, 0, 0, 0);
          rangeLabel = '6 Months';
          numBuckets = 6;
        } else if (currentRange === '1year') {
          // Last 365 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 364, 0, 0, 0, 0);
          rangeLabel = '1 Year';
          numBuckets = 12;
        } else {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 5, 1, 0, 0, 0, 0);
          rangeLabel = 'All Time';
          numBuckets = 6;
        }

        // Active variety lookup
        let activeVarietyLabel = 'All Grains';
        let matchedProdName = '';
        if (currentProd !== 'all') {
          const matchedProdObj = productsList.find(p => String(p.id) === String(currentProd));
          if (matchedProdObj) {
            activeVarietyLabel = matchedProdObj.name;
            matchedProdName = matchedProdObj.name;
          } else {
            activeVarietyLabel = currentProd;
            matchedProdName = currentProd;
          }
        }

        // Match the full Sales Overview page: reservation-marked items count only
        // when the reservation has explicitly been converted into an order ticket.
        function itemMatchesVariety(item, parentOrder = null) {
          if (!item || (item.isReservation && !(parentOrder && isTransferredReservationToOrder(parentOrder)))) return false;
          if (currentProd === 'all') return true;
          const pId = String(item.product?.id || item.productId || item.id || '');
          const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
          if (pId && pId === String(currentProd)) return true;
          if (matchedProdName && pName && pName === matchedProdName.trim().toLowerCase()) return true;
          return false;
        }

        // Helper to calculate verified sales amount contributed by an order for the selected grain filter
        function getOrderVerifiedSales(o) {
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return 0;
          if (currentProd === 'all') {
            return info.amount;
          }
          const allItems = (o.items || []).filter(item => item && (!item.isReservation || isTransferredReservationToOrder(o)));
          const matchingItems = allItems.filter(item => itemMatchesVariety(item, o));
          if (matchingItems.length === 0) return 0;
          if (matchingItems.length === allItems.length) {
            return info.amount;
          }
          const allItemsSum = allItems.reduce((acc, item) => {
            const qty = Number(item.quantity || 0);
            const price = Number(item.product?.price || item.price || 0);
            return acc + (qty * price);
          }, 0);
          const varietySum = matchingItems.reduce((acc, item) => {
            const qty = Number(item.quantity || 0);
            const price = Number(item.product?.price || item.price || 0);
            return acc + (qty * price);
          }, 0);
          const ratio = allItemsSum > 0 ? (varietySum / allItemsSum) : 1;
          return info.amount * ratio;
        }

        // Sacks must follow the same approved-ticket rule as the full Sales Overview.
        function getOrderVerifiedSacks(o) {
          let sacks = 0;
          (o.items || []).forEach(item => {
            if (itemMatchesVariety(item, o)) {
              sacks += Number(item.quantity || 0);
            }
          });
          return sacks;
        }

        const isDateOrRangeFiltered = Boolean(selectedSalesDate || currentRange !== 'all');

        // Keep order/sack activity aligned with the full Sales Overview: count
        // approved Order Processing tickets, even when delivery or COD collection
        // is pending. Pure reservations, cancelled records, and replacements are excluded.
        const approvedProcessingStatuses = new Set([
          'approved', 'confirmed', 'processing', 'preparing', 'to-ship',
          'to-receive', 'shipped', 'in-transit', 'delivered', 'completed',
          'ready-for-processing', 'ready', 'ready-for-pickup'
        ]);
        const approvedOrderTickets = liveOrders.filter(o => {
          if (!o || o.isReplacement || isSalesReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
          const statusClean = String(o.status || '').toLowerCase().replace(/_/g, '-').trim();
          const isTransferredReservation = isTransferredReservationToOrder(o);
          const hasApprovalEvidence = Boolean(
            o.approvedAt || o.verifiedBy || o.paymentVerified === true ||
            o.isVerifiedPayment === true || o.paymentConfirmed === true ||
            o.paymentStatus === 'verified' || o.paymentStatus === 'paid'
          );
          if (!approvedProcessingStatuses.has(statusClean) && !isTransferredReservation && !hasApprovalEvidence) return false;
          if (isDateOrRangeFiltered) {
            const oDate = parseOrderDate(o);
            if (oDate < rangeStart || oDate > rangeEnd) return false;
          }
          return true;
        });

        let matchingApprovedOrders = approvedOrderTickets;
        if (currentProd !== 'all') {
          matchingApprovedOrders = approvedOrderTickets.filter(o =>
            (o.items || []).some(item => itemMatchesVariety(item, o))
          );
        }

        // Revenue remains restricted to verified payments/audited collections.
        const verifiedSalesOrders = liveOrders.filter(o => {
          if (!o || o.isReplacement || isSalesReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return false;
          if (isDateOrRangeFiltered) {
            const oDate = parseOrderDate(o);
            if (oDate < rangeStart || oDate > rangeEnd) return false;
          }
          return true;
        });

        let matchingOrders = verifiedSalesOrders;
        if (currentProd !== 'all') {
          matchingOrders = verifiedSalesOrders.filter(o =>
            (o.items || []).some(item => itemMatchesVariety(item, o))
          );
        }

        let timeframeSacksSum = 0;
        let timeframeSalesSum = 0;
        matchingApprovedOrders.forEach(o => {
          timeframeSacksSum += getOrderVerifiedSacks(o);
        });
        matchingOrders.forEach(o => {
          timeframeSalesSum += getOrderVerifiedSales(o);
        });

        // Determine whether user has actively applied a filter to top summary cards
        const isFilterActive = Boolean(selectedSalesDate || (hasUserAppliedFilter && (currentRange !== 'all' || currentProd !== 'all')));

        const resetBtn = document.getElementById('btn-reset-filters');
        if (resetBtn) {
          if (isFilterActive) {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        let displayTotalOrders = 0;
        let displayActiveReservations = 0;
        let displayTotalReservations = 0;
        let displayTotalSales = 0;
        let displayTopProductName = 'N/A';
        let displayTopProductVol = 0;

        // Shared authoritative calculation for Dashboard Total Orders card and dedicated Total Orders page
        const selectedSalesDateYMD = (selectedSalesDate instanceof Date && !isNaN(selectedSalesDate.getTime()))
          ? `${selectedSalesDate.getFullYear()}-${String(selectedSalesDate.getMonth() + 1).padStart(2, '0')}-${String(selectedSalesDate.getDate()).padStart(2, '0')}`
          : '';
        const totalOrdersFilterState = {
          currentRange,
          currentProd,
          selectedSalesDate: selectedSalesDate || selectedSalesDateYMD,
          salesCustomStart,
          salesCustomEnd,
          hasUserAppliedFilter
        };
        const totalOrdersData = getDashboardTotalOrdersData({
          ...totalOrdersFilterState,
          liveOrders,
          productsList
        });
        displayTotalOrders = totalOrdersData.count;

        try {
          sessionStorage.setItem('aurora-dashboard-total-orders-state', JSON.stringify({
            currentRange,
            currentProd,
            selectedSalesDate: selectedSalesDateYMD,
            salesCustomStart,
            salesCustomEnd,
            hasUserAppliedFilter
          }));
        } catch (_) {}

        const btnViewTotalOrders = document.getElementById('btn-view-total-orders');
        if (btnViewTotalOrders) {
          if (totalOrdersData.isFilterActive) {
            const params = new URLSearchParams();
            params.set('filtered', '1');
            params.set('range', currentRange);
            params.set('prod', currentProd);
            if (selectedSalesDateYMD) params.set('date', selectedSalesDateYMD);
            if (salesCustomStart) params.set('start', salesCustomStart);
            if (salesCustomEnd) params.set('end', salesCustomEnd);
            btnViewTotalOrders.setAttribute('href', `total-orders.html?${params.toString()}`);
          } else {
            btnViewTotalOrders.setAttribute('href', 'total-orders.html');
          }
        }

        const totalSalesData = getDashboardTotalSalesData({
          ...totalOrdersFilterState,
          liveOrders,
          productsList
        });
        displayTotalSales = totalSalesData.totalSales;

        try {
          sessionStorage.setItem('aurora-dashboard-total-sales-state', JSON.stringify({
            currentRange,
            currentProd,
            selectedSalesDate: selectedSalesDateYMD,
            salesCustomStart,
            salesCustomEnd,
            hasUserAppliedFilter
          }));
        } catch (_) {}

        const btnViewTotalSales = document.getElementById('btn-view-total-sales');
        if (btnViewTotalSales) {
          if (totalSalesData.isFilterActive) {
            const params = new URLSearchParams();
            params.set('filtered', '1');
            params.set('range', currentRange);
            params.set('prod', currentProd);
            if (selectedSalesDateYMD) params.set('date', selectedSalesDateYMD);
            if (salesCustomStart) params.set('start', salesCustomStart);
            if (salesCustomEnd) params.set('end', salesCustomEnd);
            btnViewTotalSales.setAttribute('href', `total-sales.html?${params.toString()}`);
          } else {
            btnViewTotalSales.setAttribute('href', 'total-sales.html');
          }
        }

        const activeReservationsData = getDashboardActiveReservationsData({
          ...totalOrdersFilterState,
          liveOrders,
          productsList
        });
        displayActiveReservations = activeReservationsData.count;
        displayTotalReservations = activeReservationsData.count;

        const btnViewTotalReservations = document.getElementById('btn-view-total-reservations') || document.getElementById('btn-view-active-reservations');
        if (btnViewTotalReservations) {
          btnViewTotalReservations.setAttribute('href', 'reservations.html');
        }

        const topRiceProductData = getDashboardTopRiceProductData({
          ...totalOrdersFilterState,
          liveOrders,
          productsList
        });
        displayTopProductName = topRiceProductData.topProductName;
        displayTopProductVol = topRiceProductData.topProductVol;

        try {
          sessionStorage.setItem('aurora-dashboard-top-product-state', JSON.stringify({
            currentRange,
            currentProd,
            selectedSalesDate: selectedSalesDateYMD,
            salesCustomStart,
            salesCustomEnd,
            hasUserAppliedFilter
          }));
        } catch (_) {}

        const btnViewTopProduct = document.getElementById('btn-view-top-product');
        if (btnViewTopProduct) {
          if (topRiceProductData.isFilterActive) {
            const params = new URLSearchParams();
            params.set('filtered', '1');
            params.set('range', currentRange);
            params.set('prod', currentProd);
            if (selectedSalesDateYMD) params.set('date', selectedSalesDateYMD);
            if (salesCustomStart) params.set('start', salesCustomStart);
            if (salesCustomEnd) params.set('end', salesCustomEnd);
            btnViewTopProduct.setAttribute('href', `top-product.html?${params.toString()}`);
          } else {
            btnViewTopProduct.setAttribute('href', 'top-product.html');
          }
        }

        // Update top 4 summary cards (Total Orders, Total Reservations, Total Sales, Available Stock)
        const topTotalOrdersEl = document.getElementById('dash-total-registered');
        const topTotalReservationsEl = document.getElementById('dash-total-reservations') || document.getElementById('dash-active-reservations');
        const topActiveReservationsEl = topTotalReservationsEl;
        const topReservationsSubEl = document.getElementById('dash-reservations-sub');
        const topTotalSalesEl = document.getElementById('dash-validated-revenue');
        const topAvailableSacksEl = document.getElementById('dash-available-sacks');
        const topAvailableKgEl = document.getElementById('dash-available-kg');
        const topProductNameEl = document.getElementById('dash-top-product-name');
        const topProductVolEl = document.getElementById('dash-top-product-vol');

        const availableStockData = getDashboardAvailableStockData({ productsList });

        if (topTotalOrdersEl) {
          topTotalOrdersEl.textContent = `${displayTotalOrders} Order${displayTotalOrders !== 1 ? 's' : ''}`;
        }
        if (topTotalReservationsEl) {
          topTotalReservationsEl.textContent = `${displayTotalReservations} Reservation${displayTotalReservations !== 1 ? 's' : ''}`;
        }
        if (topReservationsSubEl) {
          topReservationsSubEl.textContent = activeReservationsData.isFilterActive ? 'Filtered reservations' : 'Active reservations in progress';
        }
        if (topTotalSalesEl) {
          topTotalSalesEl.textContent = `₱${displayTotalSales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }
        if (topAvailableSacksEl) {
          topAvailableSacksEl.textContent = `${availableStockData.totalAvailableSacks.toLocaleString('en-US')} sacks`;
        }
        if (topAvailableKgEl) {
          topAvailableKgEl.textContent = `${availableStockData.totalAvailableKg.toLocaleString('en-US')} kg`;
        }
        if (topProductNameEl) {
          topProductNameEl.textContent = displayTopProductName;
        }
        if (topProductVolEl) {
          topProductVolEl.textContent = `${displayTopProductVol} sacks sold`;
        }

        // Update bottom 4 summary cards
        const cardRange = document.getElementById('card-time-range');
        const cardSales = document.getElementById('card-completed-sales');
        const cardAmount = document.getElementById('card-completed-amount');
        const cardVariety = document.getElementById('card-active-variety');
        const cardSacks = document.getElementById('card-timeframe-sacks');

        // Calculate strictly COMPLETED orders and their sales amount for the Completed Orders summary card
        const strictlyCompletedOrders = liveOrders.filter(o => {
          if (!isOrderActuallyCompleted(o)) return false;

          if (isDateOrRangeFiltered) {
            const oDate = getCompletedOrderDate(o);
            if (!oDate || isNaN(oDate.getTime()) || oDate < rangeStart || oDate > rangeEnd) {
              return false;
            }
          }

          if (currentProd !== 'all') {
            return (o.items || []).some(item => itemMatchesVariety(item));
          }
          return true;
        });

        let strictlyCompletedSalesAmount = 0;
        strictlyCompletedOrders.forEach(o => {
          if (currentProd !== 'all') {
            const allItems = (o.items || []).filter(item => item && !item.isReservation);
            const matchingItems = allItems.filter(item => itemMatchesVariety(item));
            const allSum = allItems.reduce((acc, item) => acc + (Number(item.quantity || 0) * Number(item.product?.price || item.price || 0)), 0);
            const varSum = matchingItems.reduce((acc, item) => acc + (Number(item.quantity || 0) * Number(item.product?.price || item.price || 0)), 0);
            const orderTot = Number(o.total || o.totalPrice || o.totalBill || o.amountPaid || 0);
            const ratio = allSum > 0 ? (varSum / allSum) : 1;
            strictlyCompletedSalesAmount += (orderTot * ratio);
          } else {
            strictlyCompletedSalesAmount += Number(o.total || o.totalPrice || o.totalBill || o.amountPaid || 0);
          }
        });

        if (cardRange) cardRange.textContent = rangeLabel;
        if (cardSales) cardSales.textContent = `${strictlyCompletedOrders.length} Order${strictlyCompletedOrders.length !== 1 ? 's' : ''}`;
        if (cardAmount) cardAmount.textContent = `₱${strictlyCompletedSalesAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} sales`;
        if (cardVariety) {
          cardVariety.textContent = activeVarietyLabel;
          cardVariety.title = activeVarietyLabel;
        }
        if (cardSacks) cardSacks.textContent = `${timeframeSacksSum} Sack${timeframeSacksSum !== 1 ? 's' : ''}`;

        // Build time buckets for Sales Overview Bar Chart
        const totalDurationMs = rangeEnd.getTime() - rangeStart.getTime();
        const bucketMs = totalDurationMs / numBuckets;
        const buckets = [];
        const isMonthlyRange = !selectedSalesDate && (currentRange === 'all' || currentRange === '6months' || currentRange === '3months' || currentRange === '1year');

        for (let i = 0; i < numBuckets; i++) {
          let bStart;
          let bEnd;
          let label = '';
          if (selectedSalesDate) {
            bStart = new Date(rangeStart.getTime() + i * bucketMs);
            bEnd = new Date(rangeStart.getTime() + (i + 1) * bucketMs);
            const slotLabels = ['12AM–6AM', '6AM–12PM', '12PM–6PM', '6PM–12AM'];
            label = slotLabels[i] || rangeLabel;
          } else if (currentRange === '1week') {
            bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
            bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
            label = bStart.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          } else if (currentRange === '1month') {
            bStart = new Date(rangeStart.getTime() + i * bucketMs);
            bEnd = new Date(rangeStart.getTime() + (i + 1) * bucketMs);
            label = `Wk ${i + 1}`;
          } else if (isMonthlyRange) {
            const mOffset = -(numBuckets - 1 - i);
            bStart = new Date(now.getFullYear(), now.getMonth() + mOffset, 1, 0, 0, 0, 0);
            bEnd = new Date(now.getFullYear(), now.getMonth() + mOffset + 1, 0, 23, 59, 59, 999);
            label = bStart.toLocaleDateString('en-US', { month: 'short' });
          } else {
            bStart = new Date(rangeStart.getTime() + i * bucketMs);
            bEnd = new Date(rangeStart.getTime() + (i + 1) * bucketMs);
            const bMid = new Date((bStart.getTime() + bEnd.getTime()) / 2);
            label = bMid.toLocaleDateString('en-US', { month: 'short' });
          }

          let sacksInBucket = 0;
          let ordersInBucket = 0;
          let salesInBucket = 0;

          matchingApprovedOrders.forEach(o => {
            const oDate = parseOrderDate(o);
            const inBucket = (isMonthlyRange || (!selectedSalesDate && currentRange === '1week'))
              ? (oDate >= bStart && oDate <= bEnd)
              : ((i === numBuckets - 1) ? (oDate >= bStart && oDate <= bEnd) : (oDate >= bStart && oDate < bEnd));
            if (inBucket) {
              const oSacks = getOrderVerifiedSacks(o);
              if (oSacks > 0 || currentProd === 'all') {
                ordersInBucket++;
                sacksInBucket += oSacks;
              }
            }
          });
          // Show verified/audited revenue independently from approved order counts.
          matchingOrders.forEach(o => {
            const oDate = parseOrderDate(o);
            const inBucket = (isMonthlyRange || (!selectedSalesDate && currentRange === '1week'))
              ? (oDate >= bStart && oDate <= bEnd)
              : ((i === numBuckets - 1) ? (oDate >= bStart && oDate <= bEnd) : (oDate >= bStart && oDate < bEnd));
            if (inBucket) salesInBucket += getOrderVerifiedSales(o);
          });

          buckets.push({
            label,
            sacks: sacksInBucket,
            orders: ordersInBucket,
            sales: salesInBucket
          });
        }

        function formatRevenueAxis(val) {
          if (val <= 0) return '₱0';
          if (val >= 1000000) {
            const m = val / 1000000;
            return `₱${m % 1 === 0 ? m.toFixed(0) : m.toFixed(1)}M`;
          }
          if (val >= 1000) {
            const k = val / 1000;
            return `₱${k % 1 === 0 ? k.toFixed(0) : (k < 10 ? k.toFixed(1) : k.toFixed(0))}K`;
          }
          return `₱${Math.round(val)}`;
        }

        function getNiceMaxRevenue(maxRaw) {
          if (maxRaw <= 8000) return 8000;
          if (maxRaw <= 10000) return 10000;
          if (maxRaw <= 20000) return Math.ceil(maxRaw / 4000) * 4000;
          if (maxRaw <= 50000) return Math.ceil(maxRaw / 5000) * 5000;
          if (maxRaw <= 100000) return Math.ceil(maxRaw / 10000) * 10000;
          const power = Math.pow(10, Math.floor(Math.log10(maxRaw)));
          const step = power / 2;
          return Math.ceil(maxRaw / step) * step;
        }

        const rawMaxSales = Math.max(...buckets.map(b => b.sales), 0);
        const maxSalesVal = getNiceMaxRevenue(rawMaxSales);

        // Render Bar Chart (Compact Preview)
        const barChartContainer = document.getElementById('sales-barchart-inner');
        if (barChartContainer) {
          const hasAnySep = buckets.some(bk => bk.label && (bk.label.toLowerCase().includes('sep') || bk.label.toLowerCase().includes('sept')));
          barChartContainer.innerHTML = `
            <div class="flex flex-col pt-2 pb-7 sm:pb-8 w-full">
              <div class="h-40 sm:h-44 flex items-end gap-2.5 sm:gap-3.5 pl-16 sm:pl-20 pr-3 sm:pr-4 border-b so-chart-gridline relative">
                <!-- Grid Lines -->
                <div class="so-chart-gridline absolute inset-x-0 top-0 border-t border-dashed flex items-center pointer-events-none pl-2 sm:pl-2.5">
                  <span class="so-chart-axis-pill text-[#000000] dark:text-[#D6E6F8] text-[10.5px] sm:text-[11.5px] font-semibold tabular-nums px-1.5 py-0.5 rounded-md -translate-y-1/2">${formatRevenueAxis(maxSalesVal)}</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-1/4 border-t border-dashed flex items-center pointer-events-none pl-2 sm:pl-2.5">
                  <span class="so-chart-axis-pill text-[#000000] dark:text-[#D6E6F8] text-[10.5px] sm:text-[11.5px] font-semibold tabular-nums px-1.5 py-0.5 rounded-md -translate-y-1/2">${formatRevenueAxis(maxSalesVal * 0.75)}</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-1/2 border-t border-dashed flex items-center pointer-events-none pl-2 sm:pl-2.5">
                  <span class="so-chart-axis-pill text-[#000000] dark:text-[#D6E6F8] text-[10.5px] sm:text-[11.5px] font-semibold tabular-nums px-1.5 py-0.5 rounded-md -translate-y-1/2">${formatRevenueAxis(maxSalesVal * 0.5)}</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-3/4 border-t border-dashed flex items-center pointer-events-none pl-2 sm:pl-2.5">
                  <span class="so-chart-axis-pill text-[#000000] dark:text-[#D6E6F8] text-[10.5px] sm:text-[11.5px] font-semibold tabular-nums px-1.5 py-0.5 rounded-md -translate-y-1/2">${formatRevenueAxis(maxSalesVal * 0.25)}</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 bottom-0 flex items-center pointer-events-none pl-2 sm:pl-2.5">
                  <span class="so-chart-axis-pill text-[#000000] dark:text-[#D6E6F8] text-[10.5px] sm:text-[11.5px] font-semibold tabular-nums px-1.5 py-0.5 rounded-md translate-y-1/2">₱0</span>
                </div>

                <!-- Dynamic bars -->
                ${buckets.map(b => {
                  const hasZeroSalesActivity = b.sales <= 0 && (b.sacks > 0 || b.orders > 0);
                  const heightPercent = maxSalesVal > 0 ? Math.min((b.sales / maxSalesVal) * 100, 100) : 0;
                  const formattedSales = b.sales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                  const isHighlighted = Boolean((b.label && /(sep|oct)/i.test(b.label)) || b.sales > 0 || hasZeroSalesActivity);
                  const barColorClass = isHighlighted
                    ? 'bg-[#1E6C02] hover:bg-[#145001] dark:bg-emerald-500 dark:hover:bg-emerald-400 so-bar-sep shadow-xs'
                    : 'bg-[#6366F1] hover:bg-[#4F46E5] dark:bg-[#6366F1] dark:hover:bg-[#818CF8] so-bar-default shadow-xs';
                  const labelClass = isHighlighted
                    ? 'so-text-main text-[11.5px] sm:text-[12px] font-bold absolute top-full mt-2.5 truncate w-full text-center tracking-tight text-[#15803D] dark:text-emerald-400 so-bar-label-sep'
                    : 'so-text-main text-[11.5px] sm:text-[12px] font-semibold absolute top-full mt-2.5 truncate w-full text-center tracking-tight text-[#000000] dark:text-[#D6E6F8]';
                  const barStyle = b.sales > 0
                    ? `height: ${heightPercent}%; min-height: 4px;`
                    : (hasZeroSalesActivity ? 'height: 6px; min-height: 6px;' : 'height: 0%;');
                  const tooltipNote = hasZeroSalesActivity
                    ? ' · ₱0 verified sales; baseline indicator shows approved order activity'
                    : '';
                  return `
                    <div class="flex-1 flex flex-col items-center group relative h-full justify-end cursor-pointer z-10 self-stretch">
                      <!-- Tooltip -->
                      <div class="absolute bottom-full mb-2 bg-white dark:bg-[#0E1B38] text-[#000000] dark:text-white text-[11px] font-bold py-1.5 px-3 rounded-xl border border-[#CBDDF0] dark:border-[#1E3563] opacity-0 group-hover:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl">
                        <span class="text-[#14532D] dark:text-emerald-400 font-black">${b.label}:</span> <span class="text-[#000000] dark:text-white font-black">₱${formattedSales}</span> <span class="text-[#000000] dark:text-[#D6E6F8] font-semibold">(${b.sacks} Sacks · ${b.orders} Order${b.orders !== 1 ? 's' : ''}${tooltipNote})</span>
                      </div>
                      <!-- Bar item -->
                      <div class="${barColorClass} rounded-t-[3px] transition-all w-full max-w-[32px] sm:max-w-[36px]" style="${barStyle}"></div>
                      <span class="${labelClass}" title="${b.label}">${b.label}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // B. Order Summary Pie Chart
        const statusCategories = [
          { key: 'to-pay', label: 'To Pay', color: '#F59E0B' },
          { key: 'processing', label: 'Processing', color: '#3B82F6' },
          { key: 'to-ship', label: 'To Ship', color: '#8B5CF6' },
          { key: 'to-receive', label: 'To Receive', color: '#0EA5E9' },
          { key: 'delivered', label: 'Delivered', color: '#14B8A6' },
          { key: 'issue-reported', label: 'Issue Reported', color: '#EF4444' },
          { key: 'completed', label: 'Completed', color: '#1E6C02' },
          { key: 'cancelled', label: 'Cancelled', color: '#BE123C' }
        ];

        const categoryCounts = {
          'to-pay': 0,
          'processing': 0,
          'to-ship': 0,
          'to-receive': 0,
          'delivered': 0,
          'issue-reported': 0,
          'completed': 0,
          'cancelled': 0
        };

        // Match Admin > Orders' Issue Reported filter exactly: resolved issue cases
        // remain in the underlying order history, but are excluded from the active
        // Order Summary distribution and its center total. Do not modify stored data.
        const isResolvedIssueExcludedFromActiveSummary = (order) => {
          if (!order || order.status !== 'issue-reported') return false;

          const issue = order.reportedIssue || {};
          const issueStatus = String(issue.status || '').toLowerCase().trim();
          const linkedReplacementCompleted = liveOrders.some(candidate =>
            String(candidate.originalOrderId || '') === String(order.id || '') &&
            Boolean(candidate.isReplacement || candidate.replacementDelivery) &&
            String(candidate.status || '').toLowerCase() === 'completed'
          );

          return issueStatus === 'completed' ||
            issueStatus === 'resolved' ||
            (issueStatus === 'approved' && linkedReplacementCompleted);
        };

        const regularOrders = liveOrders.filter(o =>
          !o.isPreOrder &&
          !(o.items && o.items.some(i => i.isReservation)) &&
          !isResolvedIssueExcludedFromActiveSummary(o)
        );

        regularOrders.forEach(o => {
          const s = (o.status || '').toLowerCase().replace(/_/g, '-');
          if (s === 'to-pay' || s === 'unpaid' || s === 'pending-payment') {
            categoryCounts['to-pay']++;
          } else if (s === 'processing' || s === 'pre-order' || s === 'reserved' || s === 'waiting' || s === 'ready' || s === 'ready_for_processing') {
            categoryCounts['processing']++;
          } else if (s === 'to-ship' || s === 'preparing') {
            categoryCounts['to-ship']++;
          } else if (s === 'to-receive' || s === 'shipped' || s === 'in-transit') {
            categoryCounts['to-receive']++;
          } else if (s === 'delivered') {
            categoryCounts['delivered']++;
          } else if (s === 'issue-reported' || s === 'issue') {
            categoryCounts['issue-reported']++;
          } else if (s === 'completed' || s === 'fulfilled') {
            categoryCounts['completed']++;
          } else if (s === 'cancelled' || s === 'rejected' || s === 'expired') {
            categoryCounts['cancelled']++;
          } else {
            categoryCounts['to-pay']++;
          }
        });

        const totalCountedOrders = regularOrders.length;

        // Build SVG Donut slices
        let accumulatedPercent = 0;
        const svgSlices = [];

        statusCategories.forEach(cat => {
          const count = categoryCounts[cat.key] || 0;
          const pct = totalCountedOrders > 0 ? (count / totalCountedOrders) : 0;
          
          if (pct > 0) {
            const startAngle = accumulatedPercent * 2 * Math.PI - Math.PI / 2;
            accumulatedPercent += pct;
            const endAngle = accumulatedPercent * 2 * Math.PI - Math.PI / 2;

            const rOuter = 42;
            const rInner = 26;
            let angleDiff = endAngle - startAngle;
            let effectiveEndAngle = endAngle;
            if (angleDiff >= 2 * Math.PI - 0.0001) {
              effectiveEndAngle = startAngle + 2 * Math.PI - 0.0001;
            }

            const x1_out = (rOuter * Math.cos(startAngle)).toFixed(2);
            const y1_out = (rOuter * Math.sin(startAngle)).toFixed(2);
            const x2_out = (rOuter * Math.cos(effectiveEndAngle)).toFixed(2);
            const y2_out = (rOuter * Math.sin(effectiveEndAngle)).toFixed(2);

            const x1_in = (rInner * Math.cos(effectiveEndAngle)).toFixed(2);
            const y1_in = (rInner * Math.sin(effectiveEndAngle)).toFixed(2);
            const x2_in = (rInner * Math.cos(startAngle)).toFixed(2);
            const y2_in = (rInner * Math.sin(startAngle)).toFixed(2);

            const largeArc = angleDiff > Math.PI ? 1 : 0;
            const pathData = `M ${x1_out} ${y1_out} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2_out} ${y2_out} L ${x1_in} ${y1_in} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2_in} ${y2_in} Z`;

            const pctDisplay = (pct * 100) % 1 === 0 ? (pct * 100).toFixed(0) : (pct * 100).toFixed(1);
            svgSlices.push(`
              <path d="${pathData}" fill="${cat.color}" class="transition-all hover:opacity-80 cursor-pointer">
                <title>${cat.label}: ${count} Orders (${pctDisplay}%)</title>
              </path>
            `);
          }
        });

        const pieChartContainer = document.getElementById('piechart-container-inner');
        if (pieChartContainer) {
          pieChartContainer.innerHTML = `
            <div class="flex items-center justify-between w-full h-full gap-2.5 sm:gap-4 lg:gap-5">
              <!-- LEFT SIDE — Main visual (roughly 47–48%) -->
              <div class="w-[47%] sm:w-[48%] flex items-center justify-center shrink-0 py-1">
                <div class="relative flex items-center justify-center">
                  <svg viewBox="-50 -50 100 100" class="w-[174px] h-[174px] sm:w-[198px] sm:h-[198px] transform -rotate-90">
                    ${totalCountedOrders === 0 ? `
                      <circle cx="0" cy="0" r="34" fill="none" stroke="#DCE5EF" class="dark:stroke-[#1E3563]" stroke-width="14" />
                    ` : svgSlices.join('')}
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                    <p class="text-3xl sm:text-[34px] font-bold text-gray-950 dark:text-white leading-none tracking-tight">${totalCountedOrders}</p>
                    <p class="text-[11px] sm:text-[11.5px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mt-1">${totalCountedOrders === 1 ? 'Order' : 'Orders'}</p>
                  </div>
                </div>
              </div>

              <!-- RIGHT SIDE — Order status details (roughly 52–53%) -->
              <div class="w-[53%] sm:w-[52%] flex-1 min-w-0 flex flex-col justify-center space-y-0.5 sm:space-y-1">
                ${statusCategories.map(cat => {
                  const count = categoryCounts[cat.key] || 0;
                  const pct = totalCountedOrders > 0 ? (count / totalCountedOrders) * 100 : 0;
                  const pctStr = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);
                  return `
                    <div class="order-summary-row flex items-center justify-between gap-1.5 sm:gap-2 py-1 sm:py-1.5 px-2 sm:px-2.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors">
                      <div class="flex items-center gap-2 min-w-0">
                        <span class="w-2.5 h-2.5 rounded-full shrink-0 shadow-2xs" style="background-color: ${cat.color};"></span>
                        <span class="font-medium text-slate-700 dark:text-slate-200 text-xs sm:text-[12.5px] truncate leading-snug" title="${cat.label}">${cat.label}</span>
                      </div>
                      <div class="flex items-center gap-1 shrink-0 text-right">
                        <span class="font-bold text-slate-900 dark:text-white text-xs sm:text-[12.5px] tabular-nums leading-snug">${count}</span>
                        <span class="text-slate-500 dark:text-slate-400 font-medium text-[10.5px] sm:text-[11px] tabular-nums leading-snug">(${pctStr}%)</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // Sync Order Summary card height with Sales Overview card on desktop
        syncOrderSummaryHeight();

        // Render Completed Orders Section (follows active date/preset and selected rice variety)
        renderCompletedOrdersSection(rangeStart, rangeEnd, rangeLabel, isDateOrRangeFiltered, currentProd, liveOrders, itemMatchesVariety);
      }

      function syncDashboardCardsHeight() {
        const orderCard = document.getElementById('order-summary-section');
        const invCard = document.getElementById('inventory-health-section');
        const srgCard = document.getElementById('stock-replenishment-guide-section');
        const invAnalyticsCard = document.getElementById('inventory-analytics-section');
        if (orderCard && orderCard.style.height) orderCard.style.height = '';
        if (invCard && invCard.style.height) invCard.style.height = '';
        if (srgCard && srgCard.style.height) srgCard.style.height = '';
        if (invAnalyticsCard && invAnalyticsCard.style.height) invAnalyticsCard.style.height = '';
      }

      function syncOrderSummaryHeight() {
        syncDashboardCardsHeight();
      }

      window.addEventListener('resize', syncDashboardCardsHeight);

      // Authoritative Completed Order status checker - strictly actual 'completed' status
      function isOrderActuallyCompleted(order) {
        if (!order) return false;
        if (order.isReplacement) return false;
        if (typeof isCancelledOrRejectedOrder === 'function' && isCancelledOrRejectedOrder(order)) return false;
        const s = String(order.status || '').trim().toLowerCase().replace(/_/g, '-');
        return s === 'completed';
      }

      // Get completion/order date for completed orders adhering to Sales Overview date interpretation
      function getCompletedOrderDate(order) {
        const compDate = getOrderCompletionDate(order);
        if (compDate && !isNaN(compDate.getTime()) && compDate.getTime() > 0) {
          return compDate;
        }
        return parseOrderDate(order);
      }

      // Render the Completed Orders section below Sales Overview
      function renderCompletedOrdersSection(rangeStart, rangeEnd, rangeLabel, isFiltered, selectedProd, ordersList, itemMatchesVarietyFn) {
        const calSelectedStatus = document.getElementById('cal-selected-status');
        if (!calSelectedStatus) return;

        const allOrders = ordersList || (typeof getAllOrders === 'function' ? getAllOrders() : []);
        const prodsList = typeof getProducts === 'function' ? getProducts() : [];
        let matchedProdName = '';
        if (selectedProd && selectedProd !== 'all') {
          const matchedProdObj = prodsList.find(p => String(p.id) === String(selectedProd));
          matchedProdName = matchedProdObj ? matchedProdObj.name : selectedProd;
        }

        const completedOrders = allOrders.filter(o => {
          if (!isOrderActuallyCompleted(o)) return false;

          if (isFiltered) {
            const oDate = getCompletedOrderDate(o);
            if (!oDate || isNaN(oDate.getTime()) || oDate < rangeStart || oDate > rangeEnd) {
              return false;
            }
          }

          if (selectedProd && selectedProd !== 'all') {
            const matchesVariety = (o.items || []).some(item => {
              if (!item || item.isReservation) return false;
              if (typeof itemMatchesVarietyFn === 'function') {
                return itemMatchesVarietyFn(item);
              }
              const pId = String(item.product?.id || item.productId || item.id || '');
              const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
              if (pId && pId === String(selectedProd)) return true;
              if (matchedProdName && pName && pName === matchedProdName.trim().toLowerCase()) return true;
              if (matchedProdName && (pName.includes(matchedProdName.trim().toLowerCase()) || matchedProdName.trim().toLowerCase().includes(pName))) return true;
              return false;
            });
            if (!matchesVariety) return false;
          }
          return true;
        });

        if (completedOrders.length === 0) {
          const emptyMsg = (selectedProd && selectedProd !== 'all')
            ? `No completed orders found for ${matchedProdName || 'this variety'}.`
            : `No completed orders found for this period.`;
          calSelectedStatus.innerHTML = `
            <div class="space-y-1 text-left">
              <p class="so-text-sub text-[11px] font-extrabold uppercase tracking-wider">Completed Orders</p>
              <p class="so-text-main text-sm sm:text-base font-black tracking-tight">${rangeLabel}</p>
              <p class="so-text-sub text-xs sm:text-[13px] font-semibold pt-0.5">${emptyMsg}</p>
            </div>
          `;
          return;
        }

        const detailsItems = [];

        // Order IDs formatted cleanly
        const orderIds = completedOrders.map(o => {
          const rawId = String(o.id || o.orderNumber || '').trim();
          return rawId.startsWith('#') ? rawId : `#${rawId}`;
        }).filter(Boolean);

        if (orderIds.length > 0) {
          const idsStr = orderIds.slice(0, 5).join(', ');
          const moreStr = orderIds.length > 5 ? ` +${orderIds.length - 5} more` : '';
          detailsItems.push(`<p class="so-text-sub text-xs sm:text-[13px] font-semibold"><span class="so-text-main font-extrabold">Order ID:</span> ${idsStr}${moreStr}</p>`);
        }

        // Payment Numbers / References
        const paymentNumbers = completedOrders.map(o => {
          return o.referenceNumber || o.paymentNumber || o.refNumber || o.paymentRef || o.paymentId || '';
        }).filter(Boolean);

        if (paymentNumbers.length > 0) {
          const pRefsStr = paymentNumbers.slice(0, 5).join(', ');
          const pMoreStr = paymentNumbers.length > 5 ? ` +${paymentNumbers.length - 5} more` : '';
          detailsItems.push(`<p class="so-text-sub text-xs sm:text-[13px] font-semibold"><span class="so-text-main font-extrabold">Payment Number:</span> ${pRefsStr}${pMoreStr}</p>`);
        }

        // Payment / Amount information belonging to actual completed orders
        let completedTotalAmount = 0;
        completedOrders.forEach(o => {
          if (selectedProd && selectedProd !== 'all') {
            const allItems = (o.items || []).filter(item => item && !item.isReservation);
            const matchingItems = allItems.filter(item => {
              if (typeof itemMatchesVarietyFn === 'function') return itemMatchesVarietyFn(item);
              const pId = String(item.product?.id || item.productId || item.id || '');
              const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
              return pId === String(selectedProd) || (matchedProdName && pName.includes(matchedProdName.trim().toLowerCase()));
            });
            const allSum = allItems.reduce((acc, item) => acc + (Number(item.quantity || 0) * Number(item.product?.price || item.price || 0)), 0);
            const varSum = matchingItems.reduce((acc, item) => acc + (Number(item.quantity || 0) * Number(item.product?.price || item.price || 0)), 0);
            const orderTot = Number(o.total || o.totalPrice || o.totalBill || o.amountPaid || 0);
            const ratio = allSum > 0 ? (varSum / allSum) : 1;
            completedTotalAmount += (orderTot * ratio);
          } else {
            completedTotalAmount += Number(o.total || o.totalPrice || o.totalBill || o.amountPaid || 0);
          }
        });

        if (completedTotalAmount > 0) {
          detailsItems.push(`<p class="so-text-sub text-xs sm:text-[13px] font-semibold"><span class="so-text-main font-extrabold">Payment Amount:</span> ₱${completedTotalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>`);
        }

        calSelectedStatus.innerHTML = `
          <div class="space-y-3 text-left">
            <div class="so-header-divider flex items-center justify-between pb-2.5">
              <div>
                <span class="so-text-sub text-[11px] font-extrabold uppercase tracking-wider block">Completed Orders</span>
                <span class="so-text-main text-sm sm:text-base font-black tracking-tight mt-0.5 block">${rangeLabel}</span>
              </div>
              <span class="so-activity-badge text-xs font-extrabold px-3 py-1 rounded-full inline-flex items-center gap-1 shadow-2xs">
                ${completedOrders.length} Completed Order${completedOrders.length !== 1 ? 's' : ''}
              </span>
            </div>

            <div class="space-y-1.5 pt-1">
              ${detailsItems.join('')}
            </div>
          </div>
        `;
      }

      function refreshDashboard() {
        populateProductDropdown();
        const liveOrders = getAllOrders ? getAllOrders() : [];
        
        // 1. Total Regular Orders (for Recent Orders table)
        const regularOrders = liveOrders.filter(o => !isReservationOrder(o) && !isCancelledOrRejectedOrder(o) && !o.isReplacement);

        // Update Recent Orders table
        const tbody = document.getElementById('dash-pipeline-tbody');
        if (tbody) {
          const sortedOrders = regularOrders.slice().sort((a, b) => {
            const tA = new Date(a.createdAt || a.dateCreated || a.date || 0).getTime();
            const tB = new Date(b.createdAt || b.dateCreated || b.date || 0).getTime();
            return tB - tA;
          });

          const recentOrders = sortedOrders.slice(0, 4);

          if (recentOrders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-600 dark:text-gray-300 font-medium text-xs">No recent orders found</td></tr>`;
          } else {
            tbody.innerHTML = recentOrders.map(order => {
              const itemsText = (order.items || [])
                .filter(i => !i.isReservation)
                .map(i => `${i.product?.name || i.name || i.productName || 'Rice Product'} (${i.quantity || 1})`)
                .join(', ');
              const customerName = order.fullName || order.customerName || order.userName || 'Customer';
              const formattedTotal = Number(order.total || order.amountPaid || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

              return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                  <td class="py-3.5 px-3 font-normal text-gray-900 font-mono">#${order.id}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900">${customerName}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900 truncate max-w-[200px]">${itemsText || 'N/A'}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900">₱${formattedTotal}</td>
                  <td class="py-3.5 px-3 text-right">
                    <span class="px-2.5 py-1 rounded-full font-semibold text-xs tracking-wide ${getStatusBadgeClass(order.status)}">${getStatusLabel(order.status)}</span>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }

        renderRecentActivities();
        renderStockReplenishmentGuide();
        drawPerformanceCharts();
        updateInventoryHealth();
        drawDashboardCalendar();
        renderInventoryAnalytics();
        renderReservationAnalytics();
      }

      function getStatusBadgeClass(status) {
        const s = (status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
        if (s === 'to-pay' || s === 'unpaid' || s === 'pending-payment') return 'bg-amber-50 text-amber-800 border border-amber-200';
        if (s === 'ready-for-processing' || s === 'ready') return 'bg-sky-50 text-sky-800 border border-sky-200';
        if (s === 'payment-verification' || s === 'pending-verification') return 'bg-purple-50 text-purple-800 border border-purple-200';
        if (s === 'waiting-for-stock' || s === 'pre-order' || s === 'waiting' || s === 'reserved') return 'bg-blue-50 text-blue-800 border border-blue-200';
        if (s === 'processing') return 'bg-blue-50 text-blue-800 border border-blue-200';
        if (s === 'to-ship' || s === 'preparing') return 'bg-purple-50 text-purple-800 border border-purple-200';
        if (s === 'to-receive' || s === 'shipped' || s === 'in-transit') return 'bg-sky-50 text-sky-800 border border-sky-200';
        if (s === 'delivered') return 'bg-teal-50 text-teal-800 border border-teal-200';
        if (s === 'issue-reported' || s === 'issue') return 'bg-red-50 text-red-700 border border-red-200';
        if (s === 'completed' || s === 'fulfilled') return 'bg-green-50 text-green-800 border border-green-200';
        if (s === 'cancelled' || s === 'rejected' || s === 'expired') return 'bg-gray-100 text-gray-700 border border-gray-200';
        return 'bg-gray-100 text-gray-800 border border-gray-200';
      }

      function getStatusLabel(status) {
        const s = (status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
        if (s === 'to-pay') return 'To Pay';
        if (s === 'ready-for-processing' || s === 'ready') return 'Ready for Processing';
        if (s === 'payment-verification' || s === 'pending-verification') return 'Payment Verification';
        if (s === 'pre-order' || s === 'waiting' || s === 'waiting-for-stock') return 'Waiting for Stock';
        if (s === 'processing') return 'Processing';
        if (s === 'to-ship') return 'To Ship';
        if (s === 'to-receive') return 'To Receive';
        if (s === 'delivered') return 'Delivered';
        if (s === 'completed') return 'Completed';
        if (s === 'cancelled') return 'Cancelled';
        if (s === 'issue-reported') return 'Issue Reported';
        return status || 'Pending';
      }

      function formatActivityTimestamp(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        if (isNaN(d.getTime())) return String(ts);
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthStr = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${monthStr} ${day}, ${year} at ${hours}:${minutes} ${ampm}`;
      }

      let replenishFilter = 'all';
      let replenishPeriod = '30d'; // '7d', '30d', '3m', '6m', '1y', 'custom'
      let replenishCustomStart = '';
      let replenishCustomEnd = '';

      function formatSrgDateShort(d) {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '';
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      }

      function getReplenishmentPeriodRange() {
        const now = new Date();
        let coverageDays = 30;
        let periodLabel = 'Expected Sales in Next 30 Days';
        let periodName = 'Next 30 Days';
        let periodBadgeText = 'Expected Sales in Next 30 Days';
        let periodShortTag = '30D';

        if (replenishPeriod === '7d') {
          coverageDays = 7;
          periodLabel = 'Expected Sales in Next 7 Days';
          periodName = 'Next 7 Days';
          periodBadgeText = 'Expected Sales in Next 7 Days';
          periodShortTag = '7D';
        } else if (replenishPeriod === '3m') {
          coverageDays = 90;
          periodLabel = 'Expected Sales in Next 3 Months';
          periodName = 'Next 3 Months';
          periodBadgeText = 'Expected Sales in Next 3 Months';
          periodShortTag = '3M';
        } else if (replenishPeriod === '6m') {
          coverageDays = 180;
          periodLabel = 'Expected Sales in Next 6 Months';
          periodName = 'Next 6 Months';
          periodBadgeText = 'Expected Sales in Next 6 Months';
          periodShortTag = '6M';
        } else if (replenishPeriod === '1y') {
          coverageDays = 365;
          periodLabel = 'Expected Sales in Next Year';
          periodName = 'Next Year';
          periodBadgeText = 'Expected Sales in Next Year';
          periodShortTag = '1Y';
        } else if (replenishPeriod === 'custom') {
          const startEl = document.getElementById('srg-custom-start');
          const endEl = document.getElementById('srg-custom-end');
          const sVal = (startEl ? startEl.value : '') || replenishCustomStart;
          const eVal = (endEl ? endEl.value : '') || replenishCustomEnd;

          if (sVal && eVal) {
            const [sY, sM, sD] = sVal.split('-').map(Number);
            const [eY, eM, eD] = eVal.split('-').map(Number);
            const dStart = new Date(sY, sM - 1, sD);
            const dEnd = new Date(eY, eM - 1, eD);
            const diffMs = dEnd.getTime() - dStart.getTime();
            const elapsedDays = Math.max(1, Math.round(diffMs / (1000 * 60 * 60 * 24)));
            coverageDays = elapsedDays;
            periodLabel = `Expected Sales for ${elapsedDays} Day${elapsedDays === 1 ? '' : 's'}`;
            periodName = `${elapsedDays} Day${elapsedDays === 1 ? '' : 's'}`;
            periodBadgeText = `Expected Sales for ${elapsedDays} Day${elapsedDays === 1 ? '' : 's'}`;
            periodShortTag = `${elapsedDays}D`;
          }
        }

        // Verified historical sales baseline: past 30 days
        const baselineDays = 30;
        const baselineEndDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        const baselineStartDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);

        return {
          coverageDays,
          baselineDays,
          baselineStartDate,
          baselineEndDate,
          periodLabel,
          periodName,
          periodBadgeText,
          periodShortTag
        };
      }

      function renderStockReplenishmentGuide() {
        const summaryListContainer = document.getElementById('srg-dashboard-summary-list');
        const tbody = document.getElementById('replenish-guide-tbody');
        if (!summaryListContainer && !tbody) return;

        const periodInfo = getReplenishmentPeriodRange();
        const { coverageDays, baselineDays, baselineStartDate, baselineEndDate, periodLabel, periodName, periodBadgeText, periodShortTag } = periodInfo;

        // Dynamically update UI period indicators
        const badgeEl = document.getElementById('srg-period-badge-text');
        if (badgeEl) badgeEl.textContent = periodBadgeText;

        const subtitleEl = document.getElementById('srg-subtitle-text');
        if (subtitleEl) {
          subtitleEl.textContent = `See how much stock is needed for ${periodName.toLowerCase()}.`;
        }

        const needHeaderEl = document.getElementById('srg-col-need-header');
        if (needHeaderEl) needHeaderEl.textContent = periodLabel;

        const noSalesCardLabel = document.getElementById('srg-card-nosales-label');
        if (noSalesCardLabel) noSalesCardLabel.textContent = 'No Recent Sales';

        const noSalesCardSub = document.getElementById('srg-card-nosales-sub');
        if (noSalesCardSub) noSalesCardSub.textContent = 'No sales in past 30 days';

        const optNoSales = document.getElementById('opt-replenish-nosales');
        if (optNoSales) optNoSales.textContent = '⚪ No Recent Sales';

        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);

        const liveOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];

        // Filter verified customer sales orders strictly within the 30-day historical baseline
        // Excludes cancellations, rejections, replacements, and reservation orders
        const verifiedBaselineSales = liveOrders.filter(o => {
          if (!o || o.isReplacement) return false;
          if (isCancelledOrRejectedOrder(o)) return false;
          if (isReservationOrder(o)) return false;
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return false;
          const oDate = parseOrderDate(o);
          return oDate >= baselineStartDate && oDate <= baselineEndDate;
        });

        // Compute verified sales volume per active product within 30-day baseline
        const baselineSalesMap = {};
        verifiedBaselineSales.forEach(order => {
          (order.items || []).forEach(item => {
            if (!item || item.isReservation) return;
            const qty = Number(item.quantity || 0);
            if (qty <= 0) return;

            // Extract candidate product ID from item
            const rawProdId = item.product?.id ?? item.productId ?? null;
            let candidateId = (rawProdId !== null && rawProdId !== undefined && rawProdId !== '' && rawProdId !== 'undefined' && rawProdId !== 'null' && rawProdId !== '[object Object]')
              ? String(rawProdId).trim()
              : null;

            // If item.id matches a catalog product ID, use it as candidate ID
            if (!candidateId && item.id && productsList.some(p => String(p.id).trim() === String(item.id).trim())) {
              candidateId = String(item.id).trim();
            }

            let matched = null;

            // 1. If item has a product ID: strictly match by exact product ID
            if (candidateId) {
              matched = activeProducts.find(p => String(p.id).trim() === candidateId);
              if (!matched && productsList.some(p => String(p.id).trim() === candidateId)) {
                return;
              }
            }

            // 2. If no product ID was present: use safe exact normalized name match
            if (!matched) {
              const rawItemName = item.product?.name ?? item.productName ?? (typeof item.product === 'string' ? item.product : '') ?? item.name ?? '';
              const normItemName = String(rawItemName).trim().toLowerCase();
              if (normItemName) {
                matched = activeProducts.find(p => String(p.name || '').trim().toLowerCase() === normItemName);
              }
            }

            if (matched) {
              baselineSalesMap[matched.id] = (baselineSalesMap[matched.id] || 0) + qty;
            }
          });
        });

        // Build data structure for each active product using daily sales velocity projected over coverage days
        const rows = activeProducts.map(p => {
          const currentStock = p.currentStock !== undefined ? Math.max(0, Number(p.currentStock)) : Math.max(0, Number(p.stock || 0));
          const reservedStock = p.reservedStock !== undefined ? Math.max(0, Number(p.reservedStock)) : 0;
          const availableStock = p.availableStock !== undefined ? Math.max(0, Number(p.availableStock)) : Math.max(0, currentStock - reservedStock);

          const baselineSales = baselineSalesMap[p.id] || 0;
          const dailySalesRate = baselineSales / baselineDays;
          // Estimated stock need for coverage period, rounded UP to whole sacks
          const estimatedNeed = Math.ceil(dailySalesRate * coverageDays);

          const periodDemand = estimatedNeed;
          const waitingReservations = reservedStock;
          const totalDemand = periodDemand + waitingReservations;
          const shortfall = Math.max(0, totalDemand - availableStock);

          // Recommendation logic based on Demand for Selected Period + Active Waiting Reservations vs Available Stock
          let recommendation = '';
          let badgeClass = '';
          let dotClass = '';
          let explanation = '';
          let rank = 5; // sorting rank: 1=Out of Stock, 2=Low Stock, 3=Stock Running Low, 4=No Recent Sales, 5=Stock Available

          if (totalDemand === 0) {
            if (availableStock <= 0) {
              recommendation = 'Out of Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = 'No stock is available for new orders.';
              rank = 1;
            } else {
              recommendation = 'No Recent Sales';
              badgeClass = 'srg-badge-neutral';
              dotClass = 'bg-slate-400 dark:bg-slate-400';
              explanation = 'No verified sales in the past 30 days. Check current stock and reservations.';
              rank = 4;
            }
          } else {
            // totalDemand > 0
            if (availableStock <= 0) {
              recommendation = 'Out of Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = 'No stock is available for new orders.';
              rank = 1;
            } else if (availableStock < totalDemand) {
              recommendation = 'Low Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = 'Available stock may not cover expected sales and reservations. Check if more stock is needed.';
              rank = 2;
            } else if (availableStock < Math.ceil(totalDemand * 1.5)) {
              recommendation = 'Stock Running Low';
              badgeClass = 'srg-badge-warning';
              dotClass = 'bg-amber-500 shadow-[0_0_6px_rgba(245,158,11,0.7)]';
              explanation = 'Stock may be enough for now, but consider preparing more.';
              rank = 3;
            } else {
              recommendation = 'Stock Available';
              badgeClass = 'srg-badge-healthy';
              dotClass = 'bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.7)]';
              explanation = 'Stock can cover expected sales and reservations, with extra stock remaining.';
              rank = 5;
            }
          }

          return {
            product: p,
            currentStock,
            reservedStock,
            availableStock,
            baselineSales,
            dailySalesRate,
            periodDemand,
            totalDemand,
            shortfall,
            recommendation,
            badgeClass,
            dotClass,
            explanation,
            rank
          };
        });

        // Summary Counts
        const countNow = rows.filter(r => r.recommendation === 'Out of Stock' || r.recommendation === 'Low Stock').length;
        const countSoon = rows.filter(r => r.recommendation === 'Stock Running Low').length;
        const countSufficient = rows.filter(r => r.recommendation === 'Stock Available').length;
        const countInsufficient = rows.filter(r => r.recommendation === 'No Recent Sales').length;

        const statNow = document.getElementById('replenish-stat-now');
        if (statNow) statNow.textContent = countNow;
        const statSoon = document.getElementById('replenish-stat-soon');
        if (statSoon) statSoon.textContent = countSoon;
        const statSufficient = document.getElementById('replenish-stat-sufficient');
        if (statSufficient) statSufficient.textContent = countSufficient;
        const statInsufficient = document.getElementById('replenish-stat-insufficient');
        if (statInsufficient) statInsufficient.textContent = countInsufficient;

        // Filter rows if user selected a recommendation filter
        let filteredRows = rows;
        if (replenishFilter === 'replenish' || replenishFilter === 'critical') {
          filteredRows = rows.filter(r => r.recommendation === 'Out of Stock' || r.recommendation === 'Low Stock');
        } else if (replenishFilter === 'prepare') {
          filteredRows = rows.filter(r => r.recommendation === 'Stock Running Low');
        } else if (replenishFilter === 'sufficient') {
          filteredRows = rows.filter(r => r.recommendation === 'Stock Available');
        } else if (replenishFilter === 'insufficient') {
          filteredRows = rows.filter(r => r.recommendation === 'No Recent Sales');
        }

        // Sort by urgency rank (1 = Out of Stock, 2 = Low Stock, 3 = Stock Running Low, 4 = No Recent Sales, 5 = Stock Available)
        // Secondary sort: available stock ascending
        filteredRows.sort((a, b) => {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.availableStock - b.availableStock;
        });

        // 1. Render Dashboard Horizontal Progress Bar Rows matching reference design
        if (summaryListContainer) {
          if (rows.length === 0) {
            summaryListContainer.innerHTML = `
              <div class="py-6 text-center text-xs font-semibold text-[#000000] dark:text-slate-200">
                No active rice products found in catalog.
              </div>
            `;
          } else {
            // Sort active products: urgent ranks first, then available stock ascending
            const displayRows = [...rows].sort((a, b) => {
              if (a.rank !== b.rank) return a.rank - b.rank;
              return a.availableStock - b.availableStock;
            });

            const maxStockVal = Math.max(10, ...displayRows.map(r => Number(r.availableStock !== undefined ? r.availableStock : r.currentStock)));

            summaryListContainer.innerHTML = displayRows.map(r => {
              const p = r.product;
              const pName = p.name || 'Rice Variety';
              const stockVal = r.availableStock !== undefined ? r.availableStock : r.currentStock;
              const barPercent = maxStockVal > 0 ? Math.min(100, Math.max(4, Math.round((stockVal / maxStockVal) * 100))) : 0;
              const shortfall = r.shortfall || 0;

              let badgeClass = '';

              if (r.recommendation === 'Out of Stock') {

                displayStatus = 'Low Stock';
                badgeClass = 'srg-pill-needstock srg-pill-outofstock';
                barColorClass = 'srg-bar-needstock srg-bar-outofstock';
              } else if (r.recommendation === 'Stock Running Low') {

                barColorClass = 'srg-bar-lowstock srg-bar-preparesoon';
