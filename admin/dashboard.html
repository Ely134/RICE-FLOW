  <title>Admin Dashboard | RiceFlow</title>
  <script>
    (function() {
      try {
        var d = document.documentElement;
        var isDark = localStorage.getItem('aurora-dark-mode') === 'true';
        d.classList.toggle('dark', isDark);
        d.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>

    html.dark .bg-gray-50,

      // Order completion date helper - strictly for orders that reached completed status
      function getOrderCompletionDate(order) {
        if (!order) return new Date(0);
        const s = (order.status || '').toLowerCase().replace(/_/g, '-');
        if (s !== 'completed') {
          return new Date(0);
        }
        if (order.completedAt) {
          const d = new Date(order.completedAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.completionDate) {
          const d = new Date(order.completionDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.completedDate) {
          const d = new Date(order.completedDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.statusHistory && Array.isArray(order.statusHistory)) {
          const compHist = order.statusHistory.slice().reverse().find(h => {
            const hs = (h.status || '').toLowerCase().replace(/_/g, '-');
            return hs === 'completed';
          });
          if (compHist && compHist.changedAt) {
            const d = new Date(compHist.changedAt);
            if (!isNaN(d.getTime())) return d;
          }
        }
        if (order.customerConfirmationDate) {
          const d = new Date(order.customerConfirmationDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.deliveredDate) {
          const timeStr = order.deliveredTime || '00:00';
          const d = new Date(`${order.deliveredDate} ${timeStr}`);
          if (!isNaN(d.getTime())) return d;
          const d2 = new Date(order.deliveredDate);
          if (!isNaN(d2.getTime())) return d2;
        }
        if (order.deliveryVerificationDate) {
          const d = new Date(order.deliveryVerificationDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.createdAt) {
          const d = new Date(order.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.dateCreated) {
          const d = new Date(order.dateCreated);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.date) {
          const d = new Date(order.date);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      // General order date parser (createdAt, dateCreated, date, timestamp, etc.)
      function parseOrderDate(order) {
        if (!order) return new Date(0);

        function parseRawDateValue(val) {
          if (!val) return null;
          if (val instanceof Date) {
            return !isNaN(val.getTime()) ? val : null;
          }
          if (typeof val === 'object') {
            if (typeof val.toDate === 'function') {
              const d = val.toDate();
              return (d instanceof Date && !isNaN(d.getTime())) ? d : null;
            }
            if (typeof val.seconds === 'number') {
              const d = new Date(val.seconds * 1000);
              return !isNaN(d.getTime()) ? d : null;
            }
          }
          if (typeof val === 'string') {
            const trimmed = val.trim();
            const dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(trimmed);
            if (dateOnlyMatch) {
              const yr = parseInt(dateOnlyMatch[1], 10);
              const mo = parseInt(dateOnlyMatch[2], 10) - 1;
              const da = parseInt(dateOnlyMatch[3], 10);
              const localDate = new Date(yr, mo, da, 0, 0, 0, 0);
              if (!isNaN(localDate.getTime())) return localDate;
            }
          }
          const d = new Date(val);
          return !isNaN(d.getTime()) ? d : null;
        }

        const candidates = [
          order.createdAt,
          order.dateCreated,
          order.createdDate,
          order.date,
          order.timestamp
        ];

        for (let i = 0; i < candidates.length; i++) {
          const parsed = parseRawDateValue(candidates[i]);
          if (parsed) return parsed;
        }

        if (order.statusHistory && Array.isArray(order.statusHistory) && order.statusHistory.length > 0) {
          for (let i = 0; i < order.statusHistory.length; i++) {
            const parsed = parseRawDateValue(order.statusHistory[i]?.changedAt);
            if (parsed) return parsed;
          }
        }
        return new Date(0);
      }

          rangeLabel = salesCustomStart === salesCustomEnd ? eFormatted : `${sFormatted} – ${eFormatted}`;
          const spanDays = Math.max(1, Math.round((rangeEnd.getTime() - rangeStart.getTime()) / (24 * 60 * 60 * 1000)));
          numBuckets = spanDays <= 7 ? spanDays : (spanDays <= 35 ? 5 : 6);
        } else if (currentRange === '1week') {
          // Last 7 days including today (00:00:00 to 23:59:59.999)
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
          rangeLabel = '1 Week';

        // Active variety lookup
        let activeVarietyLabel = 'All Grains';

          const matchedProdObj = productsList.find(p => String(p.id) === String(currentProd));
          if (matchedProdObj) {
            activeVarietyLabel = matchedProdObj.name;

        }

        // Helper to check if an item matches the selected variety
        function itemMatchesVariety(item) {
          if (!item || item.isReservation) return false;
          if (currentProd === 'all') return true;
          const pId = String(item.product?.id || item.productId || item.id || '');
          const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
          if (pId && pId === String(currentProd)) return true;
          if (matchedProdName && pName && pName === matchedProdName.trim().toLowerCase()) return true;
          return false;
        }

        // Helper to calculate verified sales amount contributed by an order for the selected grain filter
        function getOrderVerifiedSales(o) {
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return 0;
          if (currentProd === 'all') {
            return info.amount;
          }
          const allItems = (o.items || []).filter(item => item && !item.isReservation);
          const matchingItems = allItems.filter(item => itemMatchesVariety(item));
          if (matchingItems.length === 0) return 0;
          if (matchingItems.length === allItems.length) {
            return info.amount;
          }
          const allItemsSum = allItems.reduce((acc, item) => {
            const qty = Number(item.quantity || 0);
            const price = Number(item.product?.price || item.price || 0);
            return acc + (qty * price);
          }, 0);
          const varietySum = matchingItems.reduce((acc, item) => {
            const qty = Number(item.quantity || 0);
            const price = Number(item.product?.price || item.price || 0);
            return acc + (qty * price);
          }, 0);
          const ratio = allItemsSum > 0 ? (varietySum / allItemsSum) : 1;
          return info.amount * ratio;
        }

        // Helper to calculate sacks sold contributed by an order for the selected grain filter
        function getOrderVerifiedSacks(o) {
          let sacks = 0;

          matchingOrders.forEach(o => {
            const oDate = parseOrderDate(o);
            const inBucket = (!selectedSalesDate && currentRange === '1week')
              ? (oDate >= bStart && oDate <= bEnd)
              : ((i === numBuckets - 1) ? (oDate >= bStart && oDate <= bEnd) : (oDate >= bStart && oDate < bEnd));
            if (inBucket) {
              const oSacks = getOrderVerifiedSacks(o);
              if (oSacks > 0 || currentProd === 'all') {
                ordersInBucket++;
                sacksInBucket += oSacks;
                salesInBucket += getOrderVerifiedSales(o);
              }
            }
          });

          buckets.push({
            label,
            sacks: sacksInBucket,
            orders: ordersInBucket,
            sales: salesInBucket
          });
        }

        const rawMax = Math.max(...buckets.map(b => b.sacks), 0);
        const maxVal = rawMax <= 20 ? 20 : Math.ceil(rawMax / 4) * 4;

        // Render Bar Chart
        const barChartContainer = document.getElementById('sales-barchart-inner');
        if (barChartContainer) {
          barChartContainer.innerHTML = `
            <div class="flex-1 min-h-72 flex flex-col pt-3 pb-7">
              <div class="flex-1 min-h-60 flex items-end gap-3 sm:gap-5 pl-16 sm:pl-20 pr-1 border-b so-chart-gridline relative">
                <!-- Grid Lines (0, 5, 10, 15, 20 sacks reference scale, scaling dynamically when data > 20) -->
                <div class="so-chart-gridline absolute inset-x-0 top-0 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${maxVal} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-1/4 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.round(maxVal * 0.75)} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-1/2 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.round(maxVal * 0.5)} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-3/4 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.round(maxVal * 0.25)} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 bottom-0 flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs translate-y-1/2">0 sacks</span>
                </div>

                <!-- Dynamic bars -->
                ${buckets.map(b => {
                  const heightPercent = Math.min((b.sacks / maxVal) * 100, 100);
                  const formattedSales = b.sales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                  return `
                    <div class="flex-1 flex flex-col items-center group relative h-full justify-end cursor-pointer z-10">
                      <!-- Tooltip -->
                      <div class="absolute bottom-full mb-2 bg-slate-900 dark:bg-slate-950 text-white font-bold text-xs py-2 px-3 rounded-xl border border-slate-700 opacity-0 group-hover:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl">
                        <span class="text-emerald-400 font-black">${b.label}:</span> ${b.sacks} Sacks (${b.orders} Orders · ₱${formattedSales})
                      </div>
                      <!-- Bar item -->
                      <div class="bg-[#1E6C02] hover:bg-[#145001] dark:bg-emerald-500 dark:hover:bg-emerald-400 rounded-t-lg transition-all w-full max-w-[46px] shadow-xs" style="height: ${heightPercent}%;"></div>
                      <span class="so-text-main text-xs font-extrabold absolute top-full mt-2.5 truncate w-full text-center tracking-tight" title="${b.label}">${b.label}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // B. Order Summary Pie Chart
        const statusCategories = [
          { key: 'to-pay', label: 'To Pay', color: '#F59E0B' },
          { key: 'processing', label: 'Processing', color: '#3B82F6' },
          { key: 'to-ship', label: 'To Ship', color: '#8B5CF6' },
          { key: 'to-receive', label: 'To Receive', color: '#0EA5E9' },
          { key: 'delivered', label: 'Delivered', color: '#14B8A6' },
          { key: 'issue-reported', label: 'Issue Reported', color: '#EF4444' },
          { key: 'completed', label: 'Completed', color: '#1E6C02' },
          { key: 'cancelled', label: 'Cancelled', color: '#6B7280' }
        ];

        const categoryCounts = {
          'to-pay': 0,
          'processing': 0,
          'to-ship': 0,
          'to-receive': 0,
          'delivered': 0,
          'issue-reported': 0,
          'completed': 0,
          'cancelled': 0
        };

        const regularOrders = liveOrders.filter(o => !o.isPreOrder && !(o.items && o.items.some(i => i.isReservation)));

        regularOrders.forEach(o => {
          const s = (o.status || '').toLowerCase().replace(/_/g, '-');
          if (s === 'to-pay' || s === 'unpaid' || s === 'pending-payment') {
            categoryCounts['to-pay']++;
          } else if (s === 'processing' || s === 'pre-order' || s === 'reserved' || s === 'waiting' || s === 'ready' || s === 'ready_for_processing') {
            categoryCounts['processing']++;
          } else if (s === 'to-ship' || s === 'preparing') {
            categoryCounts['to-ship']++;
          } else if (s === 'to-receive' || s === 'shipped' || s === 'in-transit') {
            categoryCounts['to-receive']++;
          } else if (s === 'delivered') {
            categoryCounts['delivered']++;
          } else if (s === 'issue-reported' || s === 'issue') {
            categoryCounts['issue-reported']++;
          } else if (s === 'completed' || s === 'fulfilled') {
            categoryCounts['completed']++;
          } else if (s === 'cancelled' || s === 'rejected' || s === 'expired') {
            categoryCounts['cancelled']++;
          } else {
            categoryCounts['to-pay']++;
          }
        });

        const totalCountedOrders = regularOrders.length;

        // Build SVG Donut slices
        let accumulatedPercent = 0;
        const svgSlices = [];

        statusCategories.forEach(cat => {
          const count = categoryCounts[cat.key] || 0;
          const pct = totalCountedOrders > 0 ? (count / totalCountedOrders) : 0;
          
          if (pct > 0) {
            const startAngle = accumulatedPercent * 2 * Math.PI - Math.PI / 2;
            accumulatedPercent += pct;
            const endAngle = accumulatedPercent * 2 * Math.PI - Math.PI / 2;

            const rOuter = 42;
            const rInner = 26;
            let angleDiff = endAngle - startAngle;
            let effectiveEndAngle = endAngle;
            if (angleDiff >= 2 * Math.PI - 0.0001) {
              effectiveEndAngle = startAngle + 2 * Math.PI - 0.0001;
            }

            const x1_out = (rOuter * Math.cos(startAngle)).toFixed(2);
            const y1_out = (rOuter * Math.sin(startAngle)).toFixed(2);
            const x2_out = (rOuter * Math.cos(effectiveEndAngle)).toFixed(2);
            const y2_out = (rOuter * Math.sin(effectiveEndAngle)).toFixed(2);

            const x1_in = (rInner * Math.cos(effectiveEndAngle)).toFixed(2);
            const y1_in = (rInner * Math.sin(effectiveEndAngle)).toFixed(2);
            const x2_in = (rInner * Math.cos(startAngle)).toFixed(2);
            const y2_in = (rInner * Math.sin(startAngle)).toFixed(2);

            const largeArc = angleDiff > Math.PI ? 1 : 0;
            const pathData = `M ${x1_out} ${y1_out} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2_out} ${y2_out} L ${x1_in} ${y1_in} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2_in} ${y2_in} Z`;

            const pctDisplay = (pct * 100) % 1 === 0 ? (pct * 100).toFixed(0) : (pct * 100).toFixed(1);
            svgSlices.push(`
              <path d="${pathData}" fill="${cat.color}" class="transition-all hover:opacity-80 cursor-pointer">
                <title>${cat.label}: ${count} Orders (${pctDisplay}%)</title>
              </path>
            `);
          }
        });

        const pieChartContainer = document.getElementById('piechart-container-inner');
        if (pieChartContainer) {
          pieChartContainer.innerHTML = `
            <!-- Visual SVG Donut chart -->
            <div class="relative flex items-center justify-center">
              <svg viewBox="-50 -50 100 100" class="w-40 h-40 transform -rotate-90">
                ${totalCountedOrders === 0 ? `
                  <circle cx="0" cy="0" r="34" fill="none" stroke="#E2E8F0" stroke-width="14" />
                ` : svgSlices.join('')}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                <p class="text-2xl font-black text-gray-900 dark:text-white leading-none">${totalCountedOrders}</p>
                <p class="text-[10px] font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider mt-1">Total Orders</p>
              </div>
            </div>

            <!-- Order Status Legend -->
            <div class="grid grid-cols-2 gap-x-4 gap-y-2 w-full text-xs pt-3 border-t border-slate-100 dark:border-slate-800">
              ${statusCategories.map(cat => {
                const count = categoryCounts[cat.key] || 0;
                const pct = totalCountedOrders > 0 ? (count / totalCountedOrders) * 100 : 0;
                const pctStr = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);
                return `
                  <div class="flex items-center justify-between gap-1.5 p-1 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors">
                    <div class="flex items-center gap-1.5 min-w-0">
                      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${cat.color};"></span>
                      <span class="font-bold text-gray-800 dark:text-gray-200 text-[11px] truncate" title="${cat.label}">${cat.label}</span>
                    </div>
                    <span class="font-extrabold text-gray-900 dark:text-white text-[11px] shrink-0 ml-1">${count} <span class="text-gray-500 dark:text-gray-400 font-bold">(${pctStr}%)</span></span>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }

        // Render Completed Orders Section (follows active date/preset and selected rice variety)
        renderCompletedOrdersSection(rangeStart, rangeEnd, rangeLabel, isDateOrRangeFiltered, currentProd, liveOrders, itemMatchesVariety);
      }

      // Authoritative Completed Order status checker - strictly actual 'completed' status
      function isOrderActuallyCompleted(order) {
        if (!order) return false;
        if (order.isReplacement) return false;
        if (typeof isCancelledOrRejectedOrder === 'function' && isCancelledOrRejectedOrder(order)) return false;
        const s = String(order.status || '').trim().toLowerCase().replace(/_/g, '-');
        return s === 'completed';
      }

      // Get completion/order date for completed orders adhering to Sales Overview date interpretation
      function getCompletedOrderDate(order) {
        const compDate = getOrderCompletionDate(order);
        if (compDate && !isNaN(compDate.getTime()) && compDate.getTime() > 0) {
          return compDate;
        }
        return parseOrderDate(order);
      }

      // Render the Completed Orders section below Sales Overview
      function renderCompletedOrdersSection(rangeStart, rangeEnd, rangeLabel, isFiltered, selectedProd, ordersList, itemMatchesVarietyFn) {
        const calSelectedStatus = document.getElementById('cal-selected-status');
        if (!calSelectedStatus) return;

        const allOrders = ordersList || (typeof getAllOrders === 'function' ? getAllOrders() : []);
        const prodsList = typeof getProducts === 'function' ? getProducts() : [];
        let matchedProdName = '';
        if (selectedProd && selectedProd !== 'all') {
          const matchedProdObj = prodsList.find(p => String(p.id) === String(selectedProd));
          matchedProdName = matchedProdObj ? matchedProdObj.name : selectedProd;
        }

        const completedOrders = allOrders.filter(o => {
          if (!isOrderActuallyCompleted(o)) return false;

          if (isFiltered) {
            const oDate = getCompletedOrderDate(o);
            if (!oDate || isNaN(oDate.getTime()) || oDate < rangeStart || oDate > rangeEnd) {
              return false;
            }
          }

          if (selectedProd && selectedProd !== 'all') {
            const matchesVariety = (o.items || []).some(item => {
              if (!item || item.isReservation) return false;
              if (typeof itemMatchesVarietyFn === 'function') {
                return itemMatchesVarietyFn(item);
              }
              const pId = String(item.product?.id || item.productId || item.id || '');
              const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
              if (pId && pId === String(selectedProd)) return true;
              if (matchedProdName && pName && pName === matchedProdName.trim().toLowerCase()) return true;
              if (matchedProdName && (pName.includes(matchedProdName.trim().toLowerCase()) || matchedProdName.trim().toLowerCase().includes(pName))) return true;
              return false;
            });
            if (!matchesVariety) return false;
          }
          return true;
        });

        if (completedOrders.length === 0) {
          const emptyMsg = (selectedProd && selectedProd !== 'all')
            ? `No completed orders found for ${matchedProdName || 'this variety'}.`
            : `No completed orders found for this period.`;
          calSelectedStatus.innerHTML = `
            <div class="space-y-1 text-left">
              <p class="so-text-sub text-[11px] font-extrabold uppercase tracking-wider">Completed Orders</p>
              <p class="so-text-main text-sm sm:text-base font-black tracking-tight">${rangeLabel}</p>
              <p class="so-text-sub text-xs sm:text-[13px] font-semibold pt-0.5">${emptyMsg}</p>
            </div>
          `;
          return;
        }

        const detailsItems = [];

        // Order IDs formatted cleanly
        const orderIds = completedOrders.map(o => {
          const rawId = String(o.id || o.orderNumber || '').trim();
          return rawId.startsWith('#') ? rawId : `#${rawId}`;
        }).filter(Boolean);

        if (orderIds.length > 0) {
          const idsStr = orderIds.slice(0, 5).join(', ');
          const moreStr = orderIds.length > 5 ? ` +${orderIds.length - 5} more` : '';
          detailsItems.push(`<p class="so-text-sub text-xs sm:text-[13px] font-semibold"><span class="so-text-main font-extrabold">Order ID:</span> ${idsStr}${moreStr}</p>`);
        }

        // Payment Numbers / References
        const paymentNumbers = completedOrders.map(o => {
          return o.referenceNumber || o.paymentNumber || o.refNumber || o.paymentRef || o.paymentId || '';
        }).filter(Boolean);

        if (paymentNumbers.length > 0) {
          const pRefsStr = paymentNumbers.slice(0, 5).join(', ');
          const pMoreStr = paymentNumbers.length > 5 ? ` +${paymentNumbers.length - 5} more` : '';
          detailsItems.push(`<p class="so-text-sub text-xs sm:text-[13px] font-semibold"><span class="so-text-main font-extrabold">Payment Number:</span> ${pRefsStr}${pMoreStr}</p>`);
        }

        // Payment / Amount information belonging to actual completed orders
        let completedTotalAmount = 0;
        completedOrders.forEach(o => {
          if (selectedProd && selectedProd !== 'all') {
            const allItems = (o.items || []).filter(item => item && !item.isReservation);
            const matchingItems = allItems.filter(item => {
              if (typeof itemMatchesVarietyFn === 'function') return itemMatchesVarietyFn(item);
              const pId = String(item.product?.id || item.productId || item.id || '');
              const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
              return pId === String(selectedProd) || (matchedProdName && pName.includes(matchedProdName.trim().toLowerCase()));
            });
            const allSum = allItems.reduce((acc, item) => acc + (Number(item.quantity || 0) * Number(item.product?.price || item.price || 0)), 0);
            const varSum = matchingItems.reduce((acc, item) => acc + (Number(item.quantity || 0) * Number(item.product?.price || item.price || 0)), 0);
            const orderTot = Number(o.total || o.totalPrice || o.totalBill || o.amountPaid || 0);
            const ratio = allSum > 0 ? (varSum / allSum) : 1;
            completedTotalAmount += (orderTot * ratio);
          } else {
            completedTotalAmount += Number(o.total || o.totalPrice || o.totalBill || o.amountPaid || 0);
          }
        });

        if (completedTotalAmount > 0) {
          detailsItems.push(`<p class="so-text-sub text-xs sm:text-[13px] font-semibold"><span class="so-text-main font-extrabold">Payment Amount:</span> ₱${completedTotalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</p>`);
        }

        calSelectedStatus.innerHTML = `
          <div class="space-y-3 text-left">
            <div class="so-header-divider flex items-center justify-between pb-2.5">
              <div>
                <span class="so-text-sub text-[11px] font-extrabold uppercase tracking-wider block">Completed Orders</span>
                <span class="so-text-main text-sm sm:text-base font-black tracking-tight mt-0.5 block">${rangeLabel}</span>
              </div>
              <span class="so-activity-badge text-xs font-extrabold px-3 py-1 rounded-full inline-flex items-center gap-1 shadow-2xs">
                ${completedOrders.length} Completed Order${completedOrders.length !== 1 ? 's' : ''}
              </span>
            </div>

            <div class="space-y-1.5 pt-1">
              ${detailsItems.join('')}
            </div>
          </div>
        `;
      }

      function refreshDashboard() {
        populateProductDropdown();
        const liveOrders = getAllOrders ? getAllOrders() : [];
        
        // 1. Total Regular Orders (for Recent Orders table)
        const regularOrders = liveOrders.filter(o => !isReservationOrder(o) && !isCancelledOrRejectedOrder(o) && !o.isReplacement);

        // Update Recent Orders table
        const tbody = document.getElementById('dash-pipeline-tbody');
        if (tbody) {
          const sortedOrders = regularOrders.slice().sort((a, b) => {
            const tA = new Date(a.createdAt || a.dateCreated || a.date || 0).getTime();
            const tB = new Date(b.createdAt || b.dateCreated || b.date || 0).getTime();
            return tB - tA;
          });

          const recentOrders = sortedOrders.slice(0, 6);

          if (recentOrders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-600 dark:text-gray-300 font-medium text-xs">No recent orders found</td></tr>`;
          } else {
            tbody.innerHTML = recentOrders.map(order => {
              const itemsText = (order.items || [])
                .filter(i => !i.isReservation)
                .map(i => `${i.product?.name || i.name || i.productName || 'Rice Product'} (${i.quantity || 1})`)
                .join(', ');
              const customerName = order.fullName || order.customerName || order.userName || 'Customer';
              const formattedTotal = Number(order.total || order.amountPaid || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

              return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                  <td class="py-3.5 px-3 font-normal text-gray-900 font-mono">#${order.id}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900">${customerName}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900 truncate max-w-[200px]">${itemsText || 'N/A'}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900">₱${formattedTotal}</td>
                  <td class="py-3.5 px-3 text-right">
                    <span class="px-2.5 py-1 rounded-full font-semibold text-xs tracking-wide ${getStatusBadgeClass(order.status)}">${getStatusLabel(order.status)}</span>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }

        renderRecentActivities();
        renderStockReplenishmentGuide();
        drawPerformanceCharts();
        updateInventoryHealth();
        drawDashboardCalendar();
        renderInventoryAnalytics();
        renderReservationAnalytics();
      }

      function getStatusBadgeClass(status) {
        const s = (status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
        if (s === 'to-pay' || s === 'unpaid' || s === 'pending-payment') return 'bg-amber-50 text-amber-800 border border-amber-200';
        if (s === 'ready-for-processing' || s === 'ready') return 'bg-sky-50 text-sky-800 border border-sky-200';
        if (s === 'payment-verification' || s === 'pending-verification') return 'bg-purple-50 text-purple-800 border border-purple-200';
        if (s === 'waiting-for-stock' || s === 'pre-order' || s === 'waiting' || s === 'reserved') return 'bg-blue-50 text-blue-800 border border-blue-200';
        if (s === 'processing') return 'bg-blue-50 text-blue-800 border border-blue-200';
        if (s === 'to-ship' || s === 'preparing') return 'bg-purple-50 text-purple-800 border border-purple-200';
        if (s === 'to-receive' || s === 'shipped' || s === 'in-transit') return 'bg-sky-50 text-sky-800 border border-sky-200';
        if (s === 'delivered') return 'bg-teal-50 text-teal-800 border border-teal-200';
        if (s === 'issue-reported' || s === 'issue') return 'bg-red-50 text-red-700 border border-red-200';
        if (s === 'completed' || s === 'fulfilled') return 'bg-green-50 text-green-800 border border-green-200';
        if (s === 'cancelled' || s === 'rejected' || s === 'expired') return 'bg-gray-100 text-gray-700 border border-gray-200';
        return 'bg-gray-100 text-gray-800 border border-gray-200';
      }

      function getStatusLabel(status) {
        const s = (status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
        if (s === 'to-pay') return 'To Pay';
        if (s === 'ready-for-processing' || s === 'ready') return 'Ready for Processing';
        if (s === 'payment-verification' || s === 'pending-verification') return 'Payment Verification';
        if (s === 'pre-order' || s === 'waiting' || s === 'waiting-for-stock') return 'Waiting for Stock';
        if (s === 'processing') return 'Processing';
        if (s === 'to-ship') return 'To Ship';
        if (s === 'to-receive') return 'To Receive';
        if (s === 'delivered') return 'Delivered';
        if (s === 'completed') return 'Completed';
        if (s === 'cancelled') return 'Cancelled';
        if (s === 'issue-reported') return 'Issue Reported';
        return status || 'Pending';
      }

      function formatActivityTimestamp(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        if (isNaN(d.getTime())) return String(ts);
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthStr = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${monthStr} ${day}, ${year} at ${hours}:${minutes} ${ampm}`;
      }

      let replenishFilter = 'all';
      let replenishPeriod = '30d'; // '7d', '30d', '3m', '6m', '1y', 'custom'
      let replenishCustomStart = '';
      let replenishCustomEnd = '';

      function formatSrgDateShort(d) {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '';
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      }

      function getReplenishmentPeriodRange() {
        const now = new Date();
        let startDate;
        let endDate = new Date(now.getTime());
        let periodLabel = 'Need (30D)';
        let periodName = 'Last 30 Days';
        let periodBadgeText = 'Analysis Period: Last 30 Days';
        let periodShortTag = '30D';

        if (replenishPeriod === '7d') {
          startDate = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));
          periodLabel = 'Need (7D)';
          periodName = 'Last 7 Days';
          periodBadgeText = 'Analysis Period: Last 7 Days';
          periodShortTag = '7D';
        } else if (replenishPeriod === '3m') {
          const d = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
          startDate = d;
          periodLabel = 'Need (3M)';
          periodName = 'Last 3 Months';
          periodBadgeText = 'Analysis Period: Last 3 Months';
          periodShortTag = '3M';
        } else if (replenishPeriod === '6m') {
          const d = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
          startDate = d;
          periodLabel = 'Need (6M)';
          periodName = 'Last 6 Months';
          periodBadgeText = 'Analysis Period: Last 6 Months';
          periodShortTag = '6M';
        } else if (replenishPeriod === '1y') {
          const d = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
          startDate = d;
          periodLabel = 'Need (1Y)';
          periodName = 'Last 1 Year';
          periodBadgeText = 'Analysis Period: Last 1 Year';
          periodShortTag = '1Y';
        } else if (replenishPeriod === 'custom') {
          const startEl = document.getElementById('srg-custom-start');
          const endEl = document.getElementById('srg-custom-end');
          const sVal = (startEl ? startEl.value : '') || replenishCustomStart;
          const eVal = (endEl ? endEl.value : '') || replenishCustomEnd;

          if (sVal) {
            startDate = new Date(`${sVal}T00:00:00`);
          } else {
            startDate = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
          }

          if (eVal) {
            endDate = new Date(`${eVal}T23:59:59.999`);
          } else {
            endDate = new Date(now.getTime());
          }

          periodLabel = 'Need (Custom)';
          periodName = 'Selected Period';
          periodBadgeText = `Analysis Period: ${formatSrgDateShort(startDate)} – ${formatSrgDateShort(endDate)}`;
          periodShortTag = 'custom';
        } else {
          // Default: 30d
          startDate = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));
          periodLabel = 'Need (30D)';
          periodName = 'Last 30 Days';
          periodBadgeText = 'Analysis Period: Last 30 Days';
          periodShortTag = '30D';
        }

        return {
          startDate,
          endDate,
          periodLabel,
          periodName,
          periodBadgeText,
          periodShortTag
        };
      }

      function renderStockReplenishmentGuide() {
        const tbody = document.getElementById('replenish-guide-tbody');
        if (!tbody) return;

        const periodInfo = getReplenishmentPeriodRange();
        const { startDate, endDate, periodLabel, periodName, periodBadgeText, periodShortTag } = periodInfo;

        // Dynamically update UI period indicators
        const badgeEl = document.getElementById('srg-period-badge-text');
        if (badgeEl) badgeEl.textContent = periodBadgeText;

        const subtitleEl = document.getElementById('srg-subtitle-text');
        if (subtitleEl) {
          subtitleEl.textContent = `Check rice sold in the ${periodName.toLowerCase()} against current and reserved stock to show what to prepare or replenish next`;
        }

        const needHeaderEl = document.getElementById('srg-col-need-header');
        if (needHeaderEl) needHeaderEl.textContent = periodLabel;

        const noSalesCardLabel = document.getElementById('srg-card-nosales-label');
        if (noSalesCardLabel) noSalesCardLabel.textContent = `No Sales in ${periodName}`;

        const noSalesCardSub = document.getElementById('srg-card-nosales-sub');
        if (noSalesCardSub) noSalesCardSub.textContent = `No ${periodShortTag} activity`;

        const optNoSales = document.getElementById('opt-replenish-nosales');
        if (optNoSales) optNoSales.textContent = `⚪ No Sales in ${periodName}`;

        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);

        const liveOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];

        // Filter verified customer sales orders strictly within selected period
        // Excludes cancellations, rejections, replacements, and reservation orders
        const verifiedSalesPeriod = liveOrders.filter(o => {
          if (!o || o.isReplacement) return false;
          if (isCancelledOrRejectedOrder(o)) return false;
          if (isReservationOrder(o)) return false;
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return false;
          const oDate = parseOrderDate(o);
          return oDate >= startDate && oDate <= endDate;
        });

        // Compute verified sales volume per active product within selected period
        const periodDemandMap = {};
        verifiedSalesPeriod.forEach(order => {
          (order.items || []).forEach(item => {
            if (!item || item.isReservation) return;
            const qty = Number(item.quantity || 0);
            if (qty <= 0) return;

            // Extract candidate product ID from item
            const rawProdId = item.product?.id ?? item.productId ?? null;
            let candidateId = (rawProdId !== null && rawProdId !== undefined && rawProdId !== '' && rawProdId !== 'undefined' && rawProdId !== 'null' && rawProdId !== '[object Object]')
              ? String(rawProdId).trim()
              : null;

            // If item.id matches a catalog product ID, use it as candidate ID
            if (!candidateId && item.id && productsList.some(p => String(p.id).trim() === String(item.id).trim())) {
              candidateId = String(item.id).trim();
            }

            let matched = null;

            // 1. If item has a product ID: strictly match by exact product ID
            if (candidateId) {
              matched = activeProducts.find(p => String(p.id).trim() === candidateId);
              if (!matched && productsList.some(p => String(p.id).trim() === candidateId)) {
                return;
              }
            }

            // 2. If no product ID was present: use safe exact normalized name match
            if (!matched) {
              const rawItemName = item.product?.name ?? item.productName ?? (typeof item.product === 'string' ? item.product : '') ?? item.name ?? '';
              const normItemName = String(rawItemName).trim().toLowerCase();
              if (normItemName) {
                matched = activeProducts.find(p => String(p.name || '').trim().toLowerCase() === normItemName);
              }
            }

            if (matched) {
              periodDemandMap[matched.id] = (periodDemandMap[matched.id] || 0) + qty;
            }
          });
        });

        // Build data structure for each active product
        const rows = activeProducts.map(p => {
          const currentStock = p.currentStock !== undefined ? Math.max(0, Number(p.currentStock)) : Math.max(0, Number(p.stock || 0));
          const reservedStock = p.reservedStock !== undefined ? Math.max(0, Number(p.reservedStock)) : 0;
          const availableStock = p.availableStock !== undefined ? Math.max(0, Number(p.availableStock)) : Math.max(0, currentStock - reservedStock);

          const periodDemand = periodDemandMap[p.id] || 0;
          const waitingReservations = reservedStock;
          const totalDemand = periodDemand + waitingReservations;

          // Recommendation logic based on Demand for Selected Period + Active Waiting Reservations vs Available Stock
          let recommendation = '';
          let badgeClass = '';
          let dotClass = '';
          let explanation = '';
          let rank = 4; // sorting rank: 1=Need More Stock, 2=Prepare More Soon, 3=No Sales in Period, 4=Stock Is Enough

          if (totalDemand === 0) {
            if (availableStock <= 0) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = 'Out of stock for new orders.';
              rank = 1;
            } else {
              recommendation = `No Sales in ${periodName}`;
              badgeClass = 'srg-badge-neutral';
              dotClass = 'bg-slate-400 dark:bg-slate-400';
              explanation = `No sales or active reservations recorded in ${periodName.toLowerCase()} (${availableStock} sack${availableStock > 1 ? 's' : ''} available for new orders).`;
              rank = 3;
            }
          } else {
            // totalDemand > 0
            if (availableStock <= 0) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = `Out of stock for new orders (${waitingReservations > 0 ? waitingReservations + ' sack' + (waitingReservations > 1 ? 's' : '') + ' waiting allocation' : 'sales demand is ' + periodDemand + ' sacks'}).`;
              rank = 1;
            } else if (availableStock < totalDemand) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              const detail = waitingReservations > 0 && periodDemand > 0
                ? `: ${periodDemand} sales + ${waitingReservations} reserved`
                : (waitingReservations > 0 ? `: ${waitingReservations} reserved` : '');
              explanation = `Available stock (${availableStock} sacks) cannot cover total demand (${totalDemand} sacks${detail}). Need more stock.`;
              rank = 1;
            } else if (availableStock < Math.ceil(totalDemand * 1.5)) {
              recommendation = 'Prepare More Soon';
              badgeClass = 'srg-badge-warning';
              dotClass = 'bg-amber-500 shadow-[0_0_6px_rgba(245,158,11,0.7)]';
              const detail = waitingReservations > 0 && periodDemand > 0
                ? `: ${periodDemand} sales + ${waitingReservations} reserved`
                : (waitingReservations > 0 ? `: ${waitingReservations} reserved` : '');
              explanation = `Available stock (${availableStock} sacks) provides a low buffer against total demand (${totalDemand} sacks${detail}). Good to prepare more soon.`;
              rank = 2;
            } else {
              recommendation = 'Stock Is Enough';
              badgeClass = 'srg-badge-healthy';
              dotClass = 'bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.7)]';
              const detail = waitingReservations > 0 && periodDemand > 0
                ? `: ${periodDemand} sales + ${waitingReservations} reserved`
                : (waitingReservations > 0 ? `: ${waitingReservations} reserved` : '');
              explanation = `Available stock (${availableStock} sacks) safely covers total demand (${totalDemand} sacks${detail}). Stock is enough for now.`;
              rank = 4;
            }
          }

          return {
            product: p,
            currentStock,
            reservedStock,
            availableStock,
            periodDemand,
            totalDemand,
            recommendation,
            badgeClass,
            dotClass,
            explanation,
            rank
          };
        });

        // Summary Counts
        const countNow = rows.filter(r => r.recommendation === 'Need More Stock').length;
        const countSoon = rows.filter(r => r.recommendation === 'Prepare More Soon').length;
        const countSufficient = rows.filter(r => r.recommendation === 'Stock Is Enough').length;
        const countInsufficient = rows.filter(r => r.rank === 3).length;

        const statNow = document.getElementById('replenish-stat-now');
        if (statNow) statNow.textContent = countNow;
        const statSoon = document.getElementById('replenish-stat-soon');
        if (statSoon) statSoon.textContent = countSoon;
        const statSufficient = document.getElementById('replenish-stat-sufficient');
        if (statSufficient) statSufficient.textContent = countSufficient;
        const statInsufficient = document.getElementById('replenish-stat-insufficient');
        if (statInsufficient) statInsufficient.textContent = countInsufficient;

        // Filter rows if user selected a recommendation filter
        let filteredRows = rows;
        if (replenishFilter === 'replenish') {
          filteredRows = rows.filter(r => r.recommendation === 'Need More Stock');
        } else if (replenishFilter === 'prepare') {
          filteredRows = rows.filter(r => r.recommendation === 'Prepare More Soon');
        } else if (replenishFilter === 'sufficient') {
          filteredRows = rows.filter(r => r.recommendation === 'Stock Is Enough');
        } else if (replenishFilter === 'insufficient') {
          filteredRows = rows.filter(r => r.rank === 3);
        }

        // Sort by urgency rank (1 = Replenish Now, 2 = Prepare Soon, 3 = Insufficient/No Sales, 4 = Sufficient)
        // Secondary sort: available stock ascending
        filteredRows.sort((a, b) => {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.availableStock - b.availableStock;
        });

        if (filteredRows.length === 0) {
          tbody.innerHTML = `
            <tr class="srg-row">
              <td colspan="6" class="srg-text-main py-12 px-4 text-center font-semibold text-sm">
                ${activeProducts.length === 0 ? 'No active rice varieties found in catalog.' : 'No rice varieties match the selected recommendation filter.'}
              </td>
            </tr>
          `;
          return;
        }

        // Visual progress bar scale references (presentation only)
        const maxStockRef = Math.max(100, ...rows.map(item => Math.max(item.currentStock, item.availableStock, 1)));
        const maxDemandRef = Math.max(20, ...rows.map(item => Math.max(item.periodDemand, 1)));

        tbody.innerHTML = filteredRows.map(r => {
          const p = r.product;
          const pName = p.name || 'Rice Variety';

            ? 'srg-num-critical font-black'

          const availBarColor = r.availableStock === 0
            ? 'bg-red-500'

          const stockNowPct = r.currentStock > 0 ? Math.min(100, Math.max(8, Math.round((r.currentStock / maxStockRef) * 100))) : 0;
          const reservedPct = r.reservedStock > 0 ? Math.min(100, Math.max(10, Math.round((r.reservedStock / Math.max(r.currentStock, maxStockRef)) * 100))) : 0;
          const availPct = r.availableStock > 0 ? Math.min(100, Math.max(8, Math.round((r.availableStock / maxStockRef) * 100))) : 0;

                      <span style="display:none;" class="srg-text-main w-full h-full items-center justify-center">
