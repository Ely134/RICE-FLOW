    .replenish-table-scroll-container {

      scrollbar-color: rgba(156, 163, 175, 0.45) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .replenish-table-scroll-container::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .replenish-table-scroll-container::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 9999px;
    }
    .replenish-table-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .replenish-table-scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(107, 114, 128, 0.7);
    }
    .dark .replenish-table-scroll-container {
      scrollbar-color: rgba(100, 116, 139, 0.5) transparent;
    }
    .dark .replenish-table-scroll-container::-webkit-scrollbar-thumb {

    .dark .replenish-table-scroll-container::-webkit-scrollbar-thumb:hover {

      // Order completion date helper - strictly for orders that reached completed status
      function getOrderCompletionDate(order) {
        if (!order) return new Date(0);
        const s = (order.status || '').toLowerCase().replace(/_/g, '-');
        if (s !== 'completed') {
          return new Date(0);
        }
        if (order.completedAt) {
          const d = new Date(order.completedAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.completionDate) {
          const d = new Date(order.completionDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.completedDate) {
          const d = new Date(order.completedDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.statusHistory && Array.isArray(order.statusHistory)) {
          const compHist = order.statusHistory.slice().reverse().find(h => {
            const hs = (h.status || '').toLowerCase().replace(/_/g, '-');
            return hs === 'completed';
          });
          if (compHist && compHist.changedAt) {
            const d = new Date(compHist.changedAt);
            if (!isNaN(d.getTime())) return d;
          }
        }
        if (order.customerConfirmationDate) {
          const d = new Date(order.customerConfirmationDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.deliveredDate) {
          const timeStr = order.deliveredTime || '00:00';
          const d = new Date(`${order.deliveredDate} ${timeStr}`);
          if (!isNaN(d.getTime())) return d;
          const d2 = new Date(order.deliveredDate);
          if (!isNaN(d2.getTime())) return d2;
        }
        if (order.deliveryVerificationDate) {
          const d = new Date(order.deliveryVerificationDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.createdAt) {
          const d = new Date(order.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.dateCreated) {
          const d = new Date(order.dateCreated);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.date) {
          const d = new Date(order.date);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      // General order date parser (createdAt, dateCreated, date, timestamp, etc.)
      function parseOrderDate(order) {
        if (!order) return new Date(0);

        function parseRawDateValue(val) {
          if (!val) return null;
          if (val instanceof Date) {
            return !isNaN(val.getTime()) ? val : null;
          }
          if (typeof val === 'object') {
            if (typeof val.toDate === 'function') {
              const d = val.toDate();
              return (d instanceof Date && !isNaN(d.getTime())) ? d : null;
            }
            if (typeof val.seconds === 'number') {
              const d = new Date(val.seconds * 1000);
              return !isNaN(d.getTime()) ? d : null;
            }
          }
          if (typeof val === 'string') {
            const trimmed = val.trim();
            const dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(trimmed);
            if (dateOnlyMatch) {
              const yr = parseInt(dateOnlyMatch[1], 10);
              const mo = parseInt(dateOnlyMatch[2], 10) - 1;
              const da = parseInt(dateOnlyMatch[3], 10);
              const localDate = new Date(yr, mo, da, 0, 0, 0, 0);
              if (!isNaN(localDate.getTime())) return localDate;
            }
          }
          const d = new Date(val);
          return !isNaN(d.getTime()) ? d : null;
        }

        const candidates = [
          order.createdAt,
          order.dateCreated,
          order.createdDate,
          order.date,
          order.timestamp
        ];

        for (let i = 0; i < candidates.length; i++) {
          const parsed = parseRawDateValue(candidates[i]);
          if (parsed) return parsed;
        }

        if (order.statusHistory && Array.isArray(order.statusHistory) && order.statusHistory.length > 0) {
          for (let i = 0; i < order.statusHistory.length; i++) {
            const parsed = parseRawDateValue(order.statusHistory[i]?.changedAt);
            if (parsed) return parsed;
          }
        }
        return new Date(0);
      }

      function populateProductDropdown() {
        const selProduct = document.getElementById('sel-chart-product');
        const selInvProduct = document.getElementById('sel-inv-product');
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);
        
        let html = `<option value="all">All Grains</option>`;
        activeProducts.forEach(p => {
          html += `<option value="${p.id}">${p.name}</option>`;
        });

        if (selProduct) {
          const currentVal = selProduct.value || productFilter || 'all';
          selProduct.innerHTML = html;
          const isStillActive = currentVal === 'all' || activeProducts.some(p => String(p.id) === String(currentVal));
          selProduct.value = isStillActive ? currentVal : 'all';
          productFilter = selProduct.value;
        }

        if (selInvProduct) {
          const currentInvVal = selInvProduct.value || invProductFilter || 'all';
          selInvProduct.innerHTML = html;

          selInvProduct.value = isStillActive ? currentInvVal : 'all';
          invProductFilter = selInvProduct.value;

        const selResProduct = document.getElementById('sel-res-product');
        if (selResProduct) {

      function drawPerformanceCharts() {
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const liveOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];

        const filterRangeEl = document.getElementById('sel-chart-range');
        const filterProdEl = document.getElementById('sel-chart-product');
        const currentRange = filterRangeEl ? filterRangeEl.value : (timeRange || '1month');
        const currentProd = filterProdEl ? filterProdEl.value : (productFilter || 'all');

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

        let rangeStart;
        let rangeEnd = endOfToday;
        let rangeLabel = 'All Time';
        let numBuckets = 6;

        if (selectedSalesDate) {
          const selY = selectedSalesDate.getFullYear();
          const selM = selectedSalesDate.getMonth();
          const selD = selectedSalesDate.getDate();
          rangeStart = new Date(selY, selM, selD, 0, 0, 0, 0);
          rangeEnd = new Date(selY, selM, selD, 23, 59, 59, 999);
          rangeLabel = selectedSalesDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          numBuckets = 4;
        } else if (currentRange === '1week') {
          // Last 7 days including today (00:00:00 to 23:59:59.999)
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
          rangeLabel = '1 Week';
          numBuckets = 7;
        } else if (currentRange === '1month') {
          // Last 30 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
          rangeLabel = '1 Month';
          numBuckets = 5;
        } else if (currentRange === '3months') {
          // Last 90 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 89, 0, 0, 0, 0);
          rangeLabel = '3 Months';
          numBuckets = 3;
        } else if (currentRange === '6months') {
          // Last 180 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 179, 0, 0, 0, 0);
          rangeLabel = '6 Months';
          numBuckets = 6;
        } else if (currentRange === '1year') {
          // Last 365 days including today
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 364, 0, 0, 0, 0);
          rangeLabel = '1 Year';
          numBuckets = 12;
        } else {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 5, 1, 0, 0, 0, 0);
          rangeLabel = 'All Time';
          numBuckets = 6;
        }

        // Active variety lookup
        let activeVarietyLabel = 'All Grains';
        let matchedProdName = '';
        if (currentProd !== 'all') {
          const matchedProdObj = productsList.find(p => String(p.id) === String(currentProd));
          if (matchedProdObj) {
            activeVarietyLabel = matchedProdObj.name;
            matchedProdName = matchedProdObj.name;
          } else {
            activeVarietyLabel = currentProd;
            matchedProdName = currentProd;
          }
        }

        // Helper to check if an item matches the selected variety
        function itemMatchesVariety(item) {
          if (!item || item.isReservation) return false;
          if (currentProd === 'all') return true;
          const pId = String(item.product?.id || item.productId || item.id || '');
          const pName = String(item.product?.name || item.name || item.productName || '').trim().toLowerCase();
          if (pId && pId === String(currentProd)) return true;
          if (matchedProdName && pName && pName === matchedProdName.trim().toLowerCase()) return true;
          return false;
        }

        // Helper to calculate verified sales amount contributed by an order for the selected grain filter
        function getOrderVerifiedSales(o) {
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return 0;
          if (currentProd === 'all') {
            return info.amount;
          }
          const allItems = (o.items || []).filter(item => item && !item.isReservation);
          const matchingItems = allItems.filter(item => itemMatchesVariety(item));
          if (matchingItems.length === 0) return 0;
          if (matchingItems.length === allItems.length) {
            return info.amount;
          }
          const allItemsSum = allItems.reduce((acc, item) => {
            const qty = Number(item.quantity || 0);
            const price = Number(item.product?.price || item.price || 0);
            return acc + (qty * price);
          }, 0);
          const varietySum = matchingItems.reduce((acc, item) => {
            const qty = Number(item.quantity || 0);
            const price = Number(item.product?.price || item.price || 0);
            return acc + (qty * price);
          }, 0);
          const ratio = allItemsSum > 0 ? (varietySum / allItemsSum) : 1;
          return info.amount * ratio;
        }

        // Helper to calculate sacks sold contributed by an order for the selected grain filter
        function getOrderVerifiedSacks(o) {
          let sacks = 0;
          (o.items || []).forEach(item => {
            if (itemMatchesVariety(item)) {
              sacks += Number(item.quantity || 0);
            }
          });
          return sacks;
        }

        const isDateOrRangeFiltered = Boolean(selectedSalesDate || currentRange !== 'all');

        // Filter verified sales orders strictly within range (using authoritative getVerifiedCustomerPaymentInfo & parseOrderDate)
        const verifiedSalesOrders = liveOrders.filter(o => {
          if (!o || o.isReplacement || isReservationOrder(o) || isCancelledOrRejectedOrder(o)) return false;
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return false;
          
          if (isDateOrRangeFiltered) {
            const oDate = parseOrderDate(o);
            if (oDate < rangeStart || oDate > rangeEnd) return false;
          }
          return true;
        });

        // Filter matching orders by variety if specific product selected
        let matchingOrders = verifiedSalesOrders;
        if (currentProd !== 'all') {
          matchingOrders = verifiedSalesOrders.filter(o => {
            return (o.items || []).some(item => itemMatchesVariety(item));
          });
        }

        // Calculate sacks sold & verified sales revenue for matching orders and selected variety
        let timeframeSacksSum = 0;
        let timeframeSalesSum = 0;

        matchingOrders.forEach(o => {
          timeframeSacksSum += getOrderVerifiedSacks(o);
          timeframeSalesSum += getOrderVerifiedSales(o);
        });

        // Determine whether user has actively applied a filter to top summary cards
        const isFilterActive = Boolean(selectedSalesDate || (hasUserAppliedFilter && (currentRange !== 'all' || currentProd !== 'all')));

        const resetBtn = document.getElementById('btn-reset-filters');
        if (resetBtn) {
          if (isFilterActive) {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        let displayTotalOrders = 0;
        let displayTotalSales = 0;
        let displayTopProductName = 'N/A';
        let displayTopProductVol = 0;

        if (!isFilterActive) {
          // 1. DEFAULT OVERALL VALUES (when dashboard first opens or filters are cleared/reset)
          // Total Orders: regular orders (excluding reservations, cancelled, rejected, replacement)
          const overallRegularOrders = liveOrders.filter(o => 
            !isReservationOrder(o) && !isCancelledOrRejectedOrder(o) && !o.isReplacement
          );
          displayTotalOrders = overallRegularOrders.length;

          // Total Sales: sum of all confirmed customer payments according to existing payment-confirmation rules
          displayTotalSales = liveOrders
            .filter(o => getVerifiedCustomerPaymentInfo(o).isVerified)
            .reduce((sum, o) => sum + getVerifiedCustomerPaymentInfo(o).amount, 0);

          // Top Rice Product: overall top product by confirmed sacks sold
          const overallProductCounts = {};
          liveOrders.forEach(o => {
            const info = getVerifiedCustomerPaymentInfo(o);
            if (info.isVerified && !info.isReservation) {
              (o.items || []).forEach(item => {
                const pName = item.product?.name || item.name || item.productName;
                if (pName && !item.isReservation) {
                  overallProductCounts[pName] = (overallProductCounts[pName] || 0) + Number(item.quantity || 0);
                }
              });
            }
          });
          const sortedOverall = Object.entries(overallProductCounts).sort((a, b) => b[1] - a[1]);
          displayTopProductName = (sortedOverall[0] && sortedOverall[0][1] > 0) ? sortedOverall[0][0] : 'N/A';
          displayTopProductVol = (sortedOverall[0] && sortedOverall[0][1] > 0) ? sortedOverall[0][1] : 0;
        } else {
          // 2. FILTERED VALUES (when admin selects a date / date range and/or rice grain)
          
          // Total Orders: regular orders matching date/range and rice grain
          const filteredRegularOrders = liveOrders.filter(o => {
            if (isReservationOrder(o) || isCancelledOrRejectedOrder(o) || o.isReplacement) return false;
            if (isDateOrRangeFiltered) {
              const d = parseOrderDate(o);
              if (d < rangeStart || d > rangeEnd) return false;
            }
            if (currentProd !== 'all') {
              return (o.items || []).some(item => itemMatchesVariety(item));
            }
            return true;
          });
          displayTotalOrders = filteredRegularOrders.length;

          // Total Sales: confirmed payments matching date/range and rice grain (uses getVerifiedCustomerPaymentInfo, NOT completed sales)
          let filteredSalesSum = 0;
          liveOrders.forEach(o => {
            const info = getVerifiedCustomerPaymentInfo(o);
            if (!info.isVerified) return;
            if (isDateOrRangeFiltered) {
              const d = parseOrderDate(o);
              if (d < rangeStart || d > rangeEnd) return false;
            }
            if (currentProd === 'all') {
              filteredSalesSum += info.amount;
            } else {
              let orderVarietySum = 0;
              (o.items || []).forEach(item => {
                if (itemMatchesVariety(item)) {
                  const qty = Number(item.quantity || 0);
                  const price = Number(item.product?.price || item.price || 0);
                  orderVarietySum += (price * qty);
                }
              });
              const tot = Number(o.total || o.totalPrice || o.totalBill || 0);
              const ratio = tot > 0 ? Math.min(1, info.amount / tot) : 1;
              filteredSalesSum += (orderVarietySum * ratio);
            }
          });
          displayTotalSales = filteredSalesSum;

          // Top Rice Product:
          // When a date or date range is selected and All Grains is selected, show top-selling rice product in that period
          // When a specific rice grain is selected, preserve overall top product
          if (currentProd === 'all' && isDateOrRangeFiltered) {
            const rangeProductCounts = {};
            liveOrders.forEach(o => {
              const info = getVerifiedCustomerPaymentInfo(o);
              if (info.isVerified && !info.isReservation) {
                const d = parseOrderDate(o);
                if (d >= rangeStart && d <= rangeEnd) {
                  (o.items || []).forEach(item => {
                    if (!item || item.isReservation) return;
                    const pName = item.product?.name || item.name || item.productName;
                    if (pName) {
                      rangeProductCounts[pName] = (rangeProductCounts[pName] || 0) + Number(item.quantity || 0);
                    }
                  });
                }
              }
            });
            const sortedRange = Object.entries(rangeProductCounts).sort((a, b) => b[1] - a[1]);
            displayTopProductName = (sortedRange[0] && sortedRange[0][1] > 0) ? sortedRange[0][0] : 'N/A';
            displayTopProductVol = (sortedRange[0] && sortedRange[0][1] > 0) ? sortedRange[0][1] : 0;
          } else {
            // Specific rice grain selected: preserve existing overall top rice product
            const overallProductCounts = {};
            liveOrders.forEach(o => {
              const info = getVerifiedCustomerPaymentInfo(o);
              if (info.isVerified && !info.isReservation) {
                (o.items || []).forEach(item => {
                  const pName = item.product?.name || item.name || item.productName;
                  if (pName && !item.isReservation) {
                    overallProductCounts[pName] = (overallProductCounts[pName] || 0) + Number(item.quantity || 0);
                  }
                });
              }
            });
            const sortedOverall = Object.entries(overallProductCounts).sort((a, b) => b[1] - a[1]);
            displayTopProductName = (sortedOverall[0] && sortedOverall[0][1] > 0) ? sortedOverall[0][0] : 'N/A';
            displayTopProductVol = (sortedOverall[0] && sortedOverall[0][1] > 0) ? sortedOverall[0][1] : 0;
          }
        }

        // Update top 3 summary cards (Total Orders, Total Sales, Top Rice Product)
        const topTotalOrdersEl = document.getElementById('dash-total-registered');
        const topTotalSalesEl = document.getElementById('dash-validated-revenue');
        const topProductNameEl = document.getElementById('dash-top-product-name');
        const topProductVolEl = document.getElementById('dash-top-product-vol');

        if (topTotalOrdersEl) {
          topTotalOrdersEl.textContent = `${displayTotalOrders} Order${displayTotalOrders !== 1 ? 's' : ''}`;
        }
        if (topTotalSalesEl) {
          topTotalSalesEl.textContent = `₱${displayTotalSales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }
        if (topProductNameEl) {
          topProductNameEl.textContent = displayTopProductName;
        }
        if (topProductVolEl) {
          topProductVolEl.textContent = `${displayTopProductVol} sacks sold`;
        }

        // Update bottom 4 summary cards
        const cardRange = document.getElementById('card-time-range');
        const cardSales = document.getElementById('card-completed-sales');
        const cardAmount = document.getElementById('card-completed-amount');
        const cardVariety = document.getElementById('card-active-variety');
        const cardSacks = document.getElementById('card-timeframe-sacks');

        if (cardRange) cardRange.textContent = rangeLabel;
        if (cardSales) cardSales.textContent = `${matchingOrders.length} Order${matchingOrders.length !== 1 ? 's' : ''}`;
        if (cardAmount) cardAmount.textContent = `₱${timeframeSalesSum.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} sales`;
        if (cardVariety) {
          cardVariety.textContent = activeVarietyLabel;
          cardVariety.title = activeVarietyLabel;
        }
        if (cardSacks) cardSacks.textContent = `${timeframeSacksSum} Sack${timeframeSacksSum !== 1 ? 's' : ''}`;

        // Build time buckets for Sales Overview Bar Chart
        const totalDurationMs = rangeEnd.getTime() - rangeStart.getTime();
        const bucketMs = totalDurationMs / numBuckets;
        const buckets = [];

        for (let i = 0; i < numBuckets; i++) {
          let bStart;
          let bEnd;
          if (!selectedSalesDate && currentRange === '1week') {
            bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
            bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
          } else {
            bStart = new Date(rangeStart.getTime() + i * bucketMs);
            bEnd = new Date(rangeStart.getTime() + (i + 1) * bucketMs);
          }
          
          let label = '';
          if (selectedSalesDate) {
            const slotLabels = ['12AM–6AM', '6AM–12PM', '12PM–6PM', '6PM–12AM'];
            label = slotLabels[i] || rangeLabel;
          } else if (currentRange === '1week') {
            label = bStart.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          } else if (currentRange === '1month') {
            label = `Wk ${i + 1}`;
          } else {
            const bMid = new Date((bStart.getTime() + bEnd.getTime()) / 2);
            label = bMid.toLocaleDateString('en-US', { month: 'short' });
          }

          let sacksInBucket = 0;
          let ordersInBucket = 0;
          let salesInBucket = 0;

          matchingOrders.forEach(o => {
            const oDate = parseOrderDate(o);
            const inBucket = (!selectedSalesDate && currentRange === '1week')
              ? (oDate >= bStart && oDate <= bEnd)
              : ((i === numBuckets - 1) ? (oDate >= bStart && oDate <= bEnd) : (oDate >= bStart && oDate < bEnd));
            if (inBucket) {
              const oSacks = getOrderVerifiedSacks(o);
              if (oSacks > 0 || currentProd === 'all') {
                ordersInBucket++;
                sacksInBucket += oSacks;
                salesInBucket += getOrderVerifiedSales(o);
              }
            }
          });

          buckets.push({
            label,
            sacks: sacksInBucket,
            orders: ordersInBucket,
            sales: salesInBucket
          });
        }

        const rawMax = Math.max(...buckets.map(b => b.sacks), 0);
        const maxVal = rawMax <= 20 ? 20 : Math.ceil(rawMax / 4) * 4;

        // Render Bar Chart
        const barChartContainer = document.getElementById('sales-barchart-inner');
        if (barChartContainer) {
          barChartContainer.innerHTML = `
            <div class="flex-1 min-h-72 flex flex-col pt-3 pb-7">
              <div class="flex-1 min-h-60 flex items-end gap-3 sm:gap-5 pl-16 sm:pl-20 pr-1 border-b so-chart-gridline relative">
                <!-- Grid Lines (0, 5, 10, 15, 20 sacks reference scale, scaling dynamically when data > 20) -->
                <div class="so-chart-gridline absolute inset-x-0 top-0 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${maxVal} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-1/4 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.round(maxVal * 0.75)} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-1/2 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.round(maxVal * 0.5)} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 top-3/4 border-t border-dashed flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.round(maxVal * 0.25)} sacks</span>
                </div>
                <div class="so-chart-gridline absolute inset-x-0 bottom-0 flex items-center pointer-events-none">
                  <span class="so-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs translate-y-1/2">0 sacks</span>
                </div>

                <!-- Dynamic bars -->
                ${buckets.map(b => {
                  const heightPercent = Math.min((b.sacks / maxVal) * 100, 100);
                  const formattedSales = b.sales.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                  return `
                    <div class="flex-1 flex flex-col items-center group relative h-full justify-end cursor-pointer z-10">
                      <!-- Tooltip -->
                      <div class="absolute bottom-full mb-2 bg-slate-900 dark:bg-slate-950 text-white font-bold text-xs py-2 px-3 rounded-xl border border-slate-700 opacity-0 group-hover:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl">
                        <span class="text-emerald-400 font-black">${b.label}:</span> ${b.sacks} Sacks (${b.orders} Orders · ₱${formattedSales})
                      </div>
                      <!-- Bar item -->
                      <div class="bg-[#1E6C02] hover:bg-[#145001] dark:bg-emerald-500 dark:hover:bg-emerald-400 rounded-t-lg transition-all w-full max-w-[46px] shadow-xs" style="height: ${heightPercent}%;"></div>
                      <span class="so-text-main text-xs font-extrabold absolute top-full mt-2.5 truncate w-full text-center tracking-tight" title="${b.label}">${b.label}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // B. Order Summary Pie Chart
        const statusCategories = [
          { key: 'to-pay', label: 'To Pay', color: '#F59E0B' },
          { key: 'processing', label: 'Processing', color: '#3B82F6' },
          { key: 'to-ship', label: 'To Ship', color: '#8B5CF6' },
          { key: 'to-receive', label: 'To Receive', color: '#0EA5E9' },
          { key: 'delivered', label: 'Delivered', color: '#14B8A6' },
          { key: 'issue-reported', label: 'Issue Reported', color: '#EF4444' },
          { key: 'completed', label: 'Completed', color: '#1E6C02' },
          { key: 'cancelled', label: 'Cancelled', color: '#6B7280' }
        ];

        const categoryCounts = {
          'to-pay': 0,
          'processing': 0,
          'to-ship': 0,
          'to-receive': 0,
          'delivered': 0,
          'issue-reported': 0,
          'completed': 0,
          'cancelled': 0
        };

        const regularOrders = liveOrders.filter(o => !o.isPreOrder && !(o.items && o.items.some(i => i.isReservation)));

        regularOrders.forEach(o => {
          const s = (o.status || '').toLowerCase().replace(/_/g, '-');
          if (s === 'to-pay' || s === 'unpaid' || s === 'pending-payment') {
            categoryCounts['to-pay']++;
          } else if (s === 'processing' || s === 'pre-order' || s === 'reserved' || s === 'waiting' || s === 'ready' || s === 'ready_for_processing') {
            categoryCounts['processing']++;
          } else if (s === 'to-ship' || s === 'preparing') {
            categoryCounts['to-ship']++;
          } else if (s === 'to-receive' || s === 'shipped' || s === 'in-transit') {
            categoryCounts['to-receive']++;
          } else if (s === 'delivered') {
            categoryCounts['delivered']++;
          } else if (s === 'issue-reported' || s === 'issue') {
            categoryCounts['issue-reported']++;
          } else if (s === 'completed' || s === 'fulfilled') {
            categoryCounts['completed']++;
          } else if (s === 'cancelled' || s === 'rejected' || s === 'expired') {
            categoryCounts['cancelled']++;
          } else {
            categoryCounts['to-pay']++;
          }
        });

        const totalCountedOrders = regularOrders.length;

        // Build SVG Donut slices
        let accumulatedPercent = 0;
        const svgSlices = [];

        statusCategories.forEach(cat => {
          const count = categoryCounts[cat.key] || 0;
          const pct = totalCountedOrders > 0 ? (count / totalCountedOrders) : 0;
          
          if (pct > 0) {
            const startAngle = accumulatedPercent * 2 * Math.PI - Math.PI / 2;
            accumulatedPercent += pct;
            const endAngle = accumulatedPercent * 2 * Math.PI - Math.PI / 2;

            const rOuter = 42;
            const rInner = 26;
            let angleDiff = endAngle - startAngle;
            let effectiveEndAngle = endAngle;
            if (angleDiff >= 2 * Math.PI - 0.0001) {
              effectiveEndAngle = startAngle + 2 * Math.PI - 0.0001;
            }

            const x1_out = (rOuter * Math.cos(startAngle)).toFixed(2);
            const y1_out = (rOuter * Math.sin(startAngle)).toFixed(2);
            const x2_out = (rOuter * Math.cos(effectiveEndAngle)).toFixed(2);
            const y2_out = (rOuter * Math.sin(effectiveEndAngle)).toFixed(2);

            const x1_in = (rInner * Math.cos(effectiveEndAngle)).toFixed(2);
            const y1_in = (rInner * Math.sin(effectiveEndAngle)).toFixed(2);
            const x2_in = (rInner * Math.cos(startAngle)).toFixed(2);
            const y2_in = (rInner * Math.sin(startAngle)).toFixed(2);

            const largeArc = angleDiff > Math.PI ? 1 : 0;
            const pathData = `M ${x1_out} ${y1_out} A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${x2_out} ${y2_out} L ${x1_in} ${y1_in} A ${rInner} ${rInner} 0 ${largeArc} 0 ${x2_in} ${y2_in} Z`;

            const pctDisplay = (pct * 100) % 1 === 0 ? (pct * 100).toFixed(0) : (pct * 100).toFixed(1);
            svgSlices.push(`
              <path d="${pathData}" fill="${cat.color}" class="transition-all hover:opacity-80 cursor-pointer">
                <title>${cat.label}: ${count} Orders (${pctDisplay}%)</title>
              </path>
            `);
          }
        });

        const pieChartContainer = document.getElementById('piechart-container-inner');
        if (pieChartContainer) {
          pieChartContainer.innerHTML = `
            <!-- Visual SVG Donut chart -->
            <div class="relative flex items-center justify-center">
              <svg viewBox="-50 -50 100 100" class="w-40 h-40 transform -rotate-90">
                ${totalCountedOrders === 0 ? `
                  <circle cx="0" cy="0" r="34" fill="none" stroke="#E2E8F0" stroke-width="14" />
                ` : svgSlices.join('')}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                <p class="text-2xl font-black text-gray-900 dark:text-white leading-none">${totalCountedOrders}</p>
                <p class="text-[10px] font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider mt-1">Total Orders</p>
              </div>
            </div>

            <!-- Order Status Legend -->
            <div class="grid grid-cols-2 gap-x-4 gap-y-2 w-full text-xs pt-3 border-t border-slate-100 dark:border-slate-800">
              ${statusCategories.map(cat => {
                const count = categoryCounts[cat.key] || 0;
                const pct = totalCountedOrders > 0 ? (count / totalCountedOrders) * 100 : 0;
                const pctStr = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);
                return `
                  <div class="flex items-center justify-between gap-1.5 p-1 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-colors">
                    <div class="flex items-center gap-1.5 min-w-0">
                      <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${cat.color};"></span>
                      <span class="font-bold text-gray-800 dark:text-gray-200 text-[11px] truncate" title="${cat.label}">${cat.label}</span>
                    </div>
                    <span class="font-extrabold text-gray-900 dark:text-white text-[11px] shrink-0 ml-1">${count} <span class="text-gray-500 dark:text-gray-400 font-bold">(${pctStr}%)</span></span>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }
      }

      function refreshDashboard() {
        populateProductDropdown();
        const liveOrders = getAllOrders ? getAllOrders() : [];
        
        // 1. Total Regular Orders (for Recent Orders table)
        const regularOrders = liveOrders.filter(o => !isReservationOrder(o) && !isCancelledOrRejectedOrder(o) && !o.isReplacement);

        // Update Recent Orders table
        const tbody = document.getElementById('dash-pipeline-tbody');
        if (tbody) {
          const sortedOrders = regularOrders.slice().sort((a, b) => {
            const tA = new Date(a.createdAt || a.dateCreated || a.date || 0).getTime();
            const tB = new Date(b.createdAt || b.dateCreated || b.date || 0).getTime();
            return tB - tA;
          });

          const recentOrders = sortedOrders.slice(0, 6);

          if (recentOrders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-gray-600 dark:text-gray-300 font-medium text-xs">No recent orders found</td></tr>`;
          } else {
            tbody.innerHTML = recentOrders.map(order => {
              const itemsText = (order.items || [])
                .filter(i => !i.isReservation)
                .map(i => `${i.product?.name || i.name || i.productName || 'Rice Product'} (${i.quantity || 1})`)
                .join(', ');
              const customerName = order.fullName || order.customerName || order.userName || 'Customer';
              const formattedTotal = Number(order.total || order.amountPaid || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

              return `
                <tr class="hover:bg-gray-50/50 transition-colors">
                  <td class="py-3.5 px-3 font-normal text-gray-900 font-mono">#${order.id}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900">${customerName}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900 truncate max-w-[200px]">${itemsText || 'N/A'}</td>
                  <td class="py-3.5 px-3 font-normal text-gray-900">₱${formattedTotal}</td>
                  <td class="py-3.5 px-3 text-right">
                    <span class="px-2.5 py-1 rounded-full font-semibold text-xs tracking-wide ${getStatusBadgeClass(order.status)}">${getStatusLabel(order.status)}</span>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }

        renderRecentActivities();
        renderStockReplenishmentGuide();
        drawPerformanceCharts();
        updateInventoryHealth();
        drawDashboardCalendar();
        renderInventoryAnalytics();
        renderReservationAnalytics();
      }

      function getStatusBadgeClass(status) {
        const s = (status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
        if (s === 'to-pay' || s === 'unpaid' || s === 'pending-payment') return 'bg-amber-50 text-amber-800 border border-amber-200';
        if (s === 'ready-for-processing' || s === 'ready') return 'bg-sky-50 text-sky-800 border border-sky-200';
        if (s === 'payment-verification' || s === 'pending-verification') return 'bg-purple-50 text-purple-800 border border-purple-200';
        if (s === 'waiting-for-stock' || s === 'pre-order' || s === 'waiting' || s === 'reserved') return 'bg-blue-50 text-blue-800 border border-blue-200';
        if (s === 'processing') return 'bg-blue-50 text-blue-800 border border-blue-200';
        if (s === 'to-ship' || s === 'preparing') return 'bg-purple-50 text-purple-800 border border-purple-200';
        if (s === 'to-receive' || s === 'shipped' || s === 'in-transit') return 'bg-sky-50 text-sky-800 border border-sky-200';
        if (s === 'delivered') return 'bg-teal-50 text-teal-800 border border-teal-200';
        if (s === 'issue-reported' || s === 'issue') return 'bg-red-50 text-red-700 border border-red-200';
        if (s === 'completed' || s === 'fulfilled') return 'bg-green-50 text-green-800 border border-green-200';
        if (s === 'cancelled' || s === 'rejected' || s === 'expired') return 'bg-gray-100 text-gray-700 border border-gray-200';
        return 'bg-gray-100 text-gray-800 border border-gray-200';
      }

      function getStatusLabel(status) {
        const s = (status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
        if (s === 'to-pay') return 'To Pay';
        if (s === 'ready-for-processing' || s === 'ready') return 'Ready for Processing';
        if (s === 'payment-verification' || s === 'pending-verification') return 'Payment Verification';
        if (s === 'pre-order' || s === 'waiting' || s === 'waiting-for-stock') return 'Waiting for Stock';
        if (s === 'processing') return 'Processing';
        if (s === 'to-ship') return 'To Ship';
        if (s === 'to-receive') return 'To Receive';
        if (s === 'delivered') return 'Delivered';
        if (s === 'completed') return 'Completed';
        if (s === 'cancelled') return 'Cancelled';
        if (s === 'issue-reported') return 'Issue Reported';
        return status || 'Pending';
      }

      function formatActivityTimestamp(ts) {
        if (!ts) return 'N/A';
        const d = new Date(ts);
        if (isNaN(d.getTime())) return String(ts);
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const monthStr = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${monthStr} ${day}, ${year} at ${hours}:${minutes} ${ampm}`;
      }

      let replenishFilter = 'all';

      function renderStockReplenishmentGuide() {
        const tbody = document.getElementById('replenish-guide-tbody');
        if (!tbody) return;

        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);

        const liveOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];
        const now = new Date();
        const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));

        // Filter verified customer sales orders strictly within last 30 days
        const verifiedSales30Days = liveOrders.filter(o => {
          if (!o || o.isReplacement) return false;
          if (isCancelledOrRejectedOrder(o)) return false;
          if (isReservationOrder(o)) return false;
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return false;
          const oDate = parseOrderDate(o);
          return oDate >= thirtyDaysAgo && oDate <= now;
        });

        // Compute 30-day verified sales volume per active product
        // Use exact product ID or safe exact normalized name matching (no broad substring or partial token matching)
        const demand30Map = {};
        verifiedSales30Days.forEach(order => {
          (order.items || []).forEach(item => {
            if (!item || item.isReservation) return;
            const qty = Number(item.quantity || 0);
            if (qty <= 0) return;

            // Extract candidate product ID from item
            const rawProdId = item.product?.id ?? item.productId ?? null;
            let candidateId = (rawProdId !== null && rawProdId !== undefined && rawProdId !== '' && rawProdId !== 'undefined' && rawProdId !== 'null' && rawProdId !== '[object Object]')
              ? String(rawProdId).trim()
              : null;

            // If item.id matches a catalog product ID, use it as candidate ID
            if (!candidateId && item.id && productsList.some(p => String(p.id).trim() === String(item.id).trim())) {
              candidateId = String(item.id).trim();
            }

            let matched = null;

            // 1. If item has a product ID: strictly match by exact product ID
            if (candidateId) {
              matched = activeProducts.find(p => String(p.id).trim() === candidateId);
              // If candidate ID belongs to a known catalog product (e.g. archived) but not active, do not fall back to name
              if (!matched && productsList.some(p => String(p.id).trim() === candidateId)) {
                return;
              }
            }

            // 2. If no product ID was present: use safe exact normalized name match (no broad includes or token subsets)
            if (!matched) {
              const rawItemName = item.product?.name ?? item.productName ?? (typeof item.product === 'string' ? item.product : '') ?? item.name ?? '';
              const normItemName = String(rawItemName).trim().toLowerCase();
              if (normItemName) {
                matched = activeProducts.find(p => String(p.name || '').trim().toLowerCase() === normItemName);
              }
            }

            if (matched) {
              demand30Map[matched.id] = (demand30Map[matched.id] || 0) + qty;
            }
          });
        });

        // Build data structure for each active product
        const rows = activeProducts.map(p => {
          const currentStock = p.currentStock !== undefined ? Math.max(0, Number(p.currentStock)) : Math.max(0, Number(p.stock || 0));
          const reservedStock = p.reservedStock !== undefined ? Math.max(0, Number(p.reservedStock)) : 0;
          const availableStock = p.availableStock !== undefined ? Math.max(0, Number(p.availableStock)) : Math.max(0, currentStock - reservedStock);

          const demand30 = demand30Map[p.id] || 0;
          const dailyDemand = demand30 / 30;
          // Calculate 7-day estimated demand: (Verified Sacks in Last 30 Days ÷ 30) × 7, rounded UP to next whole sack
          const est7DayDemand = demand30 > 0 ? Math.ceil((demand30 / 30) * 7) : 0;

          // Recommendation logic:
          // 🔴 Replenish Now
          // 🟠 Prepare Soon
          // 🟢 Stock Sufficient
          // ⚪ Insufficient Sales History
          let recommendation = '';
          let badgeClass = '';
          let dotClass = '';
          let badgeIcon = '';
          let explanation = '';
          let rank = 4; // sorting rank

          if (demand30 === 0) {
            if (availableStock <= 0) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              badgeIcon = '🔴';
              explanation = reservedStock > 0 
                ? `Out of stock for new orders (${reservedStock} sack${reservedStock > 1 ? 's' : ''} already reserved).`
                : 'Out of stock for new orders.';
              rank = 1;
            } else {
              recommendation = 'No Sales in Last 30 Days';
              badgeClass = 'srg-badge-neutral';
              dotClass = 'bg-slate-400 dark:bg-slate-400';
              badgeIcon = '⚪';
              explanation = `No sales recorded in the last 30 days (${availableStock} sack${availableStock > 1 ? 's' : ''} available for new orders). Older records remain saved.`;
              rank = 3;
            }
          } else {
            // demand30 > 0
            if (availableStock <= 0) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              badgeIcon = '🔴';
              explanation = `Out of stock for new orders. Sales in the last 30 days were ${demand30} sacks (~${est7DayDemand} sacks/week).`;
              rank = 1;
            } else if (availableStock <= est7DayDemand) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              badgeIcon = '🔴';
              explanation = `Available stock (${availableStock} sacks) is less than the estimated 7-day need (~${est7DayDemand} sacks).`;
              rank = 1;
            } else {
              const daysOfSupply = Math.round(availableStock / dailyDemand);
              if (daysOfSupply <= 14 || availableStock <= est7DayDemand * 2) {
                recommendation = 'Prepare More Soon';
                badgeClass = 'srg-badge-warning';
                dotClass = 'bg-amber-500 shadow-[0_0_6px_rgba(245,158,11,0.7)]';
                badgeIcon = '🟠';
                explanation = `Available stock covers about ${daysOfSupply} days of sales (~${est7DayDemand} sacks/week). Good to prepare more soon.`;
                rank = 2;
              } else {
                recommendation = 'Stock Is Enough';
                badgeClass = 'srg-badge-healthy';
                dotClass = 'bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.7)]';
                badgeIcon = '🟢';
                explanation = `Available stock covers about ${daysOfSupply} days of sales (~${est7DayDemand} sacks/week). Stock is enough for now.`;
                rank = 4;
              }
            }
          }

          return {
            product: p,
            currentStock,
            reservedStock,
            availableStock,
            demand30,
            est7DayDemand,
            recommendation,
            badgeClass,
            dotClass,
            badgeIcon,
            explanation,
            rank
          };
        });

        // Summary Counts
        const countNow = rows.filter(r => r.recommendation === 'Need More Stock').length;
        const countSoon = rows.filter(r => r.recommendation === 'Prepare More Soon').length;
        const countSufficient = rows.filter(r => r.recommendation === 'Stock Is Enough').length;
        const countInsufficient = rows.filter(r => r.recommendation === 'No Sales in Last 30 Days').length;

        const statNow = document.getElementById('replenish-stat-now');
        if (statNow) statNow.textContent = countNow;
        const statSoon = document.getElementById('replenish-stat-soon');
        if (statSoon) statSoon.textContent = countSoon;
        const statSufficient = document.getElementById('replenish-stat-sufficient');
        if (statSufficient) statSufficient.textContent = countSufficient;
        const statInsufficient = document.getElementById('replenish-stat-insufficient');
        if (statInsufficient) statInsufficient.textContent = countInsufficient;

        // Filter rows if user selected a recommendation filter
        let filteredRows = rows;
        if (replenishFilter === 'replenish') {
          filteredRows = rows.filter(r => r.recommendation === 'Need More Stock');
        } else if (replenishFilter === 'prepare') {
          filteredRows = rows.filter(r => r.recommendation === 'Prepare More Soon');
        } else if (replenishFilter === 'sufficient') {
          filteredRows = rows.filter(r => r.recommendation === 'Stock Is Enough');
        } else if (replenishFilter === 'insufficient') {
          filteredRows = rows.filter(r => r.recommendation === 'No Sales in Last 30 Days');
        }

        // Sort by urgency rank (1 = Replenish Now, 2 = Prepare Soon, 3 = Insufficient, 4 = Sufficient)
        // Secondary sort: available stock ascending
        filteredRows.sort((a, b) => {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.availableStock - b.availableStock;
        });

        if (filteredRows.length === 0) {
          tbody.innerHTML = `
            <tr class="srg-row">
              <td colspan="7" class="srg-text-main py-12 px-4 text-center font-semibold text-sm">
                ${activeProducts.length === 0 ? 'No active rice varieties found in catalog.' : 'No rice varieties match the selected recommendation filter.'}
              </td>
            </tr>
          `;
          return;
        }

        // Visual progress bar scale references (presentation only)
        const maxStockRef = Math.max(100, ...rows.map(item => Math.max(item.currentStock, item.availableStock, 1)));
        const maxDemandRef = Math.max(20, ...rows.map(item => Math.max(item.demand30, 1)));

        tbody.innerHTML = filteredRows.map(r => {
          const p = r.product;
          const pName = p.name || 'Rice Variety';
          const pType = p.type ? `${p.type} Rice` : '25kg sack';
          const rawImg = String(p.image || p.imageUrl || p.photoUrl || '').trim();
          const hasImg = rawImg.length > 0 && rawImg !== 'null' && rawImg !== 'undefined';

          const availNumClass = r.availableStock === 0 
            ? 'srg-num-critical font-black' 
            : (r.availableStock <= 10 || r.rank === 1 ? 'srg-num-warning font-extrabold' : 'srg-num-healthy font-extrabold');

          const availBarColor = r.availableStock === 0
            ? 'bg-red-500'
            : (r.availableStock <= 10 || r.rank === 1 ? 'bg-amber-500' : 'bg-emerald-500');

          const stockNowPct = r.currentStock > 0 ? Math.min(100, Math.max(8, Math.round((r.currentStock / maxStockRef) * 100))) : 0;
          const reservedPct = r.reservedStock > 0 ? Math.min(100, Math.max(10, Math.round((r.reservedStock / Math.max(r.currentStock, maxStockRef)) * 100))) : 0;
          const availPct = r.availableStock > 0 ? Math.min(100, Math.max(8, Math.round((r.availableStock / maxStockRef) * 100))) : 0;
          const soldPct = r.demand30 > 0 ? Math.min(100, Math.max(10, Math.round((r.demand30 / maxDemandRef) * 100))) : 0;

          return `
            <tr class="srg-row transition-colors">
              <td class="py-4 px-4 align-middle">
                <div class="flex items-center gap-3.5 min-w-[170px]">
                  <div class="srg-avatar w-11 h-11 rounded-full overflow-hidden shrink-0 flex items-center justify-center shadow-2xs relative">
                    ${hasImg ? `
                      <img src="${rawImg}" alt="${pName}" class="w-full h-full object-cover rounded-full" loading="lazy" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                      <span style="display:none;" class="srg-text-main w-full h-full items-center justify-center">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                      </span>
                    ` : `
                      <span class="srg-text-main w-full h-full flex items-center justify-center">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                      </span>
                    `}
                  </div>
                  <div class="min-w-0">
                    <div class="srg-text-main text-sm sm:text-[15px] font-bold leading-snug truncate">${pName}</div>
                    <div class="srg-text-sub text-xs font-semibold mt-0.5">${pType}</div>
                  </div>
                </div>
              </td>
              <td class="py-4 px-3 text-center align-middle font-mono tabular-nums whitespace-nowrap">
                <div class="inline-flex flex-col items-center gap-1.5 min-w-[76px]">
                  <div>
                    <span class="srg-num-primary text-[15px] sm:text-base font-extrabold">${r.currentStock}</span>
                    <span class="srg-unit-label text-[11px] font-semibold ml-0.5">sacks</span>
                  </div>
                  <div class="srg-progress-track w-16 sm:w-20 h-1.5 rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-sky-500 dark:bg-sky-400 transition-all duration-300" style="width: ${stockNowPct}%;"></div>
                  </div>
                </div>
              </td>
              <td class="py-4 px-3 text-center align-middle font-mono tabular-nums whitespace-nowrap">
                <div class="inline-flex flex-col items-center gap-1.5 min-w-[76px]">
                  <div>
                    ${r.reservedStock > 0 
                      ? `<span class="srg-num-warning text-[15px] sm:text-base font-extrabold">${r.reservedStock}</span> <span class="srg-unit-label text-[11px] font-semibold">sacks</span>` 
                      : `<span class="srg-num-primary text-[15px] sm:text-base font-bold">0</span> <span class="srg-unit-label text-[11px] font-semibold">sacks</span>`}
                  </div>
                  <div class="srg-progress-track w-16 sm:w-20 h-1.5 rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-amber-500 dark:bg-amber-400 transition-all duration-300" style="width: ${reservedPct}%;"></div>
                  </div>
                </div>
              </td>
              <td class="py-4 px-3 text-center align-middle font-mono tabular-nums whitespace-nowrap">
                <div class="inline-flex flex-col items-center gap-1.5 min-w-[76px]">
                  <div>
                    <span class="${availNumClass} text-[15px] sm:text-base">${r.availableStock}</span>
                    <span class="srg-unit-label text-[11px] font-semibold ml-0.5">sacks</span>
                  </div>
                  <div class="srg-progress-track w-16 sm:w-20 h-1.5 rounded-full overflow-hidden">
                    <div class="h-full rounded-full ${availBarColor} transition-all duration-300" style="width: ${availPct}%;"></div>
                  </div>
                </div>
              </td>
              <td class="py-4 px-3 text-center align-middle font-mono tabular-nums whitespace-nowrap">
                <div class="inline-flex flex-col items-center gap-1.5 min-w-[76px]">
                  <div>
                    ${r.demand30 > 0 
                      ? `<span class="srg-num-primary text-[15px] sm:text-base font-extrabold">${r.demand30}</span> <span class="srg-unit-label text-[11px] font-semibold">sacks</span>` 
                      : `<span class="srg-num-primary text-[15px] sm:text-base font-bold">0</span> <span class="srg-unit-label text-[11px] font-semibold">sacks</span>`}
                  </div>
                  <div class="srg-progress-track w-16 sm:w-20 h-1.5 rounded-full overflow-hidden">
                    <div class="h-full rounded-full bg-indigo-500 dark:bg-indigo-400 transition-all duration-300" style="width: ${soldPct}%;"></div>
                  </div>
                </div>
              </td>
              <td class="py-4 px-3 text-center align-middle font-mono tabular-nums whitespace-nowrap">
                ${r.demand30 > 0 
                  ? `<div class="inline-flex flex-col items-center gap-0.5"><span class="srg-num-primary text-[15px] sm:text-base font-extrabold">~${r.est7DayDemand} <span class="srg-unit-label text-[11px] font-semibold">sacks</span></span><span class="srg-unit-label text-[10px] font-sans font-semibold">per week</span></div>` 
                  : `<span class="srg-num-primary text-base font-extrabold">—</span>`}
              </td>
              <td class="py-4 px-4 align-middle">
                <div class="space-y-1.5 max-w-[290px]">
                  <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-bold ${r.badgeClass}">
                    <span class="w-2 h-2 rounded-full shrink-0 ${r.dotClass}"></span>
                    <span>${r.recommendation}</span>
                  </span>
                  <p class="srg-text-sub text-xs font-medium leading-relaxed">${r.explanation}</p>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }

      function renderRecentActivities() {
        const container = document.getElementById('dash-recent-activities-list');
        if (!container) return;

        const logs = typeof getLogs === 'function' ? getLogs() : [];
        const sortedLogs = logs.slice().sort((a, b) => {
          const tA = new Date(a.timestamp || 0).getTime();
          const tB = new Date(b.timestamp || 0).getTime();
          return tB - tA;
        });

        const recentLogs = sortedLogs.slice(0, 5);

        if (recentLogs.length === 0) {
          container.innerHTML = `<p class="text-center py-6 text-gray-500 text-xs font-normal">No recent activities recorded yet</p>`;
          return;
        }

        container.innerHTML = recentLogs.map(log => {
          const userName = log.userName || 'Admin User';
          const userRole = log.userRole || 'admin';
          const action = log.action || 'Performed action';
          const category = log.category || 'System';
          const formattedDate = formatActivityTimestamp(log.timestamp);

          return `
            <div class="p-3.5 rounded-xl bg-gray-50 border border-gray-200/60 hover:bg-gray-100/50 text-xs font-normal text-gray-900 space-y-1 transition-colors">
              <p class="text-sm font-normal text-gray-900">${userName} (${userRole}) ${action}</p>
              <p class="text-xs font-normal text-gray-500">${formattedDate}</p>
              <p class="text-xs font-normal text-gray-500">${category}</p>
            </div>
          `;
        }).join('');
      }

      function updateInventoryHealth() {
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived);

        const lowStockItems = activeProducts.filter(p => {
          const stock = p.availableStock !== undefined ? p.availableStock : (p.currentStock !== undefined ? p.currentStock : p.stock);
          return stock >= 1 && stock <= 20;
        });

        const outOfStockItems = activeProducts.filter(p => {
          const stock = p.availableStock !== undefined ? p.availableStock : (p.currentStock !== undefined ? p.currentStock : p.stock);
          return stock === 0;
        });

        const healthyItems = activeProducts.filter(p => {
          const stock = p.availableStock !== undefined ? p.availableStock : (p.currentStock !== undefined ? p.currentStock : p.stock);
          return stock > 20;
        });

        const lowCount = lowStockItems.length;
        const outCount = outOfStockItems.length;
        const totalActive = activeProducts.length;
        const healthPct = totalActive > 0 ? Math.round((healthyItems.length / totalActive) * 100) : 0;

        const lowEl = document.getElementById('dash-low-stock-count');
        if (lowEl) lowEl.textContent = `${lowCount} Item${lowCount !== 1 ? 's' : ''}`;

        const outEl = document.getElementById('dash-out-stock-count');
        if (outEl) outEl.textContent = `${outCount} Item(s)`;

        const pctEl = document.getElementById('dash-health-pct');
        if (pctEl) pctEl.textContent = `${healthPct}%`;
      }

      function parseInventoryHistoryDate(entry) {
        if (!entry) return new Date(0);

        const rawTs = entry.timestamp || entry.createdAt;
        if (rawTs && (typeof rawTs === 'number' || String(rawTs).includes('T') || String(rawTs).includes(':'))) {
          const tsDate = new Date(rawTs);
          if (!isNaN(tsDate.getTime()) && tsDate.getTime() > 0) {
            if (!entry.date) return tsDate;
            const entryDateClean = String(entry.date).trim();
            const tsLocalDate = [
              tsDate.getFullYear(),
              String(tsDate.getMonth() + 1).padStart(2, '0'),
              String(tsDate.getDate()).padStart(2, '0')
            ].join('-');
            const tsUtcDate = tsDate.toISOString().split('T')[0];
            if (entryDateClean === tsLocalDate || entryDateClean === tsUtcDate) {
              return tsDate;
            }
          }
        }

        if (entry.date) {
          const parts = String(entry.date).trim().split('-');
          if (parts.length === 3) {
            const yr = parseInt(parts[0], 10);
            const mo = parseInt(parts[1], 10) - 1;
            const da = parseInt(parts[2], 10);
            let hr = 0;
            let mi = 0;
            if (entry.time) {
              const timeParts = String(entry.time).trim().split(':');
              if (timeParts.length >= 2) {
                hr = parseInt(timeParts[0], 10) || 0;
                mi = parseInt(timeParts[1], 10) || 0;
              }
            }
            const localDate = new Date(yr, mo, da, hr, mi, 0, 0);
            if (!isNaN(localDate.getTime())) return localDate;
          }
        }
        if (entry.timestamp) {
          const d = new Date(entry.timestamp);
          if (!isNaN(d.getTime())) return d;
        }
        if (entry.createdAt) {
          const d = new Date(entry.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      function formatInventoryHistoryDateTime(entry) {
        const d = parseInventoryHistoryDate(entry);
        if (isNaN(d.getTime()) || d.getTime() === 0) {
          return `${entry.date || 'N/A'} ${entry.time || ''}`.trim() || 'N/A';
        }
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const mins = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${m} ${day}, ${year} · ${hours}:${mins} ${ampm}`;
      }

      function isEntryFromArchivedProduct(entry, productsList) {
        if (!entry) return false;
        const list = productsList || [];
        const archivedProducts = list.filter(p => Boolean(p.isArchived || p.archived));
        if (archivedProducts.length === 0) return false;

        // 1. If entry has productId, exact match against archived product IDs
        if (entry.productId) {
          const entryId = String(entry.productId);
          return archivedProducts.some(p => String(p.id) === entryId);
        }

        // 2. If no productId, safe exact normalized name match against archived product names
        const entryName = (entry.productName || '').trim().toLowerCase();
        if (!entryName) return false;
        return archivedProducts.some(p => (p.name || '').trim().toLowerCase() === entryName);
      }

      function entryMatchesVariety(entry, prodIdFilter, productsList) {
        if (!prodIdFilter || prodIdFilter === 'all') return true;

        // 1. Exact productId match if entry has productId
        if (entry.productId) {
          return String(entry.productId) === String(prodIdFilter);
        }

        // 2. Safe exact normalized name match against the filtered active product if no productId
        const targetProd = (productsList || []).find(p => String(p.id) === String(prodIdFilter));
        if (!targetProd) return false;

        const entryName = (entry.productName || '').trim().toLowerCase();
        const targetName = (targetProd.name || '').trim().toLowerCase();
        if (!entryName || !targetName) return false;

        // Strictly exact normalized match — NO substring matching
        return entryName === targetName;
      }

      function renderInventoryAnalytics() {
        const history = typeof getInventoryHistory === 'function' ? getInventoryHistory() : [];
        const productsList = typeof getProducts === 'function' ? getProducts() : [];

        const selRangeEl = document.getElementById('sel-inv-range');
        const selProdEl = document.getElementById('sel-inv-product');
        const resetBtn = document.getElementById('btn-reset-inv-filters');

        const currentRange = selRangeEl ? selRangeEl.value : (invTimeRange || 'all');
        const currentProd = selProdEl ? selProdEl.value : (invProductFilter || 'all');

        // Toggle reset button
        if (resetBtn) {
          if (currentRange !== 'all' || currentProd !== 'all') {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        let rangeStart = new Date(0);

        if (currentRange === '1week') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
        } else if (currentRange === '1month') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
        } else if (currentRange === '3months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate(), 0, 0, 0, 0);
        } else if (currentRange === '6months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), 0, 0, 0, 0);
        } else if (currentRange === '1year') {
          rangeStart = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), 0, 0, 0, 0);
        } else {
          // 'all': inspect history timestamps
          const activeHistory = history.filter(entry => entry && !isEntryFromArchivedProduct(entry, productsList));
          if (activeHistory.length > 0) {
            const validDates = activeHistory.map(h => parseInventoryHistoryDate(h).getTime()).filter(t => t > 0);
            if (validDates.length > 0) {
              const earliest = Math.min(...validDates);
              const eDate = new Date(earliest);
              rangeStart = new Date(eDate.getFullYear(), eDate.getMonth(), eDate.getDate(), 0, 0, 0, 0);
            } else {
              rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 5, 0, 0, 0, 0);
            }
          } else {
            rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 5, 0, 0, 0, 0);
          }
        }

        // Filter history entries strictly: exclude archived products, apply date range and variety
        const filteredEntries = history.filter(entry => {
          if (!entry) return false;
          // Rule: Exclude movements belonging to archived products
          if (isEntryFromArchivedProduct(entry, productsList)) return false;

          if (currentRange !== 'all') {
            const eDate = parseInventoryHistoryDate(entry);
            if (eDate < rangeStart || eDate > endOfToday) return false;
          }
          return entryMatchesVariety(entry, currentProd, productsList);
        });

        // Calculate totals using actual recorded data only
        let totalAdded = 0;
        let totalDeducted = 0;

        filteredEntries.forEach(entry => {
          const qty = Number(entry.quantityAdded || 0);
          if (qty > 0) {
            totalAdded += qty;
          } else if (qty < 0) {
            totalDeducted += Math.abs(qty);
          }
        });

        const netMovement = totalAdded - totalDeducted;
        const totalOps = filteredEntries.length;

        // Update Summary Cards with simple, clear quantities
        const statAddedEl = document.getElementById('inv-stat-added');
        const statDeductedEl = document.getElementById('inv-stat-deducted');
        const statNetEl = document.getElementById('inv-stat-net');
        const statCountEl = document.getElementById('inv-stat-count');

        if (statAddedEl) {
          statAddedEl.textContent = `+${totalAdded} Sack${totalAdded !== 1 ? 's' : ''}`;
        }
        if (statDeductedEl) {
          statDeductedEl.textContent = `-${totalDeducted} Sack${totalDeducted !== 1 ? 's' : ''}`;
        }
        if (statNetEl) {
          const sign = netMovement > 0 ? '+' : '';
          statNetEl.textContent = `${sign}${netMovement} Sack${netMovement !== 1 ? 's' : ''}`;
          statNetEl.className = `text-2xl sm:text-3xl font-black tabular-nums tracking-tight ${netMovement > 0 ? 'ia-num-positive' : (netMovement < 0 ? 'ia-num-negative' : 'ia-num-neutral')}`;
        }
        if (statCountEl) {

        // Render Simplified Trend Chart
        const chartContainer = document.getElementById('inv-movement-chart-inner');

            chartContainer.innerHTML = `
              <div class="h-full min-h-56 flex flex-col items-center justify-center text-center p-6">
                <div class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-[#1E6C02] dark:text-emerald-400 mb-3 shadow-2xs">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>

                <p class="ia-text-sub text-xs max-w-md mt-1 font-medium">When sacks of rice are added (restocks) or deducted (orders), movements will appear here automatically.</p>

          } else {
            // Build time buckets aligned to calendar dates
            const buckets = [];

            if (currentRange === '1week') {
              for (let i = 0; i < 7; i++) {
                const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                const label = bStart.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === '1month') {
              const monthStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 28, 0, 0, 0, 0);
              for (let i = 0; i < 5; i++) {
                const bStart = new Date(monthStart.getFullYear(), monthStart.getMonth(), monthStart.getDate() + i * 7, 0, 0, 0, 0);
                const bEnd = (i === 4) ? endOfToday : new Date(monthStart.getFullYear(), monthStart.getMonth(), monthStart.getDate() + (i + 1) * 7 - 1, 23, 59, 59, 999);
                const label = `Wk ${i + 1}`;
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === '3months' || currentRange === '6months' || currentRange === '1year') {
              const numMonths = currentRange === '3months' ? 3 : (currentRange === '6months' ? 6 : 12);
              for (let i = numMonths - 1; i >= 0; i--) {
                const mDate = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const bStart = new Date(mDate.getFullYear(), mDate.getMonth(), 1, 0, 0, 0, 0);
                const bEnd = new Date(mDate.getFullYear(), mDate.getMonth() + 1, 0, 23, 59, 59, 999);
                const label = bStart.toLocaleDateString('en-US', { month: 'short' });
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else {
              // 'all'
              const daysDiff = Math.max(1, Math.round((endOfToday.getTime() - rangeStart.getTime()) / 86400000));
              if (daysDiff <= 14) {
                for (let i = 0; i < daysDiff; i++) {
                  const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                  const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              } else {
                const totalDurationMs = Math.max(endOfToday.getTime() - rangeStart.getTime(), 86400000);
                const bucketMs = totalDurationMs / 6;
                for (let i = 0; i < 6; i++) {
                  const bStart = new Date(rangeStart.getTime() + i * bucketMs);
                  const bEnd = (i === 5) ? endOfToday : new Date(rangeStart.getTime() + (i + 1) * bucketMs);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              }
            }

            filteredEntries.forEach(entry => {
              const eDate = parseInventoryHistoryDate(entry);
              buckets.forEach(b => {
                if (eDate >= b.bStart && eDate <= b.bEnd) {
                  const qty = Number(entry.quantityAdded || 0);
                  if (qty > 0) b.added += qty;
                  else if (qty < 0) b.deducted += Math.abs(qty);
                }
              });
            });

            const maxBucketVal = Math.max(...buckets.map(b => Math.max(b.added, b.deducted)), 10);

            chartContainer.innerHTML = `
              <div class="h-full min-h-64 flex flex-col pt-4 pb-7 select-none">
                <div class="flex-1 min-h-52 flex items-end gap-4 sm:gap-6 pl-16 sm:pl-20 pr-2 border-b-2 ia-chart-gridline relative">

                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${maxBucketVal} sacks</span>

                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.floor(maxBucketVal / 2)} sacks</span>

                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs translate-y-1/2">0 sacks</span>

                  <!-- Easy-to-read dual bars for each time period -->
                  ${buckets.map(b => {
                    const hasAdded = b.added > 0;
                    const hasDeducted = b.deducted > 0;
                    const heightAdded = hasAdded ? Math.max((b.added / maxBucketVal) * 100, 8) : 0;
                    const heightDeducted = hasDeducted ? Math.max((b.deducted / maxBucketVal) * 100, 8) : 0;
                    const hasActivity = hasAdded || hasDeducted;

                    return `
                      <div class="flex-1 flex flex-col items-center group relative h-full justify-end cursor-pointer z-10" tabindex="0">
                        <!-- Tooltip with clear, simple summary -->
                        <div class="absolute bottom-full mb-2.5 bg-slate-900 dark:bg-slate-950 text-white text-xs py-2.5 px-3.5 rounded-xl opacity-0 group-hover:opacity-100 group-focus:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl border border-slate-700">
                          <div class="font-extrabold border-b border-slate-700/80 pb-1 mb-1.5 text-white">${b.label}</div>
                          <div class="flex items-center gap-1.5 text-emerald-300 font-bold">
                            <span class="w-2.5 h-2.5 rounded-xs bg-[#1E6C02] dark:bg-emerald-500"></span>
                            <span>Stock Added: +${b.added} sacks</span>
                          </div>
                          <div class="flex items-center gap-1.5 text-indigo-300 font-bold mt-0.5">
                            <span class="w-2.5 h-2.5 rounded-xs bg-[#4F46E5] dark:bg-[#6366F1]"></span>
                            <span>Stock Deducted: -${b.deducted} sacks</span>

                          <div class="text-white text-[11px] border-t border-slate-800 pt-1 mt-1.5 font-semibold">

                          </div>

                          <!-- Deducted Column (Muted Indigo/Blue) -->

                        <!-- Clear, readable period label -->

                      </div>
