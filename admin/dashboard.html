                displayStatus = 'Stock Available';
                badgeClass = 'srg-pill-enough';
                barColorClass = 'srg-bar-enough';
              } else {
                displayStatus = 'No Recent Sales';
                badgeClass = 'srg-pill-neutral bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-600';
                barColorClass = 'bg-slate-400 dark:bg-slate-500';
              }

              const shortfallHtml = shortfall > 0 
                ? `<span class="text-red-600 dark:text-red-400 font-bold">${shortfall} extra needed</span>`
                : `<span class="text-emerald-700 dark:text-emerald-400 font-medium">Stock Available</span>`;

              return `
                <div class="flex items-center gap-3 sm:gap-4 py-2.5 px-2.5 hover:bg-slate-50/80 dark:hover:bg-slate-800/40 rounded-xl transition-all border-b border-slate-100/80 dark:border-slate-800/70 last:border-b-0">
                  <!-- Product Name & Average Sacks Sold Subtitle -->
                  <div class="w-36 sm:w-44 md:w-48 shrink-0 min-w-0" title="${pName}">
                    <div class="srg-dash-product-name truncate text-[14px] font-semibold text-[#000000] dark:text-white leading-tight">
                      ${pName}
                    </div>
                    <div class="text-[11px] text-slate-600 dark:text-slate-400 font-medium truncate mt-0.5">
                      ${r.dailySalesRate > 0 ? (Math.round(r.dailySalesRate * 100) / 100).toFixed(2) : '0.00'}/day · ${shortfallHtml}
                    </div>
                  </div>

                  <!-- Horizontal Progress Bar -->
                  <div class="flex-1 min-w-[55px] sm:min-w-[70px] h-2 sm:h-2.5 rounded-full srg-progress-track bg-slate-100 dark:bg-slate-800/90 border border-slate-200/60 dark:border-slate-700/60 overflow-hidden">
                    <div class="h-full rounded-full ${barColorClass} transition-all duration-300" style="width: ${barPercent}%;"></div>
                  </div>

                  <!-- Available Quantity & Physical Stock Breakdown Tooltip -->
                  <div class="w-16 sm:w-20 shrink-0 text-right font-mono tabular-nums text-xs sm:text-[13px] font-bold text-[#000000] dark:text-white tracking-tight" title="Stock in Warehouse: ${r.currentStock} sacks | Reserved for Customers: ${r.reservedStock} sacks | Available for New Orders: ${stockVal} sacks | Expected Sales: ${r.periodDemand} sacks | Extra Sacks Needed: ${shortfall} sacks">
                    ${stockVal.toLocaleString('en-US')} <span class="text-[10px] font-sans font-medium text-slate-500 dark:text-slate-400">available</span>
                  </div>

                  <!-- Status Badge Pill with High-Contrast Text on Colored Background -->
                  <div class="w-32 sm:w-36 shrink-0 text-right">
                    <span class="srg-dash-status-pill inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-[12px] font-semibold tracking-normal shadow-2xs whitespace-nowrap ${badgeClass}">
                      ${displayStatus}
                    </span>
                  </div>
                </div>
              `;
            }).join('');
          }
          if (typeof syncDashboardCardsHeight === 'function') {
            syncDashboardCardsHeight();
          }

          // Dynamically update small AI status note in dashboard widget safely
          try {
            const dashAiText = document.getElementById('srg-dash-ai-status-text');
            const dashAiDot = document.getElementById('srg-dash-ai-dot');
            if (dashAiText) {
              let hasReadyModel = false;
              if (typeof trainProductDemandModel === 'function' && Array.isArray(activeProducts) && activeProducts.length > 0) {
                for (let i = 0; i < activeProducts.length; i++) {
                  const m = trainProductDemandModel(liveOrders, activeProducts[i].id, {
                    startDate: baselineStartDate,
                    endDate: baselineEndDate
                  });
                  if (m && m.forecastReady === true && m.status === 'trained') {
                    hasReadyModel = true;
                    break;
                  }
                }
              }
              if (hasReadyModel) {
                dashAiText.textContent = 'AI Demand Model: Supervised model ready for 1 or more varieties (advisory)';
                if (dashAiDot) dashAiDot.className = 'inline-block w-2 h-2 rounded-full bg-emerald-500 shrink-0';
              } else {
                dashAiText.textContent = 'AI Demand Model (Experimental): Awaiting verified sales history (insufficient data)';
                if (dashAiDot) dashAiDot.className = 'inline-block w-2 h-2 rounded-full bg-slate-400 shrink-0';
              }
            }
          } catch (e) {
            // Safe fallback: never block dashboard rendering
          }
        }

        // 2. Render Full Table if tbody element is present on this page
        if (tbody) {
          if (filteredRows.length === 0) {
            tbody.innerHTML = `
              <tr class="srg-row">
                <td colspan="6" class="srg-text-main py-12 px-4 text-center font-semibold text-sm">
                  ${activeProducts.length === 0 ? 'No active rice varieties found in catalog.' : 'No rice varieties match the selected recommendation filter.'}
                </td>
              </tr>
            `;
            return;
          }

          // Visual progress bar scale references (presentation only)
          const maxStockRef = Math.max(100, ...rows.map(item => Math.max(item.currentStock, item.availableStock, 1)));
          const maxDemandRef = Math.max(20, ...rows.map(item => Math.max(item.periodDemand, 1)));

          tbody.innerHTML = filteredRows.map(r => {
            const p = r.product;
            const pName = p.name || 'Rice Variety';
            const pType = p.type ? `${p.type} Rice` : '25kg sack';
            const rawImg = String(p.image || p.imageUrl || p.photoUrl || '').trim();
            const hasImg = rawImg.length > 0 && rawImg !== 'null' && rawImg !== 'undefined';

            const availNumClass = r.availableStock === 0 
              ? 'srg-num-critical font-black' 
              : (r.availableStock <= 10 || r.rank === 1 ? 'srg-num-warning font-extrabold' : 'srg-num-healthy font-extrabold');

            const availBarColor = r.availableStock === 0
              ? 'bg-red-500'
              : (r.availableStock <= 10 || r.rank === 1 ? 'bg-amber-500' : 'bg-emerald-500');

            const stockNowPct = r.currentStock > 0 ? Math.min(100, Math.max(8, Math.round((r.currentStock / maxStockRef) * 100))) : 0;
            const reservedPct = r.reservedStock > 0 ? Math.min(100, Math.max(10, Math.round((r.reservedStock / Math.max(r.currentStock, maxStockRef)) * 100))) : 0;
            const availPct = r.availableStock > 0 ? Math.min(100, Math.max(8, Math.round((r.availableStock / maxStockRef) * 100))) : 0;
            const demandPct = r.periodDemand > 0 ? Math.min(100, Math.max(10, Math.round((r.periodDemand / maxDemandRef) * 100))) : 0;

            return `
              <tr class="srg-row transition-colors">
                <td class="py-4 px-4 align-middle">
                  <div class="flex items-center gap-3.5 min-w-[170px]">
                    <div class="srg-avatar w-11 h-11 rounded-full overflow-hidden shrink-0 flex items-center justify-center shadow-2xs relative">
                      ${hasImg ? `
                        <img src="${rawImg}" alt="${pName}" class="w-full h-full object-cover rounded-full" loading="lazy" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                        <span style="display:none;" class="srg-text-main w-full h-full items-center justify-center">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        </span>
                      ` : `
                        <span class="srg-text-main w-full h-full flex items-center justify-center">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                        </span>
                      `}
                    </div>
                    <div class="min-w-0">
                      <div class="srg-text-main text-sm sm:text-[15px] font-bold leading-snug truncate">${pName}</div>
                      <div class="srg-text-sub text-xs font-semibold mt-0.5">${pType}</div>

                  <div class="inline-flex flex-col items-center gap-1.5 min-w-[76px]">

                      <span class="srg-num-primary text-[15px] sm:text-base font-extrabold">${r.currentStock}</span>

                      <div class="h-full rounded-full bg-sky-500 dark:bg-sky-400 transition-all duration-300" style="width: ${stockNowPct}%;"></div>

                <td class="py-4 px-3 text-center align-middle font-mono tabular-nums whitespace-nowrap">
                  <div class="inline-flex flex-col items-center gap-1.5 min-w-[76px]">

                      ${r.reservedStock > 0 
                        ? `<span class="srg-num-warning text-[15px] sm:text-base font-extrabold">${r.reservedStock}</span> <span class="srg-unit-label text-[11px] font-semibold">sacks</span>`

                    </div>

                    <p class="srg-text-sub text-xs font-medium leading-relaxed">${r.explanation}</p>
                  </div>
                </td>

            `;
          }).join('');
        }

      function renderRecentActivities() {
        const container = document.getElementById('dash-recent-activities-list');
        if (!container) return;

        const logs = typeof getLogs === 'function' ? getLogs() : [];
        const sortedLogs = logs.slice().sort((a, b) => {
          const tA = new Date(a.timestamp || 0).getTime();
          const tB = new Date(b.timestamp || 0).getTime();
          return tB - tA;
        });

        const recentLogs = sortedLogs.slice(0, 5);

        if (recentLogs.length === 0) {
          container.innerHTML = `<p class="text-center py-6 text-gray-500 text-xs font-normal">No recent activities recorded yet</p>`;
          return;
        }

        container.innerHTML = recentLogs.map(log => {
          const userName = log.userName || 'Admin User';
          const userRole = log.userRole || 'admin';
          const action = log.action || 'Performed action';
          const category = log.category || 'System';
          const formattedDate = formatActivityTimestamp(log.timestamp);

          return `
            <div class="p-3.5 rounded-xl bg-gray-50 border border-gray-200/60 hover:bg-gray-100/50 text-xs font-normal text-gray-900 space-y-1 transition-colors">
              <p class="text-sm font-normal text-gray-900">${userName} (${userRole}) ${action}</p>
              <p class="text-xs font-normal text-gray-500">${formattedDate}</p>
              <p class="text-xs font-normal text-gray-500">${category}</p>
            </div>
          `;
        }).join('');
      }

      function parseInventoryHistoryDate(entry) {
        if (!entry) return new Date(0);

        const rawTs = entry.timestamp || entry.createdAt;
        if (rawTs && (typeof rawTs === 'number' || String(rawTs).includes('T') || String(rawTs).includes(':'))) {
          const tsDate = new Date(rawTs);
          if (!isNaN(tsDate.getTime()) && tsDate.getTime() > 0) {
            if (!entry.date) return tsDate;
            const entryDateClean = String(entry.date).trim();
            const tsLocalDate = [
              tsDate.getFullYear(),
              String(tsDate.getMonth() + 1).padStart(2, '0'),
              String(tsDate.getDate()).padStart(2, '0')
            ].join('-');
            const tsUtcDate = tsDate.toISOString().split('T')[0];
            if (entryDateClean === tsLocalDate || entryDateClean === tsUtcDate) {
              return tsDate;
            }
          }
        }

        if (entry.date) {
          const parts = String(entry.date).trim().split('-');
          if (parts.length === 3) {
            const yr = parseInt(parts[0], 10);
            const mo = parseInt(parts[1], 10) - 1;
            const da = parseInt(parts[2], 10);
            let hr = 0;
            let mi = 0;
            if (entry.time) {
              const timeParts = String(entry.time).trim().split(':');
              if (timeParts.length >= 2) {
                hr = parseInt(timeParts[0], 10) || 0;
                mi = parseInt(timeParts[1], 10) || 0;
              }
            }
            const localDate = new Date(yr, mo, da, hr, mi, 0, 0);
            if (!isNaN(localDate.getTime())) return localDate;
          }
        }
        if (entry.timestamp) {
          const d = new Date(entry.timestamp);
          if (!isNaN(d.getTime())) return d;
        }
        if (entry.createdAt) {
          const d = new Date(entry.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        return new Date(0);
      }

      function formatInventoryHistoryDateTime(entry) {
        const d = parseInventoryHistoryDate(entry);
        if (isNaN(d.getTime()) || d.getTime() === 0) {
          return `${entry.date || 'N/A'} ${entry.time || ''}`.trim() || 'N/A';
        }
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const m = months[d.getMonth()];
        const day = d.getDate();
        const year = d.getFullYear();
        let hours = d.getHours();
        const mins = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return `${m} ${day}, ${year} · ${hours}:${mins} ${ampm}`;
      }

      function isEntryFromArchivedProduct(entry, productsList) {
        if (!entry) return false;
        const list = productsList || [];
        const archivedProducts = list.filter(p => Boolean(p.isArchived || p.archived));
        if (archivedProducts.length === 0) return false;

        // 1. If entry has productId, exact match against archived product IDs
        if (entry.productId) {
          const entryId = String(entry.productId);
          return archivedProducts.some(p => String(p.id) === entryId);
        }

        // 2. If no productId, safe exact normalized name match against archived product names
        const entryName = (entry.productName || '').trim().toLowerCase();
        if (!entryName) return false;
        return archivedProducts.some(p => (p.name || '').trim().toLowerCase() === entryName);
      }

      function entryMatchesVariety(entry, prodIdFilter, productsList) {
        if (!prodIdFilter || prodIdFilter === 'all') return true;

        // 1. Exact productId match if entry has productId
        if (entry.productId) {
          return String(entry.productId) === String(prodIdFilter);
        }

        // 2. Safe exact normalized name match against the filtered active product if no productId
        const targetProd = (productsList || []).find(p => String(p.id) === String(prodIdFilter));
        if (!targetProd) return false;

        const entryName = (entry.productName || '').trim().toLowerCase();
        const targetName = (targetProd.name || '').trim().toLowerCase();
        if (!entryName || !targetName) return false;

        // Strictly exact normalized match — NO substring matching
        return entryName === targetName;
      }

      function renderInventoryAnalytics() {
        const history = typeof getInventoryHistory === 'function' ? getInventoryHistory() : [];
        const productsList = typeof getProducts === 'function' ? getProducts() : [];

        const selRangeEl = document.getElementById('sel-inv-range');
        const selProdEl = document.getElementById('sel-inv-product');
        const resetBtn = document.getElementById('btn-reset-inv-filters');

        const currentRange = selRangeEl ? selRangeEl.value : (invTimeRange || 'all');
        const currentProd = selProdEl ? selProdEl.value : (invProductFilter || 'all');

        // Toggle reset button
        if (resetBtn) {
          if (currentRange !== 'all' || currentProd !== 'all') {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        let rangeStart = new Date(0);
        let rangeEnd = endOfToday;
        let periodLabel = 'All Time';

        if (currentRange === '1week') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
          periodLabel = '1 Week';
        } else if (currentRange === '1month') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
          periodLabel = '1 Month';
        } else if (currentRange === '3months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 3, now.getDate(), 0, 0, 0, 0);
          periodLabel = '3 Months';
        } else if (currentRange === '6months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), 0, 0, 0, 0);
          periodLabel = '6 Months';
        } else if (currentRange === '1year') {
          rangeStart = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), 0, 0, 0, 0);
          periodLabel = '1 Year';
        } else if (currentRange === 'custom' && invCustomStart && invCustomEnd) {
          const [sY, sM, sD] = invCustomStart.split('-').map(Number);
          const [eY, eM, eD] = invCustomEnd.split('-').map(Number);
          rangeStart = new Date(sY, sM - 1, sD, 0, 0, 0, 0);
          rangeEnd = new Date(eY, eM - 1, eD, 23, 59, 59, 999);
          if (invCustomStart === invCustomEnd) {
            periodLabel = rangeStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          } else {
            periodLabel = `${rangeStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} – ${rangeEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
          }
        } else {
          // 'all': inspect history timestamps
          const activeHistory = history.filter(entry => entry && !isEntryFromArchivedProduct(entry, productsList));
          if (activeHistory.length > 0) {
            const validDates = activeHistory.map(h => parseInventoryHistoryDate(h).getTime()).filter(t => t > 0);
            if (validDates.length > 0) {
              const earliest = Math.min(...validDates);
              const eDate = new Date(earliest);
              rangeStart = new Date(eDate.getFullYear(), eDate.getMonth(), eDate.getDate(), 0, 0, 0, 0);
            } else {
              rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 5, 0, 0, 0, 0);
            }
          } else {
            rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 5, 0, 0, 0, 0);
          }
          periodLabel = 'All Time';
        }

        const labelPeriodEl = document.getElementById('label-inv-period');
        if (labelPeriodEl) {
          labelPeriodEl.textContent = periodLabel;
        }

        // Filter history entries strictly: exclude archived products, apply date range and variety
        const filteredEntries = history.filter(entry => {
          if (!entry) return false;
          // Rule: Exclude movements belonging to archived products
          if (isEntryFromArchivedProduct(entry, productsList)) return false;

          if (currentRange !== 'all') {
            const eDate = parseInventoryHistoryDate(entry);
            if (eDate < rangeStart || eDate > rangeEnd) return false;
          }
          return entryMatchesVariety(entry, currentProd, productsList);
        });

        // Identify automatic stock restorations from cancelled/returned orders
        // so Stock Added counts only genuine new stock / restocking
        const isRestoredOrderStock = (entry) => {
          if (!entry) return false;
          const remarks = String(entry.remarks || entry.reason || '').toLowerCase();
          const type = String(entry.type || entry.action || entry.source || '').toLowerCase();
          return (
            remarks.includes('returned/restored') ||
            remarks.includes('cancelled order') ||
            remarks.includes('restored from') ||
            remarks.includes('returned from') ||
            type === 'restoration' ||
            type === 'order_cancelled_restore' ||
            type === 'return'
          );
        };

        // Calculate totals using actual recorded data only
        let totalAdded = 0;
        let totalAddedKg = 0;
        let totalPositive = 0;
        let totalPositiveKg = 0;
        let totalDeducted = 0;
        let totalDeductedKg = 0;

        filteredEntries.forEach(entry => {
          const qty = Number(entry.quantityAdded || 0);
          const p = productsList.find(pr => String(pr.id) === String(entry.productId)) ||
                    productsList.find(pr => pr.name === entry.productName);
          const sackWeight = (typeof getProductSackWeightKg === 'function' ? getProductSackWeightKg(p) : 25);
          const kg = Math.abs(qty) * sackWeight;

          if (qty > 0) {
            totalPositive += qty;
            totalPositiveKg += kg;
            if (!isRestoredOrderStock(entry)) {
              totalAdded += qty;
              totalAddedKg += kg;
            }
          } else if (qty < 0) {
            totalDeducted += Math.abs(qty);
            totalDeductedKg += kg;
          }
        });

        const netMovement = totalPositive - totalDeducted;
        const totalOps = filteredEntries.length;

        // Use the exact same existing Available Stock calculation from Dashboard Top KPI
        const activeProducts = productsList.filter(p =>
          p && p.name && !p.isArchived && !p.archived && p.status !== 'archived'
        );
        const targetProducts = (currentProd && currentProd !== 'all')
          ? activeProducts.filter(p => String(p.id) === String(currentProd) || p.name === currentProd)
          : activeProducts;

        const availableStockData = typeof getDashboardAvailableStockData === 'function'
          ? getDashboardAvailableStockData({ productsList: targetProducts })
          : { totalAvailableSacks: 0, totalAvailableKg: 0 };

        // Helper to format: "[number] sacks / [number] kg" on the same line with comfortable spacing
        const formatStockDisplay = (sacks, kg) => {
          const sFormatted = Number(sacks || 0).toLocaleString('en-US');
          const kFormatted = Number(kg || 0).toLocaleString('en-US');
          return `${sFormatted} sacks <span class="text-base sm:text-lg font-bold text-gray-400 dark:text-gray-500 mx-1.5">/</span> <span class="text-base sm:text-lg font-bold text-gray-500 dark:text-gray-400">${kFormatted} kg</span>`;
        };

        // Calculate delivered stock from completed/delivered orders
        let deliveredSacks = 0;
        let deliveredKg = 0;
        const allOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];
        allOrders.forEach(o => {
          const s = String(o.status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
          if (s === 'delivered' || s === 'completed' || s === 'fulfilled') {
            (o.items || []).forEach(it => {
              const pId = String(it.productId || it.product?.id || it.id || '');
              const pName = it.name || it.productName || '';
              if (!currentProd || currentProd === 'all' || pId === String(currentProd) || pName === currentProd) {
                const qty = Math.max(0, Number(it.quantity || o.quantity || 1));
                const p = productsList.find(pr => String(pr.id) === pId) || productsList.find(pr => pr.name === pName);
                const w = (typeof getProductSackWeightKg === 'function' ? getProductSackWeightKg(p) : 25);
                deliveredSacks += qty;
                deliveredKg += (qty * w);
              }
            });
          }
        });

        // Update Summary Cards with accurate quantities on single lines
        const statAddedEl = document.getElementById('inv-stat-added');
        const statDeductedEl = document.getElementById('inv-stat-deducted');
        const statDeliveredEl = document.getElementById('inv-stat-delivered');
        const statTotalEl = document.getElementById('inv-stat-total');

        if (statAddedEl) {
          statAddedEl.innerHTML = formatStockDisplay(totalAdded, totalAddedKg);
        }
        if (statDeductedEl) {
          statDeductedEl.innerHTML = formatStockDisplay(totalDeducted, totalDeductedKg);
        }
        if (statDeliveredEl) {
          statDeliveredEl.innerHTML = formatStockDisplay(deliveredSacks, deliveredKg);
        }
        if (statTotalEl) {
          statTotalEl.innerHTML = formatStockDisplay(availableStockData.totalAvailableSacks, availableStockData.totalAvailableKg);
        }

        // Update Dashboard Compact Inventory Analytics stacked summary items
        const valAddedEl = document.getElementById('dash-inv-val-added');
        if (valAddedEl) valAddedEl.innerHTML = `${Number(totalAdded || 0).toLocaleString()} sacks <span class="text-[#000000] dark:text-gray-400 font-normal">/</span> <span class="text-[11px] font-semibold text-[#000000] dark:text-gray-300">${Number(totalAddedKg || 0).toLocaleString()} kg</span>`;

        const valDeductedEl = document.getElementById('dash-inv-val-deducted');
        if (valDeductedEl) valDeductedEl.innerHTML = `${Number(totalDeducted || 0).toLocaleString()} sacks <span class="text-[#000000] dark:text-gray-400 font-normal">/</span> <span class="text-[11px] font-semibold text-[#000000] dark:text-gray-300">${Number(totalDeductedKg || 0).toLocaleString()} kg</span>`;

        const valDeliveredEl = document.getElementById('dash-inv-val-delivered');
        if (valDeliveredEl) valDeliveredEl.innerHTML = `${Number(deliveredSacks || 0).toLocaleString()} sacks <span class="text-[#000000] dark:text-gray-400 font-normal">/</span> <span class="text-[11px] font-semibold text-[#000000] dark:text-gray-300">${Number(deliveredKg || 0).toLocaleString()} kg</span>`;

        const valTotalEl = document.getElementById('dash-inv-val-total');
        if (valTotalEl) valTotalEl.innerHTML = `${Number(availableStockData.totalAvailableSacks || 0).toLocaleString()} sacks <span class="text-[#000000] dark:text-gray-400 font-normal">/</span> <span class="text-[11px] font-semibold text-[#000000] dark:text-gray-300">${Number(availableStockData.totalAvailableKg || 0).toLocaleString()} kg</span>`;

        // Render Reference-Style Smooth SVG Line Chart (LEFT portion of card)
        const invChartEl = document.getElementById('dash-inv-chart-container');
        if (invChartEl) {
          const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          const lineBuckets = [];
          for (let i = 4; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const mStart = new Date(d.getFullYear(), d.getMonth(), 1, 0, 0, 0, 0);
            const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999);
            const label = monthNames[d.getMonth()];
            lineBuckets.push({ mStart, mEnd, label, added: 0, allocated: 0, delivered: 0 });
          }

          // Stock Added (restocks) & Stock Allocated (set aside for orders) from inventory movement history
          history.forEach(entry => {
            if (isEntryFromArchivedProduct(entry, productsList)) return;
            const eDate = parseInventoryHistoryDate(entry);
            lineBuckets.forEach(b => {
              if (eDate >= b.mStart && eDate <= b.mEnd) {
                const qty = Number(entry.quantityAdded || 0);
                if (qty > 0) {
                  if (!isRestoredOrderStock(entry)) {
                    b.added += qty;
                  }
                } else if (qty < 0) {
                  b.allocated += Math.abs(qty);
                }
              }
            });
          });

          // Stock Delivered from actual completed and delivered customer orders
          const allOrdersForChart = typeof getAllOrders === 'function' ? getAllOrders() : [];
          allOrdersForChart.forEach(o => {
            const s = String(o.status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
            if (s === 'delivered' || s === 'completed' || s === 'fulfilled') {
              const oDate = (typeof getCompletedOrderDate === 'function' ? getCompletedOrderDate(o) : null) || parseOrderDate(o);
              if (oDate && !isNaN(oDate.getTime())) {
                lineBuckets.forEach(b => {
                  if (oDate >= b.mStart && oDate <= b.mEnd) {
                    (o.items || []).forEach(it => {
                      const pId = String(it.productId || it.product?.id || it.id || '');
                      const pName = it.name || it.productName || '';
                      if (!currentProd || currentProd === 'all' || pId === String(currentProd) || pName === currentProd) {
                        const qty = Math.max(0, Number(it.quantity || o.quantity || 1));
                        b.delivered += qty;
                      }
                    });
                  }
                });
              }
            }
          });

          // Calculate nice scale for Y-axis across Added, Allocated, Delivered
          const rawMax = Math.max(10, ...lineBuckets.map(b => Math.max(b.added, b.allocated, b.delivered)));
          let niceMax = 100;
          if (rawMax <= 20) niceMax = 20;
          else if (rawMax <= 50) niceMax = 50;
          else if (rawMax <= 100) niceMax = 100;
          else if (rawMax <= 200) niceMax = 200;
          else if (rawMax <= 400) niceMax = 400;
          else if (rawMax <= 600) niceMax = 600;
          else niceMax = Math.ceil(rawMax / 100) * 100;

          const width = 500;
          const height = 180;
          const padLeft = 34;
          const padRight = 18;
          const padTop = 16;
          const padBottom = 26;
          const plotW = width - padLeft - padRight;
          const plotH = height - padTop - padBottom;
          const count = lineBuckets.length;

          const getX = (idx) => padLeft + (idx / (count - 1)) * plotW;
          const getY = (val) => padTop + plotH - (Math.min(val, niceMax) / niceMax) * plotH;

          const addedPts = lineBuckets.map((b, idx) => ({ x: getX(idx), y: getY(b.added), val: b.added, label: b.label }));
          const allocatedPts = lineBuckets.map((b, idx) => ({ x: getX(idx), y: getY(b.allocated), val: b.allocated, label: b.label }));
          const deliveredPts = lineBuckets.map((b, idx) => ({ x: getX(idx), y: getY(b.delivered), val: b.delivered, label: b.label }));

          const buildCurve = (pts) => {
            if (!pts || pts.length === 0) return '';
            let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
            for (let i = 0; i < pts.length - 1; i++) {
              const p0 = pts[Math.max(0, i - 1)];
              const p1 = pts[i];
              const p2 = pts[i + 1];
              const p3 = pts[Math.min(pts.length - 1, i + 2)];
              const cp1x = p1.x + (p2.x - p0.x) / 6;
              const cp1y = p1.y + (p2.y - p0.y) / 6;
              const cp2x = p2.x - (p3.x - p1.x) / 6;
              const cp2y = p2.y - (p3.y - p1.y) / 6;
              d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
            }
            return d;
          };

          const pathAdded = buildCurve(addedPts);
          const pathAllocated = buildCurve(allocatedPts);
          const pathDelivered = buildCurve(deliveredPts);

          const areaAdded = pathAdded + ` L ${addedPts[count - 1].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} L ${addedPts[0].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} Z`;
          const areaAllocated = pathAllocated + ` L ${allocatedPts[count - 1].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} L ${allocatedPts[0].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} Z`;
          const areaDelivered = pathDelivered + ` L ${deliveredPts[count - 1].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} L ${deliveredPts[0].x.toFixed(1)} ${(padTop + plotH).toFixed(1)} Z`;

          const yMidVal = Math.round(niceMax / 2);
          const yTop = padTop;
          const yMid = padTop + plotH / 2;
          const yBot = padTop + plotH;

          invChartEl.innerHTML = `
            <svg viewBox="0 0 ${width} ${height}" class="w-full h-full overflow-visible select-none">
              <defs>
                <linearGradient id="grad-added" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#16A34A" stop-opacity="0.32" />
                  <stop offset="100%" stop-color="#16A34A" stop-opacity="0.0" />
                </linearGradient>
                <linearGradient id="grad-allocated" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#2563EB" stop-opacity="0.25" />
                  <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
                </linearGradient>
                <linearGradient id="grad-delivered" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#D97706" stop-opacity="0.25" />
                  <stop offset="100%" stop-color="#D97706" stop-opacity="0.0" />
                </linearGradient>
              </defs>

              <!-- Gridlines & Y-Axis Labels -->
              <line x1="${padLeft}" y1="${yTop}" x2="${width - padRight}" y2="${yTop}" stroke="currentColor" class="text-[#D6E3F0] dark:text-[#1E3563]" stroke-dasharray="3 3" />
              <text x="${padLeft - 5}" y="${yTop + 3.5}" text-anchor="end" class="text-[10px] font-medium fill-[#000000] dark:fill-[#BDD3ED] tabular-nums">${niceMax}</text>

              <line x1="${padLeft}" y1="${yMid}" x2="${width - padRight}" y2="${yMid}" stroke="currentColor" class="text-[#D6E3F0] dark:text-[#1E3563]" stroke-dasharray="3 3" />
              <text x="${padLeft - 5}" y="${yMid + 3.5}" text-anchor="end" class="text-[10px] font-medium fill-[#000000] dark:fill-[#BDD3ED] tabular-nums">${yMidVal}</text>

              <line x1="${padLeft}" y1="${yBot}" x2="${width - padRight}" y2="${yBot}" stroke="currentColor" class="text-[#D6E3F0] dark:text-[#1E3563]" stroke-width="1.2" />
              <text x="${padLeft - 5}" y="${yBot + 3.5}" text-anchor="end" class="text-[10px] font-medium fill-[#000000] dark:fill-[#BDD3ED] tabular-nums">0</text>

              <!-- Area Fills -->
              <path d="${areaDelivered}" fill="url(#grad-delivered)" />
              <path d="${areaAllocated}" fill="url(#grad-allocated)" />
              <path d="${areaAdded}" fill="url(#grad-added)" />

              <!-- Spline Strokes -->
              <path d="${pathDelivered}" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" />
              <path d="${pathAllocated}" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" />
              <path d="${pathAdded}" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linecap="round" />

              <!-- Markers & Tooltips for Delivered (Amber) -->
              ${deliveredPts.map(pt => `
                <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3" fill="#D97706" stroke="white" class="dark:stroke-[#0E1B38]" stroke-width="1.8" class="cursor-pointer transition-transform hover:scale-125">
                  <title>${pt.label}: ${pt.val} sacks delivered</title>
                </circle>
              `).join('')}

              <!-- Markers & Tooltips for Allocated (Blue) -->
              ${allocatedPts.map(pt => `
                <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.2" fill="#2563EB" stroke="white" class="dark:stroke-[#0E1B38]" stroke-width="1.8" class="cursor-pointer transition-transform hover:scale-125">
                  <title>${pt.label}: ${pt.val} sacks allocated</title>
                </circle>
              `).join('')}

              <!-- Markers & Tooltips for Added (Green) -->
              ${addedPts.map(pt => `
                <circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="#16A34A" stroke="white" class="dark:stroke-[#0E1B38]" stroke-width="2" class="cursor-pointer transition-transform hover:scale-125">
                  <title>${pt.label}: ${pt.val} sacks added</title>
                </circle>
              `).join('')}

              <!-- X-Axis Month Labels -->
              ${lineBuckets.map((b, idx) => `
                <text x="${getX(idx).toFixed(1)}" y="${height - 6}" text-anchor="middle" class="text-[11px] font-medium fill-[#000000] dark:fill-[#BDD3ED]">${b.label}</text>
              `).join('')}
            </svg>
          `;
        }

        // Render Simplified Trend Chart
        const chartContainer = document.getElementById('inv-movement-chart-inner');
        if (chartContainer) {
          if (filteredEntries.length === 0) {
            chartContainer.innerHTML = `
              <div class="h-full min-h-56 flex flex-col items-center justify-center text-center p-6">
                <div class="w-12 h-12 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-[#1E6C02] dark:text-emerald-400 mb-3 shadow-2xs">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                </div>
                <p class="ia-text-main text-sm font-bold">No stock movements recorded in this period.</p>
                <p class="ia-text-sub text-xs max-w-md mt-1 font-medium">When sacks of rice are added (restocks) or deducted (orders), movements will appear here automatically.</p>
              </div>
            `;
          } else {
            // Build time buckets aligned to calendar dates
            const buckets = [];

            if (currentRange === '1week') {
              for (let i = 0; i < 7; i++) {
                const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                const label = bStart.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === '1month') {
              const monthStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 28, 0, 0, 0, 0);
              for (let i = 0; i < 5; i++) {
                const bStart = new Date(monthStart.getFullYear(), monthStart.getMonth(), monthStart.getDate() + i * 7, 0, 0, 0, 0);
                const bEnd = (i === 4) ? endOfToday : new Date(monthStart.getFullYear(), monthStart.getMonth(), monthStart.getDate() + (i + 1) * 7 - 1, 23, 59, 59, 999);
                const label = `Wk ${i + 1}`;
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === '3months' || currentRange === '6months' || currentRange === '1year') {
              const numMonths = currentRange === '3months' ? 3 : (currentRange === '6months' ? 6 : 12);
              for (let i = numMonths - 1; i >= 0; i--) {
                const mDate = new Date(now.getFullYear(), now.getMonth() - i, 1);
                const bStart = new Date(mDate.getFullYear(), mDate.getMonth(), 1, 0, 0, 0, 0);
                const bEnd = new Date(mDate.getFullYear(), mDate.getMonth() + 1, 0, 23, 59, 59, 999);
                const label = bStart.toLocaleDateString('en-US', { month: 'short' });
                buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
              }
            } else if (currentRange === 'custom') {
              const diffMs = rangeEnd.getTime() - rangeStart.getTime();
              const diffDays = Math.max(1, Math.round(diffMs / 86400000));
              if (diffDays === 1) {
                // Single day: 4 time slots (12AM–6AM, 6AM–12PM, 12PM–6PM, 6PM–12AM)
                const slotLabels = ['12AM–6AM', '6AM–12PM', '12PM–6PM', '6PM–12AM'];
                for (let i = 0; i < 4; i++) {
                  const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate(), i * 6, 0, 0, 0);
                  const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate(), (i + 1) * 6 - 1, 59, 59, 999);
                  const label = slotLabels[i];
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              } else if (diffDays <= 14) {
                for (let i = 0; i < diffDays; i++) {
                  const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                  const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              } else {
                const totalDurationMs = Math.max(diffMs, 86400000);
                const bucketMs = totalDurationMs / 6;
                for (let i = 0; i < 6; i++) {
                  const bStart = new Date(rangeStart.getTime() + i * bucketMs);
                  const bEnd = (i === 5) ? rangeEnd : new Date(rangeStart.getTime() + (i + 1) * bucketMs);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              }
            } else {
              // 'all'
              const daysDiff = Math.max(1, Math.round((endOfToday.getTime() - rangeStart.getTime()) / 86400000));
              if (daysDiff <= 14) {
                for (let i = 0; i < daysDiff; i++) {
                  const bStart = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 0, 0, 0, 0);
                  const bEnd = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), rangeStart.getDate() + i, 23, 59, 59, 999);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              } else {
                const totalDurationMs = Math.max(endOfToday.getTime() - rangeStart.getTime(), 86400000);
                const bucketMs = totalDurationMs / 6;
                for (let i = 0; i < 6; i++) {
                  const bStart = new Date(rangeStart.getTime() + i * bucketMs);
                  const bEnd = (i === 5) ? endOfToday : new Date(rangeStart.getTime() + (i + 1) * bucketMs);
                  const label = bStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                  buckets.push({ bStart, bEnd, label, added: 0, deducted: 0 });
                }
              }
            }

            filteredEntries.forEach(entry => {
              const eDate = parseInventoryHistoryDate(entry);
              buckets.forEach(b => {
                if (eDate >= b.bStart && eDate <= b.bEnd) {
                  const qty = Number(entry.quantityAdded || 0);
                  if (qty > 0) {
                    b.positive = (b.positive || 0) + qty;
                    if (!isRestoredOrderStock(entry)) {
                      b.added += qty;
                    }
                  } else if (qty < 0) {
                    b.deducted += Math.abs(qty);
                  }
                }
              });
            });

            const maxBucketVal = Math.max(...buckets.map(b => Math.max(b.added, b.deducted)), 10);

            chartContainer.innerHTML = `
              <div class="h-full min-h-64 flex flex-col pt-4 pb-7 select-none">
                <div class="flex-1 min-h-52 flex items-end gap-4 sm:gap-6 pl-16 sm:pl-20 pr-2 border-b-2 ia-chart-gridline relative">
                  <!-- Clean Y-axis guidelines (without technical/debug annotations) -->
                  <div class="ia-chart-gridline absolute inset-x-0 top-0 border-t border-dashed flex items-center pointer-events-none">
                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${maxBucketVal} sacks</span>
                  </div>
                  <div class="ia-chart-gridline absolute inset-x-0 top-1/2 border-t border-dashed flex items-center pointer-events-none">
                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs -translate-y-1/2">${Math.floor(maxBucketVal / 2)} sacks</span>
                  </div>
                  <div class="ia-chart-gridline absolute inset-x-0 bottom-0 flex items-center pointer-events-none">
                    <span class="ia-chart-axis-pill text-[11px] sm:text-xs font-extrabold tabular-nums px-2 py-0.5 rounded-md shadow-2xs translate-y-1/2">0 sacks</span>
                  </div>

                  <!-- Easy-to-read dual bars for each time period -->
                  ${buckets.map(b => {
                    const hasAdded = b.added > 0;
                    const hasDeducted = b.deducted > 0;
                    const heightAdded = hasAdded ? Math.max((b.added / maxBucketVal) * 100, 8) : 0;
                    const heightDeducted = hasDeducted ? Math.max((b.deducted / maxBucketVal) * 100, 8) : 0;
                    const hasActivity = hasAdded || hasDeducted;

                    return `
                      <div class="flex-1 flex flex-col items-center group relative h-full justify-end cursor-pointer z-10" tabindex="0">
                        <!-- Tooltip with clear, simple summary -->
                        <div class="absolute bottom-full mb-2.5 bg-slate-900 dark:bg-slate-950 text-white text-xs py-2.5 px-3.5 rounded-xl opacity-0 group-hover:opacity-100 group-focus:opacity-100 pointer-events-none transition-all z-30 whitespace-nowrap shadow-xl border border-slate-700">
                          <div class="font-extrabold border-b border-slate-700/80 pb-1 mb-1.5 text-white">${b.label}</div>
                          <div class="flex items-center gap-1.5 text-emerald-300 font-bold">
                            <span class="w-2.5 h-2.5 rounded-xs bg-[#1E6C02] dark:bg-emerald-500"></span>
                            <span>Stock Added: +${b.added} sacks</span>
                          </div>
                          <div class="flex items-center gap-1.5 text-indigo-300 font-bold mt-0.5">
                            <span class="w-2.5 h-2.5 rounded-xs bg-[#4F46E5] dark:bg-[#6366F1]"></span>
                            <span>Stock Deducted: -${b.deducted} sacks</span>
                          </div>
                          <div class="text-white text-[11px] border-t border-slate-800 pt-1 mt-1.5 font-semibold">
                            Overall Stock Change: ${(b.positive || 0) - b.deducted > 0 ? '+' : ''}${(b.positive || 0) - b.deducted} sacks
                          </div>
                        </div>

                        <!-- Directly visible quantity labels on top of bars -->
                        <div class="w-full flex items-end justify-center gap-2 sm:gap-2.5 h-full max-w-[72px]">
                          <!-- Added Column (Green) -->
                          <div class="flex-1 flex flex-col items-center justify-end h-full">
                            ${hasAdded ? `<span class="ia-bar-val text-[11px] sm:text-xs font-black tabular-nums mb-1 leading-none">+${b.added}</span>` : ''}
                            <div class="w-full ${hasAdded ? 'bg-[#1E6C02] hover:bg-[#145001] dark:bg-emerald-500 dark:hover:bg-emerald-400 shadow-xs' : 'bg-transparent'} rounded-t-lg transition-all" style="height: ${heightAdded}%;"></div>
                          </div>

                          <!-- Deducted Column (Muted Indigo/Blue) -->
                          <div class="flex-1 flex flex-col items-center justify-end h-full">
                            ${hasDeducted ? `<span class="ia-bar-val text-[11px] sm:text-xs font-black tabular-nums mb-1 leading-none">-${b.deducted}</span>` : ''}
                            <div class="w-full ${hasDeducted ? 'bg-[#4F46E5] hover:bg-[#4338CA] dark:bg-[#6366F1] dark:hover:bg-[#818CF8] shadow-xs' : 'bg-transparent'} rounded-t-lg transition-all" style="height: ${heightDeducted}%;"></div>
                          </div>
                        </div>

                        <!-- If no changes in this period, clear zero indicator -->
                        ${!hasActivity ? `<div class="ia-bar-val absolute bottom-1.5 text-[11px] font-bold select-none">0</div>` : ''}

                        <!-- Clear, readable period label -->
                        <span class="ia-text-main text-xs font-extrabold absolute top-full mt-2.5 truncate w-full text-center tracking-tight" title="${b.label}">${b.label}</span>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }
        }

        // Render History Table
        const tbody = document.getElementById('inv-history-tbody');
        const countBadge = document.getElementById('inv-history-count-badge');
        if (countBadge) {
          countBadge.textContent = `${filteredEntries.length} Recorded Event${filteredEntries.length !== 1 ? 's' : ''}`;
        }

        if (tbody) {
          if (filteredEntries.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" class="py-8 text-center text-gray-500 dark:text-gray-400 font-normal text-xs">
                  No stock movements recorded for the selected filter.
                </td>
              </tr>
            `;
          } else {
            // Sort by date descending
            const sortedEntries = filteredEntries.slice().sort((a, b) => {
              const tA = parseInventoryHistoryDate(a).getTime();
              const tB = parseInventoryHistoryDate(b).getTime();
              return tB - tA;
            });

            // Display latest 25 entries in table
            tbody.innerHTML = sortedEntries.slice(0, 25).map(entry => {
              const qty = Number(entry.quantityAdded || 0);
              const isAdded = qty >= 0;
              const formattedDate = formatInventoryHistoryDateTime(entry);
              const varietyName = entry.productName || 'Rice Variety';
              const reason = entry.remarks || (isAdded ? 'Stock added' : 'Order stock deduction');
              const loggedBy = entry.staffName || 'System / Admin';

              return `
                <tr class="hover:bg-gray-50/60 dark:hover:bg-slate-800/60 transition-colors">
                  <td class="py-3 px-3.5 text-xs text-gray-800 dark:text-gray-200 whitespace-nowrap font-medium">${formattedDate}</td>
                  <td class="py-3 px-3.5 text-xs font-semibold text-gray-900 dark:text-white">
                    <span class="px-2 py-0.5 rounded-md bg-gray-100 dark:bg-slate-800 border border-gray-200/80 dark:border-slate-700 text-gray-800 dark:text-gray-200">${varietyName}</span>
                  </td>
                  <td class="py-3 px-3.5 text-xs whitespace-nowrap">
                    ${isAdded 
                      ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-50 dark:bg-emerald-950/60 text-green-800 dark:text-emerald-300 border border-green-200 dark:border-emerald-800/80"><span class="font-extrabold">+</span> Rice Added</span>`
                      : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/80"><span class="font-extrabold">-</span> Rice Taken Out</span>`
                    }
                  </td>
                  <td class="py-3 px-3.5 text-xs font-bold whitespace-nowrap ${isAdded ? 'text-emerald-700 dark:text-emerald-400' : 'text-amber-700 dark:text-amber-400'}">
                    ${isAdded ? `+${qty} Sacks` : `-${Math.abs(qty)} Sacks`}
                  </td>
                  <td class="py-3 px-3.5 text-xs text-gray-700 dark:text-gray-300 truncate max-w-[220px]" title="${reason}">${reason}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-600 dark:text-gray-400 text-right whitespace-nowrap">${loggedBy}</td>
                </tr>
              `;
            }).join('');
          }
        }
      }

      function renderReservationAnalytics() {
        if (!document.getElementById('reservation-analytics-section')) return;
        const orders = typeof getAllOrders === 'function' ? getAllOrders() : [];
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);

        const filterResRangeEl = document.getElementById('sel-res-range');
        const filterResProdEl = document.getElementById('sel-res-product');
        const currentRange = filterResRangeEl ? filterResRangeEl.value : (resTimeRange || 'all');
        const currentProd = filterResProdEl ? filterResProdEl.value : (resProductFilter || 'all');

        const resetBtn = document.getElementById('btn-reset-res-filters');
        if (resetBtn) {
          if (currentRange !== 'all' || currentProd !== 'all') {
            resetBtn.classList.remove('hidden');
          } else {
            resetBtn.classList.add('hidden');
          }
        }

        const now = new Date();
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        let rangeStart = new Date(0);

        if (currentRange === '1week') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6, 0, 0, 0, 0);
        } else if (currentRange === '1month') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);
        } else if (currentRange === '3months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 89, 0, 0, 0, 0);
        } else if (currentRange === '6months') {
          rangeStart = new Date(now.getFullYear(), now.getMonth() - 6, now.getDate(), 0, 0, 0, 0);
        } else if (currentRange === '1year') {
          rangeStart = new Date(now.getFullYear() - 1, now.getMonth(), now.getDate(), 0, 0, 0, 0);
        }

        // All reservation orders in the system
        const allReservations = orders.filter(o => isReservationOrder(o));

        // Filter by date range and selected rice variety
        const filteredReservations = allReservations.filter(order => {
          if (currentRange !== 'all') {
            const oDate = parseOrderDate(order);
            if (oDate < rangeStart || oDate > endOfToday) return false;
          }

          if (currentProd !== 'all') {
            const hasProd = (order.items || []).some(it => {
              const pid = it.product?.id || it.productId || it.id;
              return String(pid) === String(currentProd);
            });
            if (!hasProd) return false;
          }

          return true;
        });

        // Helper to count sacks matching current variety filter
        function getOrderSacks(order) {
          let sacks = 0;
          (order.items || []).forEach(it => {
            const pid = it.product?.id || it.productId || it.id;
            if (currentProd === 'all' || String(pid) === String(currentProd)) {
              sacks += Number(it.quantity || 1);
            }
          });
          return sacks > 0 ? sacks : Number(order.quantity || 1);
        }

        // Status classification categories
        let activeCount = 0;
        let activeSacks = 0;

        let waitingCount = 0;
        let waitingSacks = 0;

        let paymentVerificationCount = 0;
        let paymentVerificationSacks = 0;

        let readyCount = 0;
        let readySacks = 0;

        let cancelledCount = 0;
        let cancelledSacks = 0;

        let completedCount = 0;
        let completedSacks = 0;

        filteredReservations.forEach(order => {
          const rawStatus = String(order.status || '').toLowerCase().trim();
          const normStatus = rawStatus.replace(/[\s_]+/g, '-');

          // Check if this reservation has already been transferred to normal Orders
          const isTransferredToOrders = [
            'processing',
            'to-ship',
            'preparing',
            'to-receive',
            'shipped',
            'in-transit',
            'out-for-delivery',
            'in-delivery',
            'dispatch',
            'delivered',
            'completed',
            'fulfilled'
          ].includes(normStatus) || order.transferredToOrders === true || (order.isPreOrder === false && !['ready-for-processing', 'ready', 'payment-verification', 'pending-verification', 'pre-order', 'waiting', 'waiting-for-stock', 'cancelled', 'rejected', 'expired'].includes(normStatus));

          const sacks = getOrderSacks(order);

          if (isTransferredToOrders) {
            // Transferred reservations belong to the normal Orders workflow, excluded from reservation status breakdown
            if (normStatus === 'completed' || normStatus === 'fulfilled') {
              completedCount++;
              completedSacks += sacks;
            }
            return;
          }

          const isCancelled = (
            normStatus === 'cancelled' ||
            normStatus === 'rejected' ||
            normStatus === 'expired' ||
            order.status === 'Cancelled' ||
            order.paymentStatus === 'rejected_expired' ||
            order.autoCancelledDueToRejectionDeadline === true
          );

          const isReuploadWaiting = !isCancelled && isReservationWaitingForReupload(order);

          const hasSubmittedProof = Boolean(
            (order.paymentProof && String(order.paymentProof).trim() !== '' && String(order.paymentProof) !== 'null') ||
            (order.paymentProofUrl && String(order.paymentProofUrl).trim() !== '') ||
            (order.paymentProofDataUrl && String(order.paymentProofDataUrl).trim() !== '') ||
            order.paymentUploadedAt ||
            order.referenceNumber
          );

          const isPaymentVerified = order.paymentVerified === true || 
                                    order.paymentStatus === 'verified' || 
                                    order.paymentStatus === 'paid' || 
                                    order.isVerifiedPayment === true || 
                                    order.paymentConfirmed === true;

          const isReady = !isCancelled && (
            normStatus === 'ready-for-processing' ||
            normStatus === 'ready' ||
            order.status === 'ready_for_processing' ||
            order.status === 'Ready for Processing' ||
            isPaymentVerified
          );

          const isPaymentVerification = !isCancelled && !isReady && (
            isReuploadWaiting ||
            normStatus === 'payment-verification' ||
            normStatus === 'pending-verification' ||
            order.status === 'payment_verification' ||
            order.status === 'Payment Verification' ||
            order.paymentStatus === 'pending_verification' ||
            order.paymentStatus === 'payment_verification' ||
            hasSubmittedProof
          );

          if (isCancelled) {
            cancelledCount++;
            cancelledSacks += sacks;
          } else if (isReady) {
            readyCount++;
            readySacks += sacks;
            activeCount++;
            activeSacks += sacks;
          } else if (isPaymentVerification) {
            paymentVerificationCount++;
            paymentVerificationSacks += sacks;
            activeCount++;
            activeSacks += sacks;
          } else {
            // Waiting for Stock
            waitingCount++;
            waitingSacks += sacks;
            activeCount++;
            activeSacks += sacks;
          }
        });

        // 1. Update the 6 Metric Cards
        const statActiveEl = document.getElementById('res-stat-active');
        const statSacksEl = document.getElementById('res-stat-sacks');
        const statWaitingEl = document.getElementById('res-stat-waiting');
        const statReadyEl = document.getElementById('res-stat-ready');
        const statCompletedEl = document.getElementById('res-stat-completed');
        const statCancelledEl = document.getElementById('res-stat-cancelled');

        if (statActiveEl) statActiveEl.textContent = `${activeCount} Order${activeCount !== 1 ? 's' : ''}`;
        if (statSacksEl) statSacksEl.textContent = `${activeSacks} Sack${activeSacks !== 1 ? 's' : ''}`;
        if (statWaitingEl) statWaitingEl.textContent = `${waitingCount} Order${waitingCount !== 1 ? 's' : ''}`;
        if (statReadyEl) statReadyEl.textContent = `${readyCount} Order${readyCount !== 1 ? 's' : ''}`;
        if (statCompletedEl) statCompletedEl.textContent = `${completedCount} Order${completedCount !== 1 ? 's' : ''}`;
        if (statCancelledEl) statCancelledEl.textContent = `${cancelledCount} Order${cancelledCount !== 1 ? 's' : ''}`;

        // Subtitles with sacks
        const subActiveEl = document.getElementById('res-sub-active');
        const subWaitingEl = document.getElementById('res-sub-waiting');
        const subReadyEl = document.getElementById('res-sub-ready');
        const subCompletedEl = document.getElementById('res-sub-completed');
        const subCancelledEl = document.getElementById('res-sub-cancelled');

        if (subActiveEl) subActiveEl.textContent = `${activeSacks} sack${activeSacks !== 1 ? 's' : ''} in pipeline`;
        if (subWaitingEl) subWaitingEl.textContent = `${waitingSacks} sack${waitingSacks !== 1 ? 's' : ''} awaiting stock`;
        if (subReadyEl) subReadyEl.textContent = `${readySacks} sack${readySacks !== 1 ? 's' : ''} stock allocated`;
        if (subCompletedEl) subCompletedEl.textContent = `${completedSacks} sack${completedSacks !== 1 ? 's' : ''} delivered`;
        if (subCancelledEl) subCancelledEl.textContent = `${cancelledSacks} sack${cancelledSacks !== 1 ? 's' : ''} released`;

        // Render Reference-Style Donut Chart & Status Breakdown (LEFT portion of Reservation Analytics)
        const resDonutContainer = document.getElementById('dash-res-donut-container');
        if (resDonutContainer) {
          const totalBreakdown = waitingCount + paymentVerificationCount + readyCount + cancelledCount;
          
          const approvedPct = totalBreakdown > 0 ? Math.round((readyCount / totalBreakdown) * 100) : 0;
          const waitingPct = totalBreakdown > 0 ? Math.round((waitingCount / totalBreakdown) * 100) : 0;
          const paymentPct = totalBreakdown > 0 ? Math.round((paymentVerificationCount / totalBreakdown) * 100) : 0;
          const cancelledPct = totalBreakdown > 0 ? Math.max(0, 100 - approvedPct - waitingPct - paymentPct) : 0;

          const segmentsData = [
            { count: readyCount, pct: approvedPct, color: '#10B981', label: 'Approved' },
            { count: waitingCount, pct: waitingPct, color: '#0EA5E9', label: 'Waiting' },
            { count: paymentVerificationCount, pct: paymentPct, color: '#F59E0B', label: 'Payment Verification' },
            { count: cancelledCount, pct: cancelledPct, color: '#EF4444', label: 'Cancelled' }
          ];

          const radius = 40;
          const circ = 2 * Math.PI * radius;
          let cumPct = 0;

          const donutSvg = totalBreakdown > 0
            ? segmentsData.map(s => {
                if (s.count <= 0) return '';
                const dashLen = (s.pct / 100) * circ;
                const dashOffset = -((cumPct / 100) * circ);
                cumPct += s.pct;
                return `<circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="${s.color}" stroke-width="11" stroke-dasharray="${dashLen.toFixed(1)} ${circ.toFixed(1)}" stroke-dashoffset="${dashOffset.toFixed(1)}" stroke-linecap="butt"></circle>`;
              }).join('')
            : `<circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="#1E3563" stroke-opacity="0.3" stroke-width="11"></circle>`;

          resDonutContainer.innerHTML = `
            <div class="flex items-center justify-between w-full h-full gap-2.5 sm:gap-3.5 py-1">
              <!-- Donut Visual (Left) - Comfortably fits Total Reservations -->
              <div class="relative w-36 h-36 sm:w-40 sm:h-40 shrink-0 flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90 overflow-visible">
                  <circle cx="50" cy="50" r="${radius}" fill="transparent" stroke="currentColor" class="text-[#DCE5EF] dark:text-[#1E3563]" stroke-width="11"></circle>
                  ${donutSvg}
                </svg>
                <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none px-2.5">
                  <span class="text-2xl sm:text-3xl font-black text-slate-950 dark:text-white tabular-nums leading-none">${totalBreakdown}</span>
                  <span class="text-[10px] sm:text-[11px] font-black text-slate-900 dark:text-slate-100 uppercase tracking-tight mt-1.5 leading-tight text-center max-w-[88px]">Total Reservations</span>
                </div>
              </div>

              <!-- Status Items with % (Right of Donut) - Slightly more vertical space between items -->
              <div class="flex-1 min-w-0 flex flex-col justify-center space-y-3.5 pl-2 sm:pl-3">
                ${segmentsData.map(s => `
                  <div class="flex items-center justify-between gap-1.5 text-xs sm:text-[13px]">
                    <div class="flex items-center gap-2 min-w-0">
                      <span class="w-2.5 h-2.5 rounded-full shrink-0 shadow-2xs" style="background-color: ${s.color};"></span>
                      <span class="font-bold text-slate-900 dark:text-slate-100 truncate" title="${s.label}">${s.label}</span>
                    </div>
                    <span class="font-black tabular-nums text-slate-950 dark:text-white shrink-0 pl-1.5">${s.pct}%</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        // 2. Render Status Breakdown (Donut Chart + Accessible Status Breakdown Rows)
        const breakdownContainer = document.getElementById('res-status-breakdown-container');
        if (breakdownContainer) {
          const totalBreakdownReservations = waitingCount + paymentVerificationCount + readyCount + cancelledCount;
          const statusRows = [
            {
              label: 'Waiting for Stock',
              count: waitingCount,
              sacks: waitingSacks,
              color: '#F59E0B',
              bgClass: 'bg-amber-500',
              badgeClass: 'bg-amber-100 text-amber-900 border-amber-300'
            },
            {
              label: 'Payment Verification',
              count: paymentVerificationCount,
              sacks: paymentVerificationSacks,
              color: '#8B5CF6',
              bgClass: 'bg-purple-500',
              badgeClass: 'bg-purple-100 text-purple-900 border-purple-300'
            },
            {
              label: 'Ready for Processing',
              count: readyCount,
              sacks: readySacks,
              color: '#0EA5E9',
              bgClass: 'bg-sky-500',
              badgeClass: 'bg-sky-100 text-sky-900 border-sky-300'
            },
            {
              label: 'Cancelled',
              count: cancelledCount,
              sacks: cancelledSacks,
              color: '#BE123C',
              bgClass: 'bg-rose-600',
              badgeClass: 'bg-rose-50 text-rose-800 border-rose-200'
            }
          ];

          const radius = 58;
          const circumference = 2 * Math.PI * radius;
          let cumulativePct = 0;

          const donutSegments = totalBreakdownReservations > 0
            ? statusRows.map(row => {
                if (row.count <= 0) return '';
                const pct = (row.count / totalBreakdownReservations) * 100;
                const dashLen = (pct / 100) * circumference;
                const dashOffset = -((cumulativePct / 100) * circumference);
                cumulativePct += pct;
                return `<circle cx="80" cy="80" r="${radius}" fill="transparent" stroke="${row.color}" stroke-width="20" stroke-dasharray="${dashLen} ${circumference}" stroke-dashoffset="${dashOffset}" stroke-linecap="butt"></circle>`;
              }).join('')
            : '';

          breakdownContainer.innerHTML = `
            <div class="flex flex-col justify-between gap-4 h-full">
              <!-- Graphical Donut Chart Representation -->
              <div class="flex flex-col items-center justify-center py-1">
                <div class="relative w-36 h-36 sm:w-40 sm:h-40 flex items-center justify-center">
                  <svg viewBox="0 0 160 160" class="w-full h-full -rotate-90 overflow-visible">
                    <circle cx="80" cy="80" r="${radius}" fill="transparent" stroke-width="20" class="ra-donut-track"></circle>
                    ${donutSegments}
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none px-3">
                    <span class="ra-text-main text-2xl sm:text-3xl font-black tabular-nums leading-none">${totalBreakdownReservations}</span>
                    <span class="ra-text-sub text-[11px] font-extrabold uppercase tracking-wider mt-1">${totalBreakdownReservations === 1 ? 'Order' : 'Orders'}</span>
                  </div>
                </div>
              </div>

              <!-- Accessible Status Breakdown Details -->
              <div class="space-y-2.5">
                ${statusRows.map(row => {
                  const pct = totalBreakdownReservations > 0 ? (row.count / totalBreakdownReservations) * 100 : 0;
                  const pctDisplay = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);
                  return `
                    <div class="ra-item-card px-3.5 py-2.5 rounded-xl space-y-1.5 shadow-2xs">
                      <div class="flex items-center justify-between gap-2 text-xs flex-wrap">
                        <div class="flex items-center gap-2 min-w-0">
                          <span class="w-3 h-3 rounded-full shrink-0 shadow-2xs" style="background-color: ${row.color};"></span>
                          <span class="ra-text-main font-bold truncate">${row.label}</span>
                        </div>
                        <div class="flex items-center gap-2.5 shrink-0 tabular-nums">
                          <span class="ra-text-main text-xs font-extrabold">${row.count} Orders</span>
                          <span class="ra-text-sub text-[11px] font-bold">(${row.sacks} Sacks)</span>
                          <span class="ra-text-main text-xs font-black w-11 text-right">${pctDisplay}%</span>
                        </div>
                      </div>
                      <div class="ra-bar-track w-full rounded-full h-1.5 overflow-hidden">
                        <div class="h-full rounded-full transition-all duration-300" style="width: ${pct}%; background-color: ${row.color};"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }

        // 3. Render Demand by Rice Variety
        const varietyStats = activeProducts.map(p => {
          const pId = String(p.id);
          let pReservedSacks = 0;
          let pAllocatedSacks = 0;
          let pUnallocatedSacks = 0;
          let pResCount = 0;

          allReservations.forEach(order => {
            const rawStatus = String(order.status || '').toLowerCase().trim();
            const normStatus = rawStatus.replace(/[\s_]+/g, '-');

            // Exclude reservations already transferred to normal Orders
            const isTransferredToOrders = [
              'processing',
              'to-ship',
              'preparing',
              'to-receive',
              'shipped',
              'in-transit',
              'out-for-delivery',
              'in-delivery',
              'dispatch',
              'delivered',
              'completed',
              'fulfilled'
            ].includes(normStatus) || order.transferredToOrders === true || (order.isPreOrder === false && !['ready-for-processing', 'ready', 'payment-verification', 'pending-verification', 'pre-order', 'waiting', 'waiting-for-stock', 'cancelled', 'rejected', 'expired'].includes(normStatus));

            const isCancelled = (
              normStatus === 'cancelled' ||
              normStatus === 'rejected' ||
              normStatus === 'expired' ||
              order.status === 'Cancelled' ||
              order.paymentStatus === 'rejected_expired' ||
              order.autoCancelledDueToRejectionDeadline === true ||
              (isCancelledOrRejectedOrder(order) && !isReservationWaitingForReupload(order))
            );

            if (isTransferredToOrders || isCancelled) return;

            (order.items || []).forEach(it => {
              const itemId = String(it.product?.id || it.productId || it.id);
              if (itemId === pId) {
                const itemQty = Math.max(0, Number(it.quantity || order.quantity || 1));

                let rawAllocated = 0;
                if (it.allocatedQuantity !== undefined && it.allocatedQuantity !== null && !isNaN(Number(it.allocatedQuantity))) {
                  rawAllocated = Number(it.allocatedQuantity);
                } else if (order.allocatedQuantity !== undefined && order.allocatedQuantity !== null && !isNaN(Number(order.allocatedQuantity))) {
                  rawAllocated = Number(order.allocatedQuantity);
                } else if (
                  normStatus === 'ready-for-processing' ||
                  normStatus === 'ready' ||
                  order.status === 'ready_for_processing' ||
                  order.status === 'Ready for Processing' ||
                  order.stockAllocated === true
                ) {
                  rawAllocated = itemQty;
                }

                const allocatedForItem = Math.min(itemQty, Math.max(0, rawAllocated));
                const unallocatedForItem = Math.max(0, itemQty - allocatedForItem);

                pReservedSacks += itemQty;
                pAllocatedSacks += allocatedForItem;
                pUnallocatedSacks += unallocatedForItem;
                pResCount++;
              }
            });
          });

          const currentStock = Number(p.stock !== undefined ? p.stock : (p.currentStock || 0));
          return {
            product: p,
            reservedSacks: pReservedSacks,
            allocatedSacks: pAllocatedSacks,
            unallocatedSacks: pUnallocatedSacks,
            reservationCount: pResCount,
            warehouseStock: currentStock
          };
        });

        // Sort by highest reserved sacks
        varietyStats.sort((a, b) => b.reservedSacks - a.reservedSacks);

        const varietyContainer = document.getElementById('res-variety-breakdown-container');
        if (varietyContainer) {

          const displayStats = (currentProd !== 'all') 
            ? varietyStats.filter(v => String(v.product.id) === String(currentProd))
            : varietyStats;

          if (displayStats.length === 0) {
            varietyContainer.innerHTML = `
              <div class="p-8 text-center ra-text-main text-xs font-bold">
                No active grain varieties found.
              </div>
            `;
          } else {
            const maxReserved = Math.max(1, ...displayStats.map(v => v.reservedSacks));

            varietyContainer.innerHTML = `
              <div class="space-y-2.5">
                ${displayStats.map(item => {
                  const unallocatedDemand = item.unallocatedSacks !== undefined
                    ? item.unallocatedSacks
                    : Math.max(0, item.reservedSacks - (item.allocatedSacks || 0));
                  const deficit = Math.max(0, unallocatedDemand - item.warehouseStock);
                  const isHealthy = deficit === 0;
                  let badge = '';
                  let barColor = '#10B981';
                  if (item.reservedSacks === 0) {
                    badge = `<span class="ra-badge-none text-[10px] font-extrabold px-2.5 py-0.5 rounded-full shrink-0">No Active Demand</span>`;
                    barColor = '#93C5FD';
                  } else if (isHealthy) {
                    badge = `<span class="ra-badge-sufficient text-[10px] font-extrabold px-2.5 py-0.5 rounded-full shrink-0">✓ Stock Sufficient</span>`;
                    barColor = '#10B981';
                  } else if (item.warehouseStock === 0) {
                    badge = `<span class="ra-badge-critical text-[10px] font-extrabold px-2.5 py-0.5 rounded-full shrink-0">🚫 Restock Needed (${deficit} Sacks)</span>`;
                    barColor = '#EF4444';
                  } else {
                    badge = `<span class="ra-badge-deficit text-[10px] font-extrabold px-2.5 py-0.5 rounded-full shrink-0">⚠️ Partial Deficit (${deficit} Sacks)</span>`;
                    barColor = '#F59E0B';
                  }

                  const barWidthPct = item.reservedSacks > 0
                    ? Math.min(100, Math.max(6, Math.round((item.reservedSacks / maxReserved) * 100)))
                    : 0;

                  return `
                    <div class="ra-item-card px-3.5 py-3 rounded-xl space-y-2 transition-all shadow-2xs">
                      <!-- Variety Label, Status Badge, and Reserved Sacks -->
                      <div class="flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-2 min-w-0 flex-wrap">
                          <span class="ra-text-main text-xs sm:text-sm font-extrabold truncate" title="${item.product.name}">${item.product.name}</span>
                          ${badge}
                        </div>
                        <div class="text-right shrink-0">
                          <span class="ra-text-main text-xs sm:text-sm font-black tabular-nums">${item.reservedSacks} Sacks</span>
