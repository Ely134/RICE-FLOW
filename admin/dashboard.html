                        </div>
                      </div>

                      <!-- Horizontal Graphic Bar Comparison -->
                      <div class="ra-bar-track w-full rounded-lg h-3 relative flex items-center overflow-hidden">
                        <div class="h-full rounded-lg transition-all duration-500" style="width: ${barWidthPct}%; background-color: ${item.reservedSacks > 0 ? barColor : 'transparent'};"></div>
                      </div>

                      <!-- Accessible Metadata: Warehouse Stock & Reservation Count -->
                      <div class="flex items-center justify-between gap-2 text-[11px] sm:text-xs ra-text-sub font-bold pt-0.5 tabular-nums">
                        <span>Warehouse Stock: <strong class="ra-text-main font-extrabold">${item.warehouseStock} Sacks</strong></span>
                        <span class="ra-text-main font-bold">${item.reservationCount} active customer${item.reservationCount !== 1 ? 's' : ''}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `;
          }
        }

        // Populate Dashboard Compact Reserved Demand List (RIGHT portion of Reservation Analytics)
        const dashDemandListEl = document.getElementById('dash-res-demand-list');
        if (dashDemandListEl) {
          const topDemands = varietyStats.slice(0, 4);
          const maxDemand = Math.max(1, ...topDemands.map(d => d.reservedSacks));
          if (topDemands.length === 0 || topDemands.every(d => d.reservedSacks === 0)) {
            dashDemandListEl.innerHTML = `
              <div class="flex-1 flex flex-col items-center justify-center text-center p-3 text-slate-700 dark:text-slate-300">
                <span class="text-xs sm:text-[13px] font-bold">No active reserved demand</span>
              </div>
            `;
          } else {
            dashDemandListEl.innerHTML = topDemands.map(item => {
              const pct = item.reservedSacks > 0 ? Math.min(100, Math.max(8, Math.round((item.reservedSacks / maxDemand) * 100))) : 0;
              return `
                <div class="space-y-1.5 py-1">
                  <div class="flex items-center justify-between text-xs sm:text-[13px]">
                    <span class="font-extrabold text-slate-950 dark:text-white truncate pr-2" title="${item.product.name}">${item.product.name}</span>
                    <span class="font-black text-slate-950 dark:text-white tabular-nums shrink-0">${item.reservedSacks} sacks</span>
                  </div>
                  <div class="w-full bg-slate-200 dark:bg-slate-700 rounded-full h-2.5 overflow-hidden">
                    <div class="h-full rounded-full bg-[#16A34A] dark:bg-[#4ADE80] transition-all duration-300" style="width: ${pct}%"></div>
                  </div>
                </div>
              `;
            }).join('');
          }
        }

        // 4. Render Recent Reservations / Queue Preview Table
        const recentTbody = document.getElementById('res-recent-tbody');
        if (recentTbody) {
          const sorted = filteredReservations.slice().sort((a, b) => {
            const tA = parseOrderDate(a).getTime();
            const tB = parseOrderDate(b).getTime();
            return tB - tA;
          });
          const displayRows = sorted.slice(0, 5);

          if (displayRows.length === 0) {
            recentTbody.innerHTML = `
              <tr>
                <td colspan="6" class="py-8 text-center text-gray-500 dark:text-gray-400 text-xs font-medium">
                  No reservation records found for this period.
                </td>
              </tr>
            `;
          } else {
            recentTbody.innerHTML = displayRows.map(order => {
              const customerName = order.fullName || order.customerName || order.userName || 'Customer';
              const itemsText = (order.items || [])
                .map(i => `${i.product?.name || i.name || i.productName || 'Rice'} (${i.quantity || 1}s)`)
                .join(', ');
              const formattedDate = parseOrderDate(order).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

              const rawStatus = String(order.status || '').toLowerCase().trim();
              const normStatus = rawStatus.replace(/[\s_]+/g, '-');

              const isCancelled = (
                normStatus === 'cancelled' ||
                normStatus === 'rejected' ||
                normStatus === 'expired' ||
                order.status === 'Cancelled' ||
                order.paymentStatus === 'rejected_expired' ||
                order.autoCancelledDueToRejectionDeadline === true
              );

              const isReuploadWaiting = !isCancelled && isReservationWaitingForReupload(order);

              const hasSubmittedProof = Boolean(
                (order.paymentProof && String(order.paymentProof).trim() !== '' && String(order.paymentProof) !== 'null') ||
                (order.paymentProofUrl && String(order.paymentProofUrl).trim() !== '') ||
                (order.paymentProofDataUrl && String(order.paymentProofDataUrl).trim() !== '') ||
                order.paymentUploadedAt ||
                order.referenceNumber
              );

              const isPaymentVerified = order.paymentVerified === true || 
                                        order.paymentStatus === 'verified' || 
                                        order.paymentStatus === 'paid' || 
                                        order.isVerifiedPayment === true || 
                                        order.paymentConfirmed === true;

              const isReady = !isCancelled && (
                normStatus === 'ready-for-processing' ||
                normStatus === 'ready' ||
                order.status === 'ready_for_processing' ||
                order.status === 'Ready for Processing' ||
                isPaymentVerified
              );

              const isPaymentVerification = !isCancelled && !isReady && (
                isReuploadWaiting ||
                normStatus === 'payment-verification' ||
                normStatus === 'pending-verification' ||
                order.status === 'payment_verification' ||
                order.status === 'Payment Verification' ||
                order.paymentStatus === 'pending_verification' ||
                order.paymentStatus === 'payment_verification' ||
                hasSubmittedProof
              );

              // Map effective status for badge/label display matching reservation section
              let displayStatus = order.status;
              if (isCancelled) {
                displayStatus = 'cancelled';
              } else if (isReady) {
                displayStatus = 'ready-for-processing';
              } else if (isPaymentVerification) {
                displayStatus = 'payment-verification';
              } else {
                displayStatus = 'waiting';
              }

              // Retrieve actual recorded payment amount from existing payment data
              let recordedPayment = 0;
              if (order.amountPaid !== undefined && order.amountPaid !== null && !isNaN(Number(order.amountPaid)) && Number(order.amountPaid) > 0) {
                recordedPayment = Number(order.amountPaid);
              } else if (order.depositAmount !== undefined && order.depositAmount !== null && !isNaN(Number(order.depositAmount)) && Number(order.depositAmount) > 0) {
                recordedPayment = Number(order.depositAmount);
              } else if (order.downPaymentAmount !== undefined && order.downPaymentAmount !== null && !isNaN(Number(order.downPaymentAmount)) && Number(order.downPaymentAmount) > 0) {
                recordedPayment = Number(order.downPaymentAmount);
              } else if (order.paidAmount !== undefined && order.paidAmount !== null && !isNaN(Number(order.paidAmount)) && Number(order.paidAmount) > 0) {
                recordedPayment = Number(order.paidAmount);
              }

              // Determine actual amount paid:
              // - Waiting for Stock + no payment made: Display ₱0.00
              // - Payment Verification + down payment submitted: Display actual recorded down payment amount
              // - Other reservations with recorded payments: Display actual recorded amount paid
              // - Never use calculated amount due as amount paid
              let depositVal = 0;
              if (isPaymentVerification) {
                depositVal = recordedPayment;
              } else if (isPaymentVerified || isReady) {
                depositVal = recordedPayment;
              } else if (isCancelled) {
                depositVal = isPaymentVerified ? recordedPayment : 0;
              } else {
                // Waiting for Stock
                depositVal = isPaymentVerified || hasSubmittedProof ? recordedPayment : 0;
              }

              return `
                <tr class="hover:bg-gray-50/70 dark:hover:bg-slate-800/50 transition-colors">
                  <td class="py-3 px-3.5 font-bold font-mono text-gray-900 dark:text-white text-xs">#${order.id}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-900 dark:text-gray-100 font-medium">${customerName}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-800 dark:text-gray-200 truncate max-w-[180px]">${itemsText || 'N/A'}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-900 dark:text-gray-100 font-semibold">₱${depositVal.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                  <td class="py-3 px-3.5 text-xs text-gray-600 dark:text-gray-400">${formattedDate}</td>
                  <td class="py-3 px-3.5 text-right">
                    <span class="px-2.5 py-1 rounded-full font-semibold text-xs tracking-wide ${getStatusBadgeClass(displayStatus)}">${getStatusLabel(displayStatus)}</span>
                  </td>
                </tr>
              `;
            }).join('');
          }
        }
      }

      // Sales Overview Custom Date Range Calendar states and bindings
      let currentCalDate = new Date();
      let selectedCalDate = null;
      let draftSalesStart = '';
      let draftSalesEnd = '';
      let salesPickingStep = 'start';

      function parseSalesYMDLocal(ymd) {
        if (!ymd) return null;
        const [y, m, d] = ymd.split('-').map(Number);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
      }

      function formatSalesYMDShort(ymd, includeYear = true) {
        const dt = parseSalesYMDLocal(ymd);
        if (!dt) return '';
        return dt.toLocaleDateString('en-US', includeYear
          ? { month: 'short', day: 'numeric', year: 'numeric' }
          : { month: 'short', day: 'numeric' }
        );
      }

      function formatSalesCompactRange(startYMD, endYMD) {
        const sDate = parseSalesYMDLocal(startYMD);
        const eDate = parseSalesYMDLocal(endYMD);
        if (!sDate || !eDate) return 'Custom Date Range';
        if (startYMD === endYMD) {
          return formatSalesYMDShort(startYMD, true);
        }
        const sameYear = sDate.getFullYear() === eDate.getFullYear();
        const sPart = formatSalesYMDShort(startYMD, !sameYear);
        const ePart = formatSalesYMDShort(endYMD, true);
        return `${sPart} – ${ePart}`;
      }

      function updateSalesDatePickerButtonUI() {
        const pickerBtn = document.getElementById('btn-sales-date-picker');
        const pickerLabel = document.getElementById('sales-date-picker-label');
        const filterRangeEl = document.getElementById('sel-chart-range');

        const isCustomActive = Boolean(
          selectedSalesDate ||
          (timeRange === 'custom' && salesCustomStart && salesCustomEnd)
        );

        if (isCustomActive) {
          let formatted = 'Custom Date Range';
          if (salesCustomStart && salesCustomEnd) {
            formatted = formatSalesCompactRange(salesCustomStart, salesCustomEnd);
          } else if (selectedSalesDate) {
            formatted = selectedSalesDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          }
          if (pickerLabel) pickerLabel.textContent = formatted;
          if (pickerBtn) {
            pickerBtn.classList.remove('ia-date-btn-default');
            pickerBtn.classList.add('ia-date-btn-active');
          }
          if (filterRangeEl) filterRangeEl.value = 'custom';
        } else {
          if (pickerLabel) pickerLabel.textContent = 'Custom Date Range';
          if (pickerBtn) {
            pickerBtn.classList.remove('ia-date-btn-active');
            pickerBtn.classList.add('ia-date-btn-default');
          }
          if (filterRangeEl && (filterRangeEl.value === 'selected_date' || filterRangeEl.value === 'custom')) {
            filterRangeEl.value = (timeRange && timeRange !== 'custom') ? timeRange : 'all';
          }
        }
      }

      function drawDashboardCalendar() {
        const year = currentCalDate.getFullYear();
        const month = currentCalDate.getMonth();

        const calMonthYear = document.getElementById('cal-month-year');
        const calDaysGrid = document.getElementById('cal-days-grid');
        const salesStartSlot = document.getElementById('sales-cal-start-slot');
        const salesEndSlot = document.getElementById('sales-cal-end-slot');
        const salesStartDisplay = document.getElementById('sales-cal-start-display');
        const salesEndDisplay = document.getElementById('sales-cal-end-display');
        const salesStepHint = document.getElementById('sales-cal-step-hint');
        if (!calMonthYear || !calDaysGrid) return;

        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        calMonthYear.textContent = `${months[month]} ${year}`;

        if (salesStartDisplay) {
          salesStartDisplay.textContent = draftSalesStart ? formatSalesYMDShort(draftSalesStart, true) : 'Select start';
        }
        if (salesEndDisplay) {
          salesEndDisplay.textContent = draftSalesEnd ? formatSalesYMDShort(draftSalesEnd, true) : 'Select end';
        }
        if (salesStartSlot && salesEndSlot) {
          if (salesPickingStep === 'start') {
            salesStartSlot.classList.add('ia-slot-active');
            salesEndSlot.classList.remove('ia-slot-active');
          } else {
            salesStartSlot.classList.remove('ia-slot-active');
            salesEndSlot.classList.add('ia-slot-active');
          }
        }
        if (salesStepHint) {
          if (!draftSalesStart) {
            salesStepHint.textContent = 'Step 1: Select a Start Date on the calendar';
          } else if (!draftSalesEnd) {
            salesStepHint.textContent = 'Step 2: Select an End Date (or click Apply for 1 day)';
          } else {
            salesStepHint.textContent = `${formatSalesCompactRange(draftSalesStart, draftSalesEnd)} selected`;
          }
        }

        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const prevTotalDays = new Date(year, month, 0).getDate();

        let daysHtml = '';
        for (let i = firstDayIndex; i > 0; i--) {
          daysHtml += `<div class="ia-cal-filler p-1.5 font-semibold select-none text-xs flex items-center justify-center min-h-[36px]">${prevTotalDays - i + 1}</div>`;
        }

        const today = new Date();
        for (let day = 1; day <= totalDays; day++) {
          const ymd = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
          const isStart = draftSalesStart === ymd;
          const isEnd = draftSalesEnd === ymd;
          const isInRange = Boolean(draftSalesStart && draftSalesEnd && ymd > draftSalesStart && ymd < draftSalesEnd);

          let cellClass = 'ia-cal-day-default p-1 rounded-lg cursor-pointer transition-colors select-none text-xs font-bold relative flex flex-col items-center justify-center min-h-[36px]';
          if (isToday && !isStart && !isEnd && !isInRange) {
            cellClass += ' border border-[#1E6C02] dark:border-emerald-400';
          }
          if (isInRange) {
            cellClass = 'ia-cal-day-inrange p-1 rounded-lg cursor-pointer transition-colors select-none text-xs font-extrabold relative flex flex-col items-center justify-center min-h-[36px]';
          }
          if (isStart || isEnd) {
            cellClass = 'ia-cal-day-endpoint p-1 rounded-lg cursor-pointer transition-colors select-none text-xs font-black relative flex flex-col items-center justify-center min-h-[36px] shadow-2xs';
          }

          let subTag = '';
          if (isStart && isEnd) {
            subTag = `<span class="text-[9px] font-extrabold uppercase leading-none mt-0.5">1 Day</span>`;
          } else if (isStart) {
            subTag = `<span class="text-[9px] font-extrabold uppercase leading-none mt-0.5">Start</span>`;
          } else if (isEnd) {
            subTag = `<span class="text-[9px] font-extrabold uppercase leading-none mt-0.5">End</span>`;
          }

          daysHtml += `<div class="${cellClass}" data-sales-ymd="${ymd}"><span>${day}</span>${subTag}</div>`;
        }

        calDaysGrid.innerHTML = daysHtml;

        calDaysGrid.querySelectorAll('[data-sales-ymd]').forEach(cell => {
          cell.addEventListener('click', (e) => {
            e.stopPropagation();
            const clickedYMD = cell.getAttribute('data-sales-ymd');
            if (!clickedYMD) return;

            if (salesPickingStep === 'start' || !draftSalesStart || (draftSalesStart && draftSalesEnd)) {
              draftSalesStart = clickedYMD;
              draftSalesEnd = '';
              salesPickingStep = 'end';
            } else {
              if (clickedYMD < draftSalesStart) {
                draftSalesEnd = draftSalesStart;
                draftSalesStart = clickedYMD;
              } else {
                draftSalesEnd = clickedYMD;
              }
              salesPickingStep = 'start';
            }
            drawDashboardCalendar();
          });
        });
      }

      function openSalesRangeCalendar() {
        const calPopover = document.getElementById('sales-calendar-popover');
        if (!calPopover) return;
        draftSalesStart = salesCustomStart || '';
        draftSalesEnd = salesCustomEnd || '';
        salesPickingStep = (!draftSalesStart || (draftSalesStart && draftSalesEnd)) ? 'start' : 'end';
        const refDate = parseSalesYMDLocal(draftSalesStart) || selectedSalesDate || new Date();
        currentCalDate = new Date(refDate.getFullYear(), refDate.getMonth(), 1);
        drawDashboardCalendar();
        calPopover.classList.remove('hidden');
      }

      function closeSalesRangeCalendar(restoreSelectIfUnset = false) {
        const calPopover = document.getElementById('sales-calendar-popover');
        const filterRangeEl = document.getElementById('sel-chart-range');
        if (calPopover) calPopover.classList.add('hidden');
        if (restoreSelectIfUnset && filterRangeEl && filterRangeEl.value === 'custom' && (!salesCustomStart || !salesCustomEnd) && !selectedSalesDate) {
          filterRangeEl.value = (timeRange && timeRange !== 'custom') ? timeRange : 'all';
        }
      }

      function bindCalendarControls() {
        const prevBtn = document.getElementById('btn-cal-prev');
        const nextBtn = document.getElementById('btn-cal-next');
        const datePickerBtn = document.getElementById('btn-sales-date-picker');
        const calPopover = document.getElementById('sales-calendar-popover');
        const datePickerWrapper = document.getElementById('sales-date-picker-wrapper');
        const salesStartSlot = document.getElementById('sales-cal-start-slot');
        const salesEndSlot = document.getElementById('sales-cal-end-slot');
        const btnCloseSalesCal = document.getElementById('btn-close-sales-cal');
        const btnCancelSalesCustom = document.getElementById('btn-cancel-sales-custom');
        const btnApplySalesCustom = document.getElementById('btn-apply-sales-custom');
        const filterRangeEl = document.getElementById('sel-chart-range');

        if (datePickerBtn && calPopover) {
          datePickerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!calPopover.classList.contains('hidden')) {
              closeSalesRangeCalendar(true);
            } else {
              openSalesRangeCalendar();
            }
          });
        }

        if (salesStartSlot) {
          salesStartSlot.addEventListener('click', (e) => {
            e.stopPropagation();
            salesPickingStep = 'start';
            drawDashboardCalendar();
          });
        }

        if (salesEndSlot) {
          salesEndSlot.addEventListener('click', (e) => {
            e.stopPropagation();
            if (draftSalesStart) {
              salesPickingStep = 'end';
              drawDashboardCalendar();
            }
          });
        }

        if (prevBtn) {
          prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentCalDate.setMonth(currentCalDate.getMonth() - 1);
            drawDashboardCalendar();
          });
        }
        if (nextBtn) {
          nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentCalDate.setMonth(currentCalDate.getMonth() + 1);
            drawDashboardCalendar();
          });
        }

        if (btnCloseSalesCal) {
          btnCloseSalesCal.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSalesRangeCalendar(true);
          });
        }

        if (btnCancelSalesCustom) {
          btnCancelSalesCustom.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSalesRangeCalendar(true);
          });
        }

        if (btnApplySalesCustom) {
          btnApplySalesCustom.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            let sVal = draftSalesStart ? draftSalesStart.trim() : '';
            let eVal = draftSalesEnd ? draftSalesEnd.trim() : '';

            if (!sVal && !eVal) {
              if (typeof showToast === 'function') showToast('Please select a date or date range', 'error');
              return;
            }
            if (sVal && !eVal) eVal = sVal;
            else if (!sVal && eVal) sVal = eVal;

            if (sVal > eVal) {
              const tmp = sVal;
              sVal = eVal;
              eVal = tmp;
            }

            salesCustomStart = sVal;
            salesCustomEnd = eVal;
            timeRange = 'custom';
            hasUserAppliedFilter = true;

            if (sVal === eVal) {
              const singleDt = parseSalesYMDLocal(sVal);
              selectedCalDate = singleDt;
              selectedSalesDate = singleDt;
            } else {
              selectedCalDate = null;
              selectedSalesDate = null;
            }

            if (filterRangeEl) filterRangeEl.value = 'custom';
            updateSalesDatePickerButtonUI();
            closeSalesRangeCalendar(false);
            drawPerformanceCharts();
            if (typeof showToast === 'function') {
              showToast(`Sales Overview filtered to ${formatSalesCompactRange(sVal, eVal)}`);
            }
          });
        }

        document.addEventListener('click', (e) => {
          if (calPopover && !calPopover.classList.contains('hidden')) {
            if (datePickerWrapper && !datePickerWrapper.contains(e.target) && e.target !== filterRangeEl) {
              closeSalesRangeCalendar(true);
            }
          }
        });
      }

      // Render calendar immediately
      updateSalesDatePickerButtonUI();
      drawDashboardCalendar();
      bindCalendarControls();

      // Bind chart filters
      const filterRange = document.getElementById('sel-chart-range');
      const filterProduct = document.getElementById('sel-chart-product');
      const resetBtn = document.getElementById('btn-reset-filters');

      if (filterRange) {
        filterRange.addEventListener('change', () => {
          if (filterRange.value === 'selected_date') return;
          if (filterRange.value === 'custom') {
            openSalesRangeCalendar();
            return;
          }
          selectedSalesDate = null;
          selectedCalDate = null;
          salesCustomStart = '';
          salesCustomEnd = '';
          timeRange = filterRange.value;
          hasUserAppliedFilter = (timeRange !== 'all' || productFilter !== 'all');
          updateSalesDatePickerButtonUI();
          closeSalesRangeCalendar(false);
          drawPerformanceCharts();
        });
      }

      if (filterProduct) {
        filterProduct.addEventListener('change', () => {
          productFilter = filterProduct.value;
          hasUserAppliedFilter = Boolean(selectedSalesDate || timeRange !== 'all' || productFilter !== 'all');
          drawPerformanceCharts();
        });
      }

      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          selectedSalesDate = null;
          selectedCalDate = null;
          salesCustomStart = '';
          salesCustomEnd = '';
          draftSalesStart = '';
          draftSalesEnd = '';
          currentCalDate = new Date();
          timeRange = 'all';
          productFilter = 'all';
          hasUserAppliedFilter = false;
          if (filterRange) filterRange.value = 'all';
          if (filterProduct) filterProduct.value = 'all';
          updateSalesDatePickerButtonUI();
          closeSalesRangeCalendar(false);
          drawPerformanceCharts();
        });
      }

      // Bind inventory analytics filters & custom date-range calendar popover
      const filterInvRange = document.getElementById('sel-inv-range');
      const filterInvProduct = document.getElementById('sel-inv-product');
      const resetInvBtn = document.getElementById('btn-reset-inv-filters');
      const invCustomContainer = document.getElementById('inv-custom-date-container');
      const btnInvCustomRange = document.getElementById('btn-inv-custom-range');
      const invCustomRangeLabel = document.getElementById('inv-custom-range-label');
      const invCalPopover = document.getElementById('inv-calendar-popover');
      const btnCloseInvCal = document.getElementById('btn-close-inv-cal');
      const btnCancelInvCustom = document.getElementById('btn-cancel-inv-custom');
      const btnApplyInvCustom = document.getElementById('btn-apply-inv-custom');
      const btnInvCalPrev = document.getElementById('btn-inv-cal-prev');
      const btnInvCalNext = document.getElementById('btn-inv-cal-next');
      const invCalMonthYear = document.getElementById('inv-cal-month-year');
      const invCalDaysGrid = document.getElementById('inv-cal-days-grid');
      const invCalStartSlot = document.getElementById('inv-cal-start-slot');
      const invCalEndSlot = document.getElementById('inv-cal-end-slot');
      const invCalStartDisplay = document.getElementById('inv-cal-start-display');
      const invCalEndDisplay = document.getElementById('inv-cal-end-display');
      const invCalStepHint = document.getElementById('inv-cal-step-hint');

      let invCalViewDate = new Date();
      let draftInvStart = '';
      let draftInvEnd = '';
      let invPickingStep = 'start'; // 'start' | 'end'

      function parseYMDLocal(ymd) {
        if (!ymd) return null;
        const [y, m, d] = ymd.split('-').map(Number);
        if (!y || !m || !d) return null;
        return new Date(y, m - 1, d);
      }

      function formatYMDReadableShort(ymd, includeYear = true) {
        const dt = parseYMDLocal(ymd);
        if (!dt) return '';
        return dt.toLocaleDateString('en-US', includeYear
          ? { month: 'short', day: 'numeric', year: 'numeric' }
          : { month: 'short', day: 'numeric' }
        );
      }

      function formatCompactCustomRangeLabel(startYMD, endYMD) {
        const sDate = parseYMDLocal(startYMD);
        const eDate = parseYMDLocal(endYMD);

          rawSection = sessionStorage.getItem('aurora_last_dashboard_section');
          if (rawSection) {
            sessionStorage.removeItem('aurora_last_dashboard_section');
          }
        } catch (err) {
          console.warn('[NAV] Could not read sessionStorage:', err);
        }

        if (!rawSection) {
          const urlParams = new URLSearchParams(window.location.search);
          const qParam = urlParams.get('section') || urlParams.get('from');
          if (qParam) {
            rawSection = qParam;
          } else if (window.location.hash) {
            rawSection = window.location.hash.replace(/^#/, '');
          }
        }

        // If no previous Dashboard section is stored, do not invent one.
        if (!rawSection) {
          return;
        }

        const targetId = DASHBOARD_SECTION_ALIASES[rawSection] || rawSection;

        function performScroll(smooth = true) {
          const targetEl = document.getElementById(targetId);
          if (!targetEl) return false;

          const scrollContainer = document.getElementById('admin-main-content');
          if (scrollContainer) {
            const containerRect = scrollContainer.getBoundingClientRect();
            const targetRect = targetEl.getBoundingClientRect();
            const relativeTop = targetRect.top - containerRect.top + scrollContainer.scrollTop;
            const targetScrollTop = Math.max(0, relativeTop - 24);

            scrollContainer.scrollTo({
              top: targetScrollTop,
              behavior: smooth ? 'smooth' : 'auto'
            });
          }

          try {
            targetEl.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          } catch (_) {}

          return true;
        }

        // Run after initial DOM and charts render settle
        setTimeout(() => {
          if (!performScroll(true)) {
            setTimeout(() => performScroll(true), 250);
          }
        }, 120);
      }

      // Make the four dashboard preview cards open their matching detail pages.
      const dashboardPreviewCards = [
        'dash-kpi-total-orders',
        'dash-kpi-total-reservations',
        'dash-kpi-total-sales',
        'dash-kpi-available-stock',
        'sales-overview-section',
        'order-summary-section',
        'inventory-analytics-section',
        'stock-replenishment-guide-section'
      ];
      dashboardPreviewCards.forEach((cardId) => {
        const card = document.getElementById(cardId);
        if (!card) return;
        const openCardPage = () => {
          const destination = card.getAttribute('data-dashboard-href');
          if (!destination) return;
          rememberDashboardOrigin(cardId);
          // Resolve within the current admin folder so dashboard cards keep working
          // regardless of the app's deployment base path.
          const targetUrl = new URL(destination, window.location.href);
          window.location.assign(targetUrl.href);
        };
        card.addEventListener('click', (event) => {
          // Keep any links or controls inside the card working normally.
          if (event.target.closest('a, button, input, select, textarea, [role="button"]')) return;
          openCardPage();
        });
        card.addEventListener('keydown', (event) => {
          if (event.target !== card) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            openCardPage();
          }
        });
      });

      // Track all link clicks originating from Dashboard sections
      targetSpace.addEventListener('click', (e) => {
        const link = e.target.closest('a');
        if (!link) return;

        const section = link.closest(
          '#sales-overview-section, #order-summary-section, #inventory-health-section, ' +
          '#stock-replenishment-guide-section, #inventory-analytics-section, ' +
          '#dash-kpi-total-orders, #dash-kpi-active-reservations, #dash-kpi-total-reservations, #dash-kpi-total-sales, #dash-kpi-available-stock, #dash-kpi-top-product, ' +
          '#top-kpi-cards-section, #recent-orders-section'
        );

        if (section && section.id) {
          rememberDashboardOrigin(section.id);
        }
      }, true);

      // Explicit bindings for standard View More buttons
      const sectionButtonMap = [
        { btnId: 'btn-view-sales-overview', sectionId: 'sales-overview-section' },
        { btnId: 'btn-view-order-summary', sectionId: 'order-summary-section' },
        { btnId: 'btn-view-inventory-health', sectionId: 'inventory-health-section' },
        { btnId: 'dash-healthy-stock-btn', sectionId: 'inventory-health-section' },
        { btnId: 'dash-low-stock-btn', sectionId: 'inventory-health-section' },
        { btnId: 'dash-out-stock-btn', sectionId: 'inventory-health-section' },
        { btnId: 'btn-view-stock-replenishment', sectionId: 'stock-replenishment-guide-section' },
        { btnId: 'btn-view-inventory-analytics', sectionId: 'inventory-analytics-section' },
        { btnId: 'btn-view-total-orders', sectionId: 'dash-kpi-total-orders' },
        { btnId: 'btn-view-active-reservations', sectionId: 'dash-kpi-total-reservations' },
        { btnId: 'btn-view-total-reservations', sectionId: 'dash-kpi-total-reservations' },
        { btnId: 'btn-view-total-sales', sectionId: 'dash-kpi-total-sales' },
        { btnId: 'btn-view-available-stock', sectionId: 'dash-kpi-available-stock' },
        { btnId: 'btn-view-top-product', sectionId: 'dash-kpi-top-product' },
        { btnId: 'btn-view-all-orders', sectionId: 'recent-orders-section' },
      ];

      sectionButtonMap.forEach(({ btnId, sectionId }) => {
        const btn = document.getElementById(btnId);
        if (btn) {
          btn.addEventListener('click', () => {
            rememberDashboardOrigin(sectionId);
          });
        }
      });

      // Initial dashboard layout render and sync setup
      refreshDashboard();

      // Restore scroll to originating dashboard section if returning from a detail page
      restoreDashboardScrollSection();

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          restoreDashboardScrollSection();
        }
      });

      window.addEventListener('aurora-sync-event', refreshDashboard);
      window.addEventListener('aurora-orders-updated', refreshDashboard);
      window.addEventListener('storage', refreshDashboard);
    });
  </script>
</body>
</html>
