    /* 1. Base typography */
    body,
    #admin-layout-container,
    #admin-main-content {
      font-family: 'Source Sans 3', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;

      -moz-osx-font-smoothing: grayscale;

    /* 2. Primary Font: Inter */
    #admin-layout-container h1,
    #admin-layout-container h2,
    #admin-layout-container h3,
    #admin-layout-container h4,
    #admin-layout-container h5,
    #admin-main-content h1,
    #admin-main-content h2,
    #admin-main-content h3,
    #admin-main-content h4,
    #admin-main-content h5,
    .srg-title-inter,
    table thead th,
    table thead th *,
    button,
    .srg-back-btn,
    .srg-card-num,
    .srg-stock-num,
    .srg-num-primary,
    .srg-num-critical,
    .srg-num-warning,
    .srg-num-healthy,
    #srg-period-badge-text,
    .srg-badge-critical,
    .srg-badge-warning,
    .srg-badge-healthy,
    .srg-badge-neutral {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }

    label,
    select,
    .srg-text-sub,

    function parseOrderDate(order) {
      if (!order) return new Date(0);

      function parseRawDateValue(val) {
        if (!val) return null;
        if (val instanceof Date) {
          return !isNaN(val.getTime()) ? val : null;
        }
        if (typeof val === 'object') {
          if (typeof val.toDate === 'function') {
            const d = val.toDate();
            return (d instanceof Date && !isNaN(d.getTime())) ? d : null;
          }
          if (typeof val.seconds === 'number') {
            const d = new Date(val.seconds * 1000);
            return !isNaN(d.getTime()) ? d : null;
          }
        }
        if (typeof val === 'string') {
          const trimmed = val.trim();
          const dateOnlyMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(trimmed);
          if (dateOnlyMatch) {
            const yr = parseInt(dateOnlyMatch[1], 10);
            const mo = parseInt(dateOnlyMatch[2], 10) - 1;
            const da = parseInt(dateOnlyMatch[3], 10);
            const localDate = new Date(yr, mo, da, 0, 0, 0, 0);
            if (!isNaN(localDate.getTime())) return localDate;
          }
        }
        const d = new Date(val);
        return !isNaN(d.getTime()) ? d : null;
      }

      const candidates = [
        order.completedAt,
        order.completionDate,
        order.completedDate,
        order.deliveredAt,
        order.deliveredDate,
        order.createdAt,
        order.dateCreated,
        order.createdDate,
        order.date,
        order.timestamp
      ];

      for (let i = 0; i < candidates.length; i++) {
        const parsed = parseRawDateValue(candidates[i]);
        if (parsed) return parsed;
      }

      if (order.statusHistory && Array.isArray(order.statusHistory) && order.statusHistory.length > 0) {
        for (let i = 0; i < order.statusHistory.length; i++) {
          const parsed = parseRawDateValue(order.statusHistory[i]?.changedAt);
          if (parsed) return parsed;
        }
      }
      return new Date(0);
    }

      `;

      function formatYMD(d) {
        const yr = d.getFullYear();
        const mo = String(d.getMonth() + 1).padStart(2, '0');
        const da = String(d.getDate()).padStart(2, '0');
        return `${yr}-${mo}-${da}`;
      }

      function formatYMDReadableShort(ymdStr, includeYear = true) {
        if (!ymdStr) return '';
        const parts = ymdStr.split('-');
        if (parts.length !== 3) return ymdStr;
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const mIdx = Number(parts[1]) - 1;
        const day = Number(parts[2]);
        const year = parts[0];
        return includeYear ? `${months[mIdx]} ${day}, ${year}` : `${months[mIdx]} ${day}`;
      }

      function formatCompactCustomRangeLabel(sStr, eStr) {
        if (!sStr || !eStr) return 'Custom Date Range';
        return `${formatYMDReadableShort(sStr, true)} - ${formatYMDReadableShort(eStr, true)}`;
      }

      function getReplenishmentPeriodRange() {
        const now = new Date();
        let coverageDays = 30;
        let periodLabel = 'Needed for 30 Days';
        let periodName = '30 Days';
        let periodBadgeText = 'Needed for 30 Days';
        let periodShortTag = '30d';

        if (replenishPeriod === '7d') {
          coverageDays = 7;
          periodLabel = 'Needed for 7 Days';
          periodName = '7 Days';
          periodBadgeText = 'Needed for 7 Days';
          periodShortTag = '7d';
        } else if (replenishPeriod === '3m') {
          coverageDays = 90;
          periodLabel = 'Needed for 3 Months';
          periodName = '3 Months';
          periodBadgeText = 'Needed for 3 Months';
          periodShortTag = '3m';
        } else if (replenishPeriod === '6m') {
          coverageDays = 180;
          periodLabel = 'Needed for 6 Months';
          periodName = '6 Months';
          periodBadgeText = 'Needed for 6 Months';
          periodShortTag = '6m';
        } else if (replenishPeriod === '1y') {
          coverageDays = 365;
          periodLabel = 'Needed for 1 Year';
          periodName = '1 Year';
          periodBadgeText = 'Needed for 1 Year';
          periodShortTag = '1y';
        } else if (replenishPeriod === 'custom') {
          const sVal = replenishCustomStart;
          const eVal = replenishCustomEnd;
          if (sVal && eVal) {
            const [sY, sM, sD] = sVal.split('-').map(Number);
            const [eY, eM, eD] = eVal.split('-').map(Number);
            const dStart = new Date(sY, sM - 1, sD);
            const dEnd = new Date(eY, eM - 1, eD);
            const diffMs = dEnd.getTime() - dStart.getTime();
            const elapsedDays = Math.max(1, Math.round(diffMs / (1000 * 60 * 60 * 24)));
            coverageDays = elapsedDays;
            periodLabel = `Needed for ${elapsedDays} Day${elapsedDays === 1 ? '' : 's'}`;
            periodName = `${elapsedDays} Day${elapsedDays === 1 ? '' : 's'}`;
            periodBadgeText = `Needed for ${elapsedDays} Day${elapsedDays === 1 ? '' : 's'} (${formatCompactCustomRangeLabel(sVal, eVal)})`;
            periodShortTag = 'Custom';
          }
        }

        // Verified historical sales baseline: past 30 days
        const baselineDays = 30;
        const baselineEndDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);
        const baselineStartDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 29, 0, 0, 0, 0);

        return {
          coverageDays,
          baselineDays,
          baselineStartDate,
          baselineEndDate,
          periodLabel,
          periodName,
          periodBadgeText,
          periodShortTag
        };
      }

      function renderStockReplenishmentGuide() {
        const tbody = document.getElementById('replenish-guide-tbody');
        if (!tbody) return;

        const periodInfo = getReplenishmentPeriodRange();
        const { coverageDays, baselineDays, baselineStartDate, baselineEndDate, periodLabel, periodName, periodBadgeText, periodShortTag } = periodInfo;

        const badgeEl = document.getElementById('srg-period-badge-text');
        if (badgeEl) badgeEl.textContent = periodBadgeText;

        const subtitleEl = document.getElementById('srg-subtitle-text');
        if (subtitleEl) {
          subtitleEl.textContent = `Estimated stock needed for ${periodName.toLowerCase()} based on sales history and current stock.`;
        }

        const needHeaderEl = document.getElementById('srg-col-need-header');
        if (needHeaderEl) needHeaderEl.textContent = periodLabel;

        const noSalesCardLabel = document.getElementById('srg-card-nosales-label');
        if (noSalesCardLabel) noSalesCardLabel.textContent = 'No Recent Sales';

        const noSalesCardSub = document.getElementById('srg-card-nosales-sub');
        if (noSalesCardSub) noSalesCardSub.textContent = 'No sales in past 30 days';

        const optNoSales = document.getElementById('opt-replenish-nosales');
        if (optNoSales) optNoSales.textContent = '⚪ No Recent Sales';

        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p => !p.isArchived && !p.archived);

        const liveOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];

        // Filter verified customer sales orders strictly within the 30-day historical baseline
        // Excludes cancellations, rejections, replacements, and reservation orders
        const verifiedBaselineSales = liveOrders.filter(o => {
          if (!o || o.isReplacement) return false;
          if (isCancelledOrRejectedOrder(o)) return false;
          if (isReservationOrder(o)) return false;
          const info = getVerifiedCustomerPaymentInfo(o);
          if (!info || !info.isVerified) return false;
          const oDate = parseOrderDate(o);
          return oDate >= baselineStartDate && oDate <= baselineEndDate;
        });

        // Compute verified sales volume per active product within 30-day baseline
        const baselineSalesMap = {};
        verifiedBaselineSales.forEach(order => {
          (order.items || []).forEach(item => {
            if (!item || item.isReservation) return;
            const qty = Number(item.quantity || 0);
            if (qty <= 0) return;

            const rawProdId = item.product?.id ?? item.productId ?? null;
            let candidateId = (rawProdId !== null && rawProdId !== undefined && rawProdId !== '' && rawProdId !== 'undefined' && rawProdId !== 'null' && rawProdId !== '[object Object]')
              ? String(rawProdId).trim()
              : null;

            if (!candidateId && item.id && productsList.some(p => String(p.id).trim() === String(item.id).trim())) {
              candidateId = String(item.id).trim();
            }

            let matched = null;
            if (candidateId) {
              matched = activeProducts.find(p => String(p.id).trim() === candidateId);
              if (!matched && productsList.some(p => String(p.id).trim() === candidateId)) {
                return;
              }
            }

            if (!matched) {
              const rawItemName = item.product?.name ?? item.productName ?? (typeof item.product === 'string' ? item.product : '') ?? item.name ?? '';
              const normItemName = String(rawItemName).trim().toLowerCase();
              if (normItemName) {
                matched = activeProducts.find(p => String(p.name || '').trim().toLowerCase() === normItemName);
              }
            }

            if (matched) {
              baselineSalesMap[matched.id] = (baselineSalesMap[matched.id] || 0) + qty;
            }
          });
        });

        // Build data structure for each active product using daily sales velocity projected over coverage days
        const rows = activeProducts.map(p => {
          const currentStock = p.currentStock !== undefined ? Math.max(0, Number(p.currentStock)) : Math.max(0, Number(p.stock || 0));
          const reservedStock = p.reservedStock !== undefined ? Math.max(0, Number(p.reservedStock)) : 0;
          const availableStock = p.availableStock !== undefined ? Math.max(0, Number(p.availableStock)) : Math.max(0, currentStock - reservedStock);

          const baselineSales = baselineSalesMap[p.id] || 0;
          const dailySalesRate = baselineSales / baselineDays;
          // Estimated stock need for coverage period, rounded UP to whole sacks
          const estimatedNeed = Math.ceil(dailySalesRate * coverageDays);

          const periodDemand = estimatedNeed;
          const waitingReservations = reservedStock;
          const totalDemand = periodDemand + waitingReservations;

          let recommendation = '';
          let badgeClass = '';
          let dotClass = '';
          let explanation = '';
          let rank = 4; // 1=Need More Stock, 2=Prepare More Soon, 3=No Recent Sales, 4=Stock Is Enough

          if (totalDemand === 0) {
            if (availableStock <= 0) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = 'Out of stock for new orders.';
              rank = 1;
            } else {
              recommendation = 'No Recent Sales';
              badgeClass = 'srg-badge-neutral';
              dotClass = 'bg-slate-400 dark:bg-slate-400';
              explanation = `No recent sales or active reservations recorded (${availableStock} sack${availableStock > 1 ? 's' : ''} available for new orders).`;
              rank = 3;
            }
          } else {
            if (availableStock <= 0) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              explanation = `Out of stock for new orders (${waitingReservations > 0 ? waitingReservations + ' sack' + (waitingReservations > 1 ? 's' : '') + ' waiting allocation' : 'estimated need is ' + periodDemand + ' sacks'}).`;
              rank = 1;
            } else if (availableStock < totalDemand) {
              recommendation = 'Need More Stock';
              badgeClass = 'srg-badge-critical';
              dotClass = 'bg-red-500 shadow-[0_0_6px_rgba(239,68,68,0.7)]';
              const detail = waitingReservations > 0 && periodDemand > 0
                ? `: ${periodDemand} needed + ${waitingReservations} reserved`
                : (waitingReservations > 0 ? `: ${waitingReservations} reserved` : '');
              explanation = `Available stock (${availableStock} sacks) cannot cover total need (${totalDemand} sacks${detail}). Need more stock.`;
              rank = 1;
            } else if (availableStock < Math.ceil(totalDemand * 1.5)) {
              recommendation = 'Prepare More Soon';
              badgeClass = 'srg-badge-warning';
              dotClass = 'bg-amber-500 shadow-[0_0_6px_rgba(245,158,11,0.7)]';
              const detail = waitingReservations > 0 && periodDemand > 0
                ? `: ${periodDemand} needed + ${waitingReservations} reserved`
                : (waitingReservations > 0 ? `: ${waitingReservations} reserved` : '');
              explanation = `Available stock (${availableStock} sacks) is getting low compared to total need (${totalDemand} sacks${detail}). Low Stock Warning: prepare more soon.`;
              rank = 2;
            } else {
              recommendation = 'Stock Is Enough';
              badgeClass = 'srg-badge-healthy';
              dotClass = 'bg-emerald-500 shadow-[0_0_6px_rgba(16,185,129,0.7)]';
              const detail = waitingReservations > 0 && periodDemand > 0
                ? `: ${periodDemand} needed + ${waitingReservations} reserved`
                : (waitingReservations > 0 ? `: ${waitingReservations} reserved` : '');
              explanation = `Available stock (${availableStock} sacks) has enough extra stock to cover total need (${totalDemand} sacks${detail}). Stock is enough for now.`;
              rank = 4;
            }
          }

          return {
            product: p,
            currentStock,
            reservedStock,
            availableStock,
            baselineSales,
            dailySalesRate,
            periodDemand,
            totalDemand,
            recommendation,
            badgeClass,
            dotClass,
            explanation,
            rank
          };
        });

        // Summary Counts
        const countNow = rows.filter(r => r.recommendation === 'Need More Stock').length;
        const countSoon = rows.filter(r => r.recommendation === 'Prepare More Soon').length;
        const countSufficient = rows.filter(r => r.recommendation === 'Stock Is Enough').length;
        const countInsufficient = rows.filter(r => r.rank === 3).length;

        const statNow = document.getElementById('replenish-stat-now');
        if (statNow) statNow.textContent = countNow;
        const statSoon = document.getElementById('replenish-stat-soon');
        if (statSoon) statSoon.textContent = countSoon;
        const statSufficient = document.getElementById('replenish-stat-sufficient');
        if (statSufficient) statSufficient.textContent = countSufficient;
        const statInsufficient = document.getElementById('replenish-stat-insufficient');
        if (statInsufficient) statInsufficient.textContent = countInsufficient;

        // Filter rows
        let filteredRows = rows;
        if (replenishFilter === 'replenish') {
          filteredRows = rows.filter(r => r.recommendation === 'Need More Stock');
        } else if (replenishFilter === 'prepare') {
          filteredRows = rows.filter(r => r.recommendation === 'Prepare More Soon');
        } else if (replenishFilter === 'sufficient') {
          filteredRows = rows.filter(r => r.recommendation === 'Stock Is Enough');
        } else if (replenishFilter === 'insufficient') {
          filteredRows = rows.filter(r => r.rank === 3);
        }

        // Sort by urgency rank (1 = Replenish Now, 2 = Prepare Soon, 3 = Insufficient/No Sales, 4 = Sufficient)
        // Secondary sort: available stock ascending
        filteredRows.sort((a, b) => {
          if (a.rank !== b.rank) return a.rank - b.rank;
          return a.availableStock - b.availableStock;
        });

        if (filteredRows.length === 0) {
          tbody.innerHTML = `
            <tr class="srg-row">
              <td colspan="6" class="srg-text-main py-12 px-4 text-center font-semibold text-sm">
                ${activeProducts.length === 0 ? 'No active rice varieties found in catalog.' : 'No rice varieties match the selected recommendation filter.'}
              </td>
            </tr>
          `;
          return;
        }

        const maxStockRef = Math.max(100, ...rows.map(item => Math.max(item.currentStock, item.availableStock, 1)));
        const maxDemandRef = Math.max(20, ...rows.map(item => Math.max(item.periodDemand, 1)));

        tbody.innerHTML = filteredRows.map(r => {
          const p = r.product;
          const pName = p.name || 'Rice Variety';
          const pType = p.type ? `${p.type} Rice` : '25kg sack';
          const rawImg = String(p.image || p.imageUrl || p.photoUrl || '').trim();
          const hasImg = rawImg.length > 0 && rawImg !== 'null' && rawImg !== 'undefined';

          const availNumClass = r.availableStock === 0 
            ? 'srg-num-critical font-black' 
            : (r.availableStock <= 10 || r.rank === 1 ? 'srg-num-warning font-extrabold' : 'srg-num-healthy font-extrabold');

          const availBarColor = r.availableStock === 0
            ? 'srg-bar-needstock'
            : (r.availableStock <= 10 || r.rank === 1 ? 'srg-bar-lowstock' : 'srg-bar-enough');

          const stockNowPct = r.currentStock > 0 ? Math.min(100, Math.max(8, Math.round((r.currentStock / maxStockRef) * 100))) : 0;
          const reservedPct = r.reservedStock > 0 ? Math.min(100, Math.max(10, Math.round((r.reservedStock / Math.max(r.currentStock, maxStockRef)) * 100))) : 0;
          const availPct = r.availableStock > 0 ? Math.min(100, Math.max(8, Math.round((r.availableStock / maxStockRef) * 100))) : 0;
          const demandPct = r.periodDemand > 0 ? Math.min(100, Math.max(10, Math.round((r.periodDemand / maxDemandRef) * 100))) : 0;

          return `
            <tr class="srg-row transition-colors">
              <td class="py-4 px-4 align-middle">
                <div class="flex items-center gap-3.5 min-w-[190px]">
                  <div class="srg-avatar w-11 h-11 rounded-full overflow-hidden shrink-0 flex items-center justify-center shadow-2xs relative">
                    ${hasImg ? `
                      <img src="${rawImg}" alt="${pName}" class="w-full h-full object-cover rounded-full" loading="lazy" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                      <span style="display:none;" class="srg-text-main w-full h-full items-center justify-center">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                      </span>
                    ` : `
                      <span class="srg-text-main w-full h-full flex items-center justify-center">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                      </span>
                    `}
                  </div>
                  <div class="min-w-0">
                    <div class="srg-product-name text-slate-900 dark:text-white leading-snug truncate">${pName}</div>
                    <div class="srg-variety-tag text-slate-800 dark:text-slate-100 mt-0.5">${pType}</div>
                  </div>
                </div>
              </td>
              <td class="py-4 px-3 text-center align-middle tabular-nums whitespace-nowrap">
                <span class="srg-stock-num font-semibold">${r.currentStock}</span>
                <span class="srg-unit-label ml-1">sacks</span>
              </td>
              <td class="py-4 px-3 text-center align-middle tabular-nums whitespace-nowrap">
                <span class="srg-stock-num font-semibold">${r.reservedStock > 0 ? r.reservedStock : 0}</span>
                <span class="srg-unit-label ml-1">sacks</span>
              </td>
              <td class="py-4 px-3 text-center align-middle tabular-nums whitespace-nowrap">
                <span class="srg-stock-num font-semibold">${r.availableStock}</span>
                <span class="srg-unit-label ml-1">sacks</span>
              </td>
              <td class="py-4 px-3 text-center align-middle tabular-nums whitespace-nowrap">
                <span class="srg-stock-num font-semibold">${r.periodDemand > 0 ? r.periodDemand : '—'}</span>

        // AI Prediction Intelligence Dynamic Updates for Relocated Section
        updateAiPredictionSection(aiSectionProductFilter);

      /**
       * Determines the most urgent rice variety based on actual live stock levels and active waiting reservations.
       * Priority:
       * 1. Varieties that are out of stock (0 sacks) and have active reservations.
       * 2. Other varieties with zero available stock (0 sacks).
       * 3. Queued reservations exceeding stock OR critically low stock (<= 20 sacks).
       * 4. Remaining varieties sorted ascending by stock level, with deterministic tie-break by name and ID.
       */
      function findMostUrgentStockVariety(activeProducts, productsList) {
        if (!Array.isArray(activeProducts) || activeProducts.length === 0) return null;

        // Fetch live canonical orders to check active pending reservations
        const allOrders = typeof getAllOrders === 'function' ? getAllOrders() : [];
        const terminalStatuses = ['cancelled', 'rejected', 'expired', 'completed', 'delivered', 'fulfilled'];

        const activeReservations = allOrders.filter(o => {
          if (!o) return false;
          const statusClean = String(o.status || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
          if (terminalStatuses.includes(statusClean)) return false;
          if (o.paymentStatus === 'rejected_expired') return false;
          return Boolean(
            o.isPreOrder ||
            statusClean === 'pre-order' ||
            statusClean === 'pending-reservation' ||
            String(o.id || '').toUpperCase().startsWith('RES') ||
            (Array.isArray(o.items) && o.items.some(it => it && it.isReservation))
          );
        });

        const scored = activeProducts.map(p => {
          const pId = String(p.id || '');
          const pName = (p.name || '').trim();

          // Canonical available sacks
          const sacks = p.availableStock !== undefined
            ? Math.max(0, Number(p.availableStock))
            : (p.stock !== undefined ? Math.max(0, Number(p.stock)) : 0);

          // Calculate reserved sacks in active waiting reservations
          let reservedSacks = 0;
          activeReservations.forEach(o => {
            (o.items || []).forEach(it => {
              const itId = String(it.productId || it.product?.id || it.id || '');
              const itName = (it.name || it.productName || it.product?.name || '').trim();
              const matches = (itId && itId === pId) ||
                (itName && itName.toLowerCase() === pName.toLowerCase());
              if (matches) {
                reservedSacks += Math.max(0, Number(it.quantity || 1));
              }
            });
          });

          // Priority Tiers based on actual stock concerns:
          // Tier 1: Out of stock (0 sacks) AND has active reservations
          // Tier 2: Zero available stock (0 sacks) without active reservations
          // Tier 3: Queued reservations exceed available stock
          // Tier 3.5: Critically low available stock (<= 20 sacks)
          // Tier 4: Low stock (< 50 sacks)
          // Tier 5: Adequate stock
          let tier = 5;
          if (sacks === 0 && reservedSacks > 0) {
            tier = 1;
          } else if (sacks === 0) {
            tier = 2;
          } else if (reservedSacks > 0 && sacks <= reservedSacks) {
            tier = 3;
          } else if (sacks > 0 && sacks <= 20) {
            tier = 3.5;
          } else if (sacks < 50) {
            tier = 4;
          }

          return {
            product: p,
            id: pId,
            name: pName,
            sacks,
            reservedSacks,
            tier
          };
        });

        // Deterministic sorting with consistent tie-break:
        // Tier ascending -> Reserved sacks descending -> Available sacks ascending -> Name alphabetical -> ID
        scored.sort((a, b) => {
          if (a.tier !== b.tier) return a.tier - b.tier;
          if (b.reservedSacks !== a.reservedSacks) return b.reservedSacks - a.reservedSacks;
          if (a.sacks !== b.sacks) return a.sacks - b.sacks;
          return a.name.localeCompare(b.name) || a.id.localeCompare(b.id);
        });

        return scored[0]?.product || activeProducts[0];
      }

      function populateAiSectionDropdown(activeProducts, selectedId) {
        const selAiProd = document.getElementById('sel-ai-stock-product');
        if (!selAiProd) return;

        let html = '';
        activeProducts.forEach(p => {
          const pId = String(p.id);
          const sacks = p.availableStock !== undefined
            ? Math.max(0, Number(p.availableStock))
            : (p.stock !== undefined ? Math.max(0, Number(p.stock)) : 0);

          let note = '';
          if (sacks === 0) note = ' — Out of Stock';
          else if (sacks <= 15) note = ` — ${sacks} sacks (Low)`;
          else note = ` — ${sacks} sacks`;

          const isSelected = String(pId) === String(selectedId) ? ' selected' : '';
          html += `<option value="${pId}"${isSelected}>${p.name}${note}</option>`;
        });

        selAiProd.innerHTML = html;
        if (selectedId) {
          selAiProd.value = String(selectedId);
        }
      }

      function updateAiPredictionSection(chosenVarietyId) {
        const productsList = typeof getProducts === 'function' ? getProducts() : [];
        const activeProducts = productsList.filter(p =>
          p && p.name && !p.isArchived && !p.archived && p.status !== 'archived'
        );

        let targetProduct = null;
        if (chosenVarietyId && chosenVarietyId !== 'all') {
          targetProduct = activeProducts.find(p => String(p.id) === String(chosenVarietyId)) ||
                          productsList.find(p => String(p.id) === String(chosenVarietyId));
        }

        // If no target product chosen, automatically evaluate most urgent stock concern
        if (!targetProduct) {
          targetProduct = findMostUrgentStockVariety(activeProducts, productsList);
        }

        const targetVarietyId = targetProduct ? String(targetProduct.id) : (activeProducts[0]?.id || '2');
        const targetVarietyName = targetProduct ? targetProduct.name : (activeProducts[0]?.name || 'Rice Variety');

        // Populate/sync the section's dropdown with live data
        populateAiSectionDropdown(activeProducts, targetVarietyId);

        const stockVarietyEl = document.getElementById('ai-stock-variety-tag');
        const stockWindowEl = document.getElementById('ai-stock-window');
        const stockStatusDescEl = document.getElementById('ai-stock-status-desc');
        const stockMethodEl = document.getElementById('ai-stock-method');
        const stockSampleCountEl = document.getElementById('ai-stock-sample-count');
        const stockPublicAvailEl = document.getElementById('ai-stock-public-avail');
        const stockDisclaimerEl = document.getElementById('ai-stock-disclaimer');

        const serviceLeadTimeEl = document.getElementById('ai-service-leadtime');
        const serviceFallbackNoteEl = document.getElementById('ai-service-fallback-note');
        const serviceDescEl = document.getElementById('ai-service-desc');
        const serviceMethodEl = document.getElementById('ai-service-method');
        const serviceSampleCountEl = document.getElementById('ai-service-sample-count');
        const serviceDisclaimerEl = document.getElementById('ai-service-disclaimer');

        if (stockVarietyEl) stockVarietyEl.textContent = targetVarietyName;

        if (typeof predictStockAvailability === 'function') {
          const stockPred = predictStockAvailability(targetVarietyId);
          if (stockWindowEl) stockWindowEl.textContent = stockPred.displayDate || 'Waiting for Restock';
          if (stockStatusDescEl) {
            if (stockPred.status === 'predicted') {
              stockStatusDescEl.textContent = `Expected restock window based on an average of ${stockPred.averageIntervalDays} days between past deliveries.`;
            } else {
              stockStatusDescEl.textContent = 'We need more past delivery records before we can estimate when new stock will arrive.';
            }
          }
          if (stockMethodEl) stockMethodEl.textContent = 'Past delivery dates';
          if (stockSampleCountEl) stockSampleCountEl.textContent = `${stockPred.observationCount} past deliveries (${stockPred.intervalCount} intervals)`;
          if (stockPublicAvailEl) stockPublicAvailEl.textContent = stockPred.publicAvailabilityStatus || 'First-come, first-served queue';
          if (stockDisclaimerEl) {
            if (stockPred.status === 'predicted' && stockPred.confidenceNote) {
              stockDisclaimerEl.textContent = stockPred.confidenceNote;
            } else {
              stockDisclaimerEl.textContent = 'Not enough past delivery records to estimate the next restock date yet.';
            }
          }
        }

        if (typeof predictServiceReadinessTime === 'function') {
          const servicePred = predictServiceReadinessTime();
          const isFallback = !servicePred || servicePred.status === 'baseline_fallback' || servicePred.isPreliminary;

          if (serviceLeadTimeEl) serviceLeadTimeEl.textContent = servicePred.displayTime || '1 to 2 business days';

          if (serviceFallbackNoteEl) {
            if (isFallback) {
              serviceFallbackNoteEl.textContent = 'Default estimate only — not based on enough completed orders yet.';
              serviceFallbackNoteEl.style.display = 'block';
            } else {
              serviceFallbackNoteEl.textContent = '';
              serviceFallbackNoteEl.style.display = 'none';
            }
          }

          if (serviceDescEl) {
            if (servicePred.status === 'predicted') {
              serviceDescEl.textContent = `Expected warehouse prep time: about ${servicePred.predictedHours} hours based on past completed orders.`;
            } else {
              serviceDescEl.textContent = 'This is the estimated time needed to prepare an order in the warehouse.';
            }
          }
          if (serviceMethodEl) {
            serviceMethodEl.textContent = isFallback ? 'Baseline operational default' : 'Past order preparation times';
          }
          if (serviceSampleCountEl) {
            if (Number(servicePred.observationCount) === 0) {
              serviceSampleCountEl.textContent = 'Based on 0 valid completed orders.';
            } else {
              serviceSampleCountEl.textContent = `${servicePred.observationCount} completed orders`;
            }
          }
          if (serviceDisclaimerEl) serviceDisclaimerEl.textContent = 'This estimate is based on past orders. Actual preparation time may be different.';
        }
      }

      // Popover Calendar Logic
      const selAnalysisPeriod = document.getElementById('sel-analysis-period');
      const filterReplenish = document.getElementById('sel-replenish-filter');
      const btnSrgCustomRange = document.getElementById('btn-srg-custom-range');
      const srgCustomRangeLabel = document.getElementById('srg-custom-range-label');
      const srgCalPopover = document.getElementById('srg-calendar-popover');
      const btnCloseSrgCal = document.getElementById('btn-close-srg-cal');
      const btnCancelSrgCustom = document.getElementById('btn-cancel-srg-custom');
      const btnApplySrgCustom = document.getElementById('btn-apply-srg-custom');
      const btnSrgCalPrev = document.getElementById('btn-srg-cal-prev');
      const btnSrgCalNext = document.getElementById('btn-srg-cal-next');
      const srgCalMonthYear = document.getElementById('srg-cal-month-year');
      const srgCalDaysGrid = document.getElementById('srg-cal-days-grid');
      const srgCalStartSlot = document.getElementById('srg-cal-start-slot');
      const srgCalEndSlot = document.getElementById('srg-cal-end-slot');
      const srgCalStartDisplay = document.getElementById('srg-cal-start-display');
      const srgCalEndDisplay = document.getElementById('srg-cal-end-display');
      const srgCalStepHint = document.getElementById('srg-cal-step-hint');

      function updateSrgCustomRangeButtonUI() {
        if (!btnSrgCustomRange || !srgCustomRangeLabel) return;
        if (replenishPeriod === 'custom' && replenishCustomStart && replenishCustomEnd) {
          srgCustomRangeLabel.textContent = formatCompactCustomRangeLabel(replenishCustomStart, replenishCustomEnd);
          btnSrgCustomRange.classList.remove('ia-date-btn-default');
          btnSrgCustomRange.classList.add('ia-date-btn-active');
        } else {
          srgCustomRangeLabel.textContent = 'Custom Date Range';
          btnSrgCustomRange.classList.remove('ia-date-btn-active');
          btnSrgCustomRange.classList.add('ia-date-btn-default');
        }
      }

      function drawSrgRangeCalendar() {
        if (!srgCalMonthYear || !srgCalDaysGrid) return;
        const year = srgCalViewDate.getFullYear();
        const month = srgCalViewDate.getMonth();
        const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        srgCalMonthYear.textContent = `${months[month]} ${year}`;

        if (srgCalStartDisplay) {
          srgCalStartDisplay.textContent = draftSrgStart ? formatYMDReadableShort(draftSrgStart, true) : 'Select start';
        }
        if (srgCalEndDisplay) {
          srgCalEndDisplay.textContent = draftSrgEnd ? formatYMDReadableShort(draftSrgEnd, true) : 'Select end';
        }

        if (srgCalStepHint) {
          if (!draftSrgStart) {
            srgCalStepHint.textContent = '1. Click a starting date';
          } else if (!draftSrgEnd) {
            srgCalStepHint.textContent = '2. Click an ending date';
          } else {
            srgCalStepHint.textContent = 'Range selected. Click Apply to confirm.';
          }
        }

        srgCalDaysGrid.innerHTML = '';
        const firstDayIdx = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIdx; i++) {
          const blank = document.createElement('div');
          blank.className = 'h-8';
          srgCalDaysGrid.appendChild(blank);
        }

        const todayYMD = formatYMD(new Date());

        for (let d = 1; d <= daysInMonth; d++) {
          const cellDate = new Date(year, month, d);
          const cellYMD = formatYMD(cellDate);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'h-8 w-8 mx-auto rounded-lg flex items-center justify-center transition-all cursor-pointer font-bold';
          btn.textContent = d;

          const isStart = draftSrgStart === cellYMD;
          const isEnd = draftSrgEnd === cellYMD;
          const isInRange = draftSrgStart && draftSrgEnd && cellYMD > draftSrgStart && cellYMD < draftSrgEnd;

          if (isStart || isEnd) {
            btn.className += ' bg-[#1E6C02] text-white shadow-xs';
          } else if (isInRange) {
            btn.className += ' bg-emerald-100 dark:bg-emerald-950/60 text-[#145001] dark:text-emerald-300';
          } else if (cellYMD === todayYMD) {
            btn.className += ' border border-emerald-400 text-[#1E6C02] dark:text-emerald-400 hover:bg-slate-100 dark:hover:bg-slate-800';
          } else {
            btn.className += ' text-slate-800 dark:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800';
          }

          btn.addEventListener('click', () => {
            if (srgPickingStep === 'start' || !draftSrgStart || (draftSrgStart && draftSrgEnd)) {
              draftSrgStart = cellYMD;
              draftSrgEnd = '';
              srgPickingStep = 'end';
            } else {
              if (cellYMD < draftSrgStart) {
                draftSrgEnd = draftSrgStart;
                draftSrgStart = cellYMD;
              } else {
                draftSrgEnd = cellYMD;
              }
              srgPickingStep = 'start';
            }
            drawSrgRangeCalendar();
          });

          srgCalDaysGrid.appendChild(btn);
        }
      }

      function openSrgCalendarPopover() {
        if (!srgCalPopover) return;
        draftSrgStart = replenishCustomStart || '';
        draftSrgEnd = replenishCustomEnd || '';
        srgPickingStep = draftSrgStart && !draftSrgEnd ? 'end' : 'start';
        srgCalViewDate = draftSrgStart ? new Date(draftSrgStart) : new Date();
        srgCalPopover.classList.remove('hidden');
        drawSrgRangeCalendar();
      }

      function closeSrgCalendarPopover(restoreSelectIfUnset = true) {
        if (!srgCalPopover) return;
        srgCalPopover.classList.add('hidden');
        if (restoreSelectIfUnset && selAnalysisPeriod && selAnalysisPeriod.value === 'custom' && replenishPeriod !== 'custom') {
          selAnalysisPeriod.value = replenishPeriod || '30d';
        }
      }

      if (btnSrgCustomRange) {
        btnSrgCustomRange.addEventListener('click', (e) => {
          e.stopPropagation();
          if (srgCalPopover && !srgCalPopover.classList.contains('hidden')) {
            closeSrgCalendarPopover(false);
          } else {
            openSrgCalendarPopover();
          }
        });
      }

      if (btnCloseSrgCal) btnCloseSrgCal.addEventListener('click', () => closeSrgCalendarPopover(true));
      if (btnCancelSrgCustom) btnCancelSrgCustom.addEventListener('click', () => closeSrgCalendarPopover(true));

      if (btnSrgCalPrev) {
        btnSrgCalPrev.addEventListener('click', () => {
          srgCalViewDate.setMonth(srgCalViewDate.getMonth() - 1);
          drawSrgRangeCalendar();
        });
      }

      if (btnSrgCalNext) {
        btnSrgCalNext.addEventListener('click', () => {
          srgCalViewDate.setMonth(srgCalViewDate.getMonth() + 1);
          drawSrgRangeCalendar();
        });
      }

      if (srgCalStartSlot) {
        srgCalStartSlot.addEventListener('click', () => {
          srgPickingStep = 'start';
          if (srgCalStepHint) srgCalStepHint.textContent = '1. Click a starting date';
        });
      }

      if (srgCalEndSlot) {
        srgCalEndSlot.addEventListener('click', () => {
          srgPickingStep = 'end';
          if (srgCalStepHint) srgCalStepHint.textContent = '2. Click an ending date';
        });
      }

      if (btnApplySrgCustom) {
        btnApplySrgCustom.addEventListener('click', () => {
          let sVal = draftSrgStart;
          let eVal = draftSrgEnd || draftSrgStart;
          if (!sVal) {
            showToast('Please pick at least a start date');
            return;
          }
          if (eVal < sVal) {
            const tmp = sVal;
            sVal = eVal;
            eVal = tmp;
          }
          replenishCustomStart = sVal;
          replenishCustomEnd = eVal;
          if (selAnalysisPeriod) selAnalysisPeriod.value = 'custom';
          replenishPeriod = 'custom';
          updateSrgCustomRangeButtonUI();
          closeSrgCalendarPopover(false);
          renderStockReplenishmentGuide();
          showToast(`Filtered to ${formatCompactCustomRangeLabel(sVal, eVal)}`);
        });
      }

      document.addEventListener('click', (e) => {
        if (!srgCalPopover || srgCalPopover.classList.contains('hidden')) return;
        if (!srgCalPopover.contains(e.target) && (!btnSrgCustomRange || !btnSrgCustomRange.contains(e.target))) {
          closeSrgCalendarPopover(true);
        }
      });

      if (selAnalysisPeriod) {
        selAnalysisPeriod.addEventListener('change', () => {
          if (selAnalysisPeriod.value === 'custom') {
            openSrgCalendarPopover();
          } else {
            replenishPeriod = selAnalysisPeriod.value;
            replenishCustomStart = '';
            replenishCustomEnd = '';
            updateSrgCustomRangeButtonUI();
            closeSrgCalendarPopover(false);
            renderStockReplenishmentGuide();
          }
        });
      }

      if (filterReplenish) {
        filterReplenish.addEventListener('change', () => {
          replenishFilter = filterReplenish.value;
          renderStockReplenishmentGuide();
        });
      }

      // Independent rice variety filter for Expected Stock & Delivery Timing section
      const selAiProd = document.getElementById('sel-ai-stock-product');
      if (selAiProd) {
        selAiProd.addEventListener('change', () => {
          aiSectionProductFilter = selAiProd.value;
          // Updates only the Expected Stock & Delivery Timing section
          updateAiPredictionSection(aiSectionProductFilter);
        });
      }

      // Initial Render
      updateSrgCustomRangeButtonUI();
      renderStockReplenishmentGuide();
      window.addEventListener('aurora-sync-event', renderStockReplenishmentGuide);
      window.addEventListener('aurora-orders-updated', renderStockReplenishmentGuide);
      window.addEventListener('storage', renderStockReplenishmentGuide);
    });
  </script>
</body>
</html>
