  <div id="auth-guard-loader" class="fixed inset-0 bg-[#F5F5F5] z-[99999] flex flex-col items-center justify-center font-sans">
    <div class="w-9 h-9 border-3 border-[#1E6C02]/20 border-t-[#1E6C02] rounded-full animate-spin mb-3"></div>
    <p class="text-xs font-semibold text-gray-700">Verifying administrative access...</p>
  </div>

  <script type="module" src="../src/app/shared.js"></script>

  <!-- Complete Redesigned Interactive Analytical Reporting System -->
  <script type="module">
    import { protectAdminPage, renderAdminLayout, getAllOrders, showToast, addActivityLog, getVerifiedCustomerPaymentInfo, isReservationOrder, isCancelledOrRejectedOrder } from '../src/app/shared.js';

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Authoritative access control check
      const authResult = await protectAdminPage({ requiredRole: 'any' });
      if (!authResult || !authResult.ok) return;

      // 2. Initialise the standard admin layout
      renderAdminLayout('reports');

      const targetSpace = document.getElementById('admin-main-content');
      if (!targetSpace) return;

      // local state
      let activeTab = 'transaction'; // 'transaction' or 'product'
      let dateFilter = 'all'; // 'all', 'today', 'week', 'month', 'custom'
      let searchQuery = ''; // dynamic instant search query
      let currentPage = 1; // paginated offset
      const itemsPerPage = 10; // 10 entries per page

      // Selected custom range limits
      let customStartDate = null; // Date object
      let customEndDate = null; // Date object

      // State for Calendar Modal navigation
      let calendarYear = new Date().getFullYear();
      let calendarMonth = new Date().getMonth(); // 0-indexed

      // Export format tracking
      let selectedExportFormat = 'PDF';

      // helper: Format currency
      function formatPeso(val) {
        return '₱' + (val || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      // helper: format long date June 23, 2026
      function formatLongDate(dateInput) {
        const months = [
          "January", "February", "March", "April", "May", "June",
          "July", "August", "September", "October", "November", "December"
        ];
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return 'June 23, 2026';
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
      }

      // Parse order creation date accurately
      function parseOrderDate(order) {
        if (!order) return new Date(0);
        if (order.createdAt) {
          const d = new Date(order.createdAt);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.dateCreated) {
          const d = new Date(order.dateCreated);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.createdDate) {
          const d = new Date(order.createdDate);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.date) {
          const d = new Date(order.date);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.timestamp) {
          const d = new Date(order.timestamp);
          if (!isNaN(d.getTime())) return d;
        }
        if (order.statusHistory && Array.isArray(order.statusHistory) && order.statusHistory.length > 0) {
          for (let i = 0; i < order.statusHistory.length; i++) {
            if (order.statusHistory[i].changedAt) {
              const d = new Date(order.statusHistory[i].changedAt);
              if (!isNaN(d.getTime())) return d;
            }
          }
        }
        return new Date(0);
      }

      // helper: Format quantity label
      function formatQuantity(qty, weight) {
        const wt = (weight || '').toLowerCase();
        if (wt.includes('1kg') || wt === '1kg' || wt === '1 kg' || wt.includes('1 kg')) {
          return `${qty} kg`;
        }
        return `${qty} Sack${qty !== 1 ? 's' : ''}`;
      }

      // Date boundaries calculator
      function getFilteredOrders() {
        const allOrders = getAllOrders();
        const now = new Date();
        
        // Reset hours for relative day checks
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0);
        const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

        return allOrders.filter(order => {
          const orderDate = parseOrderDate(order);

          if (dateFilter === 'today') {
            return orderDate >= todayStart && orderDate <= todayEnd;
          } 
          else if (dateFilter === 'week') {
            // Current week (Monday 00:00:00 through Sunday 23:59:59 or rolling 7 days)
            const dayOfWeek = (now.getDay() + 6) % 7; // Monday = 0, Sunday = 6
            const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek, 0, 0, 0, 0);
            const rolling7DaysStart = new Date(todayStart.getTime() - 6 * 24 * 60 * 60 * 1000);
            const effectiveWeekStart = weekStart < rolling7DaysStart ? weekStart : rolling7DaysStart;

            return orderDate >= effectiveWeekStart && orderDate <= todayEnd;
          } 
          else if (dateFilter === 'month') {
            const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
            const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999);
            return orderDate >= startOfMonth && orderDate <= endOfMonth;
          } 
          else if (dateFilter === 'custom') {
            if (!customStartDate) return true; // fallback
            const startLimit = new Date(customStartDate);
            startLimit.setHours(0, 0, 0, 0);
            
            const endLimit = customEndDate ? new Date(customEndDate) : new Date(customStartDate);
            endLimit.setHours(23, 59, 59, 999);

            return orderDate >= startLimit && orderDate <= endLimit;
          }

          return true; // 'all'
        });
      }

      // Get orders filtered by date AND searched dynamically
      function getFilteredAndSearchedOrders() {
        const filteredByDate = getFilteredOrders();
        // Verified sales orders count toward transaction list
        const verifiedSalesByDate = filteredByDate.filter(o => getVerifiedCustomerPaymentInfo(o).isVerified);

        if (!searchQuery) return verifiedSalesByDate;

        return verifiedSalesByDate.filter(o => {
          const idStr = String(o.id || '').toLowerCase();
          const customerStr = String(o.fullName || '').toLowerCase();
          const productStr = o.items ? o.items.map(i => i.product ? i.product.name : '').join(' ').toLowerCase() : '';

          return idStr.includes(searchQuery) || customerStr.includes(searchQuery) || productStr.includes(searchQuery);
        });
      }

      // Check if an order is finalized completed sale
      function isCompletedOrder(o) {
        if (!o) return false;
        const s = (o.status || '').toLowerCase().replace(/_/g, '-');
        return (s === 'completed' || s === 'delivered') && !o.isReplacement;
      }

      // Business Logic Helper: Audited & Verified Turnover for Revenue (Paid & Verified)
      function getAuditedTurnoverInfo(o) {
        if (!o) return { isAudited: false, amount: 0 };
        const statusClean = (o.status || '').toLowerCase().replace(/_/g, '-');
        if (statusClean === 'cancelled' || statusClean === 'rejected' || statusClean === 'expired' || o.isReplacement) {
          return { isAudited: false, amount: 0 };
        }

        // Turnover must be submitted by deliverer AND audited/verified by Admin
        const isAudited = o.financialStatus === 'Verified' || o.financialVerification === true || o.cashAuditStatus === 'Audited';
        if (!isAudited) {
          return { isAudited: false, amount: 0 };
        }

        const amount = o.amountCollected !== undefined ? Number(o.amountCollected) : (o.cashToAudit !== undefined ? Number(o.cashToAudit) : Number(o.total || 0));
        return { isAudited: true, amount: amount };
      }

      // Get label describing active timeline duration
      function getCoverageLabel() {
        if (dateFilter === 'all') return 'All Time';
        if (dateFilter === 'today') return 'Today';
        if (dateFilter === 'week') return 'This Week';
        if (dateFilter === 'month') return 'This Month';
        if (dateFilter === 'custom') {
          if (!customStartDate) return 'Custom Range';
          const startStr = customStartDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          if (!customEndDate) return startStr;
          const endStr = customEndDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          return `${startStr} - ${endStr}`;
        }
        return 'Custom';
      }

      // Master Render Function
      function renderReportsWorkspace() {
        // Reset scroll position to top of container and window
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        const mainContentEl = document.getElementById('admin-main-content');
        if (mainContentEl) {
          mainContentEl.scrollTop = 0;
        }

        const filteredForCards = getFilteredOrders();
        const searchedOrders = getFilteredAndSearchedOrders();

        // 1. TOTAL SALES: Sum of verified customer payments (Full payment for regular orders + Down payment for reservations)
        const verifiedSalesList = filteredForCards.filter(o => getVerifiedCustomerPaymentInfo(o).isVerified);
        const totalSalesTotal = verifiedSalesList.reduce((sum, o) => sum + getVerifiedCustomerPaymentInfo(o).amount, 0);

        // 2. REVENUE (PAID & VERIFIED): Sum ONLY payments whose turnover was submitted by deliverer AND audited/verified by Admin
        const auditedTurnoverList = filteredForCards.filter(o => getAuditedTurnoverInfo(o).isAudited);

      // Redesigned Transaction List rendering

        // Pagination slicing calculations
        const totalRecords = ordersList.length;
        const totalPages = Math.max(Math.ceil(totalRecords / itemsPerPage), 1);
        
        // Boundaries checks
        if (currentPage > totalPages) {
          currentPage = totalPages;
        }
        
        const startIdx = (currentPage - 1) * itemsPerPage;
        const endIdx = Math.min(startIdx + itemsPerPage, totalRecords);
        const paginatedOrders = ordersList.slice(startIdx, endIdx);

        // Render Page controls numbers with ellipsis
        let pageNumbersHtml = '';
        const pages = [];
        if (totalPages <= 7) {
          for (let i = 1; i <= totalPages; i++) {
            pages.push(i);
          }
        } else {
          // Always include first page
          pages.push(1);
          
          let start = Math.max(2, currentPage - 1);
          let end = Math.min(totalPages - 1, currentPage + 1);
          
          if (currentPage <= 3) {
            end = 4;
          } else if (currentPage >= totalPages - 2) {
            start = totalPages - 3;
          }
          
          if (start > 2) {
            pages.push('...');
          }
          
          for (let i = start; i <= end; i++) {
            pages.push(i);
          }
          
          if (end < totalPages - 1) {
            pages.push('...');
          }
          
          // Always include last page
          pages.push(totalPages);
        }

        pages.forEach(p => {
          if (p === '...') {
            pageNumbersHtml += `
              <span class="w-10 h-10 flex items-center justify-center text-sm font-medium text-gray-500 dark:text-gray-400 select-none">
                ...

              >
                ${p}
              </button>
            `;

      // Event binders for report area interactions
      function bindWorkspaceEvents(filteredOrders, productSalesList) {
        
        // Tab buttons toggle
        const tabBtnTx = document.getElementById('tab-btn-tx');
        const tabBtnProd = document.getElementById('tab-btn-product');

        if (tabBtnTx) {
          tabBtnTx.addEventListener('click', () => {
            activeTab = 'transaction';
            renderReportsWorkspace();
          });
        }
        if (tabBtnProd) {
          tabBtnProd.addEventListener('click', () => {
            activeTab = 'product';
            renderReportsWorkspace();
          });
        }

        // Timeline Filter clicks
        document.querySelectorAll('.btn-date-filter').forEach(btn => {
          btn.addEventListener('click', () => {
            const range = btn.getAttribute('data-range');
            dateFilter = range;
            customStartDate = null;
            customEndDate = null;
            currentPage = 1; // reset page
            renderReportsWorkspace();
            showToast(`Timeline filter applied: ${getCoverageLabel()}`, 'info');
          });
        });

        // Trigger Custom Range Popup Modal
        const btnCustomRange = document.getElementById('btn-custom-range');
        if (btnCustomRange) {
          btnCustomRange.addEventListener('click', () => {
            openCalendarModal();
          });
        }

        // Trigger Export Confirmation Dialog popup
        document.querySelectorAll('.btn-export-trigger').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedExportFormat = btn.getAttribute('data-export') || 'PDF';
            const currentFiltered = getFilteredOrders();
            openExportConfirmationModal(currentFiltered);
          });
        });

        // Instant Search input handler (only exists if transaction tab is open)
        const searchInput = document.getElementById('reports-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            currentPage = 1; // Reset to page 1 on typing
            
            // Re-render only the table container to maintain search focus
            const container = document.getElementById('active-tab-container');
            if (container) {
              const searchedOrders = getFilteredAndSearchedOrders();
              container.innerHTML = renderTransactionTable(searchedOrders);
              
              // Re-bind pagination and inner handlers for the updated table content
              bindTablePaginationAndSearch();
            }
          });
          
          // Re-focus input and set cursor position at end
          searchInput.focus();
          searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
        }

        // Bind table-specific handlers initially
        bindTablePaginationAndSearch();
      }

      // Helper to bind page click handlers & search without wiping full page
      function bindTablePaginationAndSearch() {
        // Handle page number clicks
        document.querySelectorAll('.page-num-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            currentPage = parseInt(btn.getAttribute('data-page'));
            refreshTableContentOnly();
          });
        });

        // Handle Prev page click
        const prevBtn = document.getElementById('prev-page-btn');
        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
              currentPage--;
              refreshTableContentOnly();
            }
          });
        }

        // Handle Next page click
        const nextBtn = document.getElementById('next-page-btn');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            currentPage++;
            refreshTableContentOnly();
          });
        }

        // Bind search input focus retention
        const searchInput = document.getElementById('reports-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            currentPage = 1;
            refreshTableContentOnly();
          });
        }
      }

      // Live update table list on query or page changes
      function refreshTableContentOnly() {
        const container = document.getElementById('active-tab-container');
        if (container) {
          if (activeTab === 'transaction') {
            const searchedOrders = getFilteredAndSearchedOrders();
            container.innerHTML = renderTransactionTable(searchedOrders);
            bindTablePaginationAndSearch();
            
            // Maintain search cursor focus if active
            const input = document.getElementById('reports-search-input');
            if (input) {
              input.focus();
              input.setSelectionRange(input.value.length, input.value.length);
            }
          }
        }
      }


      // ==========================================
      // CUSTOM CALENDAR POPUP MODAL FUNCTIONALITY
      // ==========================================

      function openCalendarModal() {
        let calendarModal = document.getElementById('custom-range-modal');
        if (!calendarModal) {
          calendarModal = document.createElement('div');
          calendarModal.id = 'custom-range-modal';
          calendarModal.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 transition-opacity duration-200';
          document.body.appendChild(calendarModal);
        }

        calendarModal.classList.remove('hidden');
        renderCalendarInModal(calendarModal);
      }

      function renderCalendarInModal(modalContainer) {
        const monthNames = [
          "January", "February", "March", "April", "May", "June",
          "July", "August", "September", "October", "November", "December"
        ];

        const firstDayOfMonth = new Date(calendarYear, calendarMonth, 1).getDay();
        const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
        
        let daysHtml = '';
        for (let i = 0; i < firstDayOfMonth; i++) {
          daysHtml += `<div class="p-3 text-center text-slate-300 select-none"></div>`;
        }

        const todayDateStr = new Date().toDateString();

        for (let day = 1; day <= daysInMonth; day++) {
          const checkDate = new Date(calendarYear, calendarMonth, day);
          const dateStr = checkDate.toDateString();
          
          let isSelected = false;
          let isBetween = false;

          if (customStartDate && customEndDate) {
            const startReset = new Date(customStartDate);
            startReset.setHours(0,0,0,0);
            const endReset = new Date(customEndDate);
            endReset.setHours(23,59,59,999);

            if (checkDate >= startReset && checkDate <= endReset) {
              if (checkDate.toDateString() === startReset.toDateString() || checkDate.toDateString() === endReset.toDateString()) {
                isSelected = true;
              } else {
                isBetween = true;
              }
            }
          } else if (customStartDate && checkDate.toDateString() === customStartDate.toDateString()) {
            isSelected = true;
          }

          let dayClasses = 'cursor-pointer font-medium text-sm transition-all duration-150 rounded-lg focus:outline-none';
          if (isSelected) {
            dayClasses += ' bg-[#1E6C02] text-white !text-white rounded-full shadow-xs';
          } else if (isBetween) {
            dayClasses += ' bg-emerald-100/80 text-[#1E6C02] rounded-lg';
          } else {
            dayClasses += ' text-black hover:bg-[#1E6C02]/10 hover:text-[#1E6C02]';
          }

          if (dateStr === todayDateStr && !isSelected) {
            dayClasses += ' ring-2 ring-[#1E6C02] ring-offset-1 rounded-full';
          }

          daysHtml += `
            <button 
              data-day="${day}" 
              class="calendar-day-btn p-2.5 text-center text-sm transition-all duration-150 rounded-lg focus:outline-none ${dayClasses}"
            >
              ${day}
            </button>
          `;
        }

        modalContainer.innerHTML = `
          <div class="bg-white rounded-3xl max-w-md w-full border border-slate-100 shadow-2xl p-6 md:p-8 space-y-6 transform transition-all duration-300">
            <div class="text-center md:text-left">
              <h4 class="text-lg font-semibold text-black dark:text-white">Custom Date Range</h4>
              <p class="text-xs font-normal text-gray-600 dark:text-gray-400 mt-1">Select a visual start and end date on the calendar, or specify manually.</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">From Date</label>
                <input 
                  type="date" 
                  id="picker-manual-from" 
                  class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-sm font-normal text-black dark:text-white focus:bg-white focus:ring-2 focus:ring-[#1E6C02]/20 outline-none transition-all"
                  value="${customStartDate ? customStartDate.toISOString().split('T')[0] : ''}"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">To Date</label>
                <input 
                  type="date" 
                  id="picker-manual-to" 
                  class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-gray-800 border border-slate-200 dark:border-gray-700 rounded-xl text-sm font-normal text-black dark:text-white focus:bg-white focus:ring-2 focus:ring-[#1E6C02]/20 outline-none transition-all"
                  value="${customEndDate ? customEndDate.toISOString().split('T')[0] : ''}"
                />
              </div>
            </div>

            <div class="bg-slate-50 dark:bg-gray-800 rounded-2xl border border-slate-200/50 dark:border-gray-700 p-4 space-y-4">
              <div class="flex items-center justify-between">
                <button id="btn-prev-month" class="p-2 bg-white dark:bg-gray-700 hover:bg-slate-100 dark:hover:bg-gray-600 border border-slate-200 dark:border-gray-600 rounded-xl text-black dark:text-white transition-colors">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <span class="font-semibold text-black dark:text-white text-sm md:text-base">${monthNames[calendarMonth]} ${calendarYear}</span>
                <button id="btn-next-month" class="p-2 bg-white dark:bg-gray-700 hover:bg-slate-100 dark:hover:bg-gray-600 border border-slate-200 dark:border-gray-600 rounded-xl text-black dark:text-white transition-colors">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
              </div>

              <div class="grid grid-cols-7 text-center font-semibold text-xs text-gray-600 dark:text-gray-400 tracking-wider uppercase pb-1 border-b border-slate-200/40 dark:border-gray-700">
                <div>Su</div>
                <div>Mo</div>
                <div>Tu</div>
                <div>We</div>
                <div>Th</div>
                <div>Fr</div>
                <div>Sa</div>
              </div>

              <div class="grid grid-cols-7 gap-1">
                ${daysHtml}
              </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
              <button 
                id="btn-calendar-cancel" 
                class="w-full sm:flex-1 py-2.5 bg-slate-100 dark:bg-gray-800 hover:bg-slate-200 dark:hover:bg-gray-700 text-black dark:text-gray-200 font-medium text-sm rounded-xl transition-colors cursor-pointer"
              >
                Cancel
              </button>
              <button 
                id="btn-calendar-apply" 
                class="w-full sm:flex-1 py-2.5 bg-[#1E6C02] hover:bg-[#145001] text-white font-medium text-sm rounded-xl transition-colors cursor-pointer shadow-md shadow-green-900/10"
              >
                Apply Filter
              </button>
            </div>
          </div>
        `;

        bindCalendarModalEvents(modalContainer);
      }

      function bindCalendarModalEvents(modalContainer) {
        document.getElementById('btn-prev-month').addEventListener('click', () => {
          calendarMonth--;
          if (calendarMonth < 0) {
            calendarMonth = 11;
            calendarYear--;
          }
          renderCalendarInModal(modalContainer);
        });

        document.getElementById('btn-next-month').addEventListener('click', () => {
          calendarMonth++;
          if (calendarMonth > 11) {
            calendarMonth = 0;
            calendarYear++;
          }
          renderCalendarInModal(modalContainer);
        });

        document.querySelectorAll('.calendar-day-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const clickedDay = parseInt(btn.getAttribute('data-day'));
            const clickedDate = new Date(calendarYear, calendarMonth, clickedDay);

            if (!customStartDate || (customStartDate && customEndDate)) {
              customStartDate = clickedDate;
              customEndDate = null;
            } else if (customStartDate && !customEndDate) {
              if (clickedDate < customStartDate) {
                customStartDate = clickedDate;
              } else {
                customEndDate = clickedDate;
              }
            }
            renderCalendarInModal(modalContainer);
          });
        });

        const manualFrom = document.getElementById('picker-manual-from');
        const manualTo = document.getElementById('picker-manual-to');

        if (manualFrom) {
          manualFrom.addEventListener('change', (e) => {
            if (e.target.value) {
              customStartDate = new Date(e.target.value);
              calendarYear = customStartDate.getFullYear();
              calendarMonth = customStartDate.getMonth();
              renderCalendarInModal(modalContainer);
            }
          });
        }

        if (manualTo) {
          manualTo.addEventListener('change', (e) => {
            if (e.target.value) {
              customEndDate = new Date(e.target.value);
              renderCalendarInModal(modalContainer);
            }
          });
        }

        document.getElementById('btn-calendar-cancel').addEventListener('click', () => {
          modalContainer.classList.add('hidden');
        });

        document.getElementById('btn-calendar-apply').addEventListener('click', () => {
          const manualFromVal = document.getElementById('picker-manual-from').value;
          const manualToVal = document.getElementById('picker-manual-to').value;

          if (manualFromVal) customStartDate = new Date(manualFromVal);
          if (manualToVal) customEndDate = new Date(manualToVal);

          if (!customStartDate) {
            showToast('Please select at least a start date.', 'error');
            return;
          }

          dateFilter = 'custom';
          currentPage = 1; // reset offset
          modalContainer.classList.add('hidden');
          renderReportsWorkspace();
          showToast(`Custom range filter applied: ${getCoverageLabel()}`, 'success');
        });
      }

            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
              <button 
                id="btn-export-cancel" 
                class="w-full sm:flex-1 py-2.5 bg-slate-100 dark:bg-gray-800 hover:bg-slate-200 dark:hover:bg-gray-700 text-slate-700 dark:text-gray-200 font-medium text-sm rounded-xl transition-colors cursor-pointer"
              >
                Cancel
              </button>
              <button 
                id="btn-export-download" 
                class="w-full sm:flex-1 py-2.5 bg-[#1E6C02] hover:bg-[#145001] text-white font-medium text-sm rounded-xl transition-colors cursor-pointer shadow-md shadow-green-900/10"
              >
                Download Report
              </button>
            </div>
          </div>
        `;

        document.getElementById('btn-export-cancel').addEventListener('click', () => {
          exportModal.classList.add('hidden');
        });

        document.getElementById('btn-export-download').addEventListener('click', () => {
          exportModal.classList.add('hidden');
          triggerActualFileDownload(filteredOrders);
        });
      }


      // ==========================================
      // REAL FILE DOWNLOAD TRIGGERS (PDF/Excel/CSV)
      // ==========================================

      function triggerActualFileDownload(ordersList) {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const now = new Date();
        const currentMonthName = monthNames[now.getMonth()];
        const currentYear = now.getFullYear();
        const filename = `Sales_Report_${currentMonthName}_${currentYear}`;

        // Helpers for safe date formatting
        const safeISODate = (o) => {
          const d = parseOrderDate(o);
          if (!d || isNaN(d.getTime()) || d.getTime() === 0) return 'N/A';
          try {
            return d.toISOString().split('T')[0];
          } catch(e) {
            return d.toLocaleDateString();
          }
        };

        const safeLocaleDate = (o) => {
          const d = parseOrderDate(o);
          if (!d || isNaN(d.getTime()) || d.getTime() === 0) return 'N/A';
          return d.toLocaleDateString();
        };

        // Completed sales dataset
        const verifiedSalesList = ordersList.filter(o => getVerifiedCustomerPaymentInfo(o).isVerified);
        const totalSalesValue = verifiedSalesList.reduce((sum, o) => sum + getVerifiedCustomerPaymentInfo(o).amount, 0);

        // Product sales aggregation from verified sales
        const productSalesMap = {};
        verifiedSalesList.forEach(o => {
          if (o.items) {
            o.items.forEach(item => {
              if (!item || !item.product || item.isReservation) return;
              const name = item.product.name;
              const qty = Number(item.quantity || 1);
              const price = Number(item.product.price || 0);
              const rev = qty * price;
              
              if (!productSalesMap[name]) {
                productSalesMap[name] = { name, quantity: 0, revenue: 0, weight: item.product.weight || '25kg' };
              }
              productSalesMap[name].quantity += qty;
              productSalesMap[name].revenue += rev;
            });
          }
        });
        const productSalesList = Object.values(productSalesMap).sort((a, b) => b.revenue - a.revenue);

        // Reservations and Cancelled orders from filtered date range
        const reservations = ordersList.filter(o => isReservationOrder(o) && !isCancelledOrRejectedOrder(o));
        const cancelledOrders = ordersList.filter(o => isCancelledOrRejectedOrder(o));

        // Status counts breakdown
        const statusCounts = {};
        ordersList.forEach(o => {
          const s = (o.status || 'unknown').toUpperCase();
          statusCounts[s] = (statusCounts[s] || 0) + 1;
        });

        if (selectedExportFormat === 'CSV') {
          const escapeCsv = (val) => {
            if (val === null || val === undefined) return '""';
            if (typeof val === 'number') return Number.isFinite(val) ? String(val) : '0';
            const str = String(val);
            return `"${str.replace(/"/g, '""')}"`;
          };

          let csvRows = [];
          csvRows.push([escapeCsv("RiceFlow")].join(","));
          csvRows.push([escapeCsv("Queue-Enabled Rice Ordering and Inventory Management System")].join(","));
          csvRows.push([escapeCsv("Business Reports")].join(","));
          csvRows.push([escapeCsv("Generated Date/Time"), escapeCsv(now.toLocaleString())].join(","));
          csvRows.push([escapeCsv("Generated By"), escapeCsv("Admin")].join(","));
          csvRows.push([escapeCsv("Timeline Coverage"), escapeCsv(getCoverageLabel())].join(","));
          csvRows.push("");

          csvRows.push([escapeCsv("SALES SUMMARY")].join(","));
          csvRows.push([escapeCsv("Indicator"), escapeCsv("Value")].join(","));
          csvRows.push([escapeCsv("Total Sales (Gross PHP)"), Number(totalSalesValue.toFixed(2))].join(","));
          csvRows.push([escapeCsv("Verified Sales Orders"), verifiedSalesList.length].join(","));
          csvRows.push([escapeCsv("Active Reservations"), reservations.length].join(","));
          csvRows.push([escapeCsv("Cancelled Orders"), cancelledOrders.length].join(","));
          csvRows.push("");

          csvRows.push([escapeCsv("TRANSACTION LIST (VERIFIED SALES)")].join(","));
          csvRows.push([
            escapeCsv("Order ID"),
            escapeCsv("Customer"),
            escapeCsv("Product Ordered"),
            escapeCsv("Quantity"),
            escapeCsv("Amount (PHP)"),
            escapeCsv("Date Ordered"),
            escapeCsv("Status")
          ].join(","));
          verifiedSalesList.forEach(o => {
            const prodStr = o.items ? o.items.map(i => i.product ? i.product.name : 'Rice Product').join('; ') : 'Rice Order';
            const qtyStr = o.items ? o.items.map(i => `${i.quantity || 1}`).join('; ') : '1';
            const dateStr = safeISODate(o);
            const verifiedAmt = Number(Number(getVerifiedCustomerPaymentInfo(o).amount || o.total || 0).toFixed(2));
            csvRows.push([
              escapeCsv(`#${o.id}`),
              escapeCsv(o.fullName || 'Customer'),
              escapeCsv(prodStr),
              escapeCsv(qtyStr),
              verifiedAmt,
              escapeCsv(dateStr),
              escapeCsv(o.status || 'Verified')
            ].join(","));
          });
          csvRows.push("");

          csvRows.push([escapeCsv("PRODUCT SALES REPORT")].join(","));
          csvRows.push([
            escapeCsv("No."),
            escapeCsv("Product"),
            escapeCsv("Packaging / Weight"),
            escapeCsv("Quantity Ordered"),
            escapeCsv("Total Sales (PHP)")
          ].join(","));
          productSalesList.forEach((p, idx) => {
            csvRows.push([
              idx + 1,
              escapeCsv(p.name),
              escapeCsv(p.weight || '25kg'),
              escapeCsv(formatQuantity(p.quantity, p.weight)),
              Number(Number(p.revenue || 0).toFixed(2))
            ].join(","));
          });
          csvRows.push("");

          csvRows.push([escapeCsv("RESERVATION SUMMARY")].join(","));
          csvRows.push([
            escapeCsv("Order ID"),
            escapeCsv("Customer"),
            escapeCsv("Reserved Products"),
            escapeCsv("Quantity"),
            escapeCsv("Total Value (PHP)"),
            escapeCsv("Date")
          ].join(","));
          reservations.forEach(o => {
            const prodStr = o.items ? o.items.map(i => i.product ? i.product.name : 'Rice Product').join('; ') : 'Reserved Grain';
            const qtyStr = o.items ? o.items.map(i => `${i.quantity || 1}`).join('; ') : '1';
            const dateStr = safeISODate(o);
            const resAmt = Number(Number(o.total || o.totalPrice || o.amount || 0).toFixed(2));
            csvRows.push([
              escapeCsv(`#${o.id}`),
              escapeCsv(o.fullName || 'Customer'),
              escapeCsv(prodStr),
              escapeCsv(qtyStr),
              resAmt,
              escapeCsv(dateStr)
            ].join(","));
          });
          csvRows.push("");

          csvRows.push([escapeCsv("ORDER STATUS SUMMARY")].join(","));
          csvRows.push([escapeCsv("Status"), escapeCsv("Count")].join(","));
          Object.entries(statusCounts).forEach(([st, cnt]) => {
            csvRows.push([escapeCsv(st), cnt].join(","));
          });

          const csvString = "\uFEFF" + csvRows.join("\r\n");
          const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);

          const link = document.createElement("a");
          link.setAttribute("href", url);
          link.setAttribute("download", `${filename}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);

          showToast('✔ CSV Report downloaded successfully.', 'success');
          addActivityLog('Reports', 'Exported business report as CSV', 'Business Reports');
        } 
        else if (selectedExportFormat === 'Excel') {
          if (!window.XLSX) {
            showToast('❌ Excel export library is still loading. Please check your internet connection.', 'error');
            return;
          }

          const wb = window.XLSX.utils.book_new();

          // 1. Sheet: Sales & Transactions
          const salesSummaryAOA = [
            ["RiceFlow Business Reports - Sales & Transactions"],
            ["Generated Date/Time", now.toLocaleString()],
            ["Generated By", "Admin"],
            ["Timeline Coverage", getCoverageLabel()],
            [],
            ["SALES SUMMARY"],
            ["Indicator", "Value"],
            ["Total Sales (Gross PHP)", Number(totalSalesValue.toFixed(2))],
            ["Verified Sales Orders Count", verifiedSalesList.length],
            ["Active Reservations Count", reservations.length],
            ["Cancelled Orders Count", cancelledOrders.length],
            [],
            ["TRANSACTION LIST (VERIFIED SALES)"],
            ["Order ID", "Customer Name", "Product Ordered", "Quantity", "Amount (PHP)", "Date Ordered", "Status"]
          ];

          verifiedSalesList.forEach(o => {
            const prodStr = o.items ? o.items.map(i => i.product ? i.product.name : 'Rice Product').join('; ') : 'Rice Order';
            const qtyStr = o.items ? o.items.map(i => `${i.quantity || 1}`).join('; ') : '1';
            const dateStr = safeISODate(o);
            const verifiedAmt = Number(Number(getVerifiedCustomerPaymentInfo(o).amount || o.total || 0).toFixed(2));
            salesSummaryAOA.push([
              `#${o.id}`,
              o.fullName || 'Customer',
              prodStr,
              qtyStr,
              verifiedAmt,
              dateStr,
              o.status || 'Verified'
            ]);
          });

          const wsSales = window.XLSX.utils.aoa_to_sheet(salesSummaryAOA);
          wsSales['!cols'] = [
            { wch: 18 },
            { wch: 26 },
            { wch: 36 },
            { wch: 12 },
            { wch: 16 },
            { wch: 14 },
            { wch: 16 }
          ];
          window.XLSX.utils.book_append_sheet(wb, wsSales, "Sales & Transactions");

          // 2. Sheet: Product Sales
          const productSalesAOA = [
            ["RiceFlow - Product Sales Report"],
            ["Timeline Coverage", getCoverageLabel()],
            ["Generated Date/Time", now.toLocaleString()],
            [],
            ["Rank", "Product Name", "Packaging / Weight", "Quantity Ordered", "Total Sales (PHP)"]
          ];

          productSalesList.forEach((p, idx) => {
            productSalesAOA.push([
              idx + 1,
              p.name,
              p.weight || '25kg',
              formatQuantity(p.quantity, p.weight),
              Number(Number(p.revenue || 0).toFixed(2))
            ]);
          });

          const wsProducts = window.XLSX.utils.aoa_to_sheet(productSalesAOA);
          wsProducts['!cols'] = [
            { wch: 8 },
            { wch: 32 },
            { wch: 20 },
            { wch: 18 },
            { wch: 18 }
          ];
          window.XLSX.utils.book_append_sheet(wb, wsProducts, "Product Sales");

          // 3. Sheet: Reservations & Status
          const reservationsAOA = [
            ["RiceFlow - Reservations & Status Summary"],
            ["Timeline Coverage", getCoverageLabel()],
            ["Generated Date/Time", now.toLocaleString()],
            [],
            ["ACTIVE RESERVATIONS"],
            ["Order ID", "Customer Name", "Reserved Products", "Quantity", "Total Value (PHP)", "Date"]
          ];

          reservations.forEach(o => {
            const prodStr = o.items ? o.items.map(i => i.product ? i.product.name : 'Rice Product').join('; ') : 'Reserved Grain';
            const qtyStr = o.items ? o.items.map(i => `${i.quantity || 1}`).join('; ') : '1';
            const dateStr = safeISODate(o);
            const resAmt = Number(Number(o.total || o.totalPrice || o.amount || 0).toFixed(2));
            reservationsAOA.push([
              `#${o.id}`,
              o.fullName || 'Customer',
              prodStr,
              qtyStr,
              resAmt,
              dateStr
            ]);
          });

          reservationsAOA.push([]);
          reservationsAOA.push(["ORDER STATUS SUMMARY"]);
          reservationsAOA.push(["Status", "Order Count"]);
          Object.entries(statusCounts).forEach(([st, cnt]) => {
            reservationsAOA.push([st, cnt]);
          });

          const wsReservations = window.XLSX.utils.aoa_to_sheet(reservationsAOA);
          wsReservations['!cols'] = [
            { wch: 18 },
            { wch: 26 },
            { wch: 36 },
            { wch: 12 },
            { wch: 18 },
            { wch: 14 }
          ];
          window.XLSX.utils.book_append_sheet(wb, wsReservations, "Reservations & Status");

          // Write native .xlsx file and trigger download
          try {
            window.XLSX.writeFile(wb, `${filename}.xlsx`);
          } catch (writeErr) {
            const wbout = window.XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
            const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${filename}.xlsx`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
          }

          showToast('✔ Excel Report downloaded successfully (.xlsx).', 'success');
          addActivityLog('Reports', 'Exported business report as Excel (.xlsx)', 'Business Reports');
        } 
        else {
          // PDF Generation using jsPDF and jsPDF-AutoTable
          try {
            if (!window.jspdf || !window.jspdf.jsPDF) {
              showToast('❌ PDF export library is still loading. Please try again.', 'error');
              return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
              orientation: 'p',
              unit: 'mm',
              format: 'a4'
            });

            // Print brand header on page 1
            doc.setFontSize(20);
            doc.setTextColor(30, 108, 2); // Brand green #1E6C02
            doc.setFont('helvetica', 'bold');
            doc.text('RiceFlow', 14, 18);
            
            doc.setFontSize(10);
            doc.setTextColor(80, 80, 80);
            doc.setFont('helvetica', 'normal');
            doc.text('Queue-Enabled Rice Ordering and Inventory Management System', 14, 24);
            doc.text('Business Reports', 14, 29);
            
            doc.setFontSize(9);
            doc.setTextColor(120, 120, 120);
            doc.text(`Timeline: ${getCoverageLabel()}`, 196, 18, { align: 'right' });
            doc.text(`Generated: ${now.toLocaleString()}`, 196, 24, { align: 'right' });
            doc.text(`Generated By: Admin`, 196, 29, { align: 'right' });
            
            doc.setDrawColor(200, 200, 200);
            doc.setLineWidth(0.2);
            doc.line(14, 32, 196, 32);

            // Safe Y positioning helper to prevent orphaned headings across pages
            const getSafeNextY = (neededSpace = 35) => {
              const prevY = doc.lastAutoTable ? doc.lastAutoTable.finalY : 32;
              if (prevY + neededSpace > 275) {
                doc.addPage();
                return 20;
              }
              return prevY + 10;
            };

            // 1. SALES SUMMARY
            doc.setFontSize(12);
            doc.setTextColor(30, 108, 2);
            doc.setFont('helvetica', 'bold');
            doc.text('1. SALES SUMMARY', 14, 40);
            
            doc.autoTable({
              startY: 43,
              head: [['Performance Indicator', 'Summary Value']],
              body: [
                ['Total Sales (Gross)', formatPeso(totalSalesValue)],
                ['Verified Sales Orders', `${verifiedSalesList.length} orders`],
                ['Active Reservations', `${reservations.length} orders`],
                ['Cancelled Orders', `${cancelledOrders.length} orders`]
              ],
              theme: 'striped',
              headStyles: { fillColor: [30, 108, 2], textStyle: 'bold' },
              styles: { font: 'helvetica', fontSize: 9, cellPadding: 3.5 }
            });

            // 2. TRANSACTION LIST
            const nextY1 = getSafeNextY(35);
            doc.setFontSize(12);
            doc.setTextColor(30, 108, 2);
            doc.setFont('helvetica', 'bold');
            doc.text('2. TRANSACTION LIST (VERIFIED SALES)', 14, nextY1);
            
            const transactionRows = verifiedSalesList.map(o => {
              const dateStr = safeLocaleDate(o);
              const itemsListStr = o.items ? o.items.map(i => `${i.product ? i.product.name : 'Rice'} (x${i.quantity || 1})`).join(', ') : 'Rice Order';
              const qtySum = o.items ? o.items.reduce((acc, i) => acc + (i.quantity || 1), 0) : 1;
              const verifiedAmt = getVerifiedCustomerPaymentInfo(o).amount || o.total || 0;
              return [
                `#${o.id}`,
                o.fullName || 'Customer',
                itemsListStr,
                qtySum.toString(),
                formatPeso(verifiedAmt),
                dateStr
              ];
            });
            
            doc.autoTable({
              startY: nextY1 + 3,
              head: [['Order ID', 'Customer', 'Product Ordered', 'Quantity', 'Amount', 'Date Ordered']],
              body: transactionRows.length > 0 ? transactionRows : [['-', 'No completed transaction records found', '-', '-', '-', '-']],
              theme: 'striped',
              headStyles: { fillColor: [30, 108, 2] },
              styles: { font: 'helvetica', fontSize: 8, cellPadding: 3 },
              columnStyles: {
                0: { fontStyle: 'bold', cellWidth: 22 },
                1: { cellWidth: 35 },
                2: { cellWidth: 'auto' },
                3: { halign: 'center', cellWidth: 18 },
                4: { halign: 'right', fontStyle: 'bold', cellWidth: 26 },
                5: { halign: 'center', cellWidth: 24 }
              }
            });

            // 3. PRODUCT SALES REPORT
            const nextY2 = getSafeNextY(35);
            doc.setFontSize(12);
            doc.setTextColor(30, 108, 2);
            doc.setFont('helvetica', 'bold');
            doc.text('3. PRODUCT SALES REPORT', 14, nextY2);
            
            const productRows = productSalesList.map((p, idx) => [
              (idx + 1).toString(),
              p.name,
              formatQuantity(p.quantity, p.weight),
              formatPeso(p.revenue)
            ]);
            
            doc.autoTable({
              startY: nextY2 + 3,
              head: [['No.', 'Product', 'Quantity Ordered', 'Total Sales']],
              body: productRows.length > 0 ? productRows : [['-', 'No product sales recorded', '-', '-']],
              theme: 'striped',
              headStyles: { fillColor: [30, 108, 2] },
              styles: { font: 'helvetica', fontSize: 8, cellPadding: 3 },
              columnStyles: {
                0: { halign: 'center', cellWidth: 15 },
                1: { cellWidth: 'auto' },
                2: { halign: 'center', cellWidth: 40 },
                3: { halign: 'right', cellWidth: 45 }
              }
            });

            // 4. RESERVATION SUMMARY
            const nextY3 = getSafeNextY(35);
            doc.setFontSize(12);
            doc.setTextColor(30, 108, 2);
            doc.setFont('helvetica', 'bold');
            doc.text('4. RESERVATION SUMMARY', 14, nextY3);
            
            const reservationRows = reservations.map(o => {
              const dateStr = safeLocaleDate(o);
              const itemsListStr = o.items ? o.items.map(i => `${i.product ? i.product.name : 'Rice'} (x${i.quantity || 1})`).join(', ') : 'Reserved Item';
              return [
                `#${o.id}`,
                o.fullName || 'Customer',
                itemsListStr,
                formatPeso(o.total || 0),
                dateStr
              ];
            });
            
            doc.autoTable({
              startY: nextY3 + 3,
              head: [['Order ID', 'Customer', 'Reserved Products', 'Total Value', 'Date']],
              body: reservationRows.length > 0 ? reservationRows : [['-', 'No active reservation orders found', '-', '-', '-']],
              theme: 'striped',
              headStyles: { fillColor: [30, 108, 2] },
              styles: { font: 'helvetica', fontSize: 8, cellPadding: 3 },
              columnStyles: {
                0: { fontStyle: 'bold', cellWidth: 22 },
                1: { cellWidth: 40 },
                2: { cellWidth: 'auto' },
                3: { halign: 'right', fontStyle: 'bold', cellWidth: 28 },
                4: { halign: 'center', cellWidth: 26 }
              }
            });

            // Page numbers and footer across all pages
            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
              doc.setPage(i);
              doc.setFont('helvetica', 'normal');
              doc.setFontSize(8);
              doc.setTextColor(150, 150, 150);
              doc.text(`Page ${i} of ${totalPages}`, 196, 287, { align: 'right' });
              doc.text(`Generated by RiceFlow System on ${now.toLocaleString()}`, 14, 287);
            }

            doc.save(`${filename}.pdf`);
            showToast('✔ PDF Report downloaded successfully.', 'success');
            addActivityLog('Reports', 'Exported business report as PDF', 'Business Reports');
          } catch (pdfError) {
            console.error('PDF Generation Error:', pdfError);
            showToast('❌ Error generating PDF: ' + pdfError.message, 'error');
          }
        }
      }

      // Initial load trigger
      renderReportsWorkspace();
    });
  </script>
</body>
</html>
