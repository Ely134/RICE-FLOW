<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Queue | RiceFlow</title>
  <link rel="stylesheet" href="../src/styles/index.css">
  <style>
    .top-scrollbar-container {
      overflow-x: auto !important;
      overflow-y: visible !important;
      transform: rotateX(180deg);
    }
    .top-scrollbar-container > table {
      transform: rotateX(180deg);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] min-h-screen text-gray-800 antialiased">

  <div id="admin-layout-container"></div>

  <!-- ALLOCATION CONFIRMATION & REGISTRATION MODAL -->
  <div id="alloc-confirm-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-xl p-6 border border-gray-200 animate-in fade-in zoom-in duration-150">
      <div class="flex items-center gap-2 pb-4 border-b border-gray-100 mb-5 text-left">
        <span class="text-2xl">⚡</span>
        <div>
          <h3 class="text-lg font-bold text-gray-900 leading-tight">Allocate Available Stock</h3>
          <p class="text-xs text-black font-medium mt-0.5">First-Come, First-Served (FCFS) Policy</p>
        </div>
      </div>
      
      <div class="space-y-4 text-left">
        <p class="text-sm text-black leading-relaxed">
          The system will automatically assign newly available rice to customers in chronological order based on their queue standing.
        </p>

        <!-- Dynamic Inputs inside the Modal -->
        <div class="space-y-3 bg-gray-50 p-4 rounded-xl border border-gray-150">
          <div class="space-y-1">
            <label class="text-xs font-bold text-black uppercase tracking-wider">Rice Variety Arrived</label>
            <select id="modal-alloc-product-select" class="w-full bg-white border border-gray-200 text-sm font-semibold text-black px-3 py-2.5 rounded-lg outline-none focus:border-[#1E6C02] transition-all">
              <!-- Dynamically populated -->
            </select>
          </div>
          <div class="space-y-1">
            <label class="text-xs font-bold text-black uppercase tracking-wider">Arrived Sacks Count</label>
            <input type="number" id="modal-alloc-stock-input" min="1" value="50" class="w-full bg-white border border-gray-200 text-sm font-bold text-black px-3 py-2.5 rounded-lg outline-none focus:border-[#1E6C02] transition-all" />
          </div>
        </div>

        <!-- Calculated Outcome Display -->
        <div class="space-y-2 py-3 border-t border-b border-gray-100 text-xs font-semibold text-black">
          <div class="flex justify-between">
            <span class="text-black">Available Stock:</span>
            <span class="text-black font-bold" id="lbl-confirm-stock">50 Sacks</span>
          </div>
          <div class="flex justify-between">
            <span class="text-black">Customers that may receive stock:</span>
            <span class="text-[#1E6C02] font-extrabold text-sm" id="lbl-confirm-affected">0</span>
          </div>
        </div>
      </div>

      <div class="flex gap-3 justify-end mt-6">
        <button id="btn-alloc-confirm-cancel" class="px-4.5 py-2.5 border border-gray-200 rounded-xl text-xs font-bold text-black hover:bg-gray-55 transition-colors cursor-pointer">
          Cancel
        </button>
        <button id="btn-alloc-confirm-commit" class="px-5 py-2.5 bg-[#1E6C02] hover:bg-[#145001] text-white rounded-xl text-xs font-bold tracking-wide transition-colors cursor-pointer shadow-sm">
          Allocate
        </button>
      </div>
    </div>
  </div>

  <!-- RESERVATION DETAILS MODAL -->
  <div id="details-modal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div id="details-modal-box" class="bg-white rounded-2xl max-w-lg w-full shadow-xl p-6 border border-gray-200 animate-in fade-in zoom-in duration-150 text-left max-h-[95vh] overflow-y-auto">
      <!-- Dynamically rendered based on order status -->
    </div>
  </div>

  <!-- RECEIPT ZOOM LIGHTBOX MODAL -->
  <div id="lightbox-modal" class="fixed inset-0 bg-black/85 backdrop-blur-xs z-[70] flex items-center justify-center p-4 hidden">
    <div class="relative max-w-lg w-full">
      <button id="close-lightbox-btn" class="absolute -top-3 -right-3 md:-top-4 md:-right-4 text-gray-800 hover:text-black font-extrabold bg-white w-9 h-9 rounded-full flex items-center justify-center text-lg cursor-pointer transition-all duration-200 hover:scale-110 shadow-lg z-[80]" title="Close">
        ✕
      </button>
      <div class="bg-white rounded-2xl p-2.5 overflow-hidden shadow-2xl" id="lightbox-content-card">
        <div class="h-96 flex items-center justify-center bg-gray-50 rounded-xl" id="lightbox-target-container">
          <!-- Text placeholder or image -->
          <span class="text-gray-300 font-black">Screenshot image zoom</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="../src/app/shared.js"></script>

  <!-- Reservation Queue Controller -->
  <script type="module">
    import { 
      renderAdminLayout, 
      getAllOrders, 
      saveOrders, 
      getProducts, 
      saveProducts, 
      addActivityLog, 
      showToast,
      updateOrderStatus,
      allocateStockToReservations,
      getEstimatedArrivalDate,
      getReservationQueuePosition,
      addNotification,
      isReservationOrder,
      addInventoryHistory
    } from '../src/app/shared.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Render Admin Navigation Layout Frame
      renderAdminLayout('reservations');

      const targetSpace = document.getElementById('admin-main-content');
      if (!targetSpace) return;

      // Local State Variables
      let statusFilter = 'all'; 
      let searchQuery = '';
      let selectedOrderInModal = null;

      // Draw Main Page Content
      function drawContentLayout() {
        targetSpace.innerHTML = `          <!-- PAGE HEADER -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 text-left">
            <div>
              <p class="text-sm text-black mt-1.5 max-w-2xl leading-relaxed">
                View and monitor all approved reservation orders waiting for available stock. The system automatically follows the First-Come, First-Served (FCFS) policy.
              </p>
            </div>
            <!-- STOCK ALLOCATION ACTION BUTTON -->
            <div class="shrink-0">
              <button id="btn-allocate-trigger" class="px-5 py-3.5 bg-[#1E6C02] hover:bg-[#145001] text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-xs transition-all flex items-center gap-2 cursor-pointer">
                <span>⚡</span> Allocate Available Stock
              </button>
            </div>
          </div>

          <!-- SEARCH & FILTER BAR -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-xl border border-gray-200 text-left">
            <!-- Left: Search Box -->
            <div class="relative w-full sm:max-w-xs">
              <span class="absolute inset-y-0 left-3 flex items-center text-black">🔍</span>
              <input 
                type="text" 
                id="inp-search-reservations" 
                placeholder="Search Reservation..." 
                class="w-full bg-gray-50 border border-gray-250 text-xs pl-9 pr-4 py-3 rounded-lg outline-none focus:border-[#1E6C02] transition-colors"
              />
            </div>

            <!-- Right: Segmented Filters -->
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-[10px] font-bold text-black mr-1.5 uppercase tracking-wider">Filter:</span>
              <div class="inline-flex bg-gray-100 p-1 rounded-xl border border-gray-200">
                <button data-filter="all" class="px-4 py-2 rounded-lg text-xs font-bold transition-all btn-filter-click active bg-white text-gray-900 shadow-xs border border-gray-200/10">
                  All
                </button>
                <button data-filter="waiting" class="px-4 py-2 rounded-lg text-xs font-bold text-black hover:text-gray-900 transition-all btn-filter-click">
                  Waiting
                </button>
                <button data-filter="payment_verification" class="px-4 py-2 rounded-lg text-xs font-bold text-black hover:text-gray-900 transition-all btn-filter-click">
                  Payment Verification
                </button>
                <button data-filter="ready" class="px-4 py-2 rounded-lg text-xs font-bold text-black hover:text-gray-900 transition-all btn-filter-click">
                  Ready for Processing
                </button>
                <button data-filter="cancelled" class="px-4 py-2 rounded-lg text-xs font-bold text-black hover:text-gray-900 transition-all btn-filter-click">
                  Cancelled
                </button>
              </div>
            </div>
          </div>

          <!-- RESERVATION QUEUE TABLE -->
          <div class="bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden">
            <div class="top-scrollbar-container">
              <table class="w-full text-left border-collapse min-w-[900px]">
                <thead>
                  <tr class="bg-gray-50 border-b border-gray-200 text-xs font-bold text-black uppercase tracking-wider sticky top-0 z-10">
                    <th class="py-4 px-6">Queue</th>
                    <th class="py-4 px-6">Customer</th>
                    <th class="py-4 px-6">Rice Variety</th>
                    <th class="py-4 px-6">Quantity</th>
                    <th class="py-4 px-6">Reserved Date</th>
                    <th class="py-4 px-6">Status</th>
                    <th class="py-4 px-6 text-center w-[180px]">Secondary Action</th>
                    <th class="py-4 px-6 text-center w-[180px]">Primary Action</th>
                  </tr>
                </thead>
                <tbody id="queue-table-body" class="divide-y divide-gray-150">
                  <!-- Rendered dynamically -->
                </tbody>
              </table>
            </div>
          </div> </div>
        `;

        bindMainEvents();
      }

      // Populate stock allocation dropdown inside the modal
      function populateModalDropdown() {
        const select = document.getElementById('modal-alloc-product-select');
        if (!select) return;

        const products = getProducts();
        select.innerHTML = products.map(p => `
          <option value="${p.id}">
            🌾 ${p.name} (In Warehouse: ${p.stock || 0} Sacks)
          </option>
        `).join('');

        // Prepopulate with first product
        if (products.length > 0) {
          updateModalCalculations();
        }
      }

      // Live calculate potential affected FCFS customers in modal
      function updateModalCalculations() {
        const select = document.getElementById('modal-alloc-product-select');
        const input = document.getElementById('modal-alloc-stock-input');
        if (!select || !input) return;

        const productId = select.value;
        const arrivedSacks = parseInt(input.value || '0');

        document.getElementById('lbl-confirm-stock').textContent = `${arrivedSacks} Sacks`;

        const orders = getAllOrders();
        // Filter waiting preorders for this variety
        const productWaitingReservations = orders.filter(o => 
          isReservationOrder(o) && 
          (o.status === 'pre-order' || o.status === 'pre_order') && 
          o.items.some(it => it.product?.id === productId)
        );

        // Sort dynamically chronologically (by createdAt ascending)
        productWaitingReservations.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

        let tempStock = arrivedSacks;
        let eligibleCustomersCount = 0;

        for (let i = 0; i < productWaitingReservations.length; i++) {
          const order = productWaitingReservations[i];
          const item = order.items.find(it => it.product?.id === productId);
          if (item && item.quantity <= tempStock) {
            tempStock -= item.quantity;
            eligibleCustomersCount++;
          }
        }

        const affLbl = document.getElementById('lbl-confirm-affected');
        affLbl.textContent = `${eligibleCustomersCount} customers`;
        if (eligibleCustomersCount > 0) {
          affLbl.className = "text-[#1E6C02] font-black text-sm";
        } else {
          affLbl.className = "text-gray-500 font-bold text-xs";
        }
      }

      // Main Queue Render Loop
      function renderQueueTable() {
        const orders = getAllOrders().filter(o => isReservationOrder(o));

        function getQueuePosition(order) {
          return getReservationQueuePosition(order, orders);
        }

        // Apply Search query and Status Filters
        const q = String(searchQuery || '').toLowerCase().trim();
        let filtered = orders.filter(order => {
          const productNames = (order.items || []).map(it => it.product?.name || '').join(' ').toLowerCase();
          const matchSearch = !q ||
            String(order.fullName || '').toLowerCase().includes(q) ||
            String(order.id || '').toLowerCase().includes(q) ||
            String(order.phone || '').toLowerCase().includes(q) ||
            productNames.includes(q);
          
          if (!matchSearch) return false;

          const isCancelled = (order.status === 'cancelled' || order.status === 'Cancelled' || order.status === 'rejected');
          const isReady = (order.status === 'ready_for_processing' || order.status === 'ready');
          const isPaymentVerification = !isCancelled && !isReady && (
            order.status === 'payment_verification' || 
            order.paymentStatus === 'pending_verification' || 
            Boolean((order.paymentProofDataUrl && order.paymentProofDataUrl.length > 20) || (order.paymentProof && String(order.paymentProof).startsWith('data:')))
          );
          const isWaiting = !isCancelled && !isReady && !isPaymentVerification;

          if (statusFilter === 'all') return true;
          if (statusFilter === 'waiting') return isWaiting;
          if (statusFilter === 'payment_verification') return isPaymentVerification;
          if (statusFilter === 'ready') return isReady;
          if (statusFilter === 'cancelled') return isCancelled;
          return true;
        });

        // Priority Rules for Admin/Staff Reservation List:
        // 1. Payment Verification (action required by staff)
        // 2. Waiting Reservations (sorted by Queue Position #1, #2, #3... / FCFS)
        // 3. Ready for Processing (sorted by Queue Position / FCFS)
        // 4. Completed Reservations
        // 5. Cancelled Reservations (always at the bottom)
        function getReservationGroup(order) {
          const st = String(order.status || '').toLowerCase();
          if (st === 'cancelled') return 5;
          if (st === 'completed' || st === 'delivered') return 4;
          if (st === 'ready_for_processing' || st === 'ready') return 3;
          if (st === 'payment_verification' || order.paymentStatus === 'pending_verification' || Boolean((order.paymentProofDataUrl && order.paymentProofDataUrl.length > 20) || (order.paymentProof && String(order.paymentProof).startsWith('data:')))) return 1;
          return 2; // Waiting / Pre-order
        }

        filtered.sort((a, b) => {
          const groupA = getReservationGroup(a);
          const groupB = getReservationGroup(b);

          if (groupA !== groupB) {
            return groupA - groupB;
          }

          const posA = getQueuePosition(a) || 999999;
          const posB = getQueuePosition(b) || 999999;

          if (posA !== posB) {
            return posA - posB;
          }

          const timeA = new Date(a.createdAt || a.dateCreated || a.date || 0).getTime();
          const timeB = new Date(b.createdAt || b.dateCreated || b.date || 0).getTime();
          return timeA - timeB;
        });

        const tbody = document.getElementById('queue-table-body');
        if (filtered.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="py-16 text-center text-black font-bold text-sm">
                No reservations found in this queue standing.
              </td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = filtered.map(order => {
          const pos = getQueuePosition(order);
          const mainItem = order.items[0] || {};
          const productName = mainItem.product?.name || 'N/A';
          const productImg = mainItem.product?.image || 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&q=80&w=200';
          const qty = mainItem.quantity || 1;
          const productId = mainItem.product?.id;

          // Formatting date and time
          const dateObj = new Date(order.createdAt || order.date || Date.now());
          const dateStr = dateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
          const timeStr = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

          const isCancelled = (order.status === 'cancelled' || order.status === 'Cancelled' || order.status === 'rejected');
          const isReady = (order.status === 'ready_for_processing' || order.status === 'ready');
          const isPaymentVerification = !isCancelled && !isReady && (
            order.status === 'payment_verification' || 
            order.paymentStatus === 'pending_verification' || 
            Boolean((order.paymentProofDataUrl && order.paymentProofDataUrl.length > 20) || (order.paymentProof && String(order.paymentProof).startsWith('data:')))
          );
          const isWaiting = !isCancelled && !isReady && !isPaymentVerification;

          // Highlight position #1 for waiting reservations as Next
          const isNext = isWaiting && pos === 1;

          const rowBgClass = isNext 
            ? 'bg-green-50/45 hover:bg-green-100/40 transition-colors' 
            : 'hover:bg-gray-50/50 transition-colors';

          let queuePosHtml = '';
          if (pos && (isWaiting || isPaymentVerification)) {
            if (isNext) {
              queuePosHtml = `
                <div class="flex items-center gap-2">
                  <span class="font-bold text-gray-950 text-base">#${pos}</span>
                  <span class="px-2 py-0.5 rounded bg-green-100 border border-green-200 text-green-800 text-[10px] font-bold tracking-wide uppercase inline-flex items-center gap-0.5">⭐ Next</span>
                </div>
              `;
            } else {
              queuePosHtml = `<span class="font-bold text-black text-base">#${pos}</span>`;
            }
          } else if (pos && isReady) {
            queuePosHtml = `<span class="font-bold text-purple-900 text-base">#${pos}</span>`;
          } else {
            queuePosHtml = `<span class="text-black font-bold text-sm font-mono">-</span>`;
          }

          let statusBadge = '';
          let dateAndAvailabilityHtml = '';

          if (isPaymentVerification) {
            const allocatedQty = Number(order.allocatedQuantity || 0);
            const waitingQty = Math.max(0, qty - allocatedQty);
            const isFullyAllocated = allocatedQty >= qty;
            const isPartiallyAllocated = allocatedQty > 0 && allocatedQty < qty;

            statusBadge = `
              <div class="space-y-1 text-left">
                <span class="px-2.5 py-1 rounded-full bg-blue-100 border border-blue-300 text-blue-900 font-bold text-xs inline-block">🔵 Payment Verification</span>
                <p class="text-xs text-blue-800 font-semibold">Receipt Uploaded — Review Required</p>
                ${isFullyAllocated ? `
                  <p class="text-xs text-emerald-850 font-bold">Allocated: ${allocatedQty} Sacks</p>
                ` : isPartiallyAllocated ? `
                  <p class="text-xs text-emerald-850 font-bold">Allocated: ${allocatedQty} Sacks</p>
                  <p class="text-[11px] text-amber-800 font-semibold">Waiting: ${waitingQty} Sacks</p>
                ` : `
                  <p class="text-xs text-gray-500 font-normal">Pending Allocation</p>
                `}
              </div>
            `;
            dateAndAvailabilityHtml = `
              <div>
                <p class="font-bold text-gray-950 text-sm">${dateStr}</p>
                <p class="text-xs text-gray-500 font-normal mt-0.5">${timeStr}</p>
              </div>
            `;
          } else if (isWaiting) {
            const allocatedQty = Number(order.allocatedQuantity || 0);
            const waitingQty = Math.max(0, qty - allocatedQty);
            const isFullyAllocated = allocatedQty >= qty;
            const isPartiallyAllocated = allocatedQty > 0 && allocatedQty < qty;

            statusBadge = `
              <div class="space-y-1 text-left">
                ${isFullyAllocated ? `
                  <span class="px-2.5 py-1 rounded-full bg-emerald-100 border border-emerald-300 text-emerald-900 font-bold text-xs inline-block">🟢 Stock Allocated</span>
                  <p class="text-xs text-emerald-850 font-bold">Allocated: ${allocatedQty} Sacks</p>
                ` : isPartiallyAllocated ? `
                  <span class="px-2.5 py-1 rounded-full bg-amber-100 border border-amber-300 text-amber-900 font-bold text-xs inline-block">🟠 Partially Allocated</span>
                  <p class="text-xs text-emerald-850 font-bold">Allocated: ${allocatedQty} Sacks</p>
                  <p class="text-[11px] text-amber-800 font-semibold">Waiting: ${waitingQty} Sacks</p>
                ` : `
                  <span class="px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200 text-amber-700 font-semibold text-xs inline-block">🟠 Waiting for Stock</span>
                  <p class="text-xs text-gray-500 font-normal">Pending Allocation</p>
                `}
              </div>
            `;
            dateAndAvailabilityHtml = `
              <div>
                <p class="font-bold text-gray-950 text-sm">${dateStr}</p>
                <p class="text-xs text-gray-500 font-normal mt-0.5">${timeStr}</p>
                <p class="text-xs text-black font-semibold mt-1"><span class="font-bold text-[#1E6C02]">${order.deliveryOption === 'pickup' ? 'Est. Pickup' : 'Est. Delivery'}:</span> ${getEstimatedArrivalDate(order)}</p>
              </div>
            `;
          } else if (isReady) {
            const allocatedQty = Number(order.allocatedQuantity || qty);
            statusBadge = `
              <div class="space-y-1 text-left">
                <span class="px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold inline-block">🟢 Ready</span>
                <p class="text-xs text-emerald-800 font-bold">Allocated: ${allocatedQty} Sacks</p>
                <p class="text-[11px] text-gray-500 font-medium">${order.deliveryOption === 'pickup' ? 'Est. Pickup' : 'Est. Delivery'}: ${getEstimatedArrivalDate(order)}</p>
              </div>
            `;
            dateAndAvailabilityHtml = `
              <div>
                <p class="font-bold text-gray-950 text-sm">${dateStr}</p>
                <p class="text-xs text-gray-500 font-normal mt-0.5">${timeStr}</p>
              </div>
            `;
          } else {
            statusBadge = `<span class="px-2.5 py-1 rounded-full bg-gray-50 border border-gray-200 text-black text-xs font-semibold">Cancelled</span>`;
            dateAndAvailabilityHtml = `
              <div>
                <p class="font-bold text-gray-950 text-sm">${dateStr}</p>
                <p class="text-xs text-gray-500 font-normal mt-0.5">${timeStr}</p>
              </div>
            `;
          }

          let secondaryActionHtml = '';
          let primaryActionHtml = '';

          if (isReady) {
            secondaryActionHtml = `
              <button 
                data-id="${order.id}"
                class="btn-view-details w-[150px] inline-flex items-center justify-center px-3 py-2 border border-gray-300 text-black text-xs font-bold rounded-lg hover:bg-gray-100 transition-all cursor-pointer whitespace-nowrap text-center shadow-2xs"
              >
                Manage Reservation
              </button>
            `;
            primaryActionHtml = `
              <button 
                data-id="${order.id}"
                class="btn-process-order w-[150px] inline-flex items-center justify-center bg-[#1E6C02] hover:bg-[#145001] text-white font-bold rounded-lg px-3 py-2 transition-all duration-250 cursor-pointer shadow-xs text-xs whitespace-nowrap text-center"
              >
                Process Order
              </button>
            `;
          } else if (isPaymentVerification) {
            secondaryActionHtml = ``;
            primaryActionHtml = `
              <button 
                data-id="${order.id}"
                class="btn-view-details w-[150px] inline-flex items-center justify-center bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-lg px-3 py-2 transition-all duration-250 cursor-pointer shadow-xs text-xs whitespace-nowrap text-center"
              >
                Review Payment
              </button>
            `;
          } else if (isWaiting) {
            secondaryActionHtml = ``;
            primaryActionHtml = `
              <button 
                data-id="${order.id}"
                class="btn-view-details w-[150px] inline-flex items-center justify-center bg-[#1E6C02] hover:bg-[#145001] text-white font-bold rounded-lg px-3 py-2 transition-all duration-250 cursor-pointer shadow-xs text-xs whitespace-nowrap text-center"
              >
                Manage Reservation
              </button>
            `;
          } else {
            secondaryActionHtml = ``;
            primaryActionHtml = `
              <button 
                data-id="${order.id}"
                class="btn-view-details w-[150px] inline-flex items-center justify-center border border-gray-300 text-black hover:bg-gray-100 font-bold rounded-lg px-3 py-2 transition-all duration-250 cursor-pointer shadow-2xs text-xs whitespace-nowrap text-center"
              >
                Manage Reservation
              </button>
            `;
          }

          return `
            <tr id="reservation-row-${order.id}" class="${rowBgClass}">
              <!-- Queue Position -->
              <td class="py-5 px-6 font-bold text-gray-900 text-sm">${queuePosHtml}</td>
              
              <!-- Customer details -->
              <td class="py-5 px-6">

      // Main Event Bindings
      function bindMainEvents() {
        // Segmented filter button clicks
        document.querySelectorAll('.btn-filter-click').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.btn-filter-click').forEach(b => {
              b.className = "px-4 py-2 rounded-lg text-xs font-bold text-black hover:text-gray-900 transition-all btn-filter-click";

            statusFilter = btn.getAttribute('data-filter');

          });
        });

        // Instant search keypress filter
        const searchInput = document.getElementById('inp-search-reservations');
        searchInput.addEventListener('input', () => {
          searchQuery = searchInput.value;
          renderQueueTable();
        });

        // Open simple Stock Allocation Modal on Trigger Click
        const allocTriggerBtn = document.getElementById('btn-allocate-trigger');
        allocTriggerBtn.addEventListener('click', () => {
          populateModalDropdown();
          document.getElementById('alloc-confirm-modal').classList.remove('hidden');
        });

        // Dropdown selection change in modal
        const modalSelect = document.getElementById('modal-alloc-product-select');
        modalSelect.addEventListener('change', updateModalCalculations);

        // Arrived Sacks count input change in modal
        const modalInput = document.getElementById('modal-alloc-stock-input');
        modalInput.addEventListener('input', updateModalCalculations);
      }

      // Close stock allocation modal
      document.getElementById('btn-alloc-confirm-cancel').onclick = () => {
        document.getElementById('alloc-confirm-modal').classList.add('hidden');
      };

      // FCFS COMMIT LOGIC: Runs chronological allocation
      document.getElementById('btn-alloc-confirm-commit').onclick = () => {
        const select = document.getElementById('modal-alloc-product-select');
        const input = document.getElementById('modal-alloc-stock-input');
        if (!select || !input) return;

        const productId = select.value;
        const arrivedCount = parseInt(input.value || '0');
        if (arrivedCount <= 0) {
          showToast('Please enter a valid amount of sacks', 'error');
          return;
        }

        const productsList = getProducts();
        const selectedProductObj = productsList.find(p => p.id === productId);
        if (!selectedProductObj) return;

        const currentPhysical = selectedProductObj.currentStock !== undefined ? selectedProductObj.currentStock : selectedProductObj.stock;
        const newPhysicalStock = currentPhysical + arrivedCount;

        const restockTimestamp = new Date().toISOString();
        const updatedProducts = productsList.map(p => {
          if (p.id === productId) {
            return {
              ...p,
              stock: newPhysicalStock,
              currentStock: newPhysicalStock,
              lastRestockAt: restockTimestamp,
              lastRestockedQty: arrivedCount
            };
          }
          return p;
        });

        saveProducts(updatedProducts);

        // Record restock inventory history
        addInventoryHistory({
          productName: selectedProductObj.name,
          quantityAdded: arrivedCount,
          remarks: 'Physical restock delivery registered via Reservations tab'
        });

        // Run automatic stock allocation
        allocateStockToReservations(productId, { actualRestockedQty: arrivedCount, reason: 'restock' });

        const prodName = selectedProductObj.name;
        showToast(`Successfully registered ${arrivedCount} sacks of ${prodName} and triggered auto FCFS allocation!`, 'success');
        
        document.getElementById('alloc-confirm-modal').classList.add('hidden');
        
        // Refresh view
        renderQueueTable();
      };

      // PROCESS ORDER FLOW
      function processOrderAction(orderId) {
        const list = getAllOrders();
        const matchIdx = list.findIndex(o => o.id === orderId);
        if (matchIdx !== -1) {
          const order = list[matchIdx];
          
          // Update status and flags to move it from Reservation Queue to Order Management
          order.isPreOrder = false;
          order.status = 'processing';
          
          const changer = window.RiceFlow?.getCurrentAdmin()?.name || 'Admin User';
          order.statusHistory = [
            ...(order.statusHistory || []),
            {
              id: 'hist-process-' + Date.now(),
              status: 'Processing',
              changedBy: changer,
              changedAt: new Date().toLocaleString(),
              note: 'Reservation processed. Transferred to Order Management.'
            }
          ];
          
          list[matchIdx] = order;
          saveOrders(list);
          showToast('✔ Reservation successfully processed! Transferred to Order Management as Processing.', 'success');
          
          // Close modal if open
          document.getElementById('details-modal').classList.add('hidden');
          renderQueueTable();
        }

          const idx = ordersList.findIndex(o => o.id === order.id);
          if (idx !== -1) {
            ordersList[idx].adminNotes = val;
            saveOrders(ordersList);
            order.adminNotes = val;
            showToast('✔ Notes saved successfully!', 'success');
            renderQueueTable();
          }
        };

        // Update Restock Details action
        const saveRestockBtn = document.getElementById('btn-save-restock-info');
        if (saveRestockBtn) {
          saveRestockBtn.onclick = () => {
            const dateInput = document.getElementById('det-restock-date');
            const slotSelect = document.getElementById('det-restock-slot');
            if (dateInput && slotSelect) {
              const rDate = dateInput.value;
              const rSlot = slotSelect.value;
              const list = getAllOrders();
              const matchIdx = list.findIndex(o => o.id === order.id);
              if (matchIdx !== -1) {
                list[matchIdx].estimatedRestockDate = rDate;
                list[matchIdx].estimatedSlot = rSlot;
                order.estimatedRestockDate = rDate;
                order.estimatedSlot = rSlot;
               const previousEstDate = order.estimatedFulfillmentDate;
const freshEst = getEstimatedArrivalDate(order);

if (freshEst && freshEst !== 'Waiting for Restock' && freshEst !== 'Not yet scheduled') {
  list[matchIdx].estimatedFulfillmentDate = freshEst;
  order.estimatedFulfillmentDate = freshEst;
} else if (previousEstDate && previousEstDate !== 'Waiting for Restock' && previousEstDate !== 'Not yet scheduled') {
  // Preserve the previously valid fulfillment date if recalculation
  // temporarily cannot produce a new legitimate date.
  list[matchIdx].estimatedFulfillmentDate = previousEstDate;
  order.estimatedFulfillmentDate = previousEstDate;
} else {
  list[matchIdx].estimatedFulfillmentDate = null;
  order.estimatedFulfillmentDate = null;
}
                saveOrders(list);
                showToast('✔ Estimated availability dates successfully updated!', 'success');
                renderQueueTable();
              }
            }
          };
        }

        // Approve & Verify Payment action (Both conditions 1 & 2)
        const approveAndVerifyBtn = document.getElementById('btn-det-action-approve-and-verify');
        if (approveAndVerifyBtn) {
          approveAndVerifyBtn.onclick = () => {
            const list = getAllOrders();
            const matchIdx = list.findIndex(o => o.id === order.id);
            if (matchIdx !== -1) {
              const changer = window.RiceFlow?.getCurrentAdmin()?.name || 'Admin User';
              list[matchIdx].adminApproved = true;
              list[matchIdx].isApproved = true;
              list[matchIdx].paymentVerified = true;
              list[matchIdx].paymentStatus = 'verified';
              list[matchIdx].statusHistory = [
                ...(list[matchIdx].statusHistory || []),
                {
                  id: 'hist-apprver-' + Date.now(),
                  status: 'Approved & Payment Verified',
                  changedBy: changer,
                  changedAt: new Date().toLocaleString(),
                  note: 'Reservation approved and payment verified by staff/admin.'
                }
              ];
              saveOrders(list);

              // Evaluate stock condition with auto-allocator
              allocateStockToReservations();

              const updatedOrders = getAllOrders();
              const updatedOrder = updatedOrders.find(o => o.id === order.id);

              if (updatedOrder && updatedOrder.status === 'ready_for_processing') {
                showToast('✔ Reservation approved & payment verified! Transferred to Ready for Processing!', 'success');
              } else {
                showToast('✔ Reservation approved & payment verified! Remaining in Waiting queue until warehouse stock arrives.', 'success');
              }

              closeFn();
              renderQueueTable();
            }
          };
        }

        // Approve Reservation action (Condition 1 only)
        const approveBtn = document.getElementById('btn-det-action-approve');
        if (approveBtn) {
          approveBtn.onclick = () => {
            const list = getAllOrders();
            const matchIdx = list.findIndex(o => o.id === order.id);
            if (matchIdx !== -1) {
              const changer = window.RiceFlow?.getCurrentAdmin()?.name || 'Admin User';
              list[matchIdx].adminApproved = true;
              list[matchIdx].isApproved = true;
              list[matchIdx].statusHistory = [
                ...(list[matchIdx].statusHistory || []),
                {
                  id: 'hist-appr-' + Date.now(),
                  status: 'Approved',
                  changedBy: changer,
                  changedAt: new Date().toLocaleString(),
                  note: 'Reservation approved by staff/admin.'
                }
              ];
              saveOrders(list);

              // Evaluate stock condition with auto-allocator
              allocateStockToReservations();

              const updatedOrders = getAllOrders();
              const updatedOrder = updatedOrders.find(o => o.id === order.id);

              if (updatedOrder && updatedOrder.status === 'ready_for_processing') {
                showToast('✔ Reservation approved & automatically moved to Ready for Processing!', 'success');
              } else {
                showToast('✔ Reservation approved! Remaining in Waiting queue until payment is verified and stock is available.', 'success');
              }

              closeFn();
              renderQueueTable();
            }
          };
        }

        // Verify Reservation action
        const verifyPayBtn = document.getElementById('btn-det-action-verify-payment');
        if (verifyPayBtn) {
          verifyPayBtn.onclick = () => {
            const list = getAllOrders();
            const matchIdx = list.findIndex(o => o.id === order.id);
            if (matchIdx !== -1) {
              const changer = window.RiceFlow?.getCurrentAdmin()?.name || 'Admin User';
              list[matchIdx].paymentVerified = true;
              list[matchIdx].paymentStatus = 'verified';
              list[matchIdx].status = 'ready_for_processing';
              list[matchIdx].statusHistory = [
                ...(list[matchIdx].statusHistory || []),
                {
                  id: 'hist-payv-' + Date.now(),
                  status: 'Reservation Verified',
                  changedBy: changer,
                  changedAt: new Date().toLocaleString(),
                  note: 'Reservation verified by staff/admin. Moved to Ready for Processing.'
                }
              ];
              saveOrders(list);

              // Send notification to customer
              addNotification(
                list[matchIdx].userId || list[matchIdx].customerId || '',
                '✅ Reservation Ready for Processing',
                'Your payment has been verified! Your reservation is now Ready for Processing.',
                { role: 'customer', type: 'reservation', reservationId: order.id }
              );

              // Evaluate stock condition with auto-allocator
              allocateStockToReservations();

              showToast('✔ Reservation verified! Moved to Ready for Processing!', 'success');

              closeFn();
              renderQueueTable();
            }
          };
        }

        // Cancel Reservation action (from Payment Verification modal)
        const rejectPayBtn = document.getElementById('btn-det-action-reject-payment');
        if (rejectPayBtn) {
          rejectPayBtn.onclick = () => {
            const list = getAllOrders();
            const matchIdx = list.findIndex(o => o.id === order.id);
            if (matchIdx !== -1) {
              const changer = window.RiceFlow?.getCurrentAdmin()?.name || 'Admin User';
              list[matchIdx].status = 'cancelled';
              list[matchIdx].allocatedQuantity = 0;
              list[matchIdx].statusHistory = [
                ...(list[matchIdx].statusHistory || []),
                {
                  id: 'hist-cancel-' + Date.now(),
                  status: 'Cancelled',
                  changedBy: changer,
                  changedAt: new Date().toLocaleString(),
                  note: 'Reservation cancelled by staff during Payment Verification.'
                }
              ];
              saveOrders(list);

              // Send notification to customer
              addNotification(
                list[matchIdx].userId || list[matchIdx].customerId || '',
                '❌ Reservation Cancelled',
                'Your reservation was cancelled by store administration.',
                { role: 'customer', type: 'reservation', reservationId: order.id }
              );

              allocateStockToReservations();

              showToast('Reservation cancelled and allocated stock released.', 'info');

              closeFn();
              renderQueueTable();
            }
          };
        }

        // Cancel Reservation action
        const cancelBtn = document.getElementById('btn-det-action-cancel');
        if (cancelBtn) {
          cancelBtn.onclick = () => {
            const list = getAllOrders();
            const matchIdx = list.findIndex(o => o.id === order.id);
            if (matchIdx !== -1) {
              list[matchIdx].status = 'cancelled';
              const changer = window.RiceFlow?.getCurrentAdmin()?.name || 'Admin User';
              list[matchIdx].statusHistory = [
                ...(list[matchIdx].statusHistory || []),
                {
                  id: 'hist-cancel-' + Date.now(),
                  status: 'Cancelled',
                  changedBy: changer,
                  changedAt: new Date().toLocaleString(),
                  note: 'Reservation cancelled by staff.'
                }
              ];
              saveOrders(list);
              showToast('✔ Reservation cancelled successfully.', 'success');
              closeFn();
              renderQueueTable();
            }
          };
        }

        // Process Order action
        const processBtn = document.getElementById('btn-det-action-process');
        if (processBtn) {
          processBtn.onclick = () => {
            processOrderAction(order.id);
          };
        }

        // Lightbox handlers
        const openZoomLightbox = () => {
          const lbModal = document.getElementById('lightbox-modal');
          const targetContainer = document.getElementById('lightbox-target-container');
          if (lbModal && targetContainer) {
            targetContainer.innerHTML = `
              <div class="w-full flex items-center justify-center p-2 animate-in fade-in zoom-in duration-200">
                <img src="${order.paymentProofDataUrl || '../gcash_demo.jpg'}" alt="GCash Receipt Full" class="max-h-[80vh] max-w-full object-contain rounded-xl shadow-lg border border-gray-150" />
              </div>
            `;
            lbModal.classList.remove('hidden');
          }
        };

        const zoomTrigger = document.getElementById('btn-zoom-proof');
        if (zoomTrigger) zoomTrigger.onclick = openZoomLightbox;
        const imgTrigger = document.getElementById('review-payment-proof-image');
        if (imgTrigger) imgTrigger.onclick = openZoomLightbox;

        const closeLightboxBtn = document.getElementById('close-lightbox-btn');
        if (closeLightboxBtn) {
          closeLightboxBtn.onclick = () => {
            document.getElementById('lightbox-modal').classList.add('hidden');
          };
        }

        // Show Modal
        document.getElementById('details-modal').classList.remove('hidden');
      }

      // INIT LOAD RUN
      drawContentLayout();
      renderQueueTable();

      // Deep Linking handler for notifications
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const reservationId = urlParams.get('reservationId') || urlParams.get('recordId') || urlParams.get('orderId');
        if (reservationId) {
          const orders = getAllOrders();
          const targetClean = String(reservationId).trim().toLowerCase();
          const order = orders.find(o => String(o.id).trim().toLowerCase() === targetClean);
          if (order) {
            let targetFilter = 'all';
            if (order.status === 'payment_verification' || order.paymentStatus === 'pending_verification' || Boolean((order.paymentProofDataUrl && order.paymentProofDataUrl.length > 20) || (order.paymentProof && String(order.paymentProof).startsWith('data:')))) {
              targetFilter = 'payment_verification';
            } else if (order.status === 'pre-order' || order.status === 'pre_order' || order.status === 'waiting') {
              targetFilter = 'waiting';
            } else if (order.status === 'ready_for_processing' || order.status === 'ready') {
              targetFilter = 'ready';
            } else if (order.status === 'cancelled') {
              targetFilter = 'cancelled';
            }
            statusFilter = targetFilter;
            
            // Set visual active tab button
            document.querySelectorAll('.btn-filter-click').forEach(b => {
              if (b.getAttribute('data-filter') === targetFilter) {
                b.className = "px-4 py-2 rounded-lg text-xs font-bold transition-all btn-filter-click bg-white text-gray-900 shadow-xs border border-gray-200/10";
              } else {
                b.className = "px-4 py-2 rounded-lg text-xs font-bold text-black hover:text-gray-900 transition-all btn-filter-click";
              }
            });

            renderQueueTable();
            openDetailsModal(reservationId);

            // Highlight the row and scroll it into view
            setTimeout(() => {
              const row = document.getElementById(`reservation-row-${reservationId}`);
              if (row) {
                row.scrollIntoView({ behavior: 'smooth', block: 'center' });
                row.classList.add('ring-4', 'ring-green-400', 'bg-green-50/50', 'transition-all', 'duration-500');
                setTimeout(() => {
                  row.classList.remove('ring-4', 'ring-green-400', 'bg-green-50/50');
                }, 4000);
              }
            }, 500);
          } else {
            showToast("The related record is no longer available.", "error");
          }
        }
      } catch (err) {
        console.warn('[DEEP LINKING] Failed to handle link:', err);
      }
    });
  </script>
</body>
</html>
