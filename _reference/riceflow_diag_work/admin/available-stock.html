<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Stock | Aurora Rice Admin</title>
  <script>
    (function() {
      try {
        var d = document.documentElement;
        var isDark = localStorage.getItem('aurora-dark-mode') === 'true';
        d.classList.toggle('dark', isDark);
        d.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <style id="riceflow-theme-init">
    html { background-color: #F5F5F5; color-scheme: light; }
    html.dark { background-color: #1F2937 !important; color-scheme: dark; }
    html.dark body,
    html.dark #admin-layout-container,
    html.dark #admin-main-content {
      background-color: #1F2937;
      color: #F9FAFB;
    }
    html.dark #auth-guard-loader {
      background-color: #1F2937 !important;
      color: #F9FAFB !important;
    }
    html.dark #admin-sidebar,
    html.dark aside,
    html.dark header,
    html.dark .bg-white,
    html.dark .bg-gray-50,
    html.dark .bg-slate-50 {
      background-color: #111827;
      color: #F9FAFB;
    }
  </style>
  <link rel="stylesheet" href="../src/styles/index.css">
  <style id="auth-guard-style">body { visibility: hidden !important; }</style>
  <style id="available-stock-page-styles">
    /* High contrast back button */
    html:not(.dark) #admin-layout-container .as-back-btn {
      background: #FFFFFF !important;
      border: 1px solid #CBD5E1 !important;
      color: #0F172A !important;
    }
    html:not(.dark) #admin-layout-container .as-back-btn:hover {
      background: #F1F5F9 !important;
      border-color: #94A3B8 !important;
    }
    html.dark #admin-layout-container .as-back-btn {
      background: #1E293B !important;
      border: 1px solid #475569 !important;
      color: #FFFFFF !important;
    }
    html.dark #admin-layout-container .as-back-btn:hover {
      background: #334155 !important;
      border-color: #64748B !important;
    }

    /* Amber theme badges */
    html:not(.dark) #admin-layout-container .as-amber-badge {
      background: #FFFBEB !important;
      border: 1px solid #FCD34D !important;
      color: #92400E !important;
    }
    html.dark #admin-layout-container .as-amber-badge {
      background: rgba(245, 158, 11, 0.22) !important;
      border: 1px solid rgba(251, 191, 36, 0.5) !important;
      color: #FDE68A !important;
    }

    /* Rank pills */
    html:not(.dark) #admin-layout-container .as-rank-pill {
      background: #F1F5F9 !important;
      border: 1px solid #CBD5E1 !important;
      color: #0F172A !important;
    }
    html.dark #admin-layout-container .as-rank-pill {
      background: #1E293B !important;
      border: 1px solid #475569 !important;
      color: #FFFFFF !important;
    }

    /* Progress bar tracks */
    html:not(.dark) #admin-layout-container .as-bar-track {
      background: #E2E8F0 !important;
    }
    html.dark #admin-layout-container .as-bar-track {
      background: #334155 !important;
    }

    /* Progress bar fills */
    html:not(.dark) #admin-layout-container .as-bar-fill {
      background: linear-gradient(90deg, #D97706 0%, #F59E0B 100%) !important;
    }
    html.dark #admin-layout-container .as-bar-fill {
      background: linear-gradient(90deg, #F59E0B 0%, #FBBF24 100%) !important;
    }

    /* Low stock indicator fill */
    html:not(.dark) #admin-layout-container .as-bar-fill-low {
      background: linear-gradient(90deg, #DC2626 0%, #EF4444 100%) !important;
    }
    html.dark #admin-layout-container .as-bar-fill-low {
      background: linear-gradient(90deg, #EF4444 0%, #F87171 100%) !important;
    }
  </style>
</head>
<body class="bg-[#F5F5F5] min-h-screen">
  <div id="auth-guard-loader" class="fixed inset-0 bg-[#F5F5F5] z-[99999] flex flex-col items-center justify-center font-sans">
    <div class="w-9 h-9 border-3 border-[#1E6C02]/20 border-t-[#1E6C02] rounded-full animate-spin mb-3"></div>
    <p class="text-xs font-semibold text-slate-800 dark:text-slate-100">Loading stock...</p>
  </div>

  <!-- ADMIN LAYOUT WRAPPER -->
  <div id="admin-layout-container"></div>

  <script type="module" src="../src/app/shared.js"></script>

  <script type="module">
    import {
      protectAdminPage,
      renderAdminLayout,
      getProducts,
      getDashboardAvailableStockData
    } from '../src/app/shared.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const authResult = await protectAdminPage({ requiredRole: 'any' });
      if (!authResult || !authResult.ok) return;

      renderAdminLayout('available-stock');

      const targetSpace = document.getElementById('admin-main-content');
      if (!targetSpace) return;

      function renderAvailableStockPage() {
        const liveProducts = typeof getProducts === 'function' ? getProducts() : [];
        const stockData = getDashboardAvailableStockData({ productsList: liveProducts });

        const totalSacksFormatted = stockData.totalAvailableSacks.toLocaleString('en-US');
        const totalKgFormatted = stockData.totalAvailableKg.toLocaleString('en-US');

        const varieties = stockData.varieties || [];

        const varietiesListHtml = varieties.length === 0
          ? `
            <div class="bg-white dark:bg-[#111827] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-8 text-center shadow-xs">
              <p class="text-base font-extrabold text-slate-900 dark:text-white">No Rice Types Found</p>
              <p class="text-xs font-bold text-slate-700 dark:text-slate-200 mt-1">There are currently no rice types in stock.</p>
            </div>
          `
          : `
            <div class="space-y-3">
              ${varieties.map(v => {
                const isOutOfStock = v.sacks === 0;
                const isLowStock = v.sacks > 0 && v.sacks <= 15;
                const sacksFormatted = v.sacks.toLocaleString('en-US');
                const kgFormatted = v.kg.toLocaleString('en-US');

                let statusBadge = '';
                if (isOutOfStock) {
                  statusBadge = `<span class="text-[10px] sm:text-xs font-extrabold px-2 py-0.5 rounded-md bg-red-100 dark:bg-red-950/60 text-red-800 dark:text-red-300 border border-red-200 dark:border-red-800/60 uppercase tracking-wider shrink-0">Out of Stock</span>`;
                } else if (isLowStock) {
                  statusBadge = `<span class="text-[10px] sm:text-xs font-extrabold px-2 py-0.5 rounded-md bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/60 uppercase tracking-wider shrink-0">Low Stock</span>`;
                } else {
                  statusBadge = `<span class="text-[10px] sm:text-xs font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/60 uppercase tracking-wider shrink-0">Available</span>`;
                }

                return `
                  <div class="bg-white dark:bg-[#111827] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xs transition-all hover:shadow-sm">
                    <div class="flex items-center justify-between gap-3 flex-wrap">
                      <!-- Left: Rank, Name & Type -->
                      <div class="flex items-center gap-3 min-w-0">
                        <span class="as-rank-pill inline-flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-full text-xs font-black shrink-0">
                          #${v.rank}
                        </span>
                        <div class="min-w-0">
                          <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-base sm:text-lg font-bold text-slate-950 dark:text-white truncate">
                              ${v.name}
                            </span>
                            ${statusBadge}
                          </div>
                          <p class="text-xs text-slate-700 dark:text-slate-200 font-semibold mt-0.5">
                            ${v.type ? `${v.type} Rice` : 'Rice'} · ${v.sackWeightKg} kg per sack
                          </p>
                        </div>
                      </div>

                      <!-- Right: Sacks & Kilograms -->
                      <div class="text-right shrink-0">
                        <div class="flex items-baseline gap-1.5 justify-end">
                          <span class="text-lg sm:text-xl font-black text-slate-950 dark:text-white">
                            ${sacksFormatted} sack${v.sacks !== 1 ? 's' : ''}
                          </span>
                          <span class="text-sm sm:text-base font-bold text-amber-800 dark:text-amber-300">
                            · ${kgFormatted} kg
                          </span>
                        </div>
                        <p class="text-xs text-slate-700 dark:text-slate-200 font-bold mt-0.5">
                          ${v.sharePercent}% of total stock
                        </p>
                      </div>
                    </div>

                    <!-- Horizontal Bar Visualization -->
                    <div class="mt-3.5">
                      <div class="as-bar-track w-full h-3 rounded-full overflow-hidden">
                        <div
                          class="${isOutOfStock || isLowStock ? 'as-bar-fill-low' : 'as-bar-fill'} h-full rounded-full transition-all duration-500"
                          style="width: ${v.barWidthPercent}%;"
                          role="progressbar"
                          aria-valuenow="${v.sacks}"
                          aria-valuemin="0"
                          aria-valuemax="${stockData.totalAvailableSacks || 1}"
                        ></div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;

        targetSpace.innerHTML = `
          <div class="space-y-6 pb-12 max-w-5xl mx-auto">
            
            <!-- Top Navigation Row -->
            <div class="flex items-center justify-between gap-4 flex-wrap">
              <a href="dashboard.html" class="as-back-btn inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-extrabold shadow-2xs transition-all cursor-pointer">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="w-4 h-4">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Dashboard
              </a>

              <div class="text-right">
                <span class="text-xs font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider">Stock Details</span>
              </div>
            </div>

            <!-- Header Info Card -->
            <div class="bg-white dark:bg-[#111827] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 sm:p-7 shadow-xs">
              <div class="flex items-start gap-4">
                <div class="w-14 h-14 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0 border border-amber-100 dark:border-amber-800/60 shadow-2xs">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-7 h-7">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                  </svg>
                </div>
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2.5 flex-wrap">
                    <h1 class="text-xl sm:text-2xl font-black text-slate-950 dark:text-white tracking-tight">Available Stock</h1>
                    <span class="as-amber-badge text-xs font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                      Ready Stock
                    </span>
                  </div>
                  <p class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mt-1">
                    Rice in stock ready for new customer orders. Stock set aside for existing orders is already removed.
                  </p>
                </div>
              </div>
            </div>

            <!-- Visual Highlight: Total Available Stock Hero Card -->
            <div class="bg-gradient-to-br from-amber-50/80 via-white to-orange-50/40 dark:from-amber-950/30 dark:via-[#111827] dark:to-orange-950/20 border-2 border-amber-200 dark:border-amber-800/70 rounded-2xl p-6 sm:p-8 shadow-sm">
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                <div class="min-w-0 flex-1">
                  <div class="flex items-center gap-2 flex-wrap mb-2">
                    <span class="as-amber-badge text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider inline-flex items-center gap-1.5 shadow-2xs">
                      <span>📦</span> AVAILABLE STOCK
                    </span>
                    <span class="text-xs font-bold text-amber-900 dark:text-amber-200">
                      Ready for new orders
                    </span>
                  </div>
                  <div class="flex items-baseline gap-3 flex-wrap">
                    <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-slate-950 dark:text-white tracking-tight leading-tight">
                      ${totalSacksFormatted} <span class="text-xl sm:text-2xl font-bold text-slate-700 dark:text-slate-200">sacks</span>
                    </h2>
                    <span class="text-2xl sm:text-3xl font-black text-amber-800 dark:text-amber-300">
                      · ${totalKgFormatted} kg
                    </span>
                  </div>
                  <p class="text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mt-2">
                    Total rice ready to sell across all ${stockData.activeCount} rice types.
                  </p>
                </div>

                <div class="bg-white dark:bg-[#1E293B] border border-amber-100 dark:border-amber-900/60 rounded-2xl px-6 py-5 shadow-xs text-center shrink-0 min-w-[200px]">
                  <p class="text-xs font-black uppercase tracking-wider text-amber-800 dark:text-amber-300">Rice Types</p>
                  <p class="text-3xl sm:text-4xl font-black text-slate-950 dark:text-white mt-1 tracking-tight">
                    ${stockData.activeCount}
                  </p>
                  <p class="text-xs font-bold text-slate-700 dark:text-slate-200 mt-0.5">rice types in stock</p>
                </div>
              </div>
            </div>

            <!-- Rice Type Breakdown Section -->
            <div class="space-y-4">
              <div class="flex items-center justify-between gap-3 flex-wrap px-1">
                <div>
                  <h3 class="text-lg sm:text-xl font-bold text-slate-950 dark:text-white tracking-tight">Stock by Rice Type</h3>
                  <p class="text-xs font-semibold text-slate-700 dark:text-slate-200 mt-0.5">
                    Sacks and kilograms available for each rice type
                  </p>
                </div>
                <div class="text-right">
                  <span class="text-xs font-bold text-slate-700 dark:text-slate-200">
                    Total: <strong class="text-slate-950 dark:text-white">${totalSacksFormatted} sacks · ${totalKgFormatted} kg</strong>
                  </span>
                </div>
              </div>

              ${varietiesListHtml}
            </div>

            <!-- Bottom Total Available Summary & Return Section -->
            <div class="bg-white dark:bg-[#111827] border border-slate-200/80 dark:border-slate-800 rounded-2xl p-6 shadow-xs flex items-center justify-between gap-4 flex-wrap">
              <div>
                <p class="text-xs font-black text-slate-700 dark:text-slate-200 uppercase tracking-wider">TOTAL AVAILABLE STOCK</p>
                <p class="text-xl sm:text-2xl font-black text-slate-950 dark:text-white mt-0.5">
                  ${totalSacksFormatted} sacks · <span class="text-amber-800 dark:text-amber-300">${totalKgFormatted} kg</span>
                </p>
                <p class="text-xs font-medium text-slate-700 dark:text-slate-200 mt-1">
                  Rice set aside for existing orders is already removed from this count.
                </p>
              </div>
              <a href="dashboard.html" class="as-back-btn inline-flex items-center gap-2 px-5 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold shadow-2xs transition-all cursor-pointer">
                ← Return to Dashboard
              </a>
            </div>

          </div>
        `;
      }

      renderAvailableStockPage();
    });
  </script>
</body>
</html>
